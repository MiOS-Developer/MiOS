# AI-hint: Cargo manifest for mios-gen -- the SSOT projector binary (ADR-0021 gen category): every generate-*/render-* surface converges here as a verb.
# AI-related: tools/native/Cargo.toml, usr/share/mios/mios.toml, docs/design/doc-rust-static-port.md

[package]
name = "mios-gen"
version.workspace = true
edition.workspace = true
description = "MiOS SSOT projector verbs (ADR-0021 gen category)"

[dependencies]
clap = { workspace = true }
flate2 = { workspace = true }
regex = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true, features = ["preserve_order"] }
sha2 = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }
# The light lane's llama-swap model maps (light_tiers.rs), as mios-template-compile reads YAML.
serde_yaml = "0.9"
walkdir = { workspace = true }
tempfile = { workspace = true }
mios-resolver = { path = "../mios-resolver" }
mios-service-core = { path = "../mios-service-core" }
mios-unit-gen = { path = "../mios-unit-gen" }

# recvmsg/sendmsg with SCM_RIGHTS and memfd for the nested-session render proxy (wl_device_proxy.rs), safe API.
# Unix-only: every rustix use in this crate is #[cfg(unix)], so Windows builds do not pull it in.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1", features = ["fs", "net", "process"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
mios-inputd = { path = "../mios-inputd" }
