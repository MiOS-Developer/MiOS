# AI-hint: Native Tamagotchi render/input foundation and terminal sprite preview.
# AI-related: tools/native/Cargo.toml, usr/share/mios/mios.toml, specs/tamagotchi-tui
[package]
name = "mios-tamagotchi"
version.workspace = true
edition.workspace = true
rust-version = "1.88"

[dependencies]
mios-resolver = { path = "../mios-resolver" }
clap.workspace = true
serde.workspace = true
toml.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
crossterm = "0.29"
supports-color = "3.0.2"
supports-unicode = "3.0.0"

[dev-dependencies]
tempfile.workspace = true
