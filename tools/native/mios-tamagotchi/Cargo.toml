# AI-hint: Playable native virtual pet with deterministic care, memory game and atomic local saves.
# AI-related: tools/native/Cargo.toml, usr/share/mios/mios.toml, specs/tamagotchi-tui
[package]
name = "mios-tamagotchi"
version.workspace = true
edition.workspace = true
rust-version = "1.89"

[dependencies]
mios-resolver = { path = "../mios-resolver" }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
tempfile.workspace = true
toml.workspace = true
ratatui = { version = "0.30", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
# Level-triggered controlling-TTY input keeps dense mouse bursts readable.
crossterm = { version = "0.29", features = ["use-dev-tty"] }
supports-color = "3.0.2"
supports-unicode = "3.0.0"
