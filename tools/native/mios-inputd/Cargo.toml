# AI-hint: Native global input policy, controller routing and evdev/uinput bridge.
# AI-related: usr/share/mios/mios.toml [keybindings.global], tools/native/Cargo.toml
[package]
name = "mios-inputd"
version.workspace = true
edition.workspace = true

[features]
default = []
# Test builds only. The controller acceptance tests in src/mios-controller-*-acceptance.rs
# are ignored without this feature and report why. Only the sealed MiOS-DEV harness
# enables it; enabled, isolated() still asserts the pinned C95 tmux backend and fails
# on any other host.
sealed-dev-acceptance = []

[dependencies]
mios-resolver = { path = "../mios-resolver" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
regex.workspace = true
clap.workspace = true
shlex = "2.0.1"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile.workspace = true
