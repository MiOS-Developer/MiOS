# AI-hint: Linux target linker and rustflags are projected from mios.toml [build.native.linux] by mios-gen cargo-manifests; other workspace settings remain local.
# AI-hint: Cargo aliases for native tools workspace.
[alias]
xtask = "run --package xtask --"

[build]
target = "x86_64-unknown-linux-musl"
jobs = 2

[env]
TMPDIR = { value = "/var/tmp", force = true }
CARGO_INCREMENTAL = { value = "0", force = true }

[profile.dev]
opt-level = 3
debug = false
incremental = false

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
ar = "x86_64-w64-mingw32-gcc-ar"

[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]

[target.x86_64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
