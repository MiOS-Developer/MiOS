# AI-hint: Cargo manifest for mios-controls -- the ratatui TUI and CLI that draws keyboards, mice and controllers and edits the layered binding map (global bindings, Guide layer, Hypr3D room, tmux-os prefix keys, compositor tables) as a validated user-tier draft.
# AI-related: tools/native/Cargo.toml, usr/share/mios/mios.toml, src/mios-rs/mios-gate/src/keybinds.rs, tools/native/mios-inputd, tests/test-mios-controls.py

[package]
name = "mios-controls"
version.workspace = true
edition.workspace = true
description = "TUI binding editor and device views for the layered MiOS binding map"

[[bin]]
name = "mios-controls"
path = "src/main.rs"

[dependencies]
mios-resolver = { path = "../mios-resolver" }
# the router's own config validator (room table, Guide layer, contract) and its guarded evdev Device (open, grab)
mios-inputd = { path = "../mios-inputd" }
ratatui = "0.29"
# Select the re-exported backend explicitly, including standalone package builds.
crossterm = { version = "0.28", default-features = false, features = ["use-dev-tty"] }
# sched_setaffinity for the dedicated input threads and poll(2) for the pad thread (safe APIs; the crate forbids unsafe)
rustix = { version = "0.38", features = ["process", "event"] }
serde_json = { workspace = true }
toml = { workspace = true }
toml_edit = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
