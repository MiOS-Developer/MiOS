# AI-hint: MiOS wallpaper daemon manifest. mios-wallpaperd -- MiOS living-wallpaper + desktop-services daemon. Law 14 / ADR-0011 (WS-LANG): the Rust native tier.
[package]
name = "mios-wallpaperd"
version.workspace = true
edition.workspace = true
description = "MiOS living-wallpaper + desktop-services daemon: silent WorkerW WebView host, folded WSLg gui-watch, one Windows service."

[[bin]]
name = "mios-wallpaperd"
path = "src/main.rs"

[dependencies]
mios-service-core = { path = "../mios-service-core" }

[target.'cfg(windows)'.dependencies]
wry = "0.45"
tao = "0.30"
windows-service = "0.7"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_System_Threading",
    "Win32_System_RemoteDesktop",
    "Win32_System_StationsAndDesktops",
    "Win32_Security",
    "Win32_System_Registry",
    "Win32_System_Environment",
] }
# Release size tuning lives in the workspace root (rendered by mios-gen
# cargo-manifests): [profile.release.package] here would be silently ignored.
