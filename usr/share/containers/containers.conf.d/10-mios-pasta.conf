# AI-hint: Configures the default rootless Podman network engine to use pasta instead of slirp4netns to ensure network compatibility in environments without /dev/net/tun access, such as WSL2 or nested containers.
[network]
default_rootless_network_cmd = "pasta"

# AI-hint: Configures libkrun / crun-krun OCI runtime for Tier 3 MicroVM container execution (ISOL-01).
[engine.runtimes]
krun = [
    "/usr/bin/krun",
    "/usr/bin/crun-krun",
]
