# AI-hint: Tmux key bindings and terminal capabilities for iOS Blink Shell, enabling Shift+Tab (backtab) and mobile shortcut combos.
# AI-related: tools/native/mios-gen/src/terminal.rs, usr/share/doc/mios/guides/blink-tmux-mobile-keys.md

# ==============================================================================
# MiOS Tmux x Blink Shell (iOS / iPhone / iPad) Mobile Keyboard Compatibility
# ==============================================================================

# Compatibility entrypoint for older Blink configurations; global defaults
# now supply the same mobile bindings to every SSH client through /etc/tmux.conf.
source-file /usr/share/mios/tmux/mios-theme.tmux.conf
source-file /usr/share/mios/tmux/mios-keys.tmux.conf

# 1. Terminal Feature & Extended Keys Negotiation
# Enables xterm extended keys (CSI u / modifyOtherKeys) so Shift, Alt, Ctrl modifiers
# are sent cleanly by modern terminal emulators like Blink Shell.
set -s extended-keys on
# Negotiate extended keys only with clients that advertise support.
set -as terminal-overrides ',*:kbt=\E[Z'
set -gw xterm-keys on

# 2. Native Shift+Tab (Backtab / BTab) Pass-Through
# When Blink Shell or an external keyboard sends the standard ANSI backtab escape
# sequence (\033[Z or ^[[Z), tmux translates it to BTab. Ensure BTab passes
# directly through to the active application (e.g. fzf, vim, zsh, agy, claude, opencode).
bind-key -n BTab send-keys Escape "[Z"

# 3. Touchscreen / Soft-Keyboard Fallback Combos for iPhone
# On iPhone virtual keyboards where Shift+Tab is difficult or impossible to chord:

# Combo A: Prefix + Tab -> Sends Shift+Tab
# Tap tmux prefix (default C-b), then tap Tab:
bind-key Tab send-keys Escape "[Z"

# Combo B: Alt + Tab (M-Tab) -> Sends Shift+Tab
# On Blink Shell SmartBar, tap 'Alt' then 'Tab' (or hold Option on iPad):
# Alt-Tab remains available to the client/compositor. Prefix+Tab is universal.

# Combo C: Prefix + Backtick -> Sends Shift+Tab
# Single finger friendly on mobile touchscreens:
bind-key ` send-keys Escape "[Z"

# Combo D: Double-tap Escape sequence for reverse navigation
bind-key -n M-BTab send-keys Escape "[Z"
