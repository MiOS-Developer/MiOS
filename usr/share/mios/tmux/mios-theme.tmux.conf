# AI-hint: tmux theme rendered by native MiOS Rust from mios.toml [colors]; tmux has no outer padding
# =====================================================================
# MiOS Canonical Tmux Theme
# Generated from mios.toml SSOT (Style: rounded)
# Client font: GeistMono Nerd Font Mono; font size is controlled by the SSH/terminal client.
# =====================================================================

# Status Bar Placement & Refresh Interval
set -g status on
set -g status-interval 2
set -g status-position top
set -g status-style "bg=#282262,fg=#E7DFD3"
set -g window-style "bg=#282262,fg=#E7DFD3"
set -g window-active-style "bg=#282262,fg=#E7DFD3"

# Window Status Alignment & Separation
set -g status-justify left
set -g window-status-separator ""

# Terminal Capabilities & Extended Keys
set -g default-terminal "tmux-256color"
set -s terminal-features[90] "xterm*:RGB"
set -s terminal-features[91] "alacritty*:RGB"
set -s terminal-features[92] "foot*:RGB"
set -s terminal-features[93] "wezterm*:RGB"
set -s terminal-features[94] "tmux*:RGB"
set -s terminal-overrides[90] "xterm*:Tc"
set -s terminal-overrides[91] "alacritty*:Tc"
set -s terminal-overrides[92] "foot*:Tc"
set -s terminal-overrides[93] "wezterm*:Tc"
set -s terminal-overrides[94] "tmux*:Tc"

# Pane Borders
set -g pane-border-style "fg=#948E8E"
set -g pane-active-border-style "fg=#F35C15"

# Selection & Copy Mode
set -g mode-style "bg=#1A407F,fg=#E7DFD3"

# Message & Command Prompt
set -g message-style "bg=#1A407F,fg=#E7DFD3"
set -g message-command-style "bg=#282262,fg=#F35C15"

set -g pane-colours[0] "#282262"
set -g pane-colours[1] "#DC271B"
set -g pane-colours[2] "#3E7765"
set -g pane-colours[3] "#F35C15"
set -g pane-colours[4] "#1A407F"
set -g pane-colours[5] "#734F39"
set -g pane-colours[6] "#B7C9D7"
set -g pane-colours[7] "#E7DFD3"
set -g pane-colours[8] "#948E8E"
set -g pane-colours[9] "#FF6B5C"
set -g pane-colours[10] "#5FAA8E"
set -g pane-colours[11] "#FF8540"
set -g pane-colours[12] "#3D6BA8"
set -g pane-colours[13] "#9D7660"
set -g pane-colours[14] "#E0E0E0"
set -g pane-colours[15] "#FFFFFF"
set -g pane-border-lines single
set -g popup-border-lines rounded
set -g menu-border-lines rounded
set -g window-size latest
set-hook -g client-attached[90] "run-shell -b \"env TMUX='#{socket_path},#{pid},#{session_id}' TMUX_PANE='#{pane_id}' '/usr/libexec/mios/mios-agent-relay' --workspace-hook ensure\""
set-hook -g client-session-changed[90] "run-shell -b \"env TMUX='#{socket_path},#{pid},#{session_id}' TMUX_PANE='#{pane_id}' '/usr/libexec/mios/mios-agent-relay' --workspace-hook ensure\""
set-hook -g client-resized[90] "run-shell -b \"env TMUX='#{socket_path},#{pid},#{session_id}' TMUX_PANE='#{pane_id}' '/usr/libexec/mios/mios-agent-relay' --workspace-hook ensure\""
set-hook -g client-active[90] "run-shell -b \"env TMUX='#{socket_path},#{pid},#{session_id}' TMUX_PANE='#{pane_id}' '/usr/libexec/mios/mios-agent-relay' --workspace-hook ensure\""
# Rounded Glyph Formatting & Oh-My-Posh Graphics
set -g status-left-length 50
set -g @mios-status-left-wide "#[fg=#1A407F,bg=#282262]#[fg=#E7DFD3,bg=#1A407F,bold]  MiOS #[fg=#1A407F,bg=#3E7765]#[fg=#282262,bg=#3E7765,bold]  #S #[fg=#3E7765,bg=#282262] "
set -g @mios-status-left-narrow "#[fg=#3E7765,bg=#282262]#[fg=#282262,bg=#3E7765,bold]  #S #[fg=#3E7765,bg=#282262] "
set -g status-left "#{?#{e|<:#{client_width},120},#{T:@mios-status-left-narrow},#{T:@mios-status-left-wide}}"
set -g window-status-format "#[fg=#948E8E,bg=#282262]  #I  #W  "
set -g window-status-current-format "#[fg=#F35C15,bg=#282262]#[fg=#282262,bg=#F35C15,bold] #I  #W #[fg=#F35C15,bg=#282262]"
set -g status-right-length 160
set -g @mios-status-right-wide "#[fg=#1A407F,bg=#282262]#[fg=#E7DFD3,bg=#1A407F] #(/usr/libexec/mios/mios-sysmon-line) #[fg=#3E7765,bg=#1A407F]#[fg=#282262,bg=#3E7765,bold]  %a %-d %b #[fg=#1A407F,bg=#3E7765]#[fg=#E7DFD3,bg=#1A407F,bold]  %H:%M #[fg=#F35C15,bg=#1A407F]#[fg=#282262,bg=#F35C15,bold]  #H #[fg=#F35C15,bg=#282262]"
set -g @mios-status-right-narrow "#[fg=#1A407F,bg=#282262]#[fg=#E7DFD3,bg=#1A407F] #(/usr/libexec/mios/mios-sysmon-line --compact 24) #[fg=#3E7765,bg=#1A407F]#[fg=#282262,bg=#3E7765,bold]  %H:%M #[fg=#3E7765,bg=#282262]"
set -g status-right "#{?#{e|<:#{client_width},120},#{T:@mios-status-right-narrow},#{T:@mios-status-right-wide}}"
