set -s command-alias[216] "mios-menu=if-shell -F '#{e|<:#{client_height},13}' \"display-message 'Terminal too small for the MiOS menu: prefix ? lists every key'\" \"if-shell -F '#{E:@mios-console-client}' 'mios-menu-root-vt' 'mios-menu-root'\""
bind-key -N "MiOS Terminal" t new-window -c '#{pane_current_path}'
bind-key -N "MiOS AI" a run-shell -b -c '#{pane_current_path}' "TMUX_PANE=#{pane_id} /usr/libexec/mios/mios-terminal --action ai"
bind-key -N "MiOS Agents" g run-shell -b -c '#{pane_current_path}' "TMUX_PANE=#{pane_id} /usr/libexec/mios/mios-terminal --action agents"
bind-key -N "MiOS System Monitor" m new-window -n 'MiOS System Monitor' -c '#{pane_current_path}' mios mon
bind-key -N "Pane left" h select-pane -L
bind-key -N "Pane down" j select-pane -D
bind-key -N "Pane up" k select-pane -U
bind-key -N "Pane right" l select-pane -R
bind-key -N "Split below (keeps the directory)" s split-window -v -c '#{pane_current_path}'
bind-key -N "Split right (keeps the directory)" v split-window -h -c '#{pane_current_path}'
bind-key -N "Next window" n next-window
bind-key -N "Previous window" p previous-window
bind-key -N "Choose a window or pane (arrows, Enter)" w choose-tree -Zw -f '#{E:@mios-visible-session}'
bind-key -N "Zoom the pane (also hides floating panes)" z resize-pane -Z
bind-key -N "Copy and scroll mode" y copy-mode
bind-key -N "Detach this client" d detach-client
bind-key -N "Send Shift-Tab (mobile keyboards)" Tab send-keys BTab
bind-key -N "Send the prefix to the pane" b send-prefix
bind-key -N "Next pane or next agent" o run-shell -b -c '#{pane_current_path}' "TMUX_PANE=#{pane_id} /usr/libexec/mios/mios-agent-relay --workspace-focus next"
bind-key -N "Compact or auto AI workspace view" f run-shell -b -c '#{pane_current_path}' "TMUX_PANE=#{pane_id} /usr/libexec/mios/mios-agent-relay --workspace-view toggle"
bind-key -N "Command prompt" ':' command-prompt
bind-key -N "List these keys (arrows, PgUp, PgDn, q)" '?' list-keys -N
bind-key -N "Copy and scroll mode" '[' copy-mode
bind-key -N "Paste the latest buffer" ']' paste-buffer -p
bind-key -N "Choose a buffer to paste" '=' choose-buffer -Z
bind-key -N "Rename the window" ',' command-prompt -I '#W' { rename-window -- '%%' }
bind-key -N "Rename the session" '$' command-prompt -I '#S' { rename-session -- '%%' }
bind-key -N "New window (keeps the directory)" c new-window -c '#{pane_current_path}'
bind-key -N "Window 0" 0 select-window -t :=0
bind-key -N "Window 1" 1 select-window -t :=1
bind-key -N "Window 2" 2 select-window -t :=2
bind-key -N "Window 3" 3 select-window -t :=3
bind-key -N "Window 4" 4 select-window -t :=4
bind-key -N "Window 5" 5 select-window -t :=5
bind-key -N "Window 6" 6 select-window -t :=6
bind-key -N "Window 7" 7 select-window -t :=7
bind-key -N "Window 8" 8 select-window -t :=8
bind-key -N "Window 9" 9 select-window -t :=9
bind-key -N "Break the pane into its own window" '!' if-shell -F '#{||:#{@mios-workspace-head},#{||:#{@mios-mcp-owner},#{@mios-workspace-worker}}}' "display-message 'Managed AI workspace pane: use the float shell instead'" "break-pane"
bind-key -N "Show pane numbers (press one to pick it)" q display-panes
bind-key -N "Previous session (skips hidden sessions)" '(' run-shell -b -c '#{pane_current_path}' "TMUX_PANE=#{pane_id} /usr/libexec/mios/mios-terminal --session-cycle prev --client #{q:client_name}"
bind-key -N "Next session (skips hidden sessions)" ')' run-shell -b -c '#{pane_current_path}' "TMUX_PANE=#{pane_id} /usr/libexec/mios/mios-terminal --session-cycle next --client #{q:client_name}"
bind-key -N "Swap the pane up" '{' if-shell -F '#{||:#{@mios-workspace-head},#{||:#{@mios-mcp-owner},#{@mios-workspace-worker}}}' "display-message 'Managed AI workspace pane: use the float shell instead'" "swap-pane -U"
bind-key -N "Swap the pane down" '}' if-shell -F '#{||:#{@mios-workspace-head},#{||:#{@mios-mcp-owner},#{@mios-workspace-worker}}}' "display-message 'Managed AI workspace pane: use the float shell instead'" "swap-pane -D"
bind-key -N "Pane up" -r Up select-pane -U
bind-key -N "Pane down" -r Down select-pane -D
bind-key -N "Pane left" -r Left select-pane -L
bind-key -N "Pane right" -r Right select-pane -R
bind-key -N "Resize the pane left by 5" -r H resize-pane -L 5
bind-key -N "Resize the pane down by 5" -r J resize-pane -D 5
bind-key -N "Resize the pane up by 5" -r K resize-pane -U 5
bind-key -N "Resize the pane right by 5" -r L resize-pane -R 5
bind-key -N "Scroll up (copy mode; leaves at the bottom)" PPage copy-mode -eu
bind-key -N "Scroll down in copy mode" NPage if-shell -F '#{pane_in_mode}' 'send-keys -X page-down'
bind-key -N "Kill the pane (asks first; No is the default)" x if-shell -F '#{e|<:#{client_height},4}' "display-message 'Terminal too small for the MiOS menu: prefix ? lists every key'" "if-shell -F '#{E:@mios-console-client}' 'mios-menu-kill-pane-vt' 'mios-menu-kill-pane'"
bind-key -N "Kill the window (asks first; No is the default)" '&' if-shell -F '#{e|<:#{client_height},4}' "display-message 'Terminal too small for the MiOS menu: prefix ? lists every key'" "if-shell -F '#{E:@mios-console-client}' 'mios-menu-kill-window-vt' 'mios-menu-kill-window'"
bind-key -N "MiOS menu: apps, pane, window, session" Space if-shell -F '#{e|<:#{client_height},13}' "display-message 'Terminal too small for the MiOS menu: prefix ? lists every key'" "if-shell -F '#{E:@mios-console-client}' 'mios-menu-root-vt' 'mios-menu-root'"
bind-key -N "Apps and TUIs launcher" e run-shell -b -c '#{pane_current_path}' "TMUX_PANE=#{pane_id} /usr/libexec/mios/mios-terminal --menu apps --client #{q:client_name} --console #{?#{E:@mios-console-client},1,0} --rows #{client_height}"
%if "#{>=:#{version},3.7}"
bind-key -N "New floating pane (keeps the directory)" '*' if-shell -F '#{||:#{@mios-workspace-head},#{||:#{@mios-mcp-owner},#{@mios-workspace-worker}}}' "run-shell -b -c '#{pane_current_path}' \"TMUX_PANE=#{pane_id} /usr/libexec/mios/mios-terminal --float shell --client #{q:client_name} --console #{?#{E:@mios-console-client},1,0}\"" "new-pane -c '#{pane_current_path}' -x 70% -y 60% -X 15% -Y 20%"
%endif
bind-key -N "Show or hide the float shell" '`' run-shell -b -c '#{pane_current_path}' "TMUX_PANE=#{pane_id} /usr/libexec/mios/mios-terminal --float shell --client #{q:client_name} --console #{?#{E:@mios-console-client},1,0}"
bind-key -N "Float the pane, or dock a floating pane" F if-shell -F '#{||:#{@mios-workspace-head},#{||:#{@mios-mcp-owner},#{@mios-workspace-worker}}}' "display-message 'Managed AI workspace pane: use the float shell instead'" "run-shell -b -c '#{pane_current_path}' \"TMUX_PANE=#{pane_id} /usr/libexec/mios/mios-terminal --float lift --client #{q:client_name} --console #{?#{E:@mios-console-client},1,0}\""
bind-key -N "Accept the agent prompt (works without extended keys)" Enter if-shell -F '#{m:*agy*,#{pane_current_command} #{pane_title}}' 'send-keys C-k' "display-message 'No pending-action key adapter for this pane'"
unbind-key -T root MouseDown3Pane
unbind-key -T root MouseDown3Status
bind-key -N "MiOS pane menu (apps that use the mouse keep the click)" -T root MouseDown3Pane select-pane -t = \; if-shell -F '#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}' 'send-keys -M' "if-shell -F '#{e|<:#{client_height},17}' \"display-message 'Terminal too small for the MiOS menu: prefix ? lists every key'\" \"if-shell -F '#{E:@mios-console-client}' 'mios-menu-pane-vt-mouse' 'mios-menu-pane-mouse'\""
bind-key -N "MiOS menu: apps, pane, window, session" -T root MouseDown3Status "if-shell -F '#{e|<:#{client_height},13}' \"display-message 'Terminal too small for the MiOS menu: prefix ? lists every key'\" \"if-shell -F '#{E:@mios-console-client}' 'mios-menu-root-vt-mouse' 'mios-menu-root-mouse'\""
unbind-key -T root S-Enter
bind-key -n S-Enter if-shell -F '#{m:*agy*,#{pane_current_command} #{pane_title}}' 'send-keys C-k' "send-keys S-Enter"
set-hook -gu session-closed[91]
set-hook -g session-closed[91] "if-shell -F '#{S:#{?#{==:#{session_name},mios-float-#{s/^.//:hook_session}},1,}}' \"run-shell -C 'kill-session -t =mios-float-#{s/^.//:hook_session}'\""
