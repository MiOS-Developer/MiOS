# AI-hint: Generated from mios.toml [keybindings] by mios-unit-gen keybindings.
unbind-key -a -T prefix
set -g prefix C-b
set -g prefix2 None
bind-key C-b send-prefix
set -s escape-time 50
set -g repeat-time 500
set -g history-limit 50000
set -g mouse on
bind-key t new-window
bind-key a run-shell '/usr/libexec/mios/mios-terminal --action ai'
bind-key g run-shell '/usr/libexec/mios/mios-terminal --action agents'
bind-key m new-window -n MiOS-System mios mon
bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R
bind-key s split-window -v
bind-key v split-window -h
bind-key n next-window
bind-key p previous-window
bind-key w choose-tree -Zw
bind-key z resize-pane -Z
bind-key y copy-mode
bind-key d detach-client
bind-key Tab send-keys BTab
bind-key b send-prefix
bind-key o run-shell '/usr/lib/mios/mcp/.venv/bin/python3 /usr/libexec/mios/mios-mcp-server --workspace-focus next'
bind-key f run-shell '/usr/lib/mios/mcp/.venv/bin/python3 /usr/libexec/mios/mios-mcp-server --workspace-view toggle'
