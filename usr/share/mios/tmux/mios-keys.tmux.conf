bind-key -N "MiOS pane menu (apps that use the mouse keep the click)" -T root MouseDown3Pane select-pane -t = \; if-shell -F '#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}' 'send-keys -M' ''
bind-key -N "MiOS pane menu (apps that use the mouse keep the click)" -T root MouseUp3Pane select-pane -t = \; if-shell -F '#{||:#{mouse_any_flag},#{&&:#{pane_in_mode},#{?#{m/r:(copy|view)-mode,#{pane_mode}},0,1}}}' 'send-keys -M' "if-shell -F '#{e|<:#{client_height},18}' \"display-message 'Terminal too small for the MiOS menu: prefix ? lists every key'\" \"if-shell -F '#{E:@mios-console-client}' 'mios-menu-pane-vt-mouse' 'mios-menu-pane-mouse'\""
bind-key -N "MiOS menu: apps, pane, window, session" -T root MouseUp3Status "if-shell -F '#{e|<:#{client_height},14}' \"display-message 'Terminal too small for the MiOS menu: prefix ? lists every key'\" \"if-shell -F '#{E:@mios-console-client}' 'mios-menu-root-vt-mouse' 'mios-menu-root-mouse'\""
bind-key -N "MiOS menu: apps, pane, window, session" -T root MouseDown1StatusLeft run-shell -b -c '#{pane_current_path}' "TMUX_PANE=#{pane_id} /usr/bin/miosd launcher open --client #{q:client_name} --console #{?#{E:@mios-console-client},1,0}"
unbind-key -T root M-Space
bind-key -N "MiOS menu: apps, pane, window, session" -n M-Space run-shell -b -c '#{pane_current_path}' "TMUX_PANE=#{pane_id} /usr/bin/miosd launcher open --client #{q:client_name} --console #{?#{E:@mios-console-client},1,0}"
unbind-key -T root S-Enter
bind-key -n S-Enter if-shell -F '#{m:*agy*,#{pane_current_command} #{pane_title}}' 'send-keys C-k' "send-keys S-Enter"
set-hook -gu session-closed[91]
set-hook -g session-closed[91] "if-shell -F '#{S:#{?#{==:#{session_name},mios-float-#{s/^.//:hook_session}},1,}}' \"run-shell -C 'kill-session -t =mios-float-#{s/^.//:hook_session}'\""

# MiOS native TTY desktop (opt-in session/window scope)
set -g @mios-desktop-policy-enabled "1"
set -g @mios-desktop-dock "1"
set -g @mios-desktop-pane-titles "1"
set -g @mios-desktop-dock-rows "2"
set -g @mios-desktop-min-columns "34"
set -g @mios-desktop-min-rows "10"
set -g @mios-desktop-snap-margin "2"
set -g @mios-desktop-dock-refresh "1"
set -g @mios-desktop-binary "/usr/libexec/mios/mios-tmux"
set -g @mios-desktop-socket-name "mios-desktop"
set -g @mios-desktop-dock-format "#(/usr/bin/mios-gen tmux-os desktop dock-state --socket #{q:socket_path} --client #{q:client_name} --format tmux)"
set -g @mios-desktop-border-format "#{?#{E:@mios-managed-pane},#{pane_id},#{?#{@mios-desktop-canvas},,#{?#{>=:#{pane_width},12},#[align=left]#{pane_id}#[align=right][_][+][x],#{pane_id}}}}"
bind-key -T root MouseDown1Status if-shell -F "#{&&:#{@mios-desktop-enabled},#{m/r:^(apps|p:%[0-9]+)\$,#{mouse_status_range}}}" "run-shell -b \"TMUX_PANE=#{pane_id} /usr/bin/mios-gen tmux-os desktop dock-click --socket #{q:socket_path} --client #{q:client_name} --item #{q:mouse_status_range}\"" "select-window -t ="
bind-key -T root MouseUp1Border if-shell -F -t = "#{?#{@mios-desktop-enabled},#{?#{E:@mios-managed-pane},0,#{?#{@mios-desktop-canvas},0,1}},0}" "run-shell -b -t = \"TMUX_PANE=#{pane_id} /usr/bin/mios-gen tmux-os desktop title-click --socket #{q:socket_path} --client #{q:client_name} --pane #{q:mouse_pane} --expected-pid #{q:pane_pid} --expected-window #{q:window_id} --x #{mouse_x} --y #{mouse_y}\"" ""
bind-key -T root MouseUp3Border if-shell -F -t = "#{?#{@mios-desktop-enabled},#{?#{E:@mios-managed-pane},0,#{?#{@mios-desktop-canvas},0,1}},0}" "run-shell -b -t = \"TMUX_PANE=#{pane_id} /usr/bin/mios-gen tmux-os desktop context --socket #{q:socket_path} --client #{q:client_name} --pane #{q:mouse_pane} --expected-pid #{q:pane_pid} --expected-window #{q:window_id}\"" ""
bind-key -T root MouseDown1Border if-shell -F -t = "#{?#{@mios-desktop-enabled},#{?#{E:@mios-managed-pane},0,#{?#{@mios-desktop-canvas},0,1}},0}" "select-pane -t =" "select-pane -t ="
bind-key -T root MouseDrag1Border if-shell -F -t = "#{?#{@mios-desktop-enabled},#{?#{@mios-desktop-enabled},#{?#{E:@mios-managed-pane},0,#{?#{@mios-desktop-canvas},0,1}},0},1}" "resize-pane -M" ""
