# AI-hint: Contains default configuration for the SearXNG instance, defining network ports, security headers, and search engine behavior to ensure stable results for ...
# AI-doc: usr/share/doc/mios/manual/searxng.md

use_default_settings: true

general:
  instance_name: "MiOS Search"
  privacypolicy_url: false
  donation_url: false
  contact_url: false
  enable_metrics: false

server:
  # No base_url / port / bind_address here: the mios-searxng Quadlet projects
  # SEARXNG_BASE_URL and SEARXNG_BIND_ADDRESS from [ports].searxng, and granian
  # binds GRANIAN_HOST:GRANIAN_PORT from the same key. A literal here could
  # only disagree with the SSOT.
  # Filled in at first-boot by SearXNG's entrypoint.
  secret_key: "PLACEHOLDER_SECRET_KEY_REGENERATE_ON_FIRST_BOOT"
  limiter: false
  image_proxy: true
  http_protocol_version: "1.0"
  method: "GET"
  default_http_headers:
    X-Content-Type-Options: nosniff
    X-Download-Options: noopen
    X-Robots-Tag: noindex, nofollow
    Referrer-Policy: no-referrer

ui:
  static_use_hash: true
  default_locale: "en"
  query_in_title: false
  infinite_scroll: false
  center_alignment: false
  theme_args:
    simple_style: dark

search:
  safe_search: 0
  autocomplete: "duckduckgo"
  default_lang: "en"
  formats:
    - html
    - json    # required for the agent web_search tool surface

# Outgoing-request resilience. The default Google /
# DuckDuckGo scrape paths CAPTCHA / 403 / 429 a self-hosted instance
# (SearxEngineTooManyRequests / AccessDenied / CAPTCHA in the logs), which
# zeroed result sets and made the agent fall back to geo-IP'd data. More
# time + one retry keeps a slow engine from emptying the results; the cap
# stops one dead engine stalling the whole query.
outgoing:
  request_timeout: 8.0
  max_request_timeout: 12.0
  pool_connections: 100
  pool_maxsize: 20
  retries: 1

# Engine curation. use_default_settings:true means this list PATCHES the
# upstream defaults by name (it does not replace them). Disable the chronic
# blockers (Google scrape endpoints -- 403 / IndexError / CAPTCHA from a
# self-hosted IP) and lean on engines that serve a self-hosted instance
# reliably WITHOUT an API key. SearXNG auto-suspends any engine that errors,
# so the remaining set fills in; DuckDuckGo is kept (it recovers from its
# transient CAPTCHA) but is no longer load-bearing.
engines:
  - name: google
    disabled: true
  - name: google news
    disabled: true
  - name: google scholar
    disabled: true
  - name: google images
    disabled: true
  # Chronic self-hosted blockers (observed access-denied / CAPTCHA
  # on EVERY query). Disable so they neither add failed requests nor surface a
  # junk fallback when the good engines are momentarily rate-limited (that's
  # how "Sword Art Online" came back as weapon-swords + "why" as dictionary
  # definitions -- the only engine that answered was a weak one).
  - name: mojeek
    disabled: true
  - name: startpage
    disabled: true
  - name: karmasearch
    disabled: true
  # Reliable no-API-key workhorses for a self-hosted instance.
  - name: bing
    disabled: false
  - name: duckduckgo
    disabled: false
    timeout: 5.0
  # brave returns good results but rate-limits ("too many requests") under a
  # query BURST -- kept, since the fan-out/concurrency is tamed (agent-pipe)
  # so it stays healthy; SearXNG auto-suspends it briefly if it does trip.
  - name: brave
    disabled: false
  - name: wikipedia
    disabled: false
  - name: wikidata
    disabled: false
