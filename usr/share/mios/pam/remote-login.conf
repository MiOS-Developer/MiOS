# AI-hint: Private remote PAM environment applied before session/logind modules.
# AI-related: usr/lib/pam.d/mios-remote-login
# Unquoted empty values DELETE entries in Linux-PAM pam_env; quoted empty
# values leave a defined empty variable. Do not change these to quoted strings.
XDG_SEAT DEFAULT= OVERRIDE=
XDG_VTNR DEFAULT= OVERRIDE=
XDG_SESSION_REMOTE DEFAULT=1 OVERRIDE=1
