# AI-hint: Multi-user Nix configuration for MiOS bootc/ostree immutable workstation.
# AI-related: automation/59-tools.sh, usr/lib/tmpfiles.d/50-mios.conf, usr/libexec/mios/config/nix_project.py

# Core experimental features for modern flake-driven workflows
experimental-features = nix-command flakes

# Multi-user build execution and isolation
build-users-group = nixbld
sandbox = true
sandbox-fallback = false
max-jobs = auto
cores = 0

# Binary cache substituters and cryptographic trust roots
substituters = https://cache.nixos.org/
trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=

# User authorization policies
trusted-users = root mios @wheel

# Store deduplication and GC retention policies
auto-optimise-store = true
keep-outputs = true
keep-derivations = true

# Disk space management thresholds (in bytes: 1GB min, 5GB max)
min-free = 1073741824
max-free = 5368709120
