[containers.mios-piper.Container]
ContainerName = "mios-piper"
EnvironmentFile = "/etc/mios/install.env"
# The voice ships inside localhost/mios-piper (/usr/share/piper/voices), so no
# host bind: a read-only vendor model is image content (Law 12), not /var state.
Exec = "-m ${MIOS_SERVICES_PIPER_VOICE} --data-dir /usr/share/piper/voices --host 0.0.0.0 --port ${MIOS_PORTS_PIPER}"
Group = "${MIOS_SERVICES_PIPER_GID}"
HealthCmd = "python3 -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:${MIOS_PORTS_PIPER}/info', timeout=5)\" || exit 1"
HealthInterval = "30s"
HealthRetries = 3
HealthStartPeriod = "30s"
HealthTimeout = "10s"
Image = "localhost/mios-piper:latest"
Label = [
  "org.opencontainers.image.title=mios-piper",
  'org.opencontainers.image.description="Local piper1-gpl streaming server for MiOS real-time speech synthesis"',
  "org.opencontainers.image.source=https://github.com/OHF-Voice/piper1-gpl",
  "org.opencontainers.image.licenses=GPL-3.0-or-later"
]
Pod = "mios-ai.pod"
User = "${MIOS_SERVICES_PIPER_UID}"
Volume = "/run/mios:/run/mios:Z"

[containers.mios-piper.Install]
WantedBy = "multi-user.target default.target"

[containers.mios-piper.Service]
Delegate = "yes"
