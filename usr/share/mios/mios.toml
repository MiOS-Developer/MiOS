# ----------------------------------------------------------------------------
[pipeline]
space = { min = 0, max = 99 }

identity_axes = ["script_prefix", "log_label"]
future_axes   = ["oci_run_step"]
progress_axis = "script_count"

label_stage = "[{nn}-{name}]"          # e.g. [42-chrony-render]
label_check = "[{nn}-{name}:{cc}]"     # e.g. [98-drift-checks:86]

map         = "usr/share/mios/reference/pipeline-index.tsv"    # NN<TAB>kind<TAB>name<TAB>file<TAB>oneline
check_index = "usr/share/mios/reference/drift-gate-index.tsv"  # CC<TAB>check_fn<TAB>description
check_stage = 98

reporter  = "usr/lib/mios/log.sh"               # mios_step / mios_check_* derive NN + CC at runtime
generator = "tools/native/mios-gen/src/main.rs"  # extends mios-gen gate-index
gate      = "98-drift-checks.sh:check_pipeline_numbering"

bands = [
  { range = [1, 1],   purpose = "git-overlay" },
  { range = [2, 2],   purpose = "build-context" },
  { range = [5, 7],   purpose = "repos/kernel" },
  { range = [10, 15], purpose = "accounts" },
  { range = [20, 27], purpose = "hardware-universal" },
  { range = [33, 54], purpose = "services" },
  { range = [56, 62], purpose = "themes" },
  { range = [65, 80], purpose = "ai/desktop/boot/distribution" },
  { range = [85, 99], purpose = "finalize/validators" },
]

[drift.lint]
python = "python3"
shellcheck = "shellcheck"
shell_severity = "error"
shell_directories = ["", "automation", "automation/tests", "automation/support", "automation/lib", "tools", "tools/lib", "installation", "tests", "usr/lib/mios", "usr/libexec/mios"]
shell_exclude = ["automation/lib/globals.sh"]
# Files changed since the first ratchet base that resolves (MIOS_RATCHET_BASE wins) are
# also held to this severity: new shell meets the stricter bar, the backlog does not block.
shell_changed_severity = "warning"
ratchet_bases = ["origin/main", "HEAD~1"]
# The shipped monitor is a ZIP executable, not a Python source module.
python_exclude = ["usr/libexec/mios/mios-dashboard"]

[drift.modules]
import_roots = ["usr/lib/mios/agent-pipe", "usr/libexec/mios", "tools"]

[pipeline.console]
width = 100
bar_width = 24
# Ruling Q8: 97-ssot-lint, 98-drift-checks and the agent-pipe suites are
# source-tree gates, so they run in the CI gate job, not here.
post_steps = [
    { name = "post-bloat", action = "bloat" },
    { name = "post-package-health", action = "package_health" },
    { name = "99-postcheck.sh", action = "invariants" },
    { name = "post-libexec-tests", action = "libexec_tests" },
    { name = "post-image-digests", action = "image_digests" },
    { name = "post-log-chain", action = "log_chain" },
    { name = "post-finalize", action = "finalize" },
]

[pipeline.invariants]
prefix_unique       = false
prefix_in_band      = true
map_in_sync         = true
check_dense         = true
check_derived       = true
label_not_stale     = true
single_progress     = true

[pipeline.external]
counters = [
  { tool = "podman/buildah", pattern = "STEP i/N", scope = "outer ~25, nested mios-sys ~19, go-builder 2, rust-builder 4" },
  { tool = "dnf5",           pattern = "[i/N]",     scope = "download ~55 + transaction ~57" },
  { tool = "cargo",          pattern = "Compiling c (i/m)", scope = "rust-builder crate graph" },
]
suppress_hint = "quiet flags only (dnf5 -q, buildah --quiet, cargo -q). Never parse or fold into the MiOS scheme."

# task_974. miosd Check implementations that were never written: their `run` takes
# `_ctx`, never reads the tree, and returned a constant Verdict::Pass with a
# message CLAIMING verification. Containerfile:103 invokes this suite at every
# bake, so the bake's own gate was certifying a tree it had not read -- pointed
# at a directory that does not exist it reported "55 passed". They now report
# Verdict::Skip("NOT IMPLEMENTED: ..."), which is the truth, and are registered
# here shrink-only: implement a check and take it off the list; a new stub fails
# the gate. Gate: `mios-gate drift-stubs`.
# Ceilings that are GENERATED budgets rather than shrink-only ratchets, so
# check_ratchet_direction lets them rise. Itemised with a reason on purpose: a
# bare key here is indistinguishable from a silent skip, and a skip nobody can
# see is how a gate stops being one. An entry naming something that is not a
# ceiling is a finding, so a stale exemption cannot lie in wait for a future key
# of that name.
#
# A TABLE of key -> reason, deliberately not an array of inline tables: that
# shape renders differently in the two resolver twins, and its registered
# divergence set is a shrink-only 12 that a thirteenth key breaches
# (check_resolver_differential_parity). Law 13 costs a shape here.
[drift.generated_ceilings]
"build.ratchet.max_phase_scripts" = "Phase scripts expanded during Phase 2 build features; ceiling raised to 79 to match verified phase scripts on disk (task_459, task_441, task_453)"
"build.rechunk_max_layers" = "OCI layer ceiling for hhd-dev/rechunk; trades layer count against pull size and rebuild caching, so it is an operator-tunable budget rather than a shrink-only code-debt ratchet (task_3397)"
"legibility.max_tracked_mb" = "emitted by tools/native/mios-size-ceiling as round(tracked MiB) + [legibility].tracked_mb_headroom; it tracks the deliverable's size, which Law 12 BAKE-NOT-FETCH requires to grow, so shrink-only is the wrong shape for it (task_988)"
"legibility.max_libexec_verbs" = "Re-baselined to 313 following approved merges on main"
"legibility.max_shell_lines" = "Re-baselined to 54941 following approved merges on main (ADR-0026 task store, operator-approved 2026-09-26)"
"legibility.max_ps_lines" = "Re-baselined to 27878 following approved merges on main"
"legibility.max_tooling_python_lines" = "Re-baselined to 81188 following approved merges on main (ADR-0026 task store, operator-approved 2026-09-26)"

[drift.budget_keys]
# task_984. Budget keys that MUST exist in [agent_pipe] or [dispatch].
#
# Enumerating the tables catches a key ADDED with no consumer. It cannot catch
# a key DELETED, because a deleted key is simply absent from the enumeration --
# the set shrinks and nothing is missing from it. The hardcoded nine-name list
# this replaced was doing two jobs and only one of them was the defect; this is
# the other one, moved out of Rust source and into SSOT where an
# operator-tunable registry belongs (Law 7).
#
# Seeded with exactly the nine the old constant named, so the floor is no
# weaker than what it replaced. Removing an entry here is removing a guarantee:
# do it only when the knob is genuinely retired.
required = [
  "tool_max_iters",
  "replan_max",
  "no_progress_window",
  "max_consecutive_failures",
  "wall_clock_budget_s",
  "reflexion_enable",
  "swarm_max_width",
  "max_dispatch_depth",
  "default_hop_budget",
]

# [agent_pipe]/[dispatch] keys that SSOT declares and NOTHING reads.
# Shrink-only, and the ceiling may never sit above the measurement. Itemised
# rather than a bare count: a count lets one dead key swap for another without
# the gate noticing, which is the defect [docs] already carries.
#
# mios-aiplane-lint walks all 128 scalar leaves under both tables. It used to
# walk a hardcoded list of nine, so these nine were invisible: an operator
# could set any of them and nothing would happen, silently.
#
# Each is a knob with no reader. Wire it or delete it -- do not just move the
# ceiling. `reflexion_limit` and `tool_loop_limit` are named by
# tools/drift-checks.py, but only as keys it asserts are PRESENT; naming a key
# is not consuming it, and that is exactly how they stayed dead.
unconsumed = [
  "client_tools_passthrough",
  "lane_concurrency_cpu",
  "lane_concurrency_gpu0",
  "reflexion_limit",
  "tool_backend_model",
  "tool_loop_limit",
  "trace_enable",
  "trace_max_spans_per_trace",
  "trace_max_traces",
]
max_unconsumed = 9

[drift.unimplemented]
# Every miosd drift Check is implemented: the register is empty and its
# ceiling is 0, so a new stub (Verdict::Skip "NOT IMPLEMENTED:") fails both
# mios-gate drift-stubs and the runner, which counts it as MISSING.
max_unimplemented = 0
checks = []

[build.phases]
# task_975. Phase scripts present in automation/ that build.sh does NOT run.
# Shrink-only, and the ceiling may never sit above the measurement.
#
# The register is empty as of task_962 stage 5. It previously held
# 55-native-build.sh on the reasoning that registering it would put miosd on
# PATH -- its `ln -sf "${DEST_DIR}/${bin}" "/usr/bin/${bin}"` is the only such
# line in the tree -- and so arm the `command -v miosd` gates in every stage
# numbered above 55, producing a split brain inside one bake.
#
# That reasoning read the script instead of measuring whether the line runs.
# This was a historical missing-package condition. [packages.build-toolchain]
# now ships Rust/Cargo and the repos phase installs selected build dependencies.
# Phase 55 must distinguish complete source checkouts from image bake contexts;
# prebuilt native binaries copied by the Containerfile remain the bake producer.
# The binaries in the image come from the Containerfile's rust-builder stage,
# COPYed to /usr/libexec/mios, which is not on PATH -- so no stage, above or
# below 55, has ever reached its Rust branch. Registering 55 arms nothing.
# It also cannot change which phases run: build.sh selected via the
# automation/[0-9][0-9]-*.sh glob (build_catalog_authoritative = false and no
# build_phases.json), and that glob already included 55.
unregistered = []
max_unregistered = 0
