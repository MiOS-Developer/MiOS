xterm_scroll_margin    = '\.xterm-scrollable-element[^{}]*\{[^}]*?(?<![-\w])margin(?:-left)?\s*:\s*([^;}]+)'
xterm_viewport_right   = '\.xterm-viewport(?![-\w])[^{}]*\{[^}]*?(?<![-\w])right\s*:\s*([^;}]+)'
terminal_scrollbar     = '\.scrollbar(?![-\w])[^{}]*\{[^}]*?(?<![-\w])display\s*:\s*([^;}]+)'
terminal_chrome        = { scope = 'terminal|xterm|\.part\.panel', props = '(?:padding|margin|border|left|top|right|bottom|inset)(?:-(?:left|right|top|bottom|width|inline|block)(?:-(?:start|end))?)?' }

