timeout = 10
minrate = "1k"
max_parallel_downloads = 10
ip_resolve = 4

[repos.fedora-updates]
name = "Fedora {ver} Updates - $basearch"
metalink = "https://mirrors.fedoraproject.org/metalink?repo=updates-released-f{ver}&arch=$basearch"
enabled = true
repo_gpgcheck = false
repo_type = "rpm"
gpgcheck = true
