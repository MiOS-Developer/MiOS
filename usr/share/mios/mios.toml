  { generator = "tools/native/mios-gen/src/bootstrap_sync.rs", check = "check_bootstrap_sync", output = "the [bootstrap.sync] mirror files in mios-bootstrap" },
  { generator = "tools/native/mios-gen/src/sync.rs", check = "check_resolved_env_lossless", output = "usr/share/mios/reference/env-baseline.txt" },
