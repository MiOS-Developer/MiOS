# The scope this registry is measured against. `mios-gate projection-coverage`
# reads these globs, enumerates what they match, and asserts every hit is on
# `surfaces` above or itemised on `exempt` below -- the reverse direction that
# `check_projection_registry` (forward only) never asked. Single `*`, final
# path segment only; a pattern the matcher cannot express is a hard error, not
# a silent widening.
generator_globs = [
  "tools/generate-*.py", "tools/render-*.py", "tools/gen-*.py",
  "tools/native/mios-gen/src/*.rs",
  "tools/native/mios-unit-gen/src/lib*.rs",
  "tools/native/mios-bake-plan/src/main*.rs",
  "tools/native/generate-names-registry/src/main*.rs",
  "tools/native/mios-task/src/overrides*.rs",
  "tools/native/mios-size-ceiling/src/main*.rs",
  "tools/native/mios-toolchain-pin/src/main*.rs",
  "tools/native/mios-ai-config/src/main*.rs",
  "tools/native/xtask/src/main*.rs",
  "tools/native/mios-edge-status/src/main*.rs",
]

# Shrink-only. A generator belongs here ONLY if it projects nothing tracked, and
# then with the reason spelled out -- a bare name would make this a count.
exempt = []
max_exempt = 0


[security.sigstore]
cosign_major = 2
cosign_version = "v2.6.4"
cosign_release_url = "https://github.com/sigstore/cosign/releases/download"
policy_mode = "insecureAcceptEverything"
allowed_identities = []

[security.privileged_quadlets]
max_privileged_root = 13
root = [
  "mios-ceph.container",                    # Ceph OSD/MON -- uid 0 for block devices
  "mios-radosgw.container",                 # Ceph RADOS Gateway -- uid 0 for ceph admin/storage access
  "mios-k3s.container",                     # k3s server -- uid 0 (CNI, kubelet mounts)
  "mios-forge.container",                   # Forgejo data bootstrap as 0
  "mios-forgejo-runner.container",          # CI runner (DinD / --privileged)
  "mios-pxe-hub.container",                 # PXE/TFTP/DHCP -- privileged net
  "mios-webtools-crawl4ai.container",       # webtools pod -- upstream image runs as 0
  "mios-webtools-firecrawl-api.container",  # webtools pod -- upstream image runs as 0
  "mios-webtools-firecrawl-worker.container", # webtools pod -- upstream image runs as 0
  "mios-webtools-redis.container",          # webtools pod -- upstream image runs as 0
  "mios-llm-heavy.container",               # GPU serving, vLLM or SGLang per [ai].heavy_engine -- both upstream images run as 0
  "mios-coderun-sandbox@.container",        # user-scope sandbox -- Network=none + ReadOnly + DropCapability=ALL
]
# Units legitimately without Group=/Delegate=yes (Law 6 exempt from those two keys only).
no_group_delegate = [
  "mios-coderun-sandbox@.container",        # UserNS=keep-id user unit -- Delegate n/a
]

# Law 10 BARE-SAFE-ENV: /etc/mios/install.env is bare KEY=value, readable by
# all three parsers (systemd EnvironmentFile=, bash source, podman --env-file).
# A value carrying whitespace, a quote, `$`, a backtick or `#` cannot be written
# bare without changing what it means, so system-sync-env.sh skips it.
#
# Skipping SILENTLY is the defect: MIOS_AI_ENDPOINT was dropped this way and
# Law 5 routes every agent through it (task_997). These keys are declared, with
# the reason each value cannot be bare; ANY other unsafe value now fails the
# render instead of vanishing. Shrink-only: max_declared comes down as values
# are made bare, never up.
[security.non_bare_env]
max_declared = 5
keys = [
  "MIOS_USER_FULLNAME",           # a person's display name -- the space IS the content
  "MIOS_FRONTIER_LANE_A_ROLE",         # prose describing a lane's share of the work
  "MIOS_FRONTIER_LANE_B_ROLE",         # same, and parenthesised
  "MIOS_FRONTIER_LANE_B_MODEL",        # an external lane's display model name -- spaces + parentheses
  "MIOS_FRONTIER_CLAUDE_EFFORT_FLAG",  # a CLI flag template: a space and a {} placeholder
]

# Law 11 SECRETS-NEVER-IN-ENV: secret-bearing environment variable names
# that must NEVER leak into world-readable files like /etc/mios/install.env.
# min_keys is a floor -- an explicit register shared between postcheck,
# system-sync-env.sh, and mios-gate credentials.rs.
[security.secret_keys]
min_keys = 3
keys = [
  "MIOS_USER_PASSWORD_HASH",
  "MIOS_FORGE_ADMIN_PASSWORD",
  "MIOS_GITHUB_TOKEN",
]

[security.nohc_allowlist]
# SSOT Allowlist for legitimate exceptions to the ports/IPs hardcode check (task_126).
exempt_files = [
    "install-mios-agents\\.sh$",
    "usr/lib/mios/agent-pipe/server\\.py$",
    "usr/lib/mios/gateway-agent/.*\\.py$",
    "test_.*\\.py$",
    "Heal-MiOSLocalhostForwarding\\.ps1$",
    "Setup-MiOSLanPortProxy\\.ps1$",
    "Update-MiOSStartMenuShortcuts\\.ps1$",
    "user-setup\\.sh$",
    "system-sync-env\\.sh$",
    "mios-dashboard\\.sh$",
    ".*firstboot\\.sh$",
    ".*firstboot$",
    ".*/automation/.*",
    ".*/windows/.*",
    ".*/usr/libexec/.*",
    ".*/profile\\.d/.*",
    ".*/xrdp/.*",
    ".*/startwm\\.sh$",
    ".*/evals/.*",
    ".*/embeddings/.*",
    ".*/tools/.*",
    ".*/tests/.*",
    ".*/usr/share/mios/.*",
    ".*build-mios\\.ps1$",
    ".*Get-MiOS\\.ps1$",
    ".*patch_pods\\.py$",
    ".*mios-fix-wslg\\.ps1$",
    ".*MiOS-Field-FileChecker\\.ps1$"
]
exempt_patterns = [
    "0\\.0\\.0\\.0",
    "localhost:80(?![0-9])",
    "localhost:443(?![0-9])",
    "127\\.0\\.0\\.1:80(?![0-9])",
    "127\\.0\\.0\\.1:443(?![0-9])",
    "localhost/mios",
    "wsl\\.localhost",
    "localhost:8700",
    "localhost:8720",
    "localhost:8575",
    ":8700",
    ":8720",
    ":8575",
    ":11436",
    ":8740",
    ":11435",
    ":9222",
    ":8283"
]


[security.fapolicyd_observe]
enable = false



[security.mcp_sandbox]
enable = false
write_allowed_paths = ["/tmp/mios-mcp", "/var/lib/mios/ai"]

[security.egress]
mode  = "off"
allow = []

[security.disk_encryption]
mode     = "tpm2"                          # Encryption mode: "tpm2", "clevis", "none"
pcrs     = [7, 14]                         # 7 = Secure Boot state, 14 = MOK enrolment (akmods-signed NVIDIA modules)
recovery = true                            # Generate and store a LUKS recovery key
backend  = "systemd-cryptenroll"           # Enrollment backend: "systemd-cryptenroll", "clevis"

# A TPM2 PCR policy binds to ONE host: PCR 7 is that machine's Secure Boot
# state, PCR 14 that machine's MOK enrolment. Neither travels on a drive.

# So a portable MiOS-Field drive enrolls a SECOND token. ADR-0016 D13.1.
portable_token = "fido2"

[security.mtls]
enable        = false
dir           = "/etc/mios/mtls"
common_name   = ""          # empty -> hostname
validity_days = 825
# ca_file   = "/etc/mios/mtls/ca.crt"     # set these to use an org PKI instead
# cert_file = "/etc/mios/mtls/agent.crt"
# key_file  = "/etc/mios/mtls/agent.key"

[uki]
verity_uki_build = false

[fs_watcher]
watch_dirs = [
    "/var/lib/mios/hermes-tail",
    "/var/lib/mios/delegation-prefilter",
    "/var/lib/mios/log-watcher",
    "/var/lib/mios/daemon",
    "/var/lib/mios/scratch",
    "/var/lib/mios/agent-nudger",
    "/var/lib/mios/cron-director",
    "/var/lib/mios/ai/scratch",
]

[pkg]
bootstrap_per_source_cap   = 200
lookup_max_alias_results   = 3

[ttyd]
enable             = true
bind               = "127.0.0.1"
# Mobile (#82): expose the loopback bash terminal to the TAILNET (phones) over
# tailnet-only HTTPS via `tailscale serve` (NOT the public internet). When true,
# the mios-ttyd-expose.service oneshot publishes it on boot; off by default so a
# fresh install never opens a shell unprompted. Toggle here or in mios.html.
# The login is the SSOT [identity] credential (mios/mios) -- never unauth'd.
tailnet_expose     = false
# Master auth toggle: when bind != "127.0.0.1" + require_auth = true
# + auth_user/pass empty, the service refuses to start (prevents
# accidental open-network exposure).
require_auth       = true
# auth_user/auth_pass: empty = INHERIT the global [identity] login (username /
# default_password, default mios/mios) -- same as Portal/Cockpit/Forge. Set per
# instance only to override the one global credential.
auth_user          = ""
auth_pass          = ""
ssl_cert           = ""
ssl_key            = ""
# Per-instance shell overrides. Empty = use the per-service default
# (mios-ttyd-bash -> /bin/bash; mios-ttyd-powershell ->
# /usr/libexec/mios/mios-powershell --shell which resolves pwsh.exe).
bash_shell         = ""
powershell_shell   = ""
writable           = true
# Max active client sessions per instance (ttyd defaults to 1 +
# rejects further). Raise for collaborative read-only sessions.
max_clients        = 0
# Pinned release: the patched ttyd page (-I) is built from it; a moved .terminal
# padding rule FAILS the build.
version            = "1.7.7"
page_source        = "https://raw.githubusercontent.com/tsl0922/ttyd/{version}/src/html.h"  # the gzipped page ttyd embeds at that tag
page_sha256        = "6f3716ebd951e101df883bb14922f067c023f11561aa088ef487814183727cf3"  # page_source at version; a bump re-measures it
page_path          = "/usr/share/mios/ttyd/index.html"  # the patched page mios-ttyd-launch serves with -I
# xterm font size (px). The MiOS Portal sizes its inline terminal embed to a
# fixed 80x20 pixel box assuming this; raising it makes the embed show fewer
# columns/rows in that box (and vice-versa).
font_size          = 14

[agents]

[agents._defaults]
kind            = "local-http"   # local-http|remote-http|cli|mobile|edge|node|a2a
role            = "general"
job             = ""
default         = false
fanout          = true
enabled         = true           # set false on a default-off / optional unit
lane            = "gpu"
health_gate     = false          # loader upgrades -> true for local-optional / remote / cli
transport       = "http"         # cli => subprocess shim (e.g. opencode)
timeout_s       = 0              # 0 = lane default; required for kind=cli
strengths       = []
cpu_endpoint    = ""
cpu_model       = ""
failover_agents = []
denied_verbs    = []
allowed_verbs   = []
max_permission  = ""             # "" = no ceiling; e.g. "read" for an untrusted edge node
api             = ""             # openai|llamacpp|vllm|sglang
research_only   = false

[agents._defaults.auth]
scheme          = "none"         # none|bearer|oauth2|mtls
header_template = ""             # e.g. "Authorization: Bearer ${MIOS_AGENT_<NAME>_KEY}"
principal_mode  = ""             # "" = inherit [a2a].principal_mode; else audit|require

[agents._defaults.trust]
min_reputation           = 0.0   # drop a peer below this reputation (mios_reputation)
require_signed_principal = false # require a verified Ed25519 principal on inbound delegation
mtls                     = false # require mTLS for this peer

[agents.hermes]
privilege_group = "privileged"
endpoint = "http://localhost:${MIOS_PORTS_HERMES}/v1"
# model removed
role     = "general"
health_gate = true
job      = "General orchestration of multi-step, tool-driven tasks -- decide local-vs-web, search, inspect and operate the system, launch apps, then fan out and synthesise."
fanout   = false
default  = false
# Inference lane ("self-delegate to CPU concurrently
# to pending/future GPU operations"). gpu = the heavy dGPU lane (${MIOS_PORTS_LLM_HEAVY});
# cpu = the light iGPU/CPU lane. The fan-out pairs a GPU primary with a
# CPU secondary so both lanes work in parallel -- and so Hermes is never
# the ONLY dispatched agent.
lane     = "gpu"
cpu_endpoint = "http://localhost:${MIOS_PORTS_LLM_HEAVY}/v1"
cpu_model    = "mios-heavy"
# Tools Hermes is good at -- the refine pass surfaces these
# as hint_tools when the intent matches.
strengths = ["kanban", "web_search", "skill_invocation",
             "multi_step_reasoning", "tool_use"]

[agents.opencode]
privilege_group = "routine"
endpoint = "http://localhost:${MIOS_PORTS_OPENCODE_GATEWAY}/v1"
# ONE canonical model id (must match [ai].opencode_model + opencode.json + the
# mios-opencode build name:tag). Was "opencode"; unified to the real tag the
# gateway advertises and mios-llm-light serves.
model    = "mios-opencode:latest"
# WS-A1 unified-template fields: opencode is a default-OFF subprocess-shim (CLI)
# agent reached via the :8780 gateway. Declaring kind=cli + enabled=false makes
# the loader auto-upgrade health_gate=true (so a dead gateway is probed + dropped,
# never a DAG sink) even if the explicit flag below were ever removed.
kind     = "cli"
transport = "cli"
enabled  = true
timeout_s = 90
role     = "coding"
job      = "Software engineering -- read, edit, review, test and commit code, configs, scripts, systemd units, Containerfiles and TOML in this repo/system."
default  = false
fanout   = true
health_gate = true
lane     = "gpu"
strengths = ["file_edit", "code_review", "git", "test_running",
             "refactor"]
failover_agents = ["hermes"]

[agents.mios-daemon-agent]
endpoint = "http://localhost:${MIOS_PORTS_LLM_HEAVY}/v1"
model    = "mios-heavy"
# REASONING now (was "telemetry"): a real CPU second opinion, grounded in --
# not limited to -- system telemetry.
role     = "reasoning"
job      = "CPU reasoning grounded in live system state -- second opinions, summaries, planning, and answers grounded in the global journal/log telemetry it continuously collects."
default  = false
fanout   = true
# health_gate (merged from mios-reasoner-cpu): engage only when :8740 answers,
# drop fast otherwise -- the always-on daemon normally always passes.
health_gate = true
# CPU lane: runs off the dGPU, so the fan-out self-delegates to it CONCURRENTLY
# with a GPU primary at zero VRAM cost -- lane-diverse councils (CPU+GPU+iGPU).
lane     = "cpu"
# MERGED strengths: general CPU reasoning (from the consolidated mios-reasoner-
# cpu) PLUS the telemetry/log specialism (the daemon's core job). NOT topic-
# gated (council mode ignores relevance); these inform the A2A skill tags + the
# relevance-mode fallback. _daemon_agent_reply's system prompt -- not a strength
# deny-list -- keeps telemetry out of unrelated answers.
strengths = ["reasoning", "second_opinion", "summarize", "planning",
             "journalctl_tail", "log_search", "event_query",
             "system_followup", "what_just_happened"]
# P3.2 SPOF removal: when the always-on :8740 reasoner is down, hermes can
# stand in for the reasoning role (loses the live-telemetry grounding but
# preserves the second-opinion capability). The cpu-twin already covers the
# lane fallback; this lets the cluster health show a NAMED failover too.
failover_agents = ["hermes"]




[agents.ai-local]
endpoint    = ""
model       = "qwen2.5-3b-instruct-4bit"
role        = "mobile"
job         = "On-device mobile second opinion -- a lightweight local model on the operator's phone (AI.Local over the tailnet) for an extra perspective when it is serving."
default     = false
lane        = "mobile"
health_gate = true
strengths   = ["mobile_local_model", "on_device", "offline_edge"]

[agents.mios-node]
kind            = "node"
endpoint        = "http://localhost:${MIOS_PORTS_NODE}/v1"
model           = "mios-node:latest"
role            = "edge_execution"
job             = "Distributed edge micro-node task execution, Wasm sandboxing, Ed25519 signature checks, and CRDT lock-free state synchronization."
default         = false
fanout          = true
health_gate     = true
lane            = "edge"
api             = "http"
strengths       = ["wasm_sandboxing", "crdt_state_sync", "peer_discovery", "task_offloading", "ed25519_verification"]



[gateway]
# Native Gateway Sovereign Migration Configuration (task_78)
model                     = "granite4.1:8b"
max_tokens                = 4096
context_length            = 8192
port                      = 8720
max_steps                 = 30
tool_loop_engine          = "smolagents"
mcp_refresh_seconds       = 300
skill_refresh_seconds     = 300
skill_catalog_static_path = "/var/lib/mios/skills/catalog.json"
searxng_url               = "http://mios-searxng:8080"
enable                    = false

[blades]
# Fleet shape. The operator's number: 2-3 boxes typically, 6 at most, and a
# single Mini standalone is valid. Gate: check_fleet_safety.
min_nodes     = 1
typical_nodes = 3
max_nodes     = 6

# [blades.hazards] -- SHRINK-ONLY: configs safe on one node, unsafe above it.
# Detected from the tree, never hand-listed. Gate: check_fleet_safety.
[blades.hazards]
doc = "A MiOS-Metal fleet is 2-6 boxes (task_275), so a configuration that only works standalone is a defect waiting for the operator to add a peer. Each entry here is a hazard the tree currently carries, accepted deliberately while the fleet design lands (task_277). k3s-multi-server: four archetypes grant what mios-k3s requires and the unit runs `k3s server` with no K3S_URL, so every controller stands up its OWN control plane instead of joining one -- three default `hybrid` Minis would be three clusters sharing one token. pacemaker-unfenced: mios-ha-bootstrap sets stonith-enabled=false, which is correct for the one-node cluster it creates and is how split-brain corrupts data once a peer exists. Retiring an entry means the detector stops reproducing it, not editing this list."
max_accepted = 2
accepted = [
  "k3s-multi-server",
  "pacemaker-unfenced",
]


[nodes.local-cpu]
endpoint = "http://localhost:${MIOS_PORTS_CPU_NODE}/v1"
model    = "mios-agent-cpu"    # canonical CPU Modelfile tag, never a raw base
lane     = "cpu"
api      = "llamacpp"          # /slots KV-paging, no tool_choice=required
health_gate = true
# Local iGPU lane -- served natively on the Windows host via llama.cpp+Vulkan
# on localhost loopback per Architectural Law 5 (MIOS_AI_ENDPOINT).
[nodes.local-igpu]
endpoint    = "http://127.0.0.1:${MIOS_PORTS_LLM_IGPU}/v1"
host_served = "usr/share/mios/windows/MiOS-iGPU-Server.cfg"  # served on the Windows host, not by a shipped unit; check_structured verifies it listens on this lane's port
model       = "mios-igpu"         # llama.cpp + Vulkan alias served on the host
lane        = "igpu"
api         = "llamacpp"
health_gate = true
# The ONE local heavy dGPU lane: mios-llm-heavy.container on ${MIOS_PORTS_LLM_HEAVY},
# running the engine [ai].heavy_engine selects -- vLLM (PagedAttention + APC,
# runtime LoRA) or SGLang (HiCache spills inactive KV to CPU RAM for the native
# 256k context); the tunables are [ai.vllm] / [ai.sglang]. Either engine serves
# "mios-heavy" over OpenAI /v1 and honours tool_choice=required, so the node does
# not change when the engine does. health_gate=true => AUTO-JOINS only when
# reachable; gated off until a model is baked + the service is enabled.
[nodes.local-heavy]
endpoint    = "http://localhost:${MIOS_PORTS_LLM_HEAVY}/v1"
model       = "mios-heavy"     # = served_name of the selected engine ([ai.vllm] / [ai.sglang])
lane        = "gpu"            # shares the dGPU lane semaphore (VRAM-admission governs co-load)
api         = "openai"
health_gate = true             # inert until the gated mios-llm-heavy.service is enabled + reachable
[nodes.local-llamaswap]
endpoint    = "http://localhost:${MIOS_PORTS_LLM_LIGHT}/v1"
model       = "mios-agent-cpu" # a resident alias of the light lane's model map
lane        = "cpu"            # llama.cpp serving lane, not the dGPU semaphore
api         = "llamacpp"       # /slots KV-paging, no tool_choice=required
health_gate = true             # inert until GGUFs are provisioned + the lane is up

# ─── Inference Lanes (WS-1 / WS-2) ────────────────────────────────────
[lanes.light]
stream_thinking  = true
tool_call_parser = "hermes"
reasoning_parser = "qwen3"
constrained_tools = true

# The heavy lane's surface settings are per ENGINE: the one mios-llm-heavy lane
# uses [lanes.<[ai].heavy_engine>], so both tables stay while either engine can
# be selected.
[lanes.sglang]
stream_thinking  = true
tool_call_parser = "qwen25"
reasoning_parser = "qwen3"
constrained_tools = true

[lanes.vllm]
stream_thinking  = true
tool_call_parser = "hermes"
reasoning_parser = "qwen3"
constrained_tools = true

[lanes.igpu]
stream_thinking   = true
tool_call_parser  = "hermes"
reasoning_parser  = "qwen3"
constrained_tools = true


[cost]
enable              = true      # roadmap B1: observe-only ledger (records dispatches/tokens/energy; no behaviour change). /v1/cost reports it.
gpu_watts           = 350.0     # the dGPU board power used for the energy estimate
usd_per_kwh         = 0.0       # 0 => energy tracked in Wh, local $ stays 0
remote_usd_per_mtok = 0.0       # $/million-tokens for a remote escalation lane (WS-A16)
budget_usd          = 0.0       # 0 => no $ ceiling (observe only)

[audit]
chain_enable = true   # link each event into the SHA-256 tamper-evidence chain

[worker_tools]
bm25_k1                  = 1.2    # Okapi BM25 term-frequency saturation (standard 1.2-2.0)
bm25_b                   = 0.75   # Okapi BM25 document-length normalisation (standard 0.75)
# Fallback relevance score for an UNEMBEDDED verb, indexed by its _tool_priority rank
# (0 = core read/discovery .. 4 = external MCP/A2A); a rank past the list clamps to last.
priority_fallback_scores = [0.55, 0.45, 0.30, 0.25, 0.15]
tool_priority_core_first = true

[slo]
# Per-class wall-clock deadline budget (seconds the turn SHOULD meet). interactive
# = a human at the keyboard (tight); best_effort = background / autonomous /
# fan-out work that may run long.
interactive_budget_s = 8.0
best_effort_budget_s = 120.0
# Interactive-priority FLOOR: a foreground turn whose scheduling priority is
# clamped below this is downgraded to best_effort (the autonomous-clamp path).
# default_priority is the priority assumed for an unclassified turn -- at/above
# the floor by default so a plain foreground turn classifies interactive.
interactive_priority = 7.0
default_priority     = 7.0

# ----------------------------------------------------------------------------
[sched]
priority_mode = "ssot"
# Urgency tiers (the score is higher = scheduled sooner).
urgency_default = 5
urgency_high    = 9
urgency_low     = 2
# A single-action OS-control dispatch is cheap + interactive -> floor its urgency here.
urgency_dispatch_floor = 8
urgency_high_terms = ["high", "urgent", "now"]
urgency_low_terms  = ["low", "background", "defer"]
# Complexity = min(cap, base + task_count + tool_hint_count // hints_divisor).
complexity_base          = 1
complexity_hints_divisor = 2
complexity_cap           = 10
# Final blend: score = round(complexity*weight + urgency*weight, ndigits).
score_complexity_weight = 0.4
score_urgency_weight    = 0.6
score_round_ndigits     = 2

# ----------------------------------------------------------------------------
[scheduler]
preempt_enable = false
queue_enable = false
# max_suspended -- mirrors PreemptScheduler(max_suspended=...): the BOUNDED number of
# concurrently-snapshotted (preempted) turns. The snapshot-slot free-list IS the cap,
# so a runaway fan-out can never suspend unboundedly; when full the scheduler refuses
# to preempt and the turn runs to completion (bounded-suspension safety).
max_suspended = 4
# quantum_s -- the turn TIME-SLICE in seconds (the mios_preempt.Quantum limit): the
# wall-clock bound on how long the boundary will cooperatively yield to a waiter.
# <= 0 = unbounded (yielding is then bounded only by max_preempt_depth ticks).
quantum_s = 8.0
# slice_tokens -- the token-time QUANTUM (task_20): how many TOKENS a dispatched turn may
# generate before the queue re-evaluates priority at a slice boundary. This is the
# token-time slice (NOT wall-clock); token counts flow through the mios_tokenize seam.
# 0 = slicing OFF (the queue degrades to pure priority ordering; no boundary re-eval).
slice_tokens = 256
# queue_max_turns -- BOUNDED advisory capacity of the TokenSliceQueue: the cap on
# concurrently-tracked turns. The bound evicts only STALE ready bookkeeping (never an
# active turn's coroutine), so the queue can never grow without limit even if a caller
# misses a remove(). 0 = unbounded.
queue_max_turns = 64
# priority_levels -- number of DISCRETE priority buckets a turn's continuous [sched]
# score may be quantised into (0 = continuous priority, the default -- no bucketing).
# Advisory substrate knob the richer policies (task_20/task_60) consume.
priority_levels = 0
# max_preempt_depth -- bound on cooperative-yield ticks per boundary: how many times
# the hook yields the event loop to a waiter before resuming (prevents a busy-wait or
# a pathological preempt/resume cycle). 1 = yield at most once per boundary (default).
max_preempt_depth = 1

[admission]
multiblade_enable = false
tenant_quota_enable = false
# tenant_max_concurrency -- max in-flight global dispatch slots ONE tenant may hold
# while another tenant waits. 0 (DEFAULT) = unlimited (today). The cap BITES only
# under contention; a single tenant on an idle gate is never throttled, and if every
# waiter is one over-cap tenant the gate degrades OPEN (serves by priority) so it can
# never wedge. Only consulted when tenant_quota_enable = true.
tenant_max_concurrency = 0

# ----------------------------------------------------------------------------
[reflect]
# Example negative words/phrases used by the micro-LLM Definition-of-Done judge
# to determine if a response is a punt or refusal (DoD check).
judge_examples = "a punt, refusal, 'I cannot', or 'where to look'"

# ----------------------------------------------------------------------------
# [drift_monitor] -- CONS-02 Jensen-Shannon Goodhart alarm. Observe-only.
# Separate from [drift] above, which registers agent-pipe module wiring
# exceptions and has nothing to do with distribution drift. See manual ch53.
[drift_monitor]
enable      = false   # off by default: observe-only alarm, no behaviour change
threshold   = 0.2     # JSD (0..1, log base 2) at or above which drift_alert fires
window      = 200     # most recent samples per axis that form the live window
min_samples = 30      # live observations required before an axis may alert at all
axes        = ["verdict", "intent"]   # label extractors live in server.py _DRIFT_AXIS_LABELS

# ----------------------------------------------------------------------------
# [schema] -- SHRINK-ONLY dead-table register (check_schema_consumers). See ch55.
[schema]
unconsumed = [
    # WS-SEC (task_152 / ACCT-02): the PostgresOS security schema was declared
    # ahead of its readers. Nothing in the tree mentions these six at all.
    { table = "mios_security.fido2_keys",            reason = "task_152 WS-SEC: declared ahead of the FIDO2 enrolment path" },
    { table = "mios_security.usb_rules",             reason = "task_152 WS-SEC: declared ahead of the USBGuard rule sync" },
    { table = "mios_security.headscale_users",       reason = "task_152 WS-SEC: declared ahead of the headscale control-plane sync" },
    { table = "mios_security.headscale_preauth_keys", reason = "task_152 WS-SEC: declared ahead of the headscale control-plane sync" },
    { table = "mios_security.headscale_acl_rules",   reason = "task_152 WS-SEC: declared ahead of the headscale control-plane sync" },
    { table = "mios_security.keepass_vaults",        reason = "task_152 WS-SEC: declared ahead of the vault integration" },
    # task_224: a SECOND preference table, one letter from the LIVE
    # `account_preference` that materialize-user-config.py actually reads. This
    # one is the trap case -- a writer aimed at the wrong name would look
    # correct and lose every row. Resolve by dropping it or by folding the live
    # table into it; do not leave both.
    { table = "mios_identity.account_preferences",   reason = "task_224: duplicate of the live account_preference; RESOLVE, do not extend" },
    # The person_* graph: person + person_pref have consumers, these two do not.
    { table = "person_device",                       reason = "person graph: declared ahead of any device-enrolment writer" },
    { table = "person_app_install",                  reason = "person graph: declared ahead of any app-inventory writer" },
]

# ----------------------------------------------------------------------------
# [refactor] -- module-size ratchet for the agent-pipe extraction (check 149).
# `oversize` is a SHRINK-ONLY debt register; numbers may only go DOWN. See ch54.
# Operator ruling: the line ceiling governs SUB-MODULES only -- modules inside a
# component's package (submodule_roots). A component's main modules (the
# agent-pipe root: server.py, the mios_*.py components and their tests) are
# where features fold in, and carry no ceiling.
[refactor]
max_lines = 800
submodule_roots = ["mios_pipe/"]
oversize = [
    { path = "mios_pipe/federation/a2a.py",       lines =  1375 },
    { path = "mios_pipe/federation/http_caps.py", lines =   688 },
    { path = "mios_pipe/memory/knowledge.py",     lines =   871 },
    { path = "mios_pipe/routing/agent_call.py",   lines =  1093 },
    { path = "mios_pipe/routing/chat.py",         lines =  1611 },
    { path = "mios_pipe/routing/dag_exec.py",     lines =  1127 },
    { path = "mios_pipe/routing/native_loop.py",  lines =  1143 },
    { path = "mios_pipe/routing/portal.py",       lines =  1422 },
    { path = "mios_pipe/routing/refine.py",       lines =  1071 },
    { path = "mios_pipe/routing/swarm.py",        lines =   992 },
    { path = "mios_pipe/routing/web_research.py", lines =   909 },
]


# ----------------------------------------------------------------------------
# [shell_session] -- SHELL-01 persistent PTY substrate. See manual ch56.
[shell_session]
enable       = false   # off by default: a long-lived shell is state the agent can accumulate
socket_name  = "mios"  # tmux -L namespace, kept off an operator's default socket
shell        = "/bin/bash"
state_dir    = "/var/lib/mios/shell-sessions"
idle_s       = 1800    # reap a session after this long with no command
max_sessions = 8       # hard cap on concurrent shells
timeout_s    = 120     # per-command wall clock before the runner gives up
max_output_chars = 24000   # ACI-elided, not raw-truncated (head+tail kept)
max_output_lines = 400
history_limit    = 50000  # tmux keeps 2000 lines by default; a long command would lose its HEAD

# ----------------------------------------------------------------------------
# [powershell] -- Windows-side `powershell_run` execution (mios-powershell).
# Object-pipeline flattening and the script/output caps: manual ch57.
[powershell]
flatten           = true    # render the success stream through Out-String
flatten_width     = 200     # column budget the formatter sizes tables against
enumeration_limit = 16      # $FormatEnumerationLimit -- nested items shown before "..."
plain_text        = true    # $PSStyle.OutputRendering: strip ANSI from output and errors
trim_trailing     = true    # drop formatter column padding before the JSON envelope
max_script_bytes  = 65536   # inbound script cap
max_output_bytes  = 262144  # per-stream cap applied after flattening
stage_dir         = '/mnt/c/Users/Public/Documents/mios-ps'   # Windows-visible staging mount

# ----------------------------------------------------------------------------
# [consensus] -- CONS-01 weighted multi-judge Definition-of-Done.
# Fold, abstention rule, quorum floor and weighting: manual ch52.
[consensus]
enable       = false   # off by default: the panel costs one model call per lane per verdict
threshold    = 0.5     # weight-share of "yes" needed to call the answer satisfied
min_lanes    = 2       # live (non-abstaining) votes required before the fold is trusted
timeout_s    = 20.0    # per-lane judge call budget
weight_floor = 0.1     # lowest weight a lane can be reduced to; never zero it out
rrf_k        = 60      # Reciprocal-Rank-Fusion damping when lanes return RANKED lists
# One entry per judge lane. Leave `endpoint`/`model` empty to reuse the refine
# lane's. Declare 2-3; more lanes cost proportionally more per verdict.
lanes = []

# ----------------------------------------------------------------------------
[drift]
# Sibling-module allowlist/denylist: agent-pipe modules that are permitted to have
# transitional unwired (imported-but-dead) status in check_unwired_modules.
denylist = [
    "mios_ctxpack",
    "mios_deliberate",
    "mios_embed_backfill",
    "mios_persona",
    "mios_provider_translate",
    "mios_smartroute",
    "mios_worker_tools"
]

# ----------------------------------------------------------------------------
[dispatch]
enable     = true
# Default max recursion depth for cross-agent fan-out dispatches (hop budget)
# used as the fallback when the max_dispatch_depth or X-MiOS-Hop header is not set.
default_hop_budget = 2
mode       = "council"
council_default = true
# Floor on engaged agents when relevant matches exist (relevance mode only).
fanout_min = 1
# Hard cap on TOTAL concurrent agents (primary + secondaries). Each extra
# agent is a full concurrent inference on the local lanes, so size it to the
# roster + the box's headroom. 3 = primary + up to 2 council members; raise
# as more [agents.*] are added (and a tool-capable box can carry them).
fanout_max = 3
fanout_select_mode      = "model"
fanout_select_timeout_s = 8       # micro-model relevance-pick timeout (degrade-open)
max_sources          = 8
sources_registry_cap = 64
dag_empty_native_fallback = true
swarm_trust_atomic = true
native_loop_query_reformulate = true
native_loop_date_in_query     = true
native_loop_date_anchor       = true
native_loop_math_hint         = true
dag_node_max_tokens      = 800
dag_node_slow_max_tokens = 350
dag_node_retry           = 1     # empty-result retries (read-only -> safe); 0 = none
dag_node_deadline_s      = 140   # seconds; runaway backstop for a FAST-lane node. Raised 75->140 ("ALL AGENTS USE SGLANG"): with every agent on the ONE heavy lane (lane_concurrency_gpu=2, the VRAM-safe ceiling), nodes past the 2nd QUEUE for a slot, so the per-node deadline (measured from DISPATCH, not from slot-acquire) must absorb that queue wait + the node's own web-research+gen, or back-of-queue nodes get guillotined at 0 chars (grounded_nodes=0). 140 = ~queue + ~40s research + gen.
dag_node_deadline_slow_s = 150   # seconds; slow-lane (cpu/igpu/mobile) per-node deadline
# WORK-STEAL (deepen) LANES: only these FAST lanes do extra coverage passes until the barrier; a slow lane does its ONE grounded pass and waits (it can't afford a second). CSV of lane categories.
deepen_lanes         = "gpu,accelerator"
# SLOW-lane tool-surface floor: a slow lane with no explicit lane_tool_cap entry gets this many tools (NOT the full 71-tool surface a CPU daemon can't prefill). Only used when a slow node has no injected grounding to reason over. 0 = full surface (opt out).
slow_lane_tool_cap   = 12
stable_tool_prefix   = true
# How many cosine-ranked NON-core tools to append AFTER the stable core block (the only
# part of tools[] that varies per turn). Small = a longer stable cached prefix; large =
# more per-turn tool coverage at the cost of a shorter cache hit. Only used when
# stable_tool_prefix = true.
stable_prefix_tail   = 4
# Inject a user-adjacent "likely-relevant tools" TEXT hint (the relevance signal that
# can't ride the now-byte-stable tools[] order). DEFAULT false: it nudges the 8B toward
# tool-hunting + regressed memory-recall in testing (the cosine TAIL already signals
# relevance inside tools[]). A future logit-mask experiment knob -- leave off until it
# demonstrably helps. Only used when stable_tool_prefix = true.
stable_prefix_hint   = false
tool_rerank          = true
rerank_fanout        = 3     # over-fetch window K = max(fanout*N, rerank_min_k)
rerank_min_k         = 24    # floor on the rerank window so a small tail still has room
rerank_rrf_k         = 60    # reciprocal-rank-fusion constant (same value mios-web-search uses)
rerank_mmr_lambda    = 0.8   # MMR relevance(1.0) vs diversity(0.0) balance, clamped [0,1]; 0.8 held recall (no regression) + kept the rank-1 gain in the offline eval
rerank_skip_margin   = 0.08  # if the cosine cut at the N-th slot is this separated, skip stage-2 (confident, no confusable cluster)
deepen_enabled       = true
swarm_saturate       = true
deepen_iters         = 12     # RUNAWAY backstop on extra passes (the deadline is the real bound)
deepen_deadline_s    = 60     # HARD per-node deepen cap for DEEP turns (casual queries no longer deepen via the complexity gate). 60s/facet is the post-runaway deep budget.
deepen_web_timeout_s = 20     # per-iter web-research cap so one pass can't overshoot
# DETAIL-FILL ("also can loop to gather data in detail-fill passes"): a fast work-stealing node FETCHES new web data each deepen pass (bounded by deepen_web_timeout_s) and appends fresh stories to the shared grounding -> the loop enriches the FACTS, not just re-reasons them. Self-gates to web/news turns (a node carrying a web-capable refined plan). false = reason-only deepen (no new fetches).
deepen_fetch         = true
deepen_early_exit    = false
deepen_judge_timeout_s = 6
agent_concurrency    = 3      # global default per-lane concurrent-agent cap
lane_concurrency     = 3      # default per lane (each distinct hw = its own semaphore)
lane_concurrency_cpu = 2      # in-VM CPU -- cap low to avoid thrash (CPU has no VRAM elasticity)
gpu_profile     = "orchestrator"
vram_budget_mb  = 11000       # agent-lane VRAM ceiling on the shared 4090; the pack firstboot REFUSES to arm if Sigma(worker vram_mb) exceeds this (hard OOM-cascade guard)
lane_concurrency_gpu0 = 4     # per-SUB-LANE cap for the 'gpu0' small-model pack (each worker is its OWN server, so they don't pile on one daemon -- the lane=4 OOM mode is gone). Inert until workers set sub_lane="gpu0".
global_concurrency   = 16     # max concurrently-running agent dispatches across ALL lanes
# ── Runaway / abandoned-turn bounds (cancellation fix). A local llama.cpp lane
# does NOT stop generating on client disconnect, so a hard num_predict cap is the
# only real bound on an abandoned turn; the turn deadline is a wall-clock backstop
# (per-node deepen caps don't bound the whole turn). The disconnect/supersede
# cancellation lives in _execute_dag_emitting + _execute_dag_saturated.
llm_num_predict_cap = 2048   # hard per-generation token ceiling on AGENT dispatches (fast/dGPU lanes)
# PER-LANE cap (runaway fix j): a CPU/iGPU lane gens ~5 tok/s, so 2048
# tokens = ~400s of pegged cores per gen; a disconnect can't abort the gen,
# so stacked slow-lane gens drove loadavg to 387. Give the SLOW lanes a short
# ceiling (~512 ≈ ~100s) so each self-clears fast; the dGPU keeps the full 2048.
llm_num_predict_cap_cpu = 512   # token ceiling on CPU/iGPU (mios-llm-light / host-iGPU) dispatches
turn_deadline_s        = 600    # wall-clock backstop per turn (s); generous so deep research still finishes
runaway_reap           = true   # on a BLOWN deadline (not supersede), unload CPU-lane models (keep_alive:0) -- the only real release for an un-abortable gen
council_max          = 4      # max council SECONDARIES per turn (0 = all; was uncapped)
# SWARM/DAG width cap ("16-agent explosion"): the swarm/DAG
# fan-out had NO cap (council_max only bounds the council path). Bound the swarm
# to at most this many DISTINCT (endpoint,model) targets AFTER de-dup. 0=uncapped.
swarm_max_width      = 3      # "ALL AGENTS USE SGLANG": every agent now targets the ONE heavy lane, whose VRAM only safely runs lane_concurrency_gpu=2 concurrent 14B gens. Fanning out 8 nodes onto a 2-wide lane just QUEUES 6 of them past their deadline -> all time out (grounded_nodes=0). Size the fan-out to the REAL concurrency: 3 facets (2 run immediately + 1 short queue), each grounded, finishing inside dag_node_deadline_s. Work-steal/deepen still loops the 2-3 live nodes across extra coverage facets until the barrier, so coverage stays broad without a wide cold fan-out. Raise again only when the heavy lane gets more concurrency headroom (more VRAM).
# SLOW-LANE fan-out CEILING (runaway fix j): GPU/fast nodes fan out
# unbounded, but CPU/iGPU lanes are where stacked ~100s gens pile up. Cap how many
# slow-lane nodes a DAG BACKFILLS (primary facets never dropped). Default 2 = the
# live CPU node count (local-cpu + potato-cpu) = no-op today, but bounds a deep/
# research turn that would otherwise multiply CPU replicas across the lanes.
swarm_max_cpu_nodes  = 2      # max CPU/iGPU slow-lane nodes backfilled into one DAG (0 = uncapped)
# endpoint_concurrency RAISED 2->4 (dGPU co-load): backstop
# ceiling for concurrent calls to one daemon; VRAM-aware admission (admit_* +
# VRAM_COLOAD_*) is the real per-turn governor on the dGPU. The CPU lane stays
# protected by its own MemoryMax + the _cap_cpu_lane_model micro-only guard.
endpoint_concurrency = 4      # was 2; backstop, VRAM-admission governs dGPU co-load
# VRAM-aware co-load: admit another concurrent model onto a
# dGPU endpoint only when measured free VRAM fits it + reserve. SHARED-4090 guard:
# reserve leaves margin for the Windows host's VRAM co-tenancy (the VM can't see
# host-side usage). Read by _admit via the MIOS_VRAM_COLOAD_* env defaults.
vram_coload_reserve_mb = 3000   # MB left free for host co-tenancy + spikes
vram_coload_est_mb     = 5000   # assumed cold-model VRAM until /api/ps knows its size
admit_enable         = true   # master switch (ON: the gate for the wide all-nodes roster; was false)
admit_load_ceil      = 56     # 1-min loadavg ceiling (cpu*2 on the 28-core dev VM); over -> backpressure
admit_mem_pct        = 92     # mem% ceiling; over -> backpressure
admit_max_wait       = 8.0    # max seconds a dispatch waits at the gate before admitting anyway (no deadlock)
# ── All-nodes-enabled-by-default scheduling ("all nodes are
# enabled by default ... concurrently dispatched ... nothing idle until synthesis").
# Made safe by admit_enable=true above + COUNCIL_MAX + per-endpoint/lane semaphores.
nodes_research_only  = false  # [nodes.*] default research_only: FALSE = every node eligible on EVERY turn (per-node override wins)
# Lane -> admission PRIORITY (1..9; higher = admitted first / shorter backoff).
# Fast LOCAL lanes high; slow/remote/research lanes low so under host pressure they
# wait out admit_max_wait + self-shed -> the wide roster degrades, never stampedes.
lane_priority        = "gpu:8,cpu:7,accelerator:6,igpu:3,mobile:2,_default:5"
priority_queue_enable  = true   # ON ('everything on' for live MiOS-DEV); degrade-open to plain FIFO on any error
priority_starvation_ms = 4000   # a queued dispatch older than this is served ahead of priority (anti-starvation)
request_cancel_enable  = 1      # 1=cancel non-streaming turns on client disconnect; 0=deadline-only
request_cancel_poll_s  = 2.0    # disconnect-watcher poll interval (seconds)
# Proactively evict an IDLE resident model (refcount 0, non-kept) to free VRAM for
# a cold model a turn NEEDS -- "clear RAM/VRAM for idle agents to be loaded so
# nothing in the pipeline is idle". INERT on the /v1 plane (llama-swap owns model
# residency); the hard semaphores stay the OOM backstop. llama.cpp KV is paged
# separately (kv_paging_*).
vram_reclaim_idle    = false  # DISABLED proactive evict->reload of multi-GB model files thrashed disk (~2GB/s). De-dup + swarm_max_width cut the model churn at the source; let llama-swap's own LRU manage residency.
# CPU-offload of fan-out secondaries: OFF ("concurrent true
# swarm / unfired nodes"). ON funneled EVERY secondary onto the single CPU lane
# (:11435) -> 35-conn wedge while dGPU/potato/iGPU sat idle. OFF = each distinct
# node runs on its OWN hardware concurrently (dGPU co-loads multiple models).
offload_cpu          = false
# ── Tool-surface shaping. Per-lane tool CAP (weak lanes
# like the iGPU llama.cpp time out grammar-constraining all 71 verbs; they get a
# capped REAL subset, never zero) + endpoints that 400 on tool_choice=required.
lane_tool_cap        = "igpu:12,mobile:12"
default_tool_cap     = 16
no_tool_choice_hints = "llm_igpu"           # [ports] keys or host:port substrings whose llama.cpp rejects tool_choice=required
parallel_tools_hints = "llm_heavy"               # [ports] keys (or host:port substrings) whose model reliably emits PARALLEL tool calls -> OpenAI-default parallel_tool_calls=True (capable heavy lane); everything else stays sequential (small models malform parallel calls). MIOS_PARALLEL_TOOLS_HINTS overrides.
worker_mcp_tools     = true                  # surface external MCP client tools to fan-out workers
kv_paging_enable  = true     # master switch; only ACTS on llama.cpp /slots endpoints
kv_paging_hints   = "llm_igpu"   # [ports] keys or host:port substrings that speak llama.cpp /slots (default the iGPU lane)
kv_paging_slot    = 0        # llama-server slot id the light lane pages (single resident frame)
kv_paging_timeout = 12.0     # seconds for one save/restore POST (best-effort; never fails the turn)
kv_fork_enable       = false  # master switch (only ACTS when kv_paging is on AND the endpoint speaks llama.cpp /slots)
kv_fork_max_branches = 4      # runaway guard: max child KV files one fork request may spawn
kv_gc_enable      = true        # in-process KV-file GC (no-op when kv_slots_dir empty/remote)
kv_gc_interval_s  = 900         # sweep cadence (seconds)
kv_gc_ttl_s       = 86400       # evict a non-active KV file older than this (24h)
kv_gc_max_bytes   = 2000000000  # total KV-file budget; oldest-first eviction over this (~2GB)
kv_slots_dir      = ""          # llama.cpp --slot-save-path IF local to the agent-pipe (else "" -> tmpfiles-only GC)
rr_enable         = false       # master switch (off => _call_agent_complete never routes through _rr_run)
rr_quantum_s      = 8.0         # seconds a dispatch runs before it becomes preemptible
rr_max_suspended  = 4           # bounded snapshot-slot free-list (max concurrently-suspended generations)
rr_slice_tokens   = 512         # tokens per slice; sized so short/medium answers finish in ONE slice (no chunking)
rr_slice_timeout_s = 120.0      # per-slice completion timeout
sandbox_enforce   = false       # off => resolve+record only; on => also wrap opted-in verbs
cua_enable        = false       # off => /v1/computer-use returns a disabled notice
cua_max_steps     = 12          # bound the perceive->act->verify loop (anti-runaway)
# ── WS-A10/A18 persistent peer reputation. The in-process PeerReputation flushes
# its raw counters to the peer_reputation pg table every reputation_flush_s and
# restores them on startup, so a peer's accrued reliability (gossip trust-gates on
# it; the fan-out ranks on it) SURVIVES an agent-pipe restart. No-op when pg isn't
# primary. Env: MIOS_REPUTATION_FLUSH_S.
reputation_flush_s = 300.0      # seconds between reputation->pg flushes (0 = off, in-memory only)
kernel_route      = false       # off => no shadow log; execution always inline (unchanged)
slo_shed_enable   = false       # off => admission never sheds (capacity-only, as before)
batch_enable        = false
batch_interval_s    = 0.05      # window for a NON-native endpoint (seconds)
batch_max_size      = 8         # flush a window at this many pending calls
batch_native_hints  = "8520,8500"  # heavy lane (vLLM or SGLang) / llama-swap -> bypass coalescing
trace_enable          = true   # 0/false disables span recording (near-zero cost when off)
trace_max_traces      = 256    # LRU cap on retained traces in the buffer
trace_max_spans_per_trace = 128  # cap on stored spans per trace (further spans counted, not stored)


[council]
diversity_gate      = false
diversity_threshold = 0.92
# aggregator_bypass: when the WHOLE council converges (every pairwise cosine
# similarity exceeds aggregator_bypass_threshold) the expensive final aggregator
# LLM adds nothing -> skip it and ship the highest-confidence (medoid / consensus)
# individual response. Conservative threshold (MOSAIC ref: ~45.7% bypass at
# +0.24pp accuracy). An aggregator_bypass event is logged per bypass.
aggregator_bypass           = false
aggregator_bypass_threshold = 0.95

[web_research]
max_attempts    = 3    # judge-gated re-search attempts (was 5)
passes          = 3    # search->judge->re-search drill passes (was 4)
crawl_timeout_s = 18   # deep crawl4ai/Camoufox fallback per-page cap, seconds (was 45)
link_rank_mode = "heuristic"  # "heuristic" = structural ranker (default); "embed" = opt-in embedding-cosine, degrades OPEN to "heuristic" until an embeddings client is wired
seg_base       = 1    # score per path segment (path depth = article-ness signal)
slug_weight    = 2    # bonus: last path segment is a long hyphenated headline slug
slug_min_len   = 12   # min last-segment length to count as a headline slug
digit_weight   = 1    # bonus: path carries a digit (a date / article id)
anchor_weight  = 2    # bonus: anchor text is long (a real headline)
anchor_min_len = 25   # min anchor-text length to count as a real headline
min_score      = 2    # drop shallow generic / utility links scoring below this
top_n          = 6    # keep at most this many ranked article links

[knowledge]
recall_strict_score = 0.82   # above this cosine a recall is trusted without a shared-topic-anchor token
recall_pref_min_score = 0.50 # lower recall floor for SELF-REFERENTIAL asks (a possessive pronoun present): a "what is MY favorite X" template cosines below the stored statement; set == recall_min_score to disable
rank_outcome        = 0.05   # weight: + if the recalled answer's turn was satisfied, - if unsatisfied
rank_hot            = 0.03   # weight: + if the row is tier=hot (frequently paged in)
rank_access         = 0.02   # weight: * log1p(access_count)
rank_age            = 0.3    # RECENCY-DECAY SWING ("weigh date/time appropriately in an AIOS env"). Bounded MULTIPLIER on the blended score: (1-rank_age) + rank_age*0.5**(age_days/recall_halflife_days). 0.3 -> floor 0.7 (a fully-stale row keeps 70% of its score; freshest ~1.43x edge) per research (Generative-Agents/LangChain-TimeWeighted/Elasticsearch). 0 = inert (cosine-only). Cosine stays dominant; recency only breaks near-ties.
recall_halflife_days = 7.0   # recency half-life: at this row age the decay has removed HALF the rank_age swing. Lower = fresher-biased. age from last_access (refreshed on recall), fallback ts.
hot_threshold       = 5      # access_count at which a recalled row is promoted to tier=hot
store_skip_volatile = true   # anti-stale-recall: skip durable STORE *and* RECALL injection for model-classified VOLATILE turns (refine local_state/news/needs_location -- live system-state, current-events, location-bound). Such a turn is a point-in-time snapshot (cwd, windows, weather, latest-news) that poisons recall if cached; it is re-derived LIVE every turn. Model-classified, NOT a keyword check. false = legacy (cache/recall everything).
evict_enable        = true   # ON ('everything on'); DELETES only >ttl never-recalled neutral rows (hot/satisfied/pinned always kept, batch-capped)
evict_dryrun        = false  # inert when evict_enable=true; set true WITH evict_enable=false for log-only observation
evict_interval_s    = 3600   # seconds between sweeps
evict_ttl_days      = 90     # evict evictable rows not accessed within this many days
evict_max_rows      = 50000  # hard row cap; overflow (lowest-value first) is evicted
evict_min_access    = 1      # only evict rows recalled FEWER than this many times (1 = never recalled)
evict_batch         = 500    # max rows removed per sweep (blast-radius bound)

# ── WS-6 runtime HITL approval gate. 'enable' on by default; 'mode'
# = 'log' (NON-BLOCKING: record + emit a hitl_request event then proceed -- the
# autonomous swarm never deadlocks) or 'gate' (BLOCKING: a scoped verb is refused
# until approved via POST /v1/hitl/approve, then the agent retry passes). 'verbs'
# overrides the gated set (CSV); blank = the built-in high-privilege verb set.
[hitl]
enable = true
mode   = "log"     # log = non-blocking + observable (default); gate = block-until-approved
verbs  = ""        # CSV override of gated verbs; blank = _HIGH_PRIVILEGE_VERBS

[memory]
# CONS/MEM: periodic knowledge-table consolidation. Rows answering the SAME
# normalized question collapse into the newest, with the losers' access and
# recall counters folded in so K-LRU tiering never sees a merge as a reset.
consolidate            = true    # run the sweep at all
consolidate_interval_s = 3600    # seconds between sweeps (first sweep is one interval after boot)
consolidate_max_groups = 200     # duplicate groups merged per sweep; bounds one pass's DB work
n_ctx = 8000
compaction_interval = 20
tool_result_ttl_turns = 5
compaction_threshold_pct = 80
kv_slot_persist = true

# ── WS-6 replayable DAG run-templates. Capture every planned DAG to
# the run_template table (GET /v1/run-templates) keyed by a structural class hash
# -- the determinism foundation. Replay-reuse is a follow-up; capture is additive
# + fire-and-forget so it can never affect a live run.
[run_template]
enable = true
# task_205 REPLAY (the reuse half). Default OFF: replaying the WRONG plan costs
# more than re-planning. Model-free by design -- manual ch61.
replay_enable     = false
replay_threshold  = 0.85   # Jaccard a NON-exact intent match must reach to replay
replay_candidates = 50     # newest templates considered per turn

# ── WS-5 Agent-Computer Interface output normalizer. Head-TAIL
# truncation of tool/terminal results (keep the start + the end, elide the
# middle with an anti-fabrication marker) so the tail's error/exit/result
# survives. Read directly by the agent-pipe (_cap_verb_result).
[aci]
max_lines = 160    # cap lines per tool result (head+tail kept, middle elided); 0 = no line cap
head_frac = 0.6    # fraction of the char/line budget kept as head; the rest is tail

[dci]
flow_enabled = false

[verity]
sentence_abbreviations = [
    "approx.", "Approx.", "e.g.", "i.e.", "vs.", "etc.", "U.S.", "U.K.",
    "a.m.", "p.m.", "No.", "Inc.", "Co.", "Ltd.", "St.", "Mt.",
]
antifab_enable = true
antifab_min_entities = 3
antifab_ground_min = 0.34

[code_mode]
# Read by usr/libexec/mios/mios-codemode-api.py. Declared here because the
# resolver emits MIOS_CODEMODE_* from this table: undeclared, the names the
# code reads were emitted by nothing and the build's var-closure check failed.
socket         = "/run/coderun.sock"
call_timeout_s = 60
enable           = true    # master gate -- code execution ENABLED by default (per operator directive); set false (or an /etc drop-in) to gate off
heavy_lane_only  = true    # P5: code_mode (model authors orchestration python) runs ONLY in the heavy native-loop orchestrator, never a light swarm worker (worker emitting code_mode is refused). MIOS_CODE_MODE_HEAVY_ONLY overrides.
allow_net        = false   # even if a snippet requests net, deploy must also allow it (AND of the two)
max_output_chars = 8000    # cap on snippet stdout/stderr fed back to the model
uid              = 828     # mios-codemode service uid (50-mios-services.conf); pins workspace ownership
gid              = 828
# workspace_root = "/var/lib/mios/codemode"   # default; falls back to [paths].coderun_workspace_root if unset

[refine]
enable           = true
model            = "mios-agent"
endpoint         = "http://localhost:${MIOS_PORTS_LLM_LIGHT}"   # mios-llm-light (ALL llama.cpp)
# Timeout headroom: on bare-metal Fedora-bootc with real ROCm/
# CUDA, qwen3:1.7b emits a 400-token JSON in <1s. On WSL2 dev
# (CPU only -- /dev/kfd isn't exposed for ROCm) it takes 15-30s
# for the same call. 45s is generous for either deployment;
# the bypass path still keeps trivial input fast.
timeout_seconds  = 45
# Token budget for the refine JSON answer. qwen3 reasoning models
# can consume ~200 tokens on chain-of-thought even with /no_think
# in the prompt; 1200 leaves plenty of room for both. On a non-
# reasoning model this could drop to ~300.
max_tokens       = 1200
# Trivial-input shortcut: when the user message is shorter than
# this many chars AND matches one of the bypass patterns
# (greetings, single-word commands), skip refine and emit a
# minimal plan inline. Pure-bash latency on the fast path.
bypass_chars     = 24
chat_chars             = 40
dispatch_chars         = 60
promote_chars          = 100
dispatch_arg_max_words = 3

[planner]
short_prompt_chars = 60   # below this char count, skip the planner
short_prompt_words = 10   # ...AND at or below this whitespace-token count

[polish]
enable           = true
model            = "mios-agent"
endpoint         = "http://localhost:${MIOS_PORTS_LLM_LIGHT}"   # mios-llm-light (ALL llama.cpp)
# Same CPU-vs-GPU headroom rationale as [refine].timeout_seconds.
timeout_seconds  = 45
max_tokens       = 800

[passport]
enable           = true
algo             = "ed25519"
key_dir          = "/var/lib/mios/agent-passports"
rotate_days      = 365
verify_on_read   = false
# The agent identities mios-passport-provision.service enrolls at
# firstboot. Order matters only for log readability; the actual
# enrollment is parallel-idempotent.
agents = [
    "agent-pipe",
    "hermes",
    "mios-daemon",
    "opencode",
    "cron-director",
]

[daemon]
# 1-minute load-average ceiling. Above this, autonomous daemon work is held
# until load drops back under the ceiling. Sized GENEROUSLY (per-core ~1.0 is
# "busy but fine"); raise on a many-core box. Float allowed.
pressure_load_ceil      = 8.0
# GPU utilisation ceiling (percent 0-100). Above this, autonomous work that
# would touch a local inference lane is deferred so it doesn't queue behind a
# live interactive generation on the shared 4090. 90 = leave headroom for one
# in-flight turn.
pressure_gpu_util_ceil  = 90
# Master bypass for the whole back-pressure governor. false (default) = the
# governor is ACTIVE (autonomous work respects the ceilings above). true =
# legacy behaviour, autonomous work always runs regardless of load/GPU. Ships
# false but the generous ceilings keep normal use unaffected.
pressure_skip           = false
classify_dedup_s        = 600
# Hard cap on CONCURRENT cron-director-launched autonomous jobs. 1 = serialize
# scheduled autonomous work (one recurring task at a time) so a backlog can't
# fan out into a thundering herd of mios-ai runs. Raise only on a box with
# spare lanes.
cron_max_concurrent     = 1
# Limits for scheduled/cron classify and refusal loops to prevent runaway LLM calls
classify_limit_per_min  = 10
refusal_limit_per_min   = 20
# CALM-loop max tick (seconds): upper bound on a single autonomous daemon
# tick's wall-clock before it yields back to the scheduler, so one long
# autonomous unit can't monopolise the daemon. Generous so normal ticks finish
# naturally; this is a runaway backstop.
calm_max_tick_s         = 300
# Quiescence window (minutes): the daemon only initiates *new* autonomous,
# self-directed work after the system has been interactively idle for this
# long, so autonomy happens in the quiet gaps, not mid-conversation. Reactive
# (log-follow / followup) work is NOT gated by this -- only self-initiated.
quiescence_window_min   = 10
# Escalation cooldown (seconds): minimum gap between two escalations of the
# SAME concern (e.g. re-notifying / re-acting on a persistent condition) so a
# stuck state can't spam. 1800 = 30 min.
escalation_cooldown_s   = 1800
# Max escalation attempts for one concern before the daemon gives up and just
# logs (no infinite retry loop). After this many attempts within the cooldown
# cadence the concern is parked.
escalation_max_attempts = 3
launch_claim_detect     = "model"
refusal_detect          = "model"

[budget]
# Per-conversation cumulative token ceiling (prompt+completion across the whole
# turn's fan-out). Generous -- a deep council turn with web grounding stays
# well under this; it only catches a pathological loop. 0 = unlimited (off).
conversation_token_ceil = 2000000
# Per-AUTONOMOUS-run token ceiling (a daemon/cron self-initiated unit). Tighter
# than the conversation ceiling because autonomous work is unattended. 0 = off.
autonomous_token_ceil   = 400000
# Max concurrent AUTONOMOUS (self-initiated) inference runs in flight at once,
# across the whole daemon/cron plane. Bounds unattended fan-out so it can't
# saturate the lanes; interactive turns are NOT counted against this. 1 = fully
# serialized autonomy.
autonomous_max_inflight = 1
# Rolling window (seconds) over which the budget ceilings above are measured /
# reset. 3600 = per-hour accounting.
window_s                = 3600

[dispatch.autonomy]
autonomous_priority = "low"
# Max recursion depth for dispatch -> sub-dispatch chains (an agent dispatching
# to a peer that dispatches again). 2 = primary -> sub-agent -> one more hop,
# then no further nesting. Bounds runaway delegation fan-out.
max_dispatch_depth  = 2

[daemon.post_check]
open_app         = "window_visible"
open_url         = "window_visible"
focus_window     = "window_visible"
launch_app       = "window_visible"
text_create      = "file_exists"
text_str_replace = "file_nonempty"
flatpak_install  = "flatpak_installed"

[daemon.index]
enable           = true
interval_min     = 15
max_depth        = 6      # how deep to descend per root
max_entries      = 50000  # safety cap across all roots
summary_max_bytes = 240   # first N bytes of text files = summary

# Each entry: label (operator-friendly tag), path (filesystem),
# optional excludes (glob list -- skips matching basenames).
[[daemon.index.roots]]
label    = "mios-vendor"
path     = "/usr/share/mios"
excludes = ["__pycache__", "*.pyc"]

[[daemon.index.roots]]
label    = "mios-vendor-bin"
path     = "/usr/libexec/mios"

[[daemon.index.roots]]
label    = "mios-config"
path     = "/etc/mios"

[[daemon.index.roots]]
label    = "mios-state"
path     = "/var/lib/mios"
excludes = ["sessions", "vector_db", "models", "*.db", "*.db-*",
            "__pycache__", "cache"]

[[daemon.index.roots]]
label    = "operator-home"
path     = "/var/home"     # walks /var/home/$MIOS_IDENTITY_USERNAME and below
excludes = [".cache", ".local/share/Trash", "node_modules",
            ".git", "__pycache__"]

[[daemon.index.roots]]
label    = "windows-home"
path     = "/mnt/c/Users"   # walks Windows user homes
max_depth = 4               # shallow on Windows side
excludes = ["AppData", ".cache", "node_modules", ".git",
            "OneDrive*", "Cookies"]


[os_control]
default_position    = "center"   # placement for position="default" launches
default_monitor     = 0          # 0 = primary monitor
tile_gap_px         = 8          # gap between tiled / side-by-side windows
edge_margin_px      = 0          # inset from screen edges for edge placements
region_snap_halves  = true
restore_if_running  = true       # preflight: focus an existing instance instead of relaunching
focus_after_launch  = true       # raise + foreground a window after a successful launch
launch_category_priority = ["linux-flatpak", "linux-rpm-gui", "linux-cli", "windows-app", "windows-gui"]

executor_endpoint   = ""         # e.g. in /etc/mios: "http://100.x.y.z:8950"

  [os_control.nodes.igpu]
  endpoint = ""    # e.g. in /etc/mios: endpoint = "http://100.x.y.z:8950"
  desc     = "iGPU Windows host -- launch + verify on its own desktop over the tailnet (also runs mios-igpu-server.ps1 for inference)."

[computer_use]
verify_after_act = true
# Federation: when set + reachable, every cu_* op routes to this remote desktop's
# mios-computer-use-server (same HTTP contract as the Windows mios-oscontrol-
# server.ps1). EMPTY in vendor (no personal tailnet host in the public repo);
# set the real tailnet URL in your /etc/mios overlay. Configured-but-down =>
# honest error, NEVER a blind local fall-back.
executor_endpoint  = ""          # e.g. in /etc/mios: "http://100.x.y.z:11438"
input_backend      = "auto"      # auto | portal (GNOME/KDE, sandboxable) | uinput (compositor-agnostic)
capture_backend    = "auto"      # auto | portal | grim | gnome | spectacle
# Multiply grounded coordinates by this on a HiDPI seat (1.0 = no scaling).
# Declared as a float so the float() on the consumer side is a no-op.
hidpi_scale_factor = 1.0
restore_token_path = ""          # default: $XDG_STATE_HOME/mios/cu-restore-token (skips the portal consent dialog on re-use)
grounding_model    = ""          # vision grounding tag; empty => mios-pc-vision default (qwen3-vl:4b on mios-llm-light) or the vLLM mios-grounding lane
require_approval   = true        # write-class ops (click/type/key) go through the DoD/approval gate; read-class (screenshot/window-list/ground) auto
# mios-computer-use-server (the dual MCP+A2A node server) bind. Loopback-only in
# vendor; set bind_address to the tailnet IP in your /etc overlay + firewall the
# port to the tailnet to let the central pipe consume this desktop remotely.
enable             = true        # documents intent; the systemd --user unit + graphical-session.target are the real gate
server_port        = 11438       # MCP /mcp + A2A /.well-known/agent-card.json + /a2a + executor /input/* all on this one port
bind_address       = "127.0.0.1" # "" disables the server; set the tailnet IP for federation

docgen_enable      = true        # MASTER GATE for mios-docgen (pandoc+libreoffice installed + verified live; everything-on)
docgen_pandoc      = "pandoc"    # pandoc binary or absolute path (markdown <-> docx/pptx/html/pdf)
docgen_soffice     = "soffice"   # LibreOffice headless binary or path (office-binary + csv->xlsx + pdf)
docgen_pdf_engine  = ""           # pandoc --pdf-engine; empty => route PDF through LibreOffice (no LaTeX needed)
docgen_timeout_s   = 120         # per-conversion timeout (LibreOffice cold start can be slow)
docgen_max_bytes   = 20000000    # refuse inputs/content larger than this (DoS guard)

  [computer_use.nodes.workstation]
  endpoint = ""    # e.g. in /etc/mios: endpoint = "http://100.x.y.z:11438"
  desc     = "A second MiOS/Linux desktop -- screenshot + click + type + verify on its own Wayland session over the tailnet."

# ─── Observability (OpenTelemetry GenAI Spans, task_23) ──────────────────
# Gates OpenTelemetry instrumentation in the agent-pipe. When enabled,
# traces and spans are exported to the OTLP collector.
[observability]
otel_enable   = false
otel_endpoint = "http://localhost:${MIOS_PORTS_OTELCOL_OTLP}"
record_mode   = false
replay_mode   = false
debug         = true
surface_default = "clean"   # clean = reasoning-channel; "inline" only via per-surface opt-in

[observability.channels]                 # which schema event → which SSE channel
  thinking = "reasoning"
  plan = "reasoning"
  tool_call = "status+reasoning"
  tool_result = "reasoning"
  source = "source"
  content = "content"


[gossip]
# WS-A18 epidemic peer discovery (anti-entropy over the A2A peer set). DEFAULT
# OFF: interval_min = 0 -> no loop is spawned (single-box MiOS unaffected). When
# >0, each round PULLs `fanout` known peers' /v1/peers digests and merges them
# TRUST-GATED (a peer rumor is accepted only when its reputation score >=
# min_trust), so a rogue/low-rep peer can't inject itself into the federation.
interval_min = 0    # minutes between gossip rounds (0 = disabled)
fanout       = 3    # peers contacted per round (seeded -> coverage rotates)
min_trust    = 0.0  # reject peer rumors below this reputation score (0 = accept all)

[a2a]
# A2A protocol version the published AgentCard + JSON-RPC surface conform to. SSOT
# for mios_a2a.A2A_PROTOCOL_VERSION (env MIOS_A2A_PROTOCOL_VERSION overrides). v1.0
# moved this into each AgentCard supportedInterfaces[] entry; it is a protocol
# version token, declared once here, never restated in code.
protocol_version = "1.0"
discover_port = 8700
public_domain = ""
nodes = []          # e.g. in /etc/mios: nodes = ["http://172.20.0.5:8700", "http://192.168.1.40:8700"]
discover_cidr = ""  # e.g. "192.168.1.0/24" -> auto-sweep a LAN segment (bounded to 256 hosts)
# SWARM Phase-4: opt discovered A2A peers INTO the concurrent
# swarm fan-out so remote MiOS nodes do individual subtasks in parallel. Default
# false = peers stay explicit-delegation-only (no self-loop overhead). self_id is
# the local pipe's own peer id, ALWAYS excluded from fan-out so it never calls itself.
council = false
self_id = "local-mios"
route_on_card_skills = false

mdns_discovery     = false              # browse the LAN for A2A peers (default OFF = inert)
mdns_service_type  = "_mios-a2a._tcp"   # DNS-SD service type shared by advertise + browse
mdns_advertise     = false              # announce THIS node's A2A endpoint via avahi (default OFF)
mdns_refresh_sec   = 300                # minimum seconds between live mDNS browses (throttle floor)

[mcp]
protocol_version = "2026-07-28"
python = "/usr/lib/mios/mcp/.venv/bin/python3"
wheelhouse = "usr/share/mios/vendored/wheels"
python_packages = ["mcp", "uvicorn", "openai"]

# One mandatory management catalog for Windows hosts and every Linux image.
# Versions float under Law 7; installed versions are recorded in the image SBOM.
[mcp.agents]
enabled = true
binary = "/usr/libexec/mios/mios-agent-relay"
state_directory = "mios/agent-relay"
lease_s = 3600
queue_offline = true
mailbox_retention_s = 86400
max_agents = 64
max_pending = 1024
max_message_bytes = 32768
max_receipts = 4096

[mcp.agents.observation]
refresh_s = 2
max_rows = 32
window_name = "MiOS Agents"

# Coordinator lease: identities are relay registrations; the relay refuses
# values breaking lease_duration_s > renew_interval_s > 1.2 x probe_interval_s.
[mcp.agents.succession]
lease_duration_s = 5400  # seeds a fresh lease; a lease then keeps its own
renew_interval_s = 1800  # returned as next_renew_s
probe_interval_s = 600   # next_probe_s for a held lease
retry_probe_s = 60       # next_probe_s after a release, and past a brief outage's reset
min_outage_s = 900       # an outage resetting sooner is waited out, not taken over
tail_lines = 80          # transcript lines read from the end
preferred_holder = "claude-code"
successors = ["antigravity"]

[agent_cli]
enabled = true
linux_prefix = "/usr/lib/mios/agent-cli"
windows_directory = "MiOS\\agents"
node_min_major = 22
windows_node_package = "OpenJS.NodeJS.LTS"
windows_uv_installer = "https://astral.sh/uv/install.ps1"
windows_uv_installer_sha256 = "536e6ebe00d41efc96b0ab1121bf6f969b0e9cbd88d1e19cfd09e63722e96160"
python = "python3.12"
uv_package = "uv"
aider_package = "aider-chat"
antigravity_linux_installer = "https://antigravity.google/cli/install.sh"
antigravity_windows_installer = "https://antigravity.google/cli/install.ps1"
antigravity_windows_installer_sha256 = "51c2cb4fada22ce0228da71b9506370383d6544bfebcec85fe7616a52b805344"
branch_rule = "^cloud/[a-zA-Z0-9._-]+$"
tools = [
  { name = "claude", package = "@anthropic-ai/claude-code", kind = "npm", mcp = true, experimental = false, launch_template = "claude -p {task}", required_credentials = ["ANTHROPIC_API_KEY"] },
  { name = "claude-cloud", package = "@anthropic-ai/claude-code", kind = "cloud", mcp = true, experimental = false, launch_template = "claude --cloud {task}", status_template = "claude -p \"msg\" --cloud {session} --output-format json", result_template = "claude --teleport {id}", branch_rule = "^cloud/[a-zA-Z0-9._-]+$", required_credentials = ["ANTHROPIC_API_KEY"] },
  { name = "codex", package = "@openai/codex", kind = "npm", mcp = true, experimental = false, launch_template = "codex exec {task}", required_credentials = ["OPENAI_API_KEY"] },
  { name = "codex-cloud", package = "@openai/codex", kind = "cloud", mcp = true, experimental = true, launch_template = "codex cloud exec --env {env_id} {task}", status_template = "codex cloud list --json", result_template = "codex apply {task_id}", branch_rule = "^cloud/[a-zA-Z0-9._-]+$", required_credentials = ["OPENAI_API_KEY"] },
  { name = "gemini", package = "@google/gemini-cli", kind = "npm", mcp = true, experimental = false, launch_template = "gemini -p {task} -o json --approval-mode default", required_credentials = ["GEMINI_API_KEY"] },
  { name = "copilot", package = "@github/copilot", kind = "npm", mcp = true, experimental = false, launch_template = "copilot --exec {task}", required_credentials = ["GITHUB_TOKEN"] },
  { name = "opencode", package = "opencode-ai", kind = "npm", mcp = true, experimental = false, launch_template = "opencode run {task}", required_credentials = [] },
  { name = "agy", kind = "native", mcp = true, experimental = false, launch_template = "agy -p {task} --output-format json", required_credentials = ["ANTIGRAVITY_API_KEY"] },
  { name = "aider", kind = "python", mcp = false, experimental = false, launch_template = "aider --message {task}", required_credentials = ["OPENAI_API_KEY"] },
  { name = "jules", kind = "cloud", mcp = false, experimental = false, launch_template = "jules remote new --repo {repo} --session {task}", status_template = "jules remote list --session", result_template = "jules remote pull --session {id}", branch_rule = "^cloud/[a-zA-Z0-9._-]+$", required_credentials = ["GOOGLE_APPLICATION_CREDENTIALS"] },
  { name = "gh-agent-task", kind = "cloud", mcp = false, experimental = false, launch_template = "gh agent-task create {task} -b {base} -R {repo}", status_template = "gh agent-task view {id} --json state,pullRequestUrl", result_template = "gh agent-task view {id} --json pullRequestUrl", branch_rule = "^cloud/[a-zA-Z0-9._-]+$", required_credentials = ["GITHUB_TOKEN"] },
]



# Native terminal tools are served by the SAME MiOS MCP endpoint. Each MCP
# Unbound/HTTP sessions own private servers; native CLI heads bind verified human panes.
[mcp.tmux]
enabled = true
binary = "/usr/libexec/mios/tmux-mcp"
max_slots = 32
timeout_s = 300
history_limit = 50000
max_sessions = 8
session_idle_s = 1800
allowed_tools = ["open-pane", "execute-command", "send-keys", "run-in-repl", "start-and-watch", "write-to-display", "capture-pane", "screenshot-pane", "pane-state", "watch-pane", "list-slots", "close-pane", "notify"]
upstream = "https://github.com/MadAppGang/tmux-mcp"
version = "v2.0.0"
revision = "d9e45cfe72cff75f7ba923c32ac35a19f424effb"

# Native interactive workspaces; every catalogued CLI can replace this default.
