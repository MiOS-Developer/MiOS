# ----------------------------------------------------------------------------
# [identity] -- Linux account, hostname, GECOS, login shell, group membership.
# Maps to MIOS_IDENTITY_USERNAME, MIOS_IDENTITY_HOSTNAME, MIOS_USER_FULLNAME, MIOS_IDENTITY_SHELL,
# MIOS_IDENTITY_GROUPS.
# ----------------------------------------------------------------------------
[identity]
username  = "user"
fullname  = "MiOS Operator"
hostname  = "mios"
shell     = "/bin/bash"
name      = "mios"
email     = "mios@localhost"
location  = ""
groups    = ["wheel", "libvirt", "kvm", "video", "render", "input", "dialout", "docker"]
default_password = "mios"

[user]
name = ""
pronouns = ""
bio = ""

[accounts]
db_backed = true
db_render_prefs = false

# ----------------------------------------------------------------------------
# [mios] -- AI Agent Persona. Replaces hardcoded identity strings in the
# orchestrator system prompt. Layered from ~/.config/mios.
# ----------------------------------------------------------------------------
[mios]
name = "MiOS AI"
role = "the ONE name you go by on EVERY surface (the `@`/`mios` CLI, OWUI, Discord, the desktop app, the API)"
developer = "MiOS"
[agent_passport]
# Read by federation/a2a.py; the shipped manual documents this path. The
# copy under [security] was inert: emitted by no resolver, read by nothing.
principal_mode = "off"
# domain          = "mios.example.ts.net"   # public host; defaults to localhost
# legal_name      = "MiOS"
# display_name    = "MiOS AI"
# contact_email   = "admin@mios.example.ts.net"
# scope           = ["assist.local", "tools.invoke", "web.search"]
# spend_ceiling_amount = 0        # 0 = no autonomous spend authority
# hitl_above_amount    = 0        # human-in-the-loop trigger threshold
# sla_hours       = 24
# data_classification  = "local-only"
# regions         = ["US"]
# validity_days   = 90

[security]
# TLS verification on agent-plane reachability probes. false = self-signed mesh only.
probe_verify_tls = true
enable_units = [
  "usbguard.service",
  "auditd.service",
  "fapolicyd.service"
]
composefs_mode = "verity"
mask_systemd_remount_fs = true


rule_of_two_mode = "audit"

quarantine_mode = "audit"

api_require_auth     = false
api_caller_keys_path = "/etc/mios/ai/v1/caller-keys.json"

principal_bind_mode  = "audit"

firewall_high_privilege_verbs = [
    "service_restart",
    "container_restart",
    "pc_type",
    "pc_key",
    "pc_click",
    # Native text-editor write verbs -- tainted sessions can't
    # craft them to drop payloads onto operator paths.
    "text_create",
    "text_str_replace",
    "text_insert",
    # Single most dangerous verb in the catalog: arbitrary
    # Windows-side script execution. Always firewall-gated.
    "powershell_run",
    "minimize_window",
    "maximize_window",
    "restore_window",
    "resize_window",
    "position_window",
    "winget_install",
    "winget_upgrade",
    "winget_uninstall",
    "flatpak_install",
    "flatpak_upgrade",
    "flatpak_uninstall",
]
# WS-A14: verbs whose OWN execution introduces session taint (downstream
# high-privilege verbs then get firewall-checked). UNIONED with the built-in
# external-fetch set (web_search/web_extract/crawl/web_scrape) by mios_secset --
# add a verb here to taint on it without a code change. Empty by default.
taint_verbs = []
text_view_taint_prefixes = [
    "/etc/",
    "/usr/",
    "/boot/",
    "/sys/",
    "/proc/",
    "/dev/",
    "/mnt/c/Windows/",
    "/mnt/c/Program Files/",
    "/mnt/c/Program Files (x86)/",
]
internal_tld_suffixes = [".local", ".lan", ".internal"]
arbiter_deny       = []        # verbs the arbiter ALWAYS refuses (hard floor)
arbiter_allow      = ""        # exclusive allow-list when non-empty (CSV); "" = no allow-list
arbiter_block_tier = ""        # refuse verbs at/above this risk tier (read|write|interactive); "" = no tier ceiling
arbiter_port       = 8760      # loopback port mios-policy-arbiter listens on

token_ttl_s        = 3600
allowlist_hosts = [
    "localhost",
    "127.0.0.1",
    "::1",
    "host.containers.internal",
    "mios-llm-light",
    "mios-open-webui",
    "mios-hermes",
    "mios-pgvector",
    "mios-forge",
    "mios-searxng",
    "mios-crawl4ai",
    "mios-code-server",
]

provenance_taint = true
# Follow-up: promote rule_of_two_mode, quarantine_mode, principal_bind_mode from "audit" to "enforce" after one release.

# [security.credential_literals] -- Law-11 extension: default credentials still
# baked into world-readable units. SHRINK-ONLY; task_176 rotates them to
# /etc/mios/secrets.env (gate: check_credential_literals).
[security.credential_literals]
# task_972. Each entry pins path:KEY=VALUE, not just path:KEY. A key-only register
# cannot tell the shipped placeholder from an operator's real password: setting
# MIOS_PGVECTOR_PASS in the build environment bakes that value into a 0644 file under
# /usr and the key-only gate stayed green. Every value below is a placeholder
# and none is a secret; changing any of them is a NEW finding by design.
max_literals = 6
grandfathered = [
  "usr/lib/systemd/system/mios-agents.service:MIOS_IDENTITY_DEFAULT_PASSWORD=mios",
  "usr/lib/systemd/system/mios-ha-bootstrap.service:HA_PASSWORD=mios",
  "usr/share/containers/systemd/mios-guacamole.container:POSTGRESQL_PASSWORD=mios",
  "usr/share/containers/systemd/mios-open-webui.container:RAG_OPENAI_API_KEY=sk-noop",
  "usr/share/containers/systemd/mios-open-webui.container:WEBUI_SECRET_KEY=mios-stable-secret-change-me",
  "usr/share/containers/systemd/mios-pgvector.container:POSTGRES_PASSWORD=mios",
]

# [security.redact] -- task_3237 redaction on PERSIST; every schema table sits in
# exactly one list below (gate: check_redact_coverage).
[security.redact]
enable      = true
# A redaction error refuses the write; never fall through to an unredacted one.
fail_closed = true
# Agent-plane free text -- where a secret or PII actually lands. agent_inbox
# carries raw webhook payloads and threat_events free-text descriptions.
tables = [
  "agent_inbox", "agent_memory", "config_event", "directory_entry", "event",
  "fact_ledger", "gateway_sessions", "kanban", "knowledge",
  "log_digest", "mios_rag", "peer_reputation", "pending_action",
  "progress_ledger", "scratch", "session", "skill_invocation",
  "system_logs", "tasks", "threat_events", "tool_call",
]
# Structured system/config tables: redaction would CORRUPT the value, not
# protect it, and they hold no free-form prose.
# drift_snapshot holds normalized LABEL HISTOGRAMS and counts; skill_tool_call
# holds two ids and a step index. Both are structure, never content. Exempt.
exempt = [
    "account",
    "account_preference",
    "agent_keypair",
    "alias",
    "app_install",
    "appx_removal",
    "build_phase",
