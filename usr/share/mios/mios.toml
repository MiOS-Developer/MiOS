[containers.mios-sunshine.Unit]
# A USER-scope unit (see [quadlets.scope]): it streams the logged-in user's own
# desktop, so it runs rootless under that user's systemd, not as root (Law 6).
# Capture goes through xdg-desktop-portal ScreenCast + PipeWire (capture=portal);
# KMS capture would need host CAP_SYS_ADMIN, which a rootless unit cannot hold.
After = "graphical-session.target"
ConditionUser = "!@system"
Description = "'MiOS' Sunshine Low-Latency Streaming Server (portal/PipeWire capture, HW encode)"
Documentation = "https://docs.lizardbyte.dev/projects/sunshine"
PartOf = "graphical-session.target"

[containers.mios-sunshine.Container]
AddCapability = ["CAP_SYS_NICE"]
AddDevice = [
  "/dev/dri",
  "/dev/uinput",
  "nvidia.com/gpu=all"
]
ContainerName = "mios-sunshine"
Environment = [
  "XDG_RUNTIME_DIR=%t",
  "WAYLAND_DISPLAY=wayland-0",
  "PULSE_SERVER=unix:%t/pulse/native",
  "DBUS_SESSION_BUS_ADDRESS=unix:path=%t/bus",
  "HOME=%h"
]
EnvironmentFile = "/etc/mios/install.env"
Exec = "capture=portal"
Group = "%G"
GroupAdd = "keep-groups"
HealthCmd = "curl -fsS http://localhost:47990/ || exit 1"
HealthInterval = "30s"
HealthRetries = 3
HealthStartPeriod = "20s"
HealthTimeout = "10s"
Image = "docker.io/lizardbyte/sunshine:latest-ubuntu-26.10"
Label = [
  "org.opencontainers.image.title=mios-sunshine",
  'org.opencontainers.image.description="Low-latency Sunshine/Moonlight streaming server with multi-vendor hardware encoding and portal/PipeWire capture"'
]
Network = "host"
SecurityLabelDisable = true
User = "%U"
UserNS = "keep-id"
Volume = [
  "%t:%t:ro",
  "%h/.config/sunshine:%h/.config/sunshine"
]

[containers.mios-sunshine.Install]
WantedBy = "graphical-session.target"

[containers.mios-sunshine.Service]
Delegate = "yes"
ExecStartPre = "/usr/bin/mkdir -p %h/.config/sunshine"
Restart = "on-failure"
RestartSec = "5s"
TimeoutStartSec = "120s"


# ─── Editions Matrix ─────────────────────────────────────────────────────────
# Defines the different flavors/editions of MiOS that can be built by the
# pipeline (task_147). The build scripts can load an edition profile to override
# the default autounattend and branding keys from a single SSOT.
[editions.mios]
autounattend.uup_channel     = "retail"
autounattend.uup_arch        = "amd64"
autounattend.posture         = "B"
autounattend.debloat_profile  = "minimal"
autounattend.xbox.enable     = "false"
colors.accent                = "#1A407F"
branding.living_wallpaper    = "false"
metal.gpu.arbitration        = "static"
metal.gpu.assignments        = { mios-guest = ["0000:01:00.0"] }

[editions.mios-xbox]
autounattend.uup_channel     = "dev"
autounattend.uup_arch        = "amd64"
autounattend.posture         = "C"
autounattend.debloat_profile  = "gaming"
autounattend.xbox.enable     = "true"
colors.accent                = "#282262"
branding.living_wallpaper    = "true"
metal.gpu.arbitration        = "static"
metal.gpu.assignments        = { mios-guest = ["0000:01:00.0"] }

[editions.mios-xbox-arm]
autounattend.uup_channel     = "dev"
autounattend.uup_arch        = "arm64"
autounattend.posture         = "C"
autounattend.debloat_profile  = "gaming"
autounattend.xbox.enable     = "true"
colors.accent                = "#4B105C"
branding.living_wallpaper    = "true"
metal.gpu.arbitration        = "static"
metal.gpu.assignments        = { mios-guest = ["0000:01:00.0"] }

[blade]
type = "hybrid"

# Where the hardware sniff demotes to, and where role-apply falls back when the
# resolved archetype ships no target. Must itself be an archetype, and must be
# an archetype that survives on any hardware -- it is chosen precisely when the
# machine cannot do what the resolved role implies. Gate: check_role_ssot.
fallback = "headless"

# Services a seat still starts because no capability gates them yet.
# SHRINK-ONLY (gate: check_blade_coverage). Drained by task_266; keep it at [].
ungated = []

# A `mini` plane is REQUIRED unless registered here (ADR-0016 D14.1).
# A Mini with no radio is still a Mini; one with no hypervisor is not.
optional_planes = ["radio"]

# Soft pull on a gated unit, degrades without it. Reasons: ADR-0016 D4.
soft_ok = ["hermes-worker", "mios-hermes-browser", "mios-ai-firstboot"]

# Units a seat DELIBERATELY runs: what the PERSON touches. A blade runs what
# the WORK needs. See ADR-0016 D4.
seat_side = [
  "mios-agent-pipe",            # the local front door; MIOS_AI_ENDPOINT points it at a blade
  "mios-ai-legacy-forward",     # compatibility listener for the same local front door
  "hermes-dashboard",           # browser UI
  "mios-hermes-browser",        # CDP browser the agent tools drive
  "mios-hermes-tail",           # journal tail into the UI
  "mios-ttyd-bash",             # browser pty
  "mios-ttyd-powershell",       # browser pty
]

# ---- Workload mobility. Rationale: ADR-0017.

[blade.placement]
# Image -> k3s. libvirt domain -> Pacemaker. Never the other kind.
containers = "k3s"
vms        = "pacemaker"
# Retry in place first: most failures are a crash on a healthy machine.
failover_order = ["local", "localhost", "cluster"]

[blade.collapse]
# Asymmetric on purpose: quick to absorb, slow to release. Anti-flap.
fail_checks     = 3
dwell_s         = 30
recover_dwell_s = 120

[blade.discovery]
# First healthy tier wins; same chain answers "am I isolated".
order            = ["localhost", "mdns", "tailnet", "remote"]
health_path      = "/v1/models"
health_timeout_s = 3
remote           = ""      # operator-declared fallback endpoint; empty = none

[blade.reconcile]
# Blade-to-blade only; seats are stateless (ADR-0016 s8).
enabled      = true              # schema carries origin_node + logical_ts (task_2239, task_2240)
knowledge    = "union-by-hash"
embeddings   = "union-by-hash"
agent_memory = "append-ordered"
event        = "append-ordered"
session      = "last-writer-wins"
scratch      = "last-writer-wins"
config_kv    = "conflict-is-error"   # config is intent; never auto-pick a winner


# [blade.mesh] -- LAN first, Tailscale second. ADR-0016 D14.3.
# The ORDER is [blade.discovery].order; never restate it here (Law 9).

# blocks_boot = false is Law 12: enrolment never gates a boot.
# federate = "native": peers join via each system's OWN mechanism -- k3s
# server/agent join, corosync membership -- automatically, never by hand.
[blade.mesh]
blocks_boot = false
federate    = "native"

# [blade.cluster] -- k3s-NATIVE HA: 3 servers on embedded etcd. ADR-0016 D15.
# The 3 localhost_hosts ARE the 3 etcd members, so quorum works on ONE box.

# server: empty = the first Mini installed. Set it to pin a specific box.
[blade.cluster]
k3s_servers      = 3
server           = ""
control_plane_ha = true
localhost_hosts  = 3

# [blade.fencing] -- self-fence on quorum loss. ADR-0016 D12.1.
# No member must be reached to be fenced; that is what makes a guest vote safe.

# diskless = quorum-driven watchdog only, no shared block device.
# Packages `sbd` and `fence-agents-all` already ship.
[blade.fencing]
method   = "sbd"
diskless = true

# [blade.storage] -- CephFS shadow-copy policy. ADR-0016 D12.3.
# Every class replicates; encryption, not withholding, is the confidentiality.

# NOT [security].disk_encryption: that is TPM2-sealed to one box and cannot
# travel with a shadow copy. Who holds the travelling key is UNSETTLED.

# See ADR-0016 D12.3: whether a remote peer holds the key is UNSETTLED.
[blade.storage]
replication = "all"        # every data class, Mini-to-Mini only
at_rest     = "dmcrypt"   # ceph-volume --dmcrypt; key in the MON config-key store

# [blade.uplink] -- `router` is owner=mini and never moves; the DEFAULT ROUTE
# does. NOT [security].egress, which is an allowlist rather than a failover.

# ADR-0016 D12.4. Tension with ADR-0017 D3 (local-first) is recorded there.
[blade.uplink]
failover = ["local", "peer"]

# [blade.hardware] -- MiOS boots on ANY hardware. ADR-0016 D14.
# These gate a PLANE, never the boot: a box that misses one still boots.

# LAN alone is both uplink and downlink, so one interface is the whole floor.
# A radio is OPTIONAL (0 or 1); an AP is a capability, never a requirement.
[blade.hardware]
min_interfaces = 1
max_radios     = 1
min_ap_capable = 0

# [blade.planes] -- which planes a Mini owns and which can be shed.
# Meaning of owner/markers/wired_by: ADR-0016 Decision 10.

# owner: mini = owns metal a guest lacks, never shed. either = a movable workload.
# markers: packages proving the plane is baked. Empty = payload, not RPM.

# wired_by: the file that activates it. Verdicts are DERIVED, never written here.
# Generator + gate: mios-gen metal-vs-hosted --check (Law 8).

[blade.planes.hypervisor]
role     = "runs the VMs and containers every other plane lands in"
owner    = "mini"
markers  = ["libvirt", "qemu-kvm"]
wired_by = "usr/lib/sysctl.d/99-mios.conf"

[blade.planes.radio]
role     = "serves WiFi clients as an access point. OPTIONAL: MiOS boots on hardware with no radio at all"
owner    = "mini"
markers  = ["hostapd", "iw", "wireless-regdb"]
wired_by = ""

[blade.planes.router]
role     = "the uplink: forwards, NATs and filters. The LAN is both uplink and downlink, so one interface suffices"
owner    = "mini"
markers  = ["firewalld", "dnsmasq"]
wired_by = "usr/lib/sysctl.d/99-mios.conf"

[blade.planes.mesh]
role     = "joins every node and service into one addressable overlay"
owner    = "mini"
markers  = ["avahi", "nss-mdns"]
wired_by = ""

[blade.planes.storage]
