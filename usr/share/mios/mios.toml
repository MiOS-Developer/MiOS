[docs.distill]
# The Day-N+1 pass: comments are scraped, sanitized and distilled into the
# manual. AI-hints are NOT scraped -- they stay in source and are projected
# forward by the index deriver instead.
enable   = true
dest_dir = "usr/share/doc/mios/manual"
# No skip list: [docs].blocklist_globs is the one exclusion, so distill lands
# every block the narrative ratchet counts.

[docs.sanitize]
# Applied to every scraped comment before it reaches a doc. Order matters:
# rewrites first, then redaction.
# Dev-box paths -> the FHS canonical the doc reader actually has.
# MOST SPECIFIC FIRST: these are applied in order, so a general drive rewrite
# placed above the file:// form would corrupt it into file:////usr/share/...
path_rewrites = [
  ["file:///C:/MiOS/", ""],
  ["file:///C:/", ""],
  ["C:\\MiOS\\", "/usr/share/mios/"],
  ["C:/MiOS/", "/usr/share/mios/"],
  ["C:\\MiOS", "/usr/share/mios"],
  ["C:/MiOS", "/usr/share/mios"],
  ["/mnt/c/MiOS", "/usr/share/mios"],
]
# Secret-shaped values never reach a doc, whatever a comment happened to hold.
# The keyword may sit inside a longer identifier (HA_PASSWORD=, MY_API_KEY:),
# so no leading \\b -- that anchor is why FOO_PASSWORD=... escaped redaction.
# The value must look like one: 4+ non-space chars, and not the ">" of a "=>"
# arrow, so prose like "NO DISCORD_BOT_TOKEN => ..." is left alone.
redact_patterns = [
  "(?i)[A-Za-z0-9_]*(?:api[_-]?key|secret|passwd|password|token)[A-Za-z0-9_]*\\s*[:=]+\\s*(?![>\\s])[^\\s\"']{4,}",
  "\\bsha256:[0-9a-f]{64}\\b",
  "(?i)\\bBearer\\s+[A-Za-z0-9._-]{16,}",
]
redact_with = "[redacted]"

[docs.boilerplate]
# Canonical framing paragraphs, spliced into docs through MIOS-GEN markers.
# The what-mios-is block had been hand-copied into dozens of files, where the
# copies then drifted; one string here is the cure.
what-mios-is = """
MiOS is one thing built two ways at once: an immutable, `bootc`/OCI-shaped
Fedora workstation -- the whole OS is a single container image, so `bootc
upgrade` behaves like a `git pull` and `bootc rollback` like a Ctrl-Z -- that
is *also* a local, self-hosted, agentic AI operating system.
"""

[docs.signals]
why       = '\b(because|so that|otherwise|avoid|prevents?|must not|never|do not|fail-open|fail-closed|deliberately|intentionally|noqa|workaround|upstream bug|race|deadlock)\b'
narrative = '\b(operator|used to|no longer|previously|regression|root cause|incident|reverted|scrapped|rejected|instead of|alternative|rationale|invariant|degrade|ADR-[0-9]+|Law [0-9]+|WS-[A-Z]+|[0-9]{4}-[0-9]{2}-[0-9]{2})\b'
fact      = '\b(broken|deprecated|removed|disabled|not supported|only on|requires|since|as of|WS-[A-Z]+|ADR-[0-9]+|Law [0-9]+)\b'
code      = '^\s*(if|for|while|def|class|function|export|set|return|elif|else|fi|done|esac|end)\b|[;{]\s*$|^\s*[\w.]+\s*=[^=]'


