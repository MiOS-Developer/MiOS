"tests/bake-smoke.sh" = "takes an image reference as its argument; the build and smoke jobs invoke it against the image they just produced"
"tests/drift-gate-readonly.sh" = "a developer convenience wrapper over the gate tier; running it would duplicate that tier"
"tests/drift-parity.sh" = "compares the bash gate against miosd drift-check --parity and needs the miosd binary built"
"tests/test-directory-dispatch.sh" = "dispatch returns no hits without a populated directory index, and the suite indexes hits[0] unguarded -- task_2329"
"tests/test-expand-from.py" = "the open-url-fallback-chain skill resolves to not_found, so the suite sees 0 steps where it expects 3 -- task_2330"
"tests/test-reflection.py" = "needs a reachable refine backend; every connection attempt fails and reflection returns None -- task_2331"

[ci.tool_skips]
"tests/test-composefs-seal.sh" = "mkcomposefs + composefs-info: no Ubuntu 24.04 package (noble, noble-updates, noble-backports universe)"

# The MiOS product line, named once. Each variant used to be a different shape:
# an edition entry, its own table, or only a machine name. status is measured:
# shipping means built and observed, partial means the machinery runs but not
# the whole job, design means specified with no artifact.
[variants]
# Shrink-only: a variant may not sit in "design" forever without someone
# noticing. Raising this is how a design doc quietly becomes the deliverable.
max_design_variants = 2

[variants.naming]
# The naming convention, enforced by a gate rather than remembered. A variant
# has one name in two registers: title case for prose and interfaces, lower
# case for image tags, keys and paths.
prefix        = "MiOS"
separator     = "-"
title_pattern = "MiOS-<Suffix>"
key_pattern   = "mios-<suffix>"
key_charset   = "a-z0-9-"
# The base variant is the one case with no suffix.
base          = "mios"
# A suffix names WHAT THE VARIANT IS, never its size or its hardware: Metal owns
# the metal, Cat travels, Xbox plays, DEV builds. "Mini" was renamed to "Metal"
# because it described the image's size rather than its job.
suffix_rule   = "name the job, not the size"

[variants.entries.mios]
title     = "MiOS"
summary   = "the base bootc host: the AI plane, the container plane and a Windows guest on one immutable image"
target    = "bare metal or a virtual machine"
config    = ["image", "blade", "editions"]
edition   = "mios"
archetype = "hybrid"
artifacts = ["oci", "iso", "qcow2", "vhdx", "raw"]
doc       = "usr/share/doc/mios/manual.md"
status    = "shipping"

