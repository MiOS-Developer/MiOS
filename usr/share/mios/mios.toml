# Rendered per build by `miosd artifact-build qcow2`, like vhdx below.
[deploy.formats.qcow2]
title   = "QEMU disk"
summary = "a virtual machine disk for libvirt, QEMU and the cloud images built from it"
target  = "qcow2"
recipe  = ""
medium  = "virtual machine"
gui     = "full desktop session"
artifacts = ["qcow2/qcow2/*.qcow2", "qcow2/*.qcow2"]
status  = "shipping"

# Hyper-V disk: BIB's VHD (bib_type, gated by [deployment].target_vhd) converted
# to a `subformat` VHDX, its config rendered per build by `miosd artifact-build`.
# Never published (GitHub assets stop at 2 GiB a file, GHCR at 10 GB a layer):
# build it from the published digest, usr/share/doc/mios/upstream/deploy-targets.md.
[deploy.formats.vhdx]
title   = "Hyper-V disk"
summary = "a virtual machine disk for Hyper-V and Windows virtualisation"
target  = "vhdx"
recipe  = ""
medium  = "virtual machine"
gui     = "full desktop session"
bib_type  = "vhd"
subformat = "dynamic"
artifacts = ["vhdx/*.vhdx"]
status  = "shipping"

# The Hyper-V virtual machine the disk is made for. New-VM and Set-VMFirmware
# read it as written (usr/share/doc/mios/upstream/deploy-targets.md); the CI
# boot test ([ci.artifacts], [testing.boot]) runs the same shape under QEMU.
[deploy.formats.vhdx.vm]
# A bootc disk is UEFI and GPT, which only a Generation 2 VM boots.
generation           = 2
# Fedora's shim is signed by the Microsoft UEFI CA, not the Windows CA, so Secure
# Boot needs this template rather than Hyper-V's default (MicrosoftWindows).
secure_boot_template = "MicrosoftUEFICertificateAuthority"
processors           = 4
# PowerShell's form, as New-VM -MemoryStartupBytes reads it; never below
# [preflight].min_ram_gb, which miosd enforces.
memory               = "8GB"
# Fixed: GPU partitioning (GPU-PV) and the AI plane's model memory want it static.
dynamic_memory       = false
# Hyper-V's built-in NAT switch.
switch               = "Default Switch"

[deploy.formats.wsl2]
title   = "WSL distribution"
summary = "MiOS as a Windows Subsystem for Linux distribution, running its own systemd and its own containers"
target  = "wsl2"
recipe  = "config/artifacts/wsl2.toml"
medium  = "WSL2 on Windows"
# WSLg is not a separate artifact: it is this format with the graphical bridge
# Windows already provides, which etc/profile.d/mios-wslg.sh wires up.
gui     = "WSLg, via the graphical bridge Windows provides"
artifacts = ["wsl2/*.tar.gz", "wsl2/*.wsl2"]
status  = "partial"

# What it takes for a built artifact to count as real. The verifier walked the
# tree, matched nothing and reported success, so a build that produced no file
# at all satisfied the gate that guards the push. Every format above names the
# glob its own target writes; a format whose globs match nothing is a missing
# artifact, and no artifact at all is the loudest failure of the set.
[deploy.verify]
# The floor a file must clear to count as an artifact rather than a stub.
# Every format above writes a whole disk, an installer or a root filesystem,
# and none of those is as small as four mebibytes, so a file under this floor
# is a truncated or empty write rather than a smaller build.
min_bytes = 4194304

# A disk's credential, never stored here and never defaulted: `miosd
# artifact-build` reads these environment variables, then [auth] in the layered
# mios.toml (password_hash under password_policy "hashed", existing_ssh_key under
# ssh_key_action "existing"), and refuses a disk none of them opens (P1-4).
[deploy.identity]
password_hash_env = "MIOS_USER_PASSWORD_HASH"   # `openssl passwd -6`; the console login
ssh_key_env       = "MIOS_SSH_PUBKEY"

# [rust] -- what the Rust layer's green actually covers.
#
# `cargo test --workspace` prints "test result: ok. 0 passed" for a crate with no
# tests, which reads exactly like a crate whose tests all passed. Every entry
# below is in that state. The ceiling is shrink-only: write a test, remove the
# entry, lower the number.
[rust]
max_untested_crates = 0

[rust.untested_crates]

# ----------------------------------------------------------------------------
# [rust.categories] -- ADR-0021 Function-Named Binary & Crate SSOT Registry
# ----------------------------------------------------------------------------
# Maps script domains and existing crates to destination static binaries,
# lifecycle roles, install directories, and responsible owners (task_3488).
# Ownership gate: mios-gate rust-categories.
# Owner lanes and install roles are declared once each, in [rust.categories.owners]
# and [rust.categories.roles], as lists of categories (every category in exactly
# one of each). A role names its [build.native.categories.<role>] table, which
# owns the install directory. A destination binary's own crate is implied by
# binary=; crates= lists only the other crates folded into it.
# Script layer: scope= globs claim the scripts a category owns for porting;
# exempt categories (role exempt, no binary) carry their reason in description=;
# universe= fixes the script roots the gate must account for, and max_unowned
# is the shrink-only ceiling for scripts no category claims yet (task_3488).
# A replaces= entry is ported-and-deleted evidence: the named script must be
# absent from the tree in the same commit that proves parity (ADR-0021).
[rust.categories]
binaries = [
  "mios-gate", "mios-gen", "mios-resolver", "mios-serve", "mios-probe",
  "mios-install", "mios-build", "mios-task", "mios-node", "mios-launch",
  "mios-wallpaperd", "miosd",
]
max_unowned = 128
universe = [
  "tools/", "automation/", "usr/libexec/mios/", "usr/lib/mios/",
  "usr/share/mios/windows/", "installation/", "tests/", ".",
]

[rust.categories.owners]
port-lane = ["gate", "gen"]
native-tier = [
  "resolver", "serve", "probe", "install", "build", "task", "node", "apps",
  "wallpaperd", "daemon_meta",
]
agent-plane = ["ai-plane"]
build-lane = ["automation-glue"]
qa-lane = ["tests"]

[rust.categories.roles]
cli = ["gate", "gen", "resolver", "probe", "install", "build", "task", "daemon_meta"]
services = ["serve"]
daemons = ["node", "wallpaperd"]
apps = ["apps"]
exempt = ["ai-plane", "automation-glue", "tests"]

