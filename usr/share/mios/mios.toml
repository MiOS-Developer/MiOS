# ----------------------------------------------------------------------------
# [generator] -- Quadlet & manifest generator configuration
# ----------------------------------------------------------------------------
[generator]
placeholders             = ["FEDORA_VERSION", "MIOS_VERSION", "MIOS_VERSIONS_FEDORA"]

[versions]
fedora                   = "44"
k3s                      = "latest"
forgejo                  = "latest"
ceph                     = "latest"

# ----------------------------------------------------------------------------
# [image.sidecars] -- pinned upstream container references for every
# Quadlet sidecar. version + image (where present) are paired; consumers
# read either via MIOS_<svc>_VERSION / MIOS_<svc>_IMAGE.
# ----------------------------------------------------------------------------
[image.sidecars]
sys                = "localhost/mios-sys:latest"
cuda               = "ghcr.io/mostlygeek/llama-swap:cuda"
k3s                = "docker.io/rancher/k3s:${MIOS_VERSIONS_K3S}"
ceph               = "quay.io/ceph/ceph:${MIOS_VERSIONS_CEPH}"
forge              = "codeberg.org/forgejo/forgejo:${MIOS_VERSIONS_FORGEJO}"
searxng            = "docker.io/searxng/searxng:latest"
hermes             = "docker.io/nousresearch/hermes-agent:latest"
open_webui         = "ghcr.io/open-webui/open-webui:main"
# hermes_workspace sidecar REMOVED -- replaced by the
# hermes-agent's built-in dashboard at port 9119.
code_server        = "ghcr.io/coder/code-server:4.139.1"   # pinned (-> MIOS_CODE_SERVER_VERSION): the workbench bake patches are release-bound; a bump that moves an anchor FAILS the build
devpod             = "ghcr.io/loft-sh/devpod:v0.6.15"      # DevPod workspace container image (MPL-2.0)
guacamole          = "docker.io/guacamole/guacamole:latest"
forge_runner       = "code.forgejo.org/forgejo/runner:latest"
crowdsec           = "docker.io/crowdsecurity/crowdsec:latest"
postgres           = "docker.io/library/postgres:latest"
guacd              = "docker.io/guacamole/guacd:latest"
pxe_hub            = "quay.io/poseidon/matchbox:latest"
bib_alpine         = "docker.io/library/alpine:latest"
pgvector           = "docker.io/pgvector/pgvector:pg18"   # pgvector floats per PostgreSQL MAJOR (pgNN); no :latest tag exists. mios-pgvector-major-upgrade migrates PGDATA across majors
# mios-llm-light lane image. The upstream llama-swap proxy (FOSS, MIT) bundles
# llama-server + on-demand model swap. Tag carries the CUDA build; verify version.
llm_light          = "ghcr.io/mostlygeek/llama-swap:cuda"
# AdGuard Home -- open-source (GPLv3) DNS sinkhole + recursive resolver. Single
# Go binary container; serves DNS on :53 and the web UI/API on :3053.
adguard            = "docker.io/adguard/adguardhome:latest"
vllm               = "docker.io/vllm/vllm-openai:latest"
sglang             = "docker.io/lmsysorg/sglang:latest"
valkey             = "docker.io/valkey/valkey:latest"
# `all-in-one` is the Jaeger v1 line only (v2 ships as jaegertracing/jaeger),
# so :latest can never cross into v2's env model; its manifest is digest-identical
# to the last v1 release. Floating it cannot unbind the collector's SSOT ports.
otelcol            = "docker.io/jaegertracing/all-in-one:latest"
headscale          = "docker.io/headscale/headscale:latest"

# ----------------------------------------------------------------------------
# [image.sys] / [image.cuda] -- SSOT sections for the consolidated shared bases
# ----------------------------------------------------------------------------
[image.sys]
base = "ghcr.io/ublue-os/ucore-hci:stable-nvidia"
packages = [
  "python3", "python3-pip", "python3-devel",
