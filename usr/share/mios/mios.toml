RemainAfterExit = "yes"

[units."mios-gpu-detect.service".Install]
WantedBy = "sysinit.target"


[units."mios-gpu-amd.service".Unit]
comment = "# AI-hint: Configures AMD GPU hardware acceleration by loading the amdgpu module, generating CDI specifications for containerized ROCm/KFD access, and enforcing 0660 permissions on /dev/kfd for the render group.\n# AI-related: mios-gpu, systemd-modules-load.service, systemd-udev-trigger.service, multi-user.target"
Description = "'MiOS' AMD GPU container plumbing (ROCm/KFD + DRI)"
ConditionVirtualization = "!container"
Documentation = "https://github.com/mios-dev/MiOS/blob/main/docs/gpu-passthrough.md"
ConditionPathExists = "/dev/kfd"
After = "systemd-modules-load.service systemd-udev-trigger.service"

[units."mios-gpu-amd.service".Service]
Type = "oneshot"
RemainAfterExit = "yes"
ExecStartPre = "/usr/sbin/modprobe -a amdgpu"
ExecStart = '''/usr/bin/bash -c ' \
  # If amd-ctk ever lands in Fedora RPM repos, drop a CDI spec automatically. \
  # Until then containers must pass --device /dev/kfd --device /dev/dri \
  # --group-add keep-groups explicitly. \
  if command -v amd-ctk >/dev/null 2>&1; then \
    amd-ctk cdi generate --output=/run/cdi/amd.json || true; \
  fi; \
  # Defensive perms -- Fedora Rawhide already labels /dev/kfd as root:render \
  # 0660 via kernel, but pin it in case of drift. \
  chgrp render /dev/kfd 2>/dev/null || true; \
  chmod 0660   /dev/kfd 2>/dev/null || true; \
  exit 0\''''
StandardOutput = "journal"
StandardError = "journal"

[units."mios-gpu-amd.service".Install]
WantedBy = "multi-user.target"


[units."mios-gpu-intel.service".Unit]
comment = "# AI-hint: Systemd unit that initializes iGPU drivers (i915/xe/amdgpu) and configures permissions for /dev/dri/renderD128 to enable hardware acceleration and unified render node access for Intel/AMD hardware.\n# AI-related: mios-gpu, systemd-modules-load.service, systemd-udev-trigger.service, multi-user.target"
Description = "'MiOS' Intel/AMD iGPU Container Plumbing (i915/xe/amdgpu)"
ConditionVirtualization = "!container"
Documentation = "https://github.com/mios-dev/MiOS/blob/main/docs/gpu-passthrough.md"
ConditionPathExists = "/dev/dri/renderD128"
After = "systemd-modules-load.service systemd-udev-trigger.service"

[units."mios-gpu-intel.service".Service]
Type = "oneshot"
RemainAfterExit = "yes"
ExecStartPre = "-/usr/sbin/modprobe -a i915 xe amdgpu"
ExecStart = '''/usr/bin/bash -c ' \
  # Defensive perms on primary render node -- do not touch card* nodes (video group \
  # handled by 99-mios-gpu.rules at udev-add time). \
  if [ -e /dev/dri/renderD128 ]; then \
    chgrp render /dev/dri/renderD128 2>/dev/null || true; \
    chmod 0660   /dev/dri/renderD128 2>/dev/null || true; \
  fi; \
  exit 0\''''
StandardOutput = "journal"
StandardError = "journal"

[units."mios-gpu-intel.service".Install]
WantedBy = "multi-user.target"


[units."mios-gpu-nvidia.service".Unit]
comment = "# AI-hint: Systemd unit that ensures NVIDIA GPU modules are loaded and CDI configurations are generated for container passthrough, acting as a fallback or prerequisite for nvidia-cdi-refresh.service.\n# AI-related: mios-gpu, nvidia-cdi-refresh.service, systemd-modules-load.service, systemd-udev-trigger.service, akmods.service, multi-user.target"
Description = "'MiOS' NVIDIA GPU container plumbing"
ConditionVirtualization = ["!container", "!wsl"]
Documentation = "https://github.com/mios-dev/MiOS/blob/main/docs/gpu-passthrough.md"
ConditionPathExists = "/dev/nvidia0"
After = "systemd-modules-load.service systemd-udev-trigger.service akmods.service"
Before = "nvidia-cdi-refresh.service"

[units."mios-gpu-nvidia.service".Service]
Type = "oneshot"
RemainAfterExit = "yes"
ExecStartPre = "/usr/sbin/modprobe -a nvidia nvidia_uvm nvidia_modeset nvidia_drm"
ExecStart = '''/usr/bin/bash -c ' \
  if systemctl list-unit-files nvidia-cdi-refresh.service 2>/dev/null \
       | grep -q nvidia-cdi-refresh; then \
    echo "nvidia-cdi-refresh.service present; deferring CDI generation to upstream"; \
    exit 0; \
  fi; \
  if command -v nvidia-ctk >/dev/null 2>&1; then \
    nvidia-ctk cdi generate --output=/run/cdi/nvidia.yaml || true; \
  fi; \
  exit 0\''''
StandardOutput = "journal"
StandardError = "journal"

[units."mios-gpu-nvidia.service".Install]
WantedBy = "multi-user.target"


[units."mios-gpu-nvidia.service.d/10-cycle-fix.conf".Unit]
comment = "# AI-hint: Overrides the mios-gpu-nvidia.service unit to ensure it runs during the early sysinit.target phase, bypassing standard dependency delays to ensure GPU drivers are initialized early in the boot sequence.\n# AI-related: mios-gpu-nvidia, mios-gpu-nvidia.service, sysinit.target"
DefaultDependencies = "no"
Requires = "sysinit.target"
After = "sysinit.target"


[units."mios-gpu-pv-detect.service".Unit]
comment = "# AI-hint: Systemd unit that executes /usr/libexec/mios/gpu-pv-detect to detect Hyper-V GPU Partitioning (GPU-PV) capabilities during boot, enabling hardware acceleration for guests on Microsoft Hyper-V hosts.\n# AI-related: /usr/libexec/mios/gpu-pv-detect, systemd-modules-load.service, display-manager.service, multi-user.target"
Description = "'MiOS' Hyper-V GPU-PV Guest Detection"
DefaultDependencies = "no"
After = "systemd-modules-load.service"
Before = "display-manager.service"
ConditionVirtualization = "microsoft"

[units."mios-gpu-pv-detect.service".Service]
Type = "oneshot"
ExecStart = "/usr/libexec/mios/gpu-pv-detect"
RemainAfterExit = "yes"

[units."mios-gpu-pv-detect.service".Install]
WantedBy = "multi-user.target"


[units."mios-gpu-status.service".Unit]
comment = "# AI-hint: Systemd unit that detects GPU hardware (NVIDIA, AMD, Intel) and virtualization status, exporting the results to /run/mios/gpu-passthrough.status and enabling the container_use_devices SELinux boolean.\n# AI-related: mios-gpu, systemd-udev-trigger.service, systemd-modules-load.service, podman.socket, docker.socket, local-fs.target, basic.target, sockets.target, multi-user.target"
ConditionVirtualization = "!container"
Description = "'MiOS' GPU passthrough detection and status"
Documentation = "https://github.com/mios-dev/MiOS/blob/main/docs/gpu-passthrough.md"
DefaultDependencies = "yes"
After = "systemd-udev-trigger.service systemd-modules-load.service local-fs.target"

[units."mios-gpu-status.service".Service]
Type = "oneshot"
RemainAfterExit = "yes"
RuntimeDirectory = "mios"
RuntimeDirectoryMode = "0755"
ExecStart = '''/usr/bin/bash -c ' \
  set +e; \
  HAS_NV=0; HAS_AMD=0; HAS_INTEL=0; \
  [ -e /dev/nvidia0 ]            && HAS_NV=1; \
  [ -e /dev/kfd ]                && HAS_AMD=1; \
  [ -e /dev/dri/renderD128 ]     && HAS_INTEL=1; \
  VIRT=$(systemd-detect-virt || echo none); \
  # /run/mios, /run/cdi, /var/lib/mios/gpu declared in usr/lib/tmpfiles.d/mios-gpu.conf (LAW 2). \
  { \
    echo "timestamp=$(date -Is)"; \
    echo "virtualization=${VIRT}"; \
    echo "nvidia=${HAS_NV}"; \
    echo "amd=${HAS_AMD}"; \
    echo "intel=${HAS_INTEL}"; \
    lspci -nn 2>/dev/null | grep -iE "vga|3d|display" || true; \
  } > /run/mios/gpu-passthrough.status; \
  # Non-persistent (in-memory) SELinux boolean -- build-time semanage handles \
  # persistence; this guarantees the boolean is on even if the policy merge \
  # dropped it. No-op on permissive / disabled / missing boolean. \
  if command -v setsebool >/dev/null 2>&1; then \
    setsebool container_use_devices on 2>/dev/null || true; \
  fi; \
  exit 0\''''
StandardOutput = "journal"
StandardError = "journal"

[units."mios-gpu-status.service".Install]
WantedBy = "multi-user.target"


[units."mios-ai-firstboot.service".Unit]
comment = "# AI-hint: Systemd unit that executes the mios-ai-firstboot script to provision the AI agent virtual environment and download llama.cpp GGUF models if the .ai-firstboot-done sentinel is missing.\n# AI-related: 72-hermes-agent.sh, /usr/libexec/mios/mios-ai-firstboot, mios-ai-firstboot, mios-dev, mios-llm-light.service, network-online.target\n# Completes the build-time AI setup on deployments that didn't bake it (the\n# overlay-provisioned dev VM, WSL imports, etc.). 72-hermes-agent.sh's header\n# explicitly anticipates this: \"a firstboot retry can complete it later\".\n# Needs network (pip + model pull); GGUF blobs come from Hugging Face."
Description = "'MiOS' AI first-boot provisioning (agent venv + llama.cpp GGUFs)"
Documentation = "https://github.com/mios-dev/mios"
After = "network-online.target mios-pgvector.service"
Wants = "network-online.target mios-pgvector.service"
comment2 = "# The script writes the sentinel ONLY when both the venv and the GGUFs are\n# present, so a network-less first boot simply retries on the next one."
ConditionPathExists = "!/var/lib/mios/.ai-firstboot-done"
comment3 = "# Retry is owned by mios-ai-firstboot.timer (OnBootSec + OnUnitInactiveSec), NOT\n# an in-unit Restart=on-failure / StartLimitBurst storm. The script degrades open\n# (exit 0) on a partial provision, so the unit shows success and the timer simply\n# re-fires it on its cadence until the sentinel above is written."

[units."mios-ai-firstboot.service".Service]
Type = "oneshot"
RemainAfterExit = "yes"
comment = "# Cap a hung fetch (multi-GB model download) at 10min so it can't wedge the unit\n# forever; the timer re-fires the run afterwards. (Was 2400s.)"
TimeoutStartSec = "1800"
EnvironmentFile = "-/etc/mios/install.env"
ExecStart = "/usr/libexec/mios/mios-ai-firstboot"

[units."mios-ai-firstboot.service".Install]
WantedBy = "multi-user.target"


[units."mios-hermes-firstboot.service".Unit]
Description = "'MiOS' Hermes-Agent first-boot config + key generation"
Documentation = "https://github.com/mios-dev/MiOS"
After = "local-fs.target systemd-tmpfiles-setup.service"
Before = "mios-agent-pipe.service multi-user.target"

[units."mios-hermes-firstboot.service".Service]
Type = "oneshot"
RemainAfterExit = "yes"
EnvironmentFile = "-/etc/mios/install.env"
ExecStart = "/usr/libexec/mios/mios-hermes-firstboot"

[units."mios-hermes-firstboot.service".Install]
WantedBy = "multi-user.target"


[units."mios-forge-firstboot.service".Unit]
comment = "# AI-hint: Executes the forge-firstboot.sh script to bootstrap the Forgejo instance, creating the initial admin user and repository credentials required for the MiOS self-replication and CI runner integration.\n# AI-related: /etc/mios/install.env, /usr/libexec/mios/forge-firstboot.sh, mios-forge.service, mios-forgejo-runner.service\n# /etc/mios/install.env is the optional layered-TOML resolver output\n# from mios-sync-env. The firstboot script tolerates its absence:\n# admin user, email, password all resolve from MIOS_DEFAULT_* or\n# fall back to \"mios\" / mios@hostname.local. Keep the unit gated only\n# by the firstboot sentinel."
Description = "'MiOS' Forge first-boot admin-bootstrap (Forgejo)"
Documentation = "https://github.com/mios-dev/MiOS/blob/main/etc/containers/systemd/mios-forge.container"
After = "mios-forge.service network-online.target"
Wants = "mios-forge.service network-online.target"
ConditionPathExists = "!/var/lib/mios/forge/.firstboot-done"
comment2 = "# Forgejo bootstrap MUST run on WSL too (the localhost:3000 git origin\n# is the heart of the MiOS self-replication loop on every shape). A\n# plain `!container` would skip WSL because systemd reports virtualization\n# as `wsl` -- a container variant. Use OR: \"not a container OR is WSL\"."
ConditionVirtualization = ["|!container", "|wsl"]
StartLimitIntervalSec = "1200"
StartLimitBurst = "6"

[units."mios-forge-firstboot.service".Service]
Type = "oneshot"
RemainAfterExit = "yes"
EnvironmentFile = "-/etc/mios/install.env"
ExecStart = "/usr/libexec/mios/forge-firstboot.sh"
TimeoutStartSec = "600s"
Restart = "on-failure"
RestartSec = "30"
NoNewPrivileges = "yes"
ProtectSystem = "strict"
ProtectHome = "yes"
ReadWritePaths = "/etc/mios/forge /var/lib/mios/forge /var/log/mios/forge /var/lib/containers /run"
PrivateTmp = "yes"
LockPersonality = "yes"
RestrictRealtime = "yes"

[units."mios-forge-firstboot.service".Install]
WantedBy = "multi-user.target"


[units."mios-adguard-firstboot.service".Unit]
comment = "# AI-hint: Systemd unit that executes /usr/libexec/mios/mios-adguard-firstboot to generate the AdGuardHome.yaml config from mios.toml, injecting Tailscale IPs before the AdGuard container starts.\n# AI-related: /usr/libexec/mios/mios-adguard-firstboot, /etc/mios/adguard/AdGuardHome.yaml, tailscaled.service, mios-adguard.service, network-online.target\n# /usr/lib/systemd/system/mios-adguard-firstboot.service\n# Generates /etc/mios/adguard/AdGuardHome.yaml from mios.toml [adguard]/[ports]\n# + the live Tailscale IP/MagicDNS suffix, BEFORE the AdGuard container starts.\n# Idempotent + non-destructive (skips if the config already exists), so it is\n# safe to leave enabled across boots. mios-adguard.container Requires= + After=\n# this unit, so it is pulled in automatically; it is also enabled directly for\n# fresh installs."
Description = "'MiOS' AdGuard Home first-boot config generator"
After = "network-online.target tailscaled.service"
Wants = "network-online.target"
Before = "mios-adguard.service"
ConditionPathExists = "/usr/libexec/mios/mios-adguard-firstboot"

[units."mios-adguard-firstboot.service".Service]
Type = "oneshot"
RemainAfterExit = "yes"
ExecStart = "/usr/libexec/mios/mios-adguard-firstboot"

[units."mios-adguard-firstboot.service".Install]
WantedBy = "multi-user.target"


[units."mios-models-firstboot.service".Unit]
