[variants.entries.mios-metal]
title     = "MiOS-Metal"
summary   = "the metal-owning firmware: a small headless bootc hypervisor-router that binds the GPUs and NICs and hosts MiOS as a guest"
target    = "bare metal, headless"
config    = ["metal"]
