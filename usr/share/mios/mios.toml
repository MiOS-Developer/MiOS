introduction = "Choose a head CLI. Use MiOS-MCP and tmux-mcp to coordinate visible workers."
selection_hint = "Client number/name; n/p: pages; q: close."
navigation_hint = "Ctrl-b w: choose windows/panes; arrows: expand tree. Ctrl-b z: zoom. Ctrl-b o: next pane. Ctrl-b g: live agents."
navigation_hint_compact = "Ctrl-b o: agent; f: compact/auto; w: panes; z: zoom."

[mcp.tmux.assets.x86_64]
path = "usr/share/mios/vendored/tmux-mcp/tmux-mcp_linux_amd64.tar.gz"
sha256 = "44e8f5749e98230b87585b60131d2116ae00d8e8ceb57348a84b6c8dfd93cd20"

[mcp.tmux.assets.aarch64]
