  "check_pod_quadlets",
  # Python lint: requires flake8/black static analyzer toolchain.
  "check_python_lint",
  # Raw TOML readers: requires raw TOML reader prohibition scanner.
  "check_raw_toml_readers",
  # RBAC tiers: requires role-based access control definition tree.
  "check_rbac_tiers",
  # Resolver twin parity: requires dual-resolver parity validator.
