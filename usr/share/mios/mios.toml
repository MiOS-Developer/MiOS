head_agent = ""                # empty opens the client chooser; NAME bypasses it
worker_panes = 4
# Golden ratio: the head's share (38.2%) of EVERY head/monitor split -- this
# workspace and the Windows Terminal monitor ([terminal.monitor]). The monitor
