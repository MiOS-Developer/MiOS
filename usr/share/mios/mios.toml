  "automation/lib/globals.sh",
  "automation/lib/globals.ps1",
  "tools/native/mios-unit-gen/tests/golden/**",
  "tools/test_*.py",
  "**/*.generated.*",
  "usr/share/mios/names.generated.txt",
]

# READONLY: these strings are sent to a model. Copy them into docs, never edit,
# reformat or prune them -- editing the text changes model behaviour.
