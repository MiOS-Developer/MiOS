[security.powershell_signing]
# Certificate PATH or thumbprint only. There is deliberately no password key
# here: mios.toml is committed, so a signing secret in SSOT is a leaked secret.
# tools/sign-powershell.ps1 takes -CertPassword as a SecureString, or prompts.
signing_cert = ""

[repos.external.hyprland]
enabled = true
