install_env         = "/etc/mios/install.env"
profile_toml_vendor = "/usr/share/mios/profile.toml"
profile_toml_host   = "/etc/mios/profile.toml"
wsl_firstboot_done  = "/var/lib/mios/.wsl-firstboot-done"
mios_toml           = "/usr/share/mios/mios.toml"   # this file's vendor path

usr_dir                  = "/usr/lib/mios"
libexec_dir              = "/usr/libexec/mios"
share_dir                = "/usr/share/mios"
share_ai_dir             = "${MIOS_SHARE_DIR}/ai"
share_distrobox_dir      = "${MIOS_SHARE_DIR}/distrobox"
share_branding_dir       = "${MIOS_SHARE_DIR}/branding"
share_fastfetch_dir      = "${MIOS_SHARE_DIR}/fastfetch"
share_kb_dir             = "${MIOS_SHARE_DIR}/kb"
share_configurator_dir   = "${MIOS_SHARE_DIR}/configurator"
share_k3s_manifests_dir  = "${MIOS_SHARE_DIR}/k3s-manifests"
etc_dir                  = "/etc/mios"
etc_ai_dir               = "${MIOS_ETC_DIR}/ai"
etc_forge_dir            = "${MIOS_ETC_DIR}/forge"
etc_envd_dir             = "${MIOS_ETC_DIR}/env.d"
var_dir                  = "/var/lib/mios"
var_ai_dir               = "${MIOS_VAR_DIR}/ai"
var_mcp_dir              = "${MIOS_VAR_DIR}/mcp"
var_backups_dir          = "${MIOS_VAR_DIR}/backups"
var_cache_dir            = "${MIOS_VAR_DIR}/cache"
srv_ai_dir               = "/srv/ai"
srv_ai_models_dir        = "${MIOS_SRV_AI_DIR}/models"
srv_ai_outputs_dir       = "${MIOS_SRV_AI_DIR}/outputs"
srv_ai_collections_dir   = "${MIOS_SRV_AI_DIR}/collections"
srv_ai_mcp_dir           = "${MIOS_SRV_AI_DIR}/mcp"
toml_vendor              = "${MIOS_SHARE_DIR}/mios.toml"
toml_host                = "${MIOS_ETC_DIR}/mios.toml"
firstboot_sentinel       = "${MIOS_VAR_DIR}/.wsl-firstboot-done"
ai_system_prompt         = "${MIOS_SHARE_AI_DIR}/system.md"
mcp_registry             = "${MIOS_SHARE_AI_DIR}/v1/mcp.json"

coderun_workspace_root = "/var/home/mios/coderuns"          # podman coderun-sandbox /work bind root (shared by code_mode + coderun-session)
coderun_snapshots_root = "/var/home/mios/.coderun-snapshots" # coderun-session snapshot root
codemode_workspace_root = "/var/lib/mios/codemode"          # WS-2 Code Mode generated-snippet root (uid 828, tmpfiles mios-codemode.conf)


# Voidtools Everything CLI -- probed in order; first match wins. WSL
# paths so MiOS helpers can exec via interop.
everything_cli = [
    "/mnt/m/Programs/Everything/es.exe",
    "/mnt/c/Program Files/Everything/es.exe",
    "/mnt/c/Program Files (x86)/Everything/es.exe",
    "/mnt/c/Tools/Everything/es.exe",
    "/mnt/c/Users/mios/AppData/Local/Programs/Everything/es.exe",
]
