# ----------------------------------------------------------------------------
# [templates] -- global template schema configurations.
# ----------------------------------------------------------------------------
[templates.adr]
match = "^usr/share/doc/mios/adr/\\d{4}-.*\\.md$"
comment = "md"
required_header = true
required_markers = ["## Status", "## Context", "## Decision", "## Rationale", "## Consequences"]
generated = false
scaffold = true
dest_dir = "usr/share/doc/mios/adr"
# name_prefix on a SEQUENTIAL type is an ordinal seed, not a literal: it supplies
# the zero-pad width and the first number ever allocated. name_ordinal_next tells
# the scaffolder to allocate the next FREE ordinal by scanning dest_dir, so two
# ADRs scaffolded in a row cannot collide on the same number.
name_prefix = "0001-"
name_ordinal_next = true
name_suffix = ".md"
emit = "file"

[templates.drift-check]
match = "^automation/98-drift-checks\\.sh$"
comment = "hash"
required_header = true
