[build.quadlet_render]
# File extensions automation/34-render-quadlets.sh substitutes ${MIOS_*} in.
# SSOT because the renderer and check_render_extension_coverage must agree:
# `.socket` was absent, so usr/lib/systemd/system/mios-cockpit-link.socket
# shipped `ListenStream=0.0.0.0:${MIOS_PORTS_COCKPIT_LINK}` (task_977).
extensions = [
  "container", "network", "volume", "pod", "image", "build",
  "toml", "json", "conf", "service", "socket",
]
# Trees the renderer walks. Hardcoded in bash AND again in miosd before task_977.
dirs = [
  "/etc/containers/systemd",
  "/etc/containers/systemd/users",
  "/usr/share/containers/systemd",
  "/usr/share/containers/systemd/users",
  "/etc/mios",
  "/usr/share/mios/kb",
  "/usr/lib/systemd/system/cockpit.socket.d",
  "/usr/lib/systemd/system",
  # Walked for the ${VAR:-...} survivor check even without placeholders (task_3427).
  "/usr/lib/systemd/user",
  "/etc/systemd/system",
  "/etc/systemd/user",
]
# Matches the bash `find -maxdepth 2`; miosd's read_dir was depth 1 and missed users/.
max_depth = 2
# Directives whose BARE ${VAR} systemd resolves at runtime from the unit's own
# Environment=/EnvironmentFile=. The `:-` form is never protected: systemd calls
# replace_env_full with flags=0 and does no replacement, so it must be baked.
runtime_ref_directives = [
  "ExecStart", "ExecStartPre", "ExecStartPost",
  "ExecStop", "ExecStopPost", "ExecReload", "ExecCondition",
]

[build.toolchain]
# The toolchain both workspaces build and lint with (task_996).
# Projected into the root rust-toolchain.toml; rustup finds it by ascent.
# A channel, never a version number: CI and every workstation track the same
# current stable, so they still agree, and nothing freezes on an old release.
channel = "stable"
components = ["clippy", "rustfmt"]
# Where every MiOS image keeps that toolchain, so it can rebuild its own native
# catalog: the channel, components and [build.native.linux] target with its
# linker, provisioned by `automation/55-native-build.sh --toolchain` in the image
# build. Under /usr because /var and /usr/local reset on an ostree image.
# etc/profile.d/mios-env.sh exports RUSTUP_HOME and puts the rustup proxies in
# cargo_home/bin first on PATH; CARGO_HOME itself stays per user (~/.cargo), so
# registry downloads never need a writable /usr.
rustup_home = "/usr/lib/mios/rustup"
cargo_home = "/usr/lib/mios/cargo"

# One native entry point for current-source builds on every builder platform.
[build.images]
engine = "podman"
order = ["os", "devcontainer"]
network = "host"
retries = 5
retry_delay = "3s"

[build.images.os]
containerfile = "Containerfile"
tag_key = "image.local_tag"
build_args = { BASE_IMAGE = "image.base" }

# The dev container is the OS image plus container wiring: it layers on the
# image this run has just built, never on a registry copy of an older one.
# A build argument naming a target carries that target's tag, so the os
# target's tag_key is declared once and followed here.
[build.images.devcontainer]
containerfile = ".devcontainer/Containerfile"
tag_key = "image.dev_local_tag"
build_args = { MIOS_IMAGE_REF = "build.images.os" }

# Native executable roles are distinct; libraries remain shared workspace code.
# Category membership and installation are consumed by miosd native-targets.
[build.native]
workspaces = ["tools/native", "src/mios-rs"]
windows_only = ["mios-launch", "mios-wallpaperd"]
# Shared generators, gates, CLIs and services must produce verified static releases on both platforms.
windows_shared = [
  "generate-names-registry",
  "mios-ai-config",
  "mios-aiplane-lint",
  "mios-bake-plan",
  "mios-browser",
  "mios-comment-lex",
  "mios-drift-runner",
  "mios-edge-status",
  "mios-hardcode-lint",
  "mios-render-quadlets",
  "mios-resolver",
  "mios-size-ceiling",
  "mios-ssot-lint",
  "mios-task",
  "mios-toml-get",
  "mios-template-compile",
  "mios-template-conform",
  "mios-toolchain-pin",
  "mios-unit-gen",
  "mios-version-check",
  "xtask",
  "mios-gate",
  "mios-probe",
  "miosd",
  "mios-install",
  "mios-gen",
  "mios-agent-relay",
  "mios-node",
]

[build.native.linux]
jobs = 2
targets = { x86_64 = "x86_64-unknown-linux-musl", aarch64 = "aarch64-unknown-linux-musl" }
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static"]
# Required ELF shape per target: true demands a static-pie (ET_DYN + DF_1_PIE,
# so ASLR covers the image). x86_64-unknown-linux-musl links static-pie with
# +crt-static since Rust 1.46 (rust-lang/rust#70740). aarch64-unknown-linux-musl
# has no static-pie support upstream as of 1.99 (#158510 enabled gnu only), so
# it links a non-PIE static executable; flip it when upstream does.
pie = { x86_64 = true, aarch64 = false }

[build.native.windows]
# MSVC links the WebView2 loader statically; GNU imports WebView2Loader.dll.
target = "x86_64-pc-windows-msvc"
linker = "lld-link"
driver = "cargo-xwin"
driver_version = "0.3.0"
rustflags = ["-C", "target-feature=+crt-static"]
# OS imports are permitted; external compiler and runtime DLLs are rejected.
system_dlls = [
  "kernel32.dll", "ntdll.dll", "bcrypt.dll", "advapi32.dll", "user32.dll",
  "gdi32.dll", "dwmapi.dll", "ole32.dll", "oleaut32.dll", "shell32.dll",
  "shlwapi.dll", "comctl32.dll", "comdlg32.dll", "ws2_32.dll", "userenv.dll",
  "iphlpapi.dll", "secur32.dll", "crypt32.dll", "winmm.dll", "version.dll",
  "uxtheme.dll", "windowscodecs.dll", "dwrite.dll", "dxgi.dll", "d2d1.dll",
  "d3d11.dll", "propsys.dll", "msvcrt.dll", "ucrtbase.dll",
  # Windows synchronization API contract and OS cryptographic primitives.
  # https://learn.microsoft.com/windows/win32/apiindex/windows-apisets
  "api-ms-win-core-synch-l1-2-0.dll", "bcryptprimitives.dll",
  # Windows session notifications: learn.microsoft.com/windows/win32/api/wtsapi32/
  "wtsapi32.dll",
]

[build.native.categories.cli]
binaries = [
  "generate-names-registry", "mios-ai-config", "mios-aiplane-lint", "mios-bake-plan",
  "mios-browser", "mios-comment-lex", "mios-drift-runner", "mios-edge-status", "mios-hardcode-lint", "mios-render-quadlets",
  "mios-resolver", "mios-size-ceiling", "mios-ssot-lint", "mios-task", "mios-toml-get",
  "mios-template-compile", "mios-template-conform", "mios-toolchain-pin",
  "mios-unit-gen", "mios-version-check", "xtask", "mios-gate", "mios-probe", "miosd",
  "mios-install", "mios-gen",
]
install_dir = "/usr/bin"
expose_bin = false
compat_dirs = ["/usr/libexec/mios"]

[build.native.categories.apps]
# Native Windows terminal launcher; Linux uses /usr/bin/mios terminal.
binaries = ["mios-launch"]
install_dir = "/usr/bin"
expose_bin = false
compat_dirs = []

[build.native.categories.services]
# Service-facing programs; systemd Type= independently defines their lifecycle.
binaries = ["mios-agent-relay"]
install_dir = "/usr/libexec/mios"
expose_bin = false
compat_dirs = []

[build.native.categories.daemons]
binaries = ["mios-node", "mios-wallpaperd"]
install_dir = "/usr/libexec/mios"
expose_bin = true
compat_dirs = []

[build.tool_dispatch]
# Bake-time tool-dispatch gates whose lookup cannot resolve. Shrink-only: task_962.
max_unreachable = 0
unreachable = []

[ai_tag]
# Shrink-only, and set to the measured count so the next untagged file
# fails the gate. At 130 against an actual 42 it had 88 files of slack
# and could not catch a regression until 88 files had degraded.
# Header-free prompts, fixtures, vendored files and generated artifacts are
# excluded by the native classifier. The remaining taggable source census
# leaves one untagged file; the check fails above AND below this number.
max_untagged = 1
max_unconforming = 0

# Hint length cap. Was hardcoded 260 in mios-ai-tag, where it also silently
# TRUNCATED hand-written hints on every re-tag. Raised so a re-tag is lossless;
# ratcheted down once the over-cap hints have been shortened deliberately.
hint_max_chars = 260
# Teacher lane for generating a hint when a file has none. The former defaults
# were port 8450 (SSOT says 8500) and model gemma4:12b, which is not in
# [ai].available_models -- so the lane could never have worked.
teacher_port_key = "llm_light"
teacher_model = "granite4.1:3b"

[selfimprove]
sample_size    = 500     # most-recent tool_call rows to analyze
min_samples    = 5       # don't judge a tool with fewer calls (no over-reaction)
fail_threshold = 0.3     # tools failing >= this fraction are flagged
slow_ms        = 10000   # tools averaging >= this many ms are flagged slow
# interval_min: how often the agent proactively runs the analyzer and SURFACES
# new high/medium findings to the log (picked up by the daemon-agent + visible in
# journalctl) -- the "loop closure" in the observe->surface sense. 0 (default) =
# off, no background task (byte-identical hot path). It only SURFACES; auto-
# remediation (self-modification) is a separate, guardrail-gated step.
interval_min   = 0

act_enabled    = false   # master switch for the ACT (propose->prove->queue) loop
# Proof-of-utility accept criterion (Autodata accept-if-non-regressing, 126/233):
# accept iff the proposed variant's pass^k does not regress the baseline by more than
# accept_margin (0 = strict >=); require_improvement additionally demands a strict
# improvement (delta > 0) where a discriminative eval applies. passhat_k = the k for
# the pass^k reliability score (the same worst-case metric the skill gate uses).
accept_margin       = 0.0   # max tolerated score regression (proposed >= baseline - margin)
require_improvement = false # also require a strict improvement (proposed > baseline)
passhat_k           = 2     # k for pass^k over the held-out eval
# Solver-gap (Autodata discriminative signal): an eval task carries signal ONLY when
# the strong solver beats the weak one by >= solver_gap_min; trivial (both pass) and
# impossible (both fail) tasks are dropped. The weak/strong pair is the light/heavy
# LANE pair, named here by lane key and resolved from the live lane registry at
# dispatch -- NOT a model id baked in code.
solver_gap_min  = 0.2      # min strong-weak pass-rate gap for a task to count as eval signal
weak_solver     = "light"  # lane key of the weak solver (the everyday light lane)
strong_solver   = "heavy"  # lane key of the strong solver (the heavy/council lane)
improvable_targets = ["prompt", "skill", "config"]
protected_targets  = ["evaluator", "eval_data", "lane_config", "selfimprove"]
max_proposals_per_pass = 3   # cap proposals drafted per loop pass (bounded change)

[portal]
# Externally-reachable name for the portal's service tiles (e.g. a Tailscale
# MagicDNS name whose HTTPS cert `tailscale serve` binds to). EMPTY by default:
# the vendor image bakes NO specific host -> agent-pipe degrades to this
# machine's own hostname. Set to YOUR public name to link tiles to it.
public_host = ""
require_login = true     # false ONLY if a reverse proxy already authenticates
user          = ""       # empty = inherits [identity].username
password      = ""       # empty = inherits [identity].default_password
session_ttl   = 604800   # signed-cookie lifetime in seconds (default 7 days)
session_kdf_iterations = 600000  # PBKDF2-HMAC-SHA-256; minimum 600000, derived once per worker
# secret: empty = derive the cookie-HMAC key from the password (so rotating the
# password or KDF work factor invalidates live sessions). Set a stable value
# to keep sessions alive across password changes. The PBKDF2 upgrade requires
# one new login for password-derived sessions; explicit secrets are unchanged.
secret        = ""

discord_channel_default = ""
discord_guild_default   = ""
# Largest POST /portal/config body the configurator save accepts. The whole
# layered config is posted back, so this must exceed its serialized size.
config_max_body_bytes   = 2097152

# ----------------------------------------------------------------------------
# [locale] -- system-wide defaults applied via systemd-localed at first boot.
# Maps to MIOS_LOCALE_TIMEZONE, MIOS_LOCALE_KEYBOARD_LAYOUT, MIOS_LOCALE_LANGUAGE.
# ----------------------------------------------------------------------------
[locale]
timezone        = "UTC"
keyboard_layout = "us"
language        = "en_US.UTF-8"

[auth]
ssh_key_type     = "ed25519"
ssh_key_action   = "generate"
existing_ssh_key = ""
password_policy  = "plain"
password          = "mios"      # SSOT: dashboard advertises this; cockpit PAM uses it
password_hash    = ""           # only when password_policy = "hashed"
luks_passphrase  = ""           # never tracked; FHS installer + LUKS only
github_pat       = ""           # never tracked; configures git credential helper

# ----------------------------------------------------------------------------
# [network] -- firewalld posture.
# Defaults match SECURITY.md (default zone "drop", ssh + cockpit allowed).
# ----------------------------------------------------------------------------
[network]
loopback               = "127.0.0.1"
bind_all               = "0.0.0.0"
win_tailscale_ip       = "100.79.3.50"
firewalld_default_zone = "drop"
allow_ssh              = true
allow_cockpit          = true   # opens 9090/tcp
allow_libvirt_bridge   = true   # for VM networking

# Declarative nftables container micro-segmentation matrix (task_423)
[network.firewall.container_matrix]
default_policy = "drop"
rules = [
    { source = "open_webui", destination = "agent_pipe", port = 8700, protocol = "tcp" },
    { source = "agent_pipe", destination = "hermes", port = 8720, protocol = "tcp" },
    { source = "agent_pipe", destination = "pgvector", port = 5432, protocol = "tcp" },
    { source = "agent_pipe", destination = "llm_light", port = 8500, protocol = "tcp" },
    { source = "hermes", destination = "searxng", port = 8800, protocol = "tcp" },
    { source = "hermes", destination = "pgvector", port = 5432, protocol = "tcp" },
    { source = "forge_runner", destination = "forge", port = 8400, protocol = "tcp" },
]

# NTP servers configuration (Chrony)
[network.ntp]
servers = [
    "0.pool.ntp.org",
    "1.pool.ntp.org",
    "2.pool.ntp.org",
    "3.pool.ntp.org",
]

# Dedicated Out-of-Band IP-KVM management mesh (task_468)
[management_mesh]
subnet      = "10.200.0.0/16"
interface   = "wg-ipkvm"
listen_port = 51821
backends    = ["pikvm", "redfish", "openbmc"]
mtu         = 1420

# UPS configuration (Network UPS Tools)
# Set name = "" to disable NUT (boots inert)
[power.ups]
name   = ""
driver = "usbhid-ups"
port   = "auto"
desc   = "MiOS Uninterruptible Power Supply"

# MiOS-Metal GPU arbitration and guest assignment (WS-F5)
[metal.gpu]
# Rule: Each GPU (PCI/IOMMU address) must be assigned to exactly one owner/guest.
# Forbid assigning the same PCI address to multiple active guests to prevent hardware conflicts.
assignments = { mios-guest = ["0000:01:00.0"] }
arbitration = "static"   # GPU arbitration model: "static" (pre-bind at boot), "dynamic" (libvirt hotplug/detach)

[meta]
schema_version = "1.1.0"
mios_version   = "0.3.0"
format         = "toml"
# Spec for the on-disk format -- TOML 1.0.0 (https://toml.io/en/v1.0.0).
# Editor: /usr/share/mios/configurator/mios.html (static, runs from
# file:// or behind any HTTP server) reads + writes this file via a
# round-trip parser; no installation required.
spec_url       = "https://toml.io/en/v1.0.0"
editor_url     = "/usr/share/mios/configurator/mios.html"

[verbs]
# Each entry: name = { description = "<help text>", surface = "<windows|dev_vm|both>" }
#   windows -- runs in the Windows pwsh host
