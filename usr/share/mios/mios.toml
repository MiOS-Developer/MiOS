[units."hermes-worker.service".Unit]
Description = "'MiOS' Hermes-Worker (non-thin agent, native tool loop, :8643)"
Documentation = "https://github.com/NousResearch/hermes-agent"
comment2 = "# R8: dropped After=mios-ai-firstboot.service -- the worker rides the venv + its own\n# provisioner (hermes-worker-firstboot) + the inference lanes, NOT the boot-time\n# GGUF/vLLM fetch owned by mios-ai-firstboot."
After = "network-online.target mios-llm-heavy.service mios-llm-light.service hermes-worker-firstboot.service"
Wants = "network-online.target mios-llm-heavy.service mios-llm-light.service hermes-worker-firstboot.service"
comment3 = "# Skip cleanly if the direct install didn't land."
ConditionPathExists = "/usr/lib/mios/agents/.venv/bin/hermes"

[units."hermes-worker.service".Service]
Type = "simple"
User = "mios-ai"
Group = "mios-ai"
comment = "# SEPARATE HERMES_HOME + HOME => fully isolated pid/lock/state/DBs/config AND a\n# distinct $HOME/XDG so the discord scope-lock dir (derived from $HOME) can\n# never collide with the :8642 gateway's. Discord is off here regardless."
Environment = [
  "HOME=/var/lib/mios/hermes-worker",
  "HERMES_HOME=/var/lib/mios/hermes-worker",
  "SEARXNG_URL=http://localhost:${MIOS_PORTS_SEARXNG}",
  "MIOS_CRAWL_SERVICE_URL=http://127.0.0.1:${MIOS_PORTS_CRAWL4AI}",
  "FIRECRAWL_API_URL=http://127.0.0.1:${MIOS_PORTS_FIRECRAWL}",
  "PORT=${MIOS_PORTS_HERMES}",
  "API_SERVER_PORT=${MIOS_PORTS_HERMES}",
  "HERMES_BACKEND_BASE_URL=http://localhost:${MIOS_PORTS_LLM_HEAVY}",
  "HERMES_MAX_TOKENS=8192",
  "BROWSER_CDP_URL=http://localhost:${MIOS_PORTS_CHROME_CDP_WORKER:-9223}",
]
EnvironmentFile = ["-/etc/mios/install.env", "-/etc/mios/hermes/api.env"]
ExecStartPre = [
  "+/usr/bin/install -d -o mios-ai -g mios-ai -m 0700 /var/lib/mios/hermes-worker",
  "-/usr/bin/python3 /usr/libexec/mios/mios-hermes-discord-reactions-patch /usr/lib/mios/agents/.venv/lib/python3.14/site-packages/gateway/platforms/discord.py",
  "-+/usr/libexec/mios/mios-hermes-dashboard-auth-stub",
]
ExecStart = "/usr/lib/mios/agents/.venv/bin/hermes gateway run"
Restart = "on-failure"
RestartSec = "10s"
TimeoutStartSec = "300s"
TimeoutStopSec = "240s"
LimitNOFILE = "1048576"
ProtectSystem = "strict"
ReadWritePaths = "/etc/mios /var/lib/mios /run/mios-launcher"
ProtectHome = "false"
NoNewPrivileges = "false"
PrivateTmp = "yes"

[units."hermes-worker.service".Install]
WantedBy = "multi-user.target"


[units."mios-agent-pipe.service".Unit]
comment = "# AI-hint: Systemd unit defining the agent-pipe FastAPI service which acts as a router, refiner, and critic for the Hermes gateway, routing inference requests to the llama.cpp light lane (mios-llm-light); the lane port is the single SSOT key [ports].llm_light (MIOS_PORTS_LLM_LIGHT), composed in server.py via _LIGHT_BASE.\n# AI-related: /usr/lib/mios/agent-pipe/server.py, /etc/mios/install.env, /etc/mios/agent-pipe.env, mios-pgvector, mios-passport-provision, mios-ai, mios-hermes"
Description = "'MiOS' Agent Pipe (router + refine + critic FastAPI; fronts hermes for every gateway)"
Documentation = "file:///usr/lib/mios/agent-pipe/server.py"
comment2 = "# R8: NOT ordered After=mios-ai-firstboot.service. The plane needs the VENV (baked\n# into the image) + pgvector, NOT the boot-time model fetch; ordering behind\n# firstboot's multi-GB download blocked the router for the whole download. firstboot\n# `systemctl restart --no-block`s this unit once models land, so the edge is redundant."
After = "network-online.target mios-pgvector.service mios-passport-provision.service"
Wants = "network-online.target mios-passport-provision.service"
comment3 = "# R6: the pipe touches pgvector on every route, so upgrade the DB edge from After=\n# (ordering only) to a hard Requires= -- a missing DB should hold/fail the unit."
Requires = "mios-pgvector.service"
comment4 = "# R6: bound the existing Restart=on-failure so a DB-down window (many quick\n# restarts) can't trip the default 5/10s start limit and land permanently failed."
StartLimitIntervalSec = "300"
StartLimitBurst = "5"
comment5 = "# The venv python is baked into the FINAL image, but on the podman-MiOS-DEV substrate it is\n# built at first boot by mios-ai-firstboot. Skip (rather than 203/EXEC-fail) until it exists."
ConditionPathExists = "/usr/lib/mios/agents/.venv/bin/python3"

[units."mios-agent-pipe.service".Service]
Type = "simple"
User = "mios-ai"
Group = "mios-ai"
SupplementaryGroups = "mios-hermes"
WorkingDirectory = "/var/lib/mios/agent-pipe"
EnvironmentFile = ["-/etc/mios/agent-pipe.env", "-/etc/mios/install.env"]
Environment = [
  "MIOS_PORTS_AGENT_PIPE=${MIOS_PORTS_AGENT_PIPE}",
  "MIOS_AGENT_PIPE_BACKEND_LIGHT=1",
  "MIOS_AI_MODEL=granite4.1:8b",
  "MIOS_NO_TOOL_CHOICE_HINTS=11436",
  "MIOS_KV_PAGING_HINTS=11436,11450",
  "MIOS_LLM_API_HINTS=",
  "MIOS_REFINE_TIMEOUT_SECONDS=45",
  "MIOS_POLISH_TIMEOUT_SECONDS=45",
  "MIOS_REFINE_MAX_TOKENS=1200",
  "MIOS_AGENT_MEMORY_RECALL=1",
  "MIOS_PASSPORT_AGENT_NAME=agent-pipe",
]
ExecStart = "/usr/lib/mios/agents/.venv/bin/python3 -u /usr/lib/mios/agent-pipe/server.py"
Restart = "on-failure"
RestartSec = "5s"
TimeoutStartSec = "60s"
NoNewPrivileges = "yes"
PrivateTmp = "yes"
ProtectSystem = "strict"
ProtectHome = "yes"
ReadWritePaths = "/var/lib/mios/agent-pipe /var/lib/mios/skills /var/log /var/lib/mios/agent-env /var/lib/mios/ai"
ReadOnlyPaths = "/var/lib/mios/agent-passports"

[units."mios-agent-pipe.service".Install]
WantedBy = "multi-user.target"


[units."mios-agents.service".Unit]
comment = "# AI-hint: Runs the mios-agents A2O super-container (code-server IDE + tmux war room + Claude CLI + agy/Gemini + the mios-a2o muxer) as a systemd-managed container. ExecStartPre builds the local image if absent; ExecStart runs it every boot on the code-server port MIOS_PORTS_CODE_SERVER (mios-agents REPLACES the retired mios-code-server -- one IDE, no duplicate service).\n# AI-related: /usr/share/mios/agents/Containerfile, /usr/share/mios/agents/mios-a2o, /usr/libexec/mios/mios-agents-firstboot.sh, /etc/mios/install.env, /var/lib/mios/agents\n# /usr/lib/systemd/system/mios-agents.service"
Description = "'MiOS' A2O agents super-container (Claude + agy/Gemini + tmux war room + code-server)"
Documentation = "https://github.com/mios-dev/MiOS/blob/main/usr/share/mios/agents/ACTIVATION.md"
After = "network-online.target podman.socket"
Wants = "network-online.target"
ConditionPathExists = "/usr/share/mios/agents/Containerfile"

[units."mios-agents.service".Service]
Type = "simple"
comment = "# systemd does NOT expand bash ${VAR:-default} in ExecStart -- it resolves to\n# empty (code-server then dies \"Invalid URL\"). Set the defaults here; install.env\n# (the mios.toml -> env SSOT bridge) overrides them when present. ExecStart uses\n# plain ${VAR}."
Environment = [
  "MIOS_PORTS_CODE_SERVER=${MIOS_PORTS_CODE_SERVER:-8900}",
  "MIOS_IDENTITY_DEFAULT_PASSWORD=mios",
  # Law 10 keeps these four out of install.env -- a space, parentheses or a
  # {} placeholder, or an empty value the resolver drops -- while ExecStart
  # references each BARE, which the renderer leaves for systemd to expand.
  # Without a supply here systemd expanded all four to the empty string
  # (task_3362). `mios-gate protected-refs` fails the build on the general case.
  "\"MIOS_FRONTIER_LANE_B_MODEL=${MIOS_FRONTIER_LANE_B_MODEL:-}\"",
  "\"MIOS_FRONTIER_CLAUDE_EFFORT_FLAG=${MIOS_FRONTIER_CLAUDE_EFFORT_FLAG:-}\"",
  "\"MIOS_A2O_AGY_EFFORT_FLAG=${MIOS_A2O_AGY_EFFORT_FLAG:-}\"",
  "\"MIOS_A2O_GEMINI_EFFORT_FLAG=${MIOS_A2O_GEMINI_EFFORT_FLAG:-}\"",
]
EnvironmentFile = "-/etc/mios/install.env"
TimeoutStartSec = "1200s"
comment2 = "# Build the local super-container image on first deploy (idempotent no-op after)."
ExecStartPre = "/usr/libexec/mios/mios-agents-firstboot.sh"
ExecStart = """/usr/sbin/podman run --replace --name mios-agents \
  --network=host \
  --env PASSWORD=${MIOS_IDENTITY_DEFAULT_PASSWORD} \
  --env MIOS_A2O_ENGINE=agy \
  --env MIOS_A2O_WORK=/mnt/mios-root \
  --env MIOS_FRONTIER_ORCH_ENGINE=${MIOS_FRONTIER_ORCH_ENGINE} \
  --env MIOS_FRONTIER_ORCH_MODEL=${MIOS_FRONTIER_ORCH_MODEL} \
  --env MIOS_FRONTIER_ORCH_EFFORT=${MIOS_FRONTIER_ORCH_EFFORT} \
  --env MIOS_FRONTIER_LANE_A_ENGINE=${MIOS_FRONTIER_LANE_A_ENGINE} \
  --env MIOS_FRONTIER_LANE_A_MODEL=${MIOS_FRONTIER_LANE_A_MODEL} \
  --env MIOS_FRONTIER_LANE_A_EFFORT=${MIOS_FRONTIER_LANE_A_EFFORT} \
  --env MIOS_FRONTIER_LANE_B_ENGINE=${MIOS_FRONTIER_LANE_B_ENGINE} \
  --env MIOS_FRONTIER_LANE_B_MODEL=${MIOS_FRONTIER_LANE_B_MODEL} \
  --env MIOS_FRONTIER_LANE_B_EFFORT=${MIOS_FRONTIER_LANE_B_EFFORT} \
  --env MIOS_FRONTIER_CLAUDE_EFFORT_FLAG=${MIOS_FRONTIER_CLAUDE_EFFORT_FLAG} \
  --env MIOS_A2O_AGY_EFFORT_FLAG=${MIOS_A2O_AGY_EFFORT_FLAG} \
  --env MIOS_A2O_GEMINI_EFFORT_FLAG=${MIOS_A2O_GEMINI_EFFORT_FLAG} \
  --volume /:/mnt/mios-root:rw,rslave \
  --volume /var/lib/mios/agents:/home/coder:rw \
  localhost/mios-agents:latest \
  --bind-addr 0.0.0.0:8800 /mnt/mios-root"""
ExecStop = "/usr/sbin/podman stop -t 10 mios-agents"
Restart = "on-failure"
RestartSec = "10s"
# /var/lib/mios/agents is writable through ReadWritePaths, not StateDirectory=:
# this unit runs as root, and StateDirectory= would recursively chown the coder
# home to root on every start. tmpfiles.d/mios-agents.conf owns it (task_3432).
ReadWritePaths = "/var/lib/mios/agents /var/lib/containers /run"

[units."mios-agents.service".Install]
WantedBy = "multi-user.target default.target"


[units."mios-daemon.service".Unit]
Description = "'MiOS' consolidated micro-LLM daemon (log classify + refusal detect + cron gate)"
Documentation = "file:///usr/libexec/mios/mios-daemon"
After = "mios-llm-light.service network.target"
Wants = "mios-llm-light.service"
