[resolver]
# Keys the Python and Rust resolvers do not agree on. Shrink-only.
# 983 measured the retired render-globals.py against the binary; compared
# twin to twin (mios_toml.emit_exports vs --emit=json over the same tiers)
# the resolvers agree on every key, so the ceiling is held at that floor.
max_key_divergence = 0
# Values that differ for keys both resolvers emit. The remainder is
# Python's repr of nested arrays/tables, which needs preserve_order on
# the toml crate to match -- task_2317, with a toolchain that can link.
max_value_divergence = 0

[tasks]
# AGY task hygiene ratchet over the frozen AGY-TASKS.md. Duplicate task IDs make dependencies ambiguous.
# The task from which AGY tasks carry the full schema (a typed id once the ids are migrated); a DONE task
# is exempt by its marker. schema_also names the tasks created after it that the list files before it,
# so their numbers sit below it -- the schema is demanded of them too.
schema_from = "task_2248"
schema_also = ["task_1120", "task_1157", "task_1158", "task_1159", "task_1160", "task_1161", "task_1162", "task_1163", "task_1164", "task_1165", "task_1166", "task_1167", "task_1168", "task_1169", "task_1170", "task_1171", "task_1172", "task_1928"]
max_duplicate_ids = 0

[tasks.store]
# ADR-0028: the ONLY canonical MiOS task list, edited directly; TASKS.md renders it plus operator overrides.
path   = "tasks.jsonl"
schema = "usr/lib/mios/schemas/task-record.schema.json"
doc    = "TASKS.md"
# The task stores and lists this one replaced. Each must stay deleted; their records live in `path`.
retired = [
  "TASKS.jsonl",
  ".devloop/tasks.jsonl",
  "AGY-TASKS.md",
  "usr/share/mios/agents/TASKS.md",
  "usr/share/mios/docs/MIOS-GEMINI-TASKS-2026-06-22.md",
  "usr/share/mios/docs/MIOS-GEMINI-TASKS-R2-2026-06-22.md",
]
# Records carried by the migration; each keeps a non-null provenance and at least one slice, so a dropped one
# fails the check. The digest freezes their identity -- number, opaque id and slice set (mios-task check names
# the current digest) -- so a swap that keeps the count, a renumbered task or a stripped slice fails too.
migrated = 3484
migrated_sha256 = "79095e90f04be59d34652719fbf564da8580bc1c259962631c717ff26e860a75"
# Frozen history: every byte of these lists, as last merged and with every old task id rewritten to its typed
# id by `mios-task migrate-ids`, lives in the records' provenance.sources and rebuilds to this digest
# (`mios-task source <source>`). Git history keeps the bytes from before the rewrite.
frozen = [
  { source = "MiOS:.devloop/tasks.jsonl",                                   bytes =   235424, sha256 = "ca0b0d53f73d07856d05d58dd0e22260bd2f8febdf30ef75e0a5a6551ee78bab" },
  { source = "MiOS:AGY-TASKS.md",                                           bytes =  3035112, sha256 = "e363167bcb1761b219300a2bc60784f13362d260f78a5fec310181de8da07a00" },
  { source = "MiOS:ROADMAP.md",                                             bytes =   163127, sha256 = "1101fc7357b17c03ceec30cf703083528a178fc3ef0610344c435760c0bfc6fd" },
  { source = "MiOS:TASKS.md",                                               bytes =  1690331, sha256 = "4e1d3c5451c2b579d1e3ead2ba04416ac2426598317c2c3be226ee58354d4153" },
  { source = "MiOS:usr/share/mios/agents/TASKS.md",                         bytes =    36434, sha256 = "fe2a952a4558da9315194ddb1c3e95e277bbd966f81ae17c8d2889990a330a2e" },
  { source = "MiOS:usr/share/mios/docs/MIOS-GEMINI-TASKS-2026-06-22.md",    bytes =     6836, sha256 = "7736164fa292d72026dfa3321e16144f11c62e9e315e9037563d14e1affaae24" },
  { source = "MiOS:usr/share/mios/docs/MIOS-GEMINI-TASKS-R2-2026-06-22.md", bytes =     5291, sha256 = "ab70c6a65372a739b86b00e81733005e945ca986b6c7f2e20a71fd8565db16c8" },
  { source = "mios-micro:ROADMAP.md",                                       bytes =     3405, sha256 = "fcca0f8b3cd1b0faf4954fb3fff010f52eb6c1b783aded53d70e1f73e080e424" },
]
# The highest task number issued (ADR-0028). Numbers are never reissued: the list's highest may not fall
# below this, so a dropped last task cannot hand its number on. Raising it to the current highest tightens it.
numbered = 3650
