# ----------------------------------------------------------------------------
# [storage.cephfs] -- Part 9: XDG + CephFS Unified Storage Fabric
# SSOT for mios-cephfs-provision, automount templates, and ceph.conf generation.
# ----------------------------------------------------------------------------
[storage.cephfs]
enable                          = false          # Operator sets true after cluster is live
cluster_name                    = "ceph"
monitors                        = ["127.0.0.1:6789"]   # Override with actual MON IPs in /etc/mios/install.env
fs_name                         = "cephfs"
tenant_id                       = "mios"                # Subvolume group name prefix

# Pool layout
metadata_pool                   = "cephfs_metadata"
data_pool_hot                   = "cephfs_data_hot"
data_pool_bulk                  = "cephfs_data_bulk"

# MDS tuning
mds_cache_memory_limit_gib      = 4
mds_session_cap_max             = 1024

# Client-side mount options (rendered into /etc/fstab / systemd .mount units)
mount_options                   = "noatime,fsc,_netdev"
client_cache_size               = 16384
client_readahead_max_bytes      = 33554432
client_reconnect_stale_interval = 30

# XDG cache isolation (MUST be local, NEVER CephFS)
xdg_cache_home_override         = "/run/user/{uid}/.cache"    # {uid} expanded at runtime

# Provisioning
subvolume_mode                  = "0700"
keyring_dir                     = "/etc/ceph/keyring.d"
provision_script                = "/usr/libexec/mios/mios-cephfs-provision"

# Automount
automount_enable                = true
automount_idle_timeout_s        = 600    # Unmount idle home dirs after 10 min

# ----------------------------------------------------------------------------
# [storage.ledger] -- task_346: Transactional ledger replication across CephFS pools
# ----------------------------------------------------------------------------
[storage.ledger]
enable                          = true
sync_interval_s                 = 60
ledger_dir                      = "/var/lib/mios/cephfs/ledger"
hash_algo                       = "sha256"

# ----------------------------------------------------------------------------
# [storage.quotas] -- task_347: CephFS dynamic quota enforcement per tenant
# ----------------------------------------------------------------------------
[storage.quotas]
enable                          = true
default_max_bytes               = "100GiB"
default_max_files               = 1000000
warn_threshold_pct              = 80
critical_threshold_pct          = 90

# ----------------------------------------------------------------------------
# [storage.s3_gateway] -- task_348: S3-compatible object storage gateway (radosgw)
# ----------------------------------------------------------------------------
[storage.s3_gateway]
enable                          = true
port_key                        = "radosgw"
bind_address                    = "127.0.0.1"
data_dir                        = "/var/lib/mios/radosgw"

# ----------------------------------------------------------------------------
# [storage.backup] -- task_352: Fast delta snapshot remote backup transfer
# ----------------------------------------------------------------------------
[storage.backup]
enable                          = true
chunk_size_bytes                = 4194304
compression                     = "zstd"
zstd_level                      = 3
retention_count                 = 7

# ----------------------------------------------------------------------------
# [storage.bench] -- task_353: Storage performance benchmark tool
# ----------------------------------------------------------------------------
[storage.bench]
enable                          = true
scratch_dir                     = "/var/tmp/mios-bench"
default_block_size              = 4096
test_duration_s                 = 5

# ----------------------------------------------------------------------------
# [database.pgvector_maintenance] -- task_345: Automated VACUUM & HNSW reindex
# ----------------------------------------------------------------------------
[database.pgvector_maintenance]
enable                          = true
vacuum_parallel_workers         = 4
dead_tuple_threshold_ratio      = 0.10
schedule                        = "weekly"
reindex_concurrently            = true

# ----------------------------------------------------------------------------
# [database.replication] -- task_350: Hot-standby PostgreSQL replica provisioning
# ----------------------------------------------------------------------------
[database.replication]
enable                          = true
slot_prefix                     = "mios_blade_"
max_lag_bytes                   = 67108864
health_check_interval_s         = 15
fence_enforcement               = true

# ----------------------------------------------------------------------------
# [database.doctor] -- task_351: Database corruption detector and automated repair
# ----------------------------------------------------------------------------
[database.doctor]
enable                          = true
greenboot_check_enable          = true
auto_repair_reindex             = true
vacuum_on_fragmentation         = true
non_destructive_only            = true

# ----------------------------------------------------------------------------
# [database.migration] -- task_356: Zero-downtime database schema migration runner
# ----------------------------------------------------------------------------
[database.migration]
enable                          = true
migrations_dir                  = "/usr/share/mios/postgres/migrations"
version_table                   = "schema_version"
atomic_transactions             = true
integrity_check                 = true

# ----------------------------------------------------------------------------
# [security.luks_rotate] -- task_349: Encrypted volume key rotation service
# ----------------------------------------------------------------------------
[security.luks_rotate]
enable                          = true
rotation_interval_days          = 90
header_backup_dir               = "/var/lib/mios/luks-headers"
key_length_bytes                = 64

# ----------------------------------------------------------------------------
# [psi] -- task_429: agent-pipe PSI sampler and load shedding (mios_psi.py)
# ----------------------------------------------------------------------------
[psi]
enable                          = true
sample_interval_ms              = 2000
# some avg10 percentages; each level clears clear_margin_pct below where it trips.
warning_threshold               = 40.0
critical_threshold              = 70.0
clear_margin_pct                = 10.0
throttle_status                 = 429

# ----------------------------------------------------------------------------
# [memory.tmpfs_spill] -- task_354: Automated tmpfs spill-to-NVMe manager
# ----------------------------------------------------------------------------
[memory.tmpfs_spill]
enable                          = true
psi_some_threshold_pct          = 60.0
psi_window_seconds              = 10
spill_target_dir                = "/var/tmp/spill"
min_file_size_bytes             = 10485760
max_spill_quota_bytes           = 53687091200

# ----------------------------------------------------------------------------
# [logging.pipeline] -- task_355: Unified log aggregation pipeline streaming to pgvector
# ----------------------------------------------------------------------------
[logging.pipeline]
enable                          = true
streamer_service                = "mios-log-streamer.service"
min_priority                    = 3
batch_size                      = 50
flush_interval_s                = 5
target_table                    = "system_logs"
embedding_dim                   = 768


# ============================================================================
# [converge.*] -- Converged-Resource Architecture (Part 10)
# Controls the phased rollout of queueing, engine consolidation, memory tiering,
# and distroless base images. All values default to safe no-ops.
# ============================================================================

[converge.gateway]
mode            = "http"          # "queue" = in-process; "http" = legacy :8720 (default)
queue_maxsize   = 64              # max pending requests in the asyncio.Queue
worker_concurrency = 4            # parallel GatewayWorker coroutines
fallback_http   = "http://localhost:${MIOS_PORTS_HERMES}/v1"   # used when mode="http" or worker fails

[converge.inference]
# One heavy lane; its engine is [ai].heavy_engine. The vllm_* keys are vLLM
# multi-LoRA and apply when that engine is "vllm" (check_converge_ssot fails
# vllm_allow_runtime_lora = true under any other engine).
vllm_lora_adapters_dir = "/var/lib/mios/lora-adapters/"
vllm_allow_runtime_lora = false   # set true + VLLM_ALLOW_RUNTIME_LORA_UPDATING=true
llama_cache_reuse_tokens = 0      # 0 = disabled; 256 = enable shared prefix caching
llama_parallel_slots     = 1      # increase to 4 with cache-reuse enabled

[converge.memory]
sqlite_vec_enable      = false    # true = per-session sqlite-vec scratchpad
scratchpad_dir         = "/run/user/{uid}"    # {uid} expanded at runtime
cold_evict_enable      = false    # true = export evicted pg rows to zstd JSONL
cold_storage_dir       = "/var/lib/mios/history/"
cold_retention_days    = 90       # delete cold archives older than this
cold_zstd_level        = 10       # zstd compression level (1-19)

[converge.image]
distroless_enable      = false    # true = agent-pipe built from distroless base
distroless_base        = "localhost/mios-base:latest" # native tmux/MCP is mandatory even in the compact agent image
rechunk_enable         = false    # true = apply rechunk in CI post-build step
rechunk_format_version = 1
mcp_pool_enable        = false    # true = unified MCPClientPool in GatewayWorker
