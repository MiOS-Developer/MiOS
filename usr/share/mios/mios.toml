# [bootstrap.sync] -- Law 15 mirror manifest. Contract: installation/UNIFY.md.
[bootstrap.sync]
# Byte-identical in both repos; mios.git wins. Never list a bootstrap-owned file.
# build-mios.ps1 and installation/* stay mirrored rather than moved: bootstrap
# runs them from its own checkout and raw URL (Get-MiOS.ps1, build-mios.sh,
# field/lib/MiOS-Field.psm1), so its copy is a mirror of this one, not an owner.
mirror_files = [
  "Get-MiOS.ps1",
  "LICENSE",
  "build-mios.ps1",
  "installation/UNIFY.md",
  "installation/mios-common.ps1",
  "installation/mios-common.sh",
  "installation/mios-install.sh",
  "installation/mios-install.ps1",
  "installation/bin/7z.dll",
  # The one MiOS dev image; the same bytes build from either repo root.
  ".devcontainer/Containerfile",
  # Harness settings: the no-merge deny applies in every MiOS repo.
  ".claude/settings.json",
  # Install defaults and the release number: one value set for both repos.
  ".env.mios",
  "VERSION",
]

# SSOT tables mirrored into bootstrap's root mios.toml.
mirror_toml_tables = ["ports", "colors"]

# Single keys "<dotted.table>.<key>" mirrored by value; the rest of each table stays repo-owned.
mirror_toml_keys = [
  "theme.padding",
  "theme.scrollbar_state",
  "bootstrap.windows_install_mode",
  "network.loopback",
  "network.bind_all",
  "network.win_tailscale_ip",
]

# Deliberately NOT mirrored; reasons in installation/UNIFY.md.
# Owned here and absent from bootstrap (no row needed; the tracked-in-both scan
# flags a copy that reappears): etc/mios/ai/config.json (generated by
# tools/native/mios-ai-config) and etc/skel/.config/{mios,aichat}/*. Owned by
# bootstrap and absent here: install.sh, install.ps1.
not_mirrored = [
  "bootstrap.sh", "bootstrap.ps1",
  "README.md", "CLAUDE.md", "AGENTS.md",
  "GEMINI.md", ".gitignore",
  ".devcontainer/Dockerfile",
  ".devcontainer/devcontainer.json",
  ".editorconfig",
  ".gitattributes",
  "installation/README.md",
  "llms.txt",
  "system-prompt.md",
  "usr/share/mios/names.generated.txt",
  "usr/share/mios/referenced_names.txt",
]

# [legibility] -- the repo IS the deliverable. Floors fall only. See ROADMAP.md.
[legibility]
# EVERY tracked file, dependencies included (ADR-0030). Shrink-only, really: it is no longer
# exempt in [drift.generated_ceilings]. ratchet-direction compares it with main's tree count.
max_tracked_files = 3250
# The sister repo mios-bootstrap's own count (ADR-0030: 500 EACH per repo). Shrink-only.
max_bootstrap_files = 201
# Raised to 3409 following approved merges on main: task_1018..task_1025, manual corpus,
# devcontainer, artifacts, and core OS daemons.
# GENERATED by tools/native/mios-size-ceiling; do not hand-edit. The valid band
# is round(tracked MiB) .. that + tracked_mb_headroom, and a committed value
# outside it fails check_size_ceiling. This ceiling is NOT shrink-only, which is
# why it is itemised in [drift.generated_ceilings] rather than silently skipped.
# The alternative considered and not taken -- exclude usr/share/mios/vendored/
# (83% of the measurement, and Law 12 forbids shedding it) and re-baseline down
# the way generated globals are excluded from the shell/PowerShell counts -- is
# recorded in task_988 with the numbers.
max_tracked_mb    = 327
# The allowance, and the only operator-tunable half: how far the tree may grow
# between regenerations before the gate says anything. 0 makes the ceiling exact
# and every MiB boundary a failure, which is the state task_988 was filed about.
tracked_mb_headroom = 1
max_shell_lines   = 54941  # bash is glue only (Law 14). Re-baselined from approved merges.
max_ps_lines      = 27878  # no new PowerShell-as-program (Law 14)
max_automation_phases = "${MIOS_BUILD_RATCHET_MAX_PHASE_SCRIPTS}"  # one phase-count declaration, shared with build.ratchet
max_libexec_verbs     = 312  # verbs only; retired flight-control.sh, mios-dashboard.sh, mios-dup-report (task_3454)

# Script mass that converts to Rust binaries; the AI plane is exempt.
python_ai_plane_prefixes = ["usr/lib/mios/agent-pipe/", "usr/lib/mios/agents/"]
max_tooling_python_lines = 80483   # module-test-coverage + static-linkage census folded into mios-gate (-618).

# ADR-0030: 500 tracked files EACH per repo (dependencies included). Each tracked file counts in the
# FIRST domain of `order` whose glob matches (fnmatch: * also crosses /). max_files only comes DOWN:
# a fold lane lowers its domain in the commit that folds; a new file is paid for by a fold in that commit.
[legibility.file_budget]
target_tracked_files = 500     # operator: "500 total files EACH per MiOS repo" -- this repo (the domains below sum under it)
target_bootstrap_files = 500   # the same cap for the sister repo mios-bootstrap ([legibility].max_bootstrap_files)
order = ["dependency", "projections", "agent_pipe", "modules", "harness", "docs", "tests", "rust", "automation", "etc", "data", "tools", "archive", "misc"]

[legibility.file_budget.domains.dependency]  # vendored wheels and archives fold into one bundle per kind (Law 12 still bakes them); one Cargo.lock
max_files = 6
target_files = 5
globs = ["usr/share/mios/vendored/*", "*Cargo.lock"]

[legibility.file_budget.domains.projections]  # rendered by the build from SSOT, not tracked; human views (ROADMAP/TASKS/ADR index) stay
max_files = 319
target_files = 5
globs = ["usr/share/man/*", "usr/share/containers/systemd/*", "usr/share/applications/*.desktop", "usr/share/mios/dropins/*", "usr/lib/systemd/system/*", "usr/lib/systemd/user/*", "usr/lib/tmpfiles.d/*", "usr/lib/sysusers.d/*", "usr/lib/sysctl.d/*", "usr/lib/modprobe.d/*", "usr/share/mios/ai/v1/*", "usr/share/mios/reference/*", "ADR.md", "ROADMAP.md", "TASKS.md", "ARTIFACT-PROMPT.md", "automation/manifest.json", "usr/share/mios/pipe-boundaries.manifest.json"]

[legibility.file_budget.domains.agent_pipe]  # domain modules of the AI plane
max_files = 414
target_files = 40
globs = ["usr/lib/mios/agent-pipe/*"]

[legibility.file_budget.domains.modules]  # few MiOS-MODULES, multicall by argv[0] (ruling Q19)
max_files = 549
target_files = 45
globs = ["usr/libexec/*", "usr/bin/*"]

[legibility.file_budget.domains.docs]  # one manual volume per domain; one ADR log
max_files = 542
target_files = 40
globs = ["usr/share/doc/*", "docs/*", ".research/*", ".devloop/*", "*.md"]

[legibility.file_budget.domains.tests]  # one suite per domain; fixtures as data bundles
max_files = 281
target_files = 40
globs = ["tests/*"]

[legibility.file_budget.domains.rust]  # one workspace; crates are the MiOS-MODULES
max_files = 210
target_files = 60
globs = ["src/*", "tools/native/*", "rust-toolchain.toml"]

[legibility.file_budget.domains.automation]  # phases as [build.phases] data run by the Rust build driver
max_files = 160
target_files = 15
globs = ["automation/*", "Justfile", "Containerfile*"]

[legibility.file_budget.domains.etc]  # profile.d one file per shell; skel rendered by the dotfiles registry (ADR-0010)
max_files = 73
target_files = 25
globs = ["etc/*"]

[legibility.file_budget.domains.harness]  # per-harness shims rendered from one source at dev setup
max_files = 131
target_files = 20
globs = [".agents/*", "commands/*", ".claude/*", ".github/*", ".forgejo/*", ".devcontainer/*", ".mios/*", ".dotfiles/*"]

[legibility.file_budget.domains.data]  # usr data as SSOT tables or one bundle per domain
max_files = 428
target_files = 60
globs = ["usr/*"]

[legibility.file_budget.domains.tools]  # tools fold into mios-gen / mios-gate
max_files = 96
target_files = 30
globs = ["tools/*", "installation/*"]

[legibility.file_budget.domains.archive]  # Decision 7: the git-native legacy store -- HEAD, config, the branch, one pack (.pack + .idx)
max_files = 5
target_files = 5
globs = [".archive/**"]

[legibility.file_budget.domains.misc]  # root dotfiles and var seeds rendered or folded
max_files = 20
target_files = 20
globs = ["*"]

# ADR-0030 Decision 7: dropped files kept in a bare git store beside .git; built by `mios-gen archive`,
# verified by drift check legacy-archive.
[legibility.archive]
path = ".archive"            # the store, at the root beside .git; only HEAD, config, the branch and one pack are tracked
ref = "legacy"               # its one branch
object_format = "sha256"     # git's sha256 object format; content is compared by the sha256 of the bytes
since = "76f7042fff67542bc7bdfb8eb743bb9a64ad8db6"  # main's tree when the file-budget campaign began; first-parent history from here
author = "mios-gen archive <archive@mios.localhost>"  # fixed author and committer; the date is SOURCE_DATE_EPOCH or the since commit's
# Dropped paths never re-tracked (keys, tokens, credentials, valued .env, leaks), as globs with a reason each.
# Screening all 315 dropped paths found none. Vendored assets are consolidated into bundles in-tree (task_3662).
exclude = ["usr/share/mios/vendored/*"]

# --- Firstboot Models (task_180) ---
[[ai.firstboot_models]]
# Keys are the fetcher's contract (usr/libexec/mios/mios-models-firstboot): name + source +
# sha256; the file lands in /var/lib/mios/llamacpp/models/<name>. The digest is the upstream
# LFS oid of the same file [llamacpp].bake_models names.
name   = "lfm2-700m.gguf"
source = "https://huggingface.co/LiquidAI/LFM2-700M-GGUF/resolve/main/LFM2-700M-Q4_K_M.gguf"
sha256 = "684e8406dc13321452b3f6aeca432776e2a6a7e1ad6c23f7887b8fe3efbe2efa"

# The suite registry: every publisher runs this list and only this list.
# Before it existed the two ran different sets and thirteen suites ran
# nowhere. One reader consumes it; a gate keeps it whole.
[ci]
# Shrink-only. An exemption is a suite that cannot currently run, not a suite
# that need not: each carries the reason it was measured to fail.
max_exempt_suites = 6
# Harnesses, not suites. They execute the tiers rather than asserting anything
# themselves, so they are covered without consuming the exemption ratchet.
runners = ["tests/run-suites.sh"]
# Ceiling, checked by run-suites.sh on every tier; lower it as tools land. A suite in [ci.tool_skips] may exit 77 when a host tool it needs is absent; run-suites.sh counts and names it, never passes it.
max_tool_skips = 1
# Wall-clock limit, in seconds, run-suites.sh gives each suite (timeout(1),
# whole process group, then SIGKILL). Without it one hung suite -- an orphaned
# listener holding the output pipe -- wedged the tier with no verdict at all
# (task_3448). A suite that hits it FAILS; raise it only for a measured runtime.
suite_timeout_s = 900

[tests]
# Shrink-only. A negative test that leaves its injected fixture behind ships the
# mutation; three reached this file in one session and turned five suites red.
max_leaked_fixtures = 0
# Shrink-only. check_negatives_registered has always CLAIMED that every
# drift check has a negative test; it only detected orphans. This is the
# measured gap it never enforced: write a test, lower the number.
# 48 -> 47: four new two-sided tests, less five the tightened
# argument-position coverage predicate correctly re-counted.
max_checks_without_negative = 44

[ci.artifacts]
# Disk formats the artifact-boot job (.github/workflows/mios-ci.yml) builds and
# boots on every run: a second image build, a BIB run and a QEMU boot, about an
# hour each, so every format starts off. Outside the drift-gate tiers.
vhdx = false

[ci.python]
# Installed on a runner before the unit tier.
#
# A hand-written list was wrong twice in a row: server.py's import chain reaches
# smolagents through mios_gateway_queue and mcp through the module after that,
# and each missing name cost a CI round trip to discover. The agent-pipe already
# declares what it needs, so the runner installs THAT and the list cannot drift
# from the code again.
requirements = ["requirements-dev.txt"]
# Pinned dev dependencies now include pyflakes, mypy, ruff, pytest, etc.
packages = []

[ci.powershell.modules]
# CI provisions exact verified module releases before the read-only native lint gates.
PSScriptAnalyzer = "1.25.0"
Pester = "6.0.1"

[ci.fedora]
# The lean CI harness: the drift-gate job runs in this container, the podman
# machine OS MiOS-DEV boots ([bootstrap.dev_vm].base_image), through
# [image].machine_os_mirror -- the same image digests without the disk-image
# entries older containerd cannot read. The dev container is NOT built from it:
# .devcontainer/Containerfile is FROM [image].ref, the full MiOS image.
image = "ghcr.io/mios-dev/machine-os:6.1"
# [packages.<set>] lists installed first; devcontainer is MiOS's development userspace.
package_sets = ["devcontainer"]
# Repo-config RPMs installed before any package. Fedora does not package
# PowerShell; Microsoft's repository does, floating, as it documents for Fedora.
repos = ["https://packages.microsoft.com/config/rhel/9/packages-microsoft-prod.rpm"]
# CI-only extras the harness needs beyond that set: sandbox tests (bubblewrap),
# composefs sealing (mkcomposefs, composefs-info), unit verification
# (systemd-analyze), the lint tier's pwsh and the analyzer's .NET runtime, and
# test-ukify-stage's real-compiler tier (ukify + the systemd-boot EFI stub; the
# image's own kernel is the input). A suite that cannot run its live tier exits
# 77, which fails unless [ci.tool_skips] registers it: provide the tool here.
packages = ["bubblewrap", "composefs", "systemd", "dotnet-sdk-8.0", "powershell",
            "systemd-ukify", "systemd-boot-unsigned"]

