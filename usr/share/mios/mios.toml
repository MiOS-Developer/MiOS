Restart = "on-failure"
RestartSec = "5s"
User = "mios-ai"
Group = "mios-ai"
Environment = "PYTHONUNBUFFERED=1"
comment2 = "# Hardening (kept loose enough to allow journalctl subscription +\n# subprocess.Popen for cron actions)."
NoNewPrivileges = "true"
ProtectSystem = "strict"
