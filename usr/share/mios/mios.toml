# AI-hint: The primary configuration file defining the MiOS user profile, providing the base defaults for identity, system environment, and service configurations used by tools ...
# AI-doc: usr/share/doc/mios/manual/mios.md

# ----------------------------------------------------------------------------
# [migration] -- Per-surface native Rust vs legacy resolver selection toggles.
# ----------------------------------------------------------------------------
[migration]
use_rust_resolver_shell = true
use_rust_resolver_powershell = true
use_rust_resolver_python = true
use_rust_resolver_install_env = true
use_compiled_oscontrol = false # enable only after the native executor preserves every control route
use_compiled_ainode = true

# ----------------------------------------------------------------------------
# [security.privileged_units] -- Roster of systemd units requiring privileged access.
# ----------------------------------------------------------------------------
[security.privileged_units]
max_exposure_score = 9.2
unconfined = [
  "mios-hermes-worker.service",
  "mios-ceph-bootstrap.service",
]

# ----------------------------------------------------------------------------
# [security.licensing] -- Permissive licensing & zero copyleft taint policy (Milestone M5 / R5).
# ----------------------------------------------------------------------------
[security.licensing]
zero_copyleft_taint = true
policy = "permissive_only"
allowed_licenses = [
  "MIT",
  "Apache-2.0",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "LGPL-2.1-or-later",
  "ISC",
  "Zlib",
  "CC0-1.0",
  "Unicode-3.0",
]
denied_licenses = [
  "GPL-3.0-only",
  "GPL-3.0-or-later",
  "GPL-2.0-only",
  "GPL-2.0-or-later",
  "AGPL-3.0-only",
  "AGPL-3.0-or-later",
  "SSPL-1.0",
]

[security.licensing.replacements]
coreutils = { upstream = "gnu-coreutils", upstream_license = "GPL-3.0-or-later", replacement = "uutils-coreutils", replacement_license = "MIT" }
oci_runtime = { upstream = "runc", upstream_license = "GPL-2.0-only", replacement = "youki", replacement_license = "Apache-2.0" }
bootloader = { upstream = "grub2", upstream_license = "GPL-3.0-or-later", replacement = "systemd-boot", replacement_license = "LGPL-2.1-or-later" }
dbus_daemon = { upstream = "dbus-daemon", upstream_license = "GPL-2.0-or-later", replacement = "dbus-broker", replacement_license = "Apache-2.0" }
workspace_orchestrator = { upstream = "coder", upstream_license = "AGPL-3.0-only", replacement = "devpod", replacement_license = "MPL-2.0" }


# ----------------------------------------------------------------------------
# [firewall] -- Firewall open ports SSOT selector for public zone.
# ----------------------------------------------------------------------------
[firewall]
open_ports = [
  "forge_http",
  "open_webui",
  "code_server",
  "hermes",
  "searxng",
  "cockpit",
  "hermes_dashboard",
  "llm_light",
  "pgvector",
  "cockpit_link",
  "adguard_ui",
  "ssh",
  "forge_ssh",
  "llm_heavy",
  "cpu_node",
]



# ----------------------------------------------------------------------------
# [ssot_consumers] -- Shrink-only register: config keys a consumer reads that
# the SSOT does not declare at that path.
# ----------------------------------------------------------------------------
[ssot_consumers]
doc = "Shipped Python reads config as _toml_section(\"<table>\").get(\"<key>\"). When <table>.<key> does not exist the consumer silently takes its compiled default -- the SSOT and the code disagree with nobody told, and every test that stubs the value still passes. Nine security controls sat unreachable this way (and one of the nine entries, the memory guard, was itself such a control) under an unclosed [security.nohc_allowlist] header (task_269). MISPLACED means the key name is declared elsewhere in the SSOT, so one side has the wrong path; UNDECLARED means it exists nowhere, so it is an optional escape hatch or a dead read. Draining an entry: decide which side is right, move the key or fix the consumer, then lower max_unresolved. Gate: check_ssot_consumer_keys."
max_unresolved = 2
unresolved = [
  "a2a.security",                      # MISPLACED -> packages.security/security
  "ai.micro_model",                    # MISPLACED -> ai.host_thresholds.micro_model
]

# ----------------------------------------------------------------------------
# [ssot_tables] -- Shrink-only register: top-level SSOT tables no code reads.
# ----------------------------------------------------------------------------
[ssot_tables]
doc = "A top-level table nothing reads is dead SSOT: it looks operator-tunable and is not, and every edit to it is silently ignored. The gate demands ACCESS-SHAPED evidence of consumption -- a direct index of the parsed SSOT, a toml-get lookup, a quoted dotted path naming a real key, the [dotfiles.registry] manifest, or a resolver-projected MIOS_<TABLE>_* variable derived from the table's own keys appearing in a hand-written consumer -- because name-appearance was measured and rejected: any doc sentence or word collision kept a dead table alive (task_940, and the task_941 measurement that closed the text-search direction). Projection surfaces are NOT consumption: the generated globals twins render every table and seed-db-config mirrors nearly every table into config_kv wholesale, so crediting either would make the gate vacuous again. Each entry here is a table whose consumption is currently broken, accepted deliberately while its wiring lands: browser (family/flags reach no browser launcher; MIOS_BROWSER_AI_* belongs to [browser_ai]), hwcaps (ld_so_hwcaps_autoselect and native_rebuild reach no consumer; the rebuild script they describe is absent), preflight (the Windows preflight reads none of its thresholds), repos (its repo definitions feed no dnf/bootc surface). Draining an entry: wire a real consumer or delete the table, then lower max_unconsumed. Gate: check_no_inert_ssot_tables."
max_unconsumed = 1
unconsumed = [
  "hwcaps",                            # rebuild script it describes is absent
]

# ----------------------------------------------------------------------------
# [unit_projection] -- Shrink-only debt register for the [units] projection.
# ----------------------------------------------------------------------------
[unit_projection]
doc = "[units.*] is the SOURCE and usr/lib/systemd/system is the DERIVED artifact (Law 8), but the declarations went stale while nothing compared them: mios-unit-gen --check rendered into memory, printed PASSED and returned, and its golden test diffed the unit tree against tests/golden/, a byte copy of that same tree. This register lists every unit [units.*] declares whose rendering no longer matches the file it ships. It only shrinks -- tools/native/mios-unit-gen/tests/projection.rs fails an entry that has stopped drifting as loudly as one that starts, so the count cannot be padded. Draining an entry: `mios-unit-gen --render <unit> | diff - usr/lib/systemd/system/<unit>`, then correct [units.*] (the file on disk is what boots, so it wins). A unit absent from BOTH this register and [units.*] is not covered at all -- 52 of the tree's 120 units are in that state, which is the larger debt behind task_267."
max_drift = 55
drift = [
  "hermes-worker-firstboot.service",
  "hermes-worker.path",
  "hermes-worker.service",
  "mios-account-sync.service",
  "mios-additionalimagestores-perms.path",
  "mios-adguard-firstboot.service",
  "mios-agent-pipe.service",
  "mios-agents.service",
  "mios-ai-firstboot.service",
  "mios-ai-firstboot.timer",
  "mios-aios-refresh.timer",
  "mios-bound-images-firstboot.service",
  "mios-ceph-bootstrap.service",
  "mios-daemon.service",
  "mios-dashboard-issue.timer",
  "mios-desktop.target",
  "mios-embed-backfill.service",
  "mios-embed-backfill.timer",
  "mios-finetune-serve.service",
  "mios-firewall-ports.service",
  "mios-firstboot.target",
  "mios-forge-firstboot.service",
  "mios-forgejo-runner-firstboot.service",
  "mios-gpu-amd.service",
  "mios-gpu-detect.service",
  "mios-gpu-intel.service",
  "mios-gpu-nvidia.service",
  "mios-gpu-nvidia.service.d/10-cycle-fix.conf",
  "mios-gpu-pv-detect.service",
  "mios-gpu-status.service",
  "mios-ha-node.target",
  "mios-headless.target",
  "mios-hermes-browser-worker.service",
  "mios-hermes-browser.service",
  "mios-hermes-firstboot.service",
  "mios-hybrid.target",
  "mios-k3s-master.target",
  "mios-k3s-worker.target",
  "mios-libexec-perms.path",
  "mios-mcp.service",
  "mios-models-firstboot.service",
  "mios-opencode-gateway.service",
  "mios-pgvector-backup.service",
  "mios-pgvector-backup.timer",
  "mios-podman-gc.service",
  "mios-policy-arbiter.service",
  "mios-shell-session-gc.service",
  "mios-skills-miner.timer",
  "mios-suggestion-refresh.timer",
  "mios-swarm-pack-firstboot.service",
  "mios-sys-env-refresh.timer",
  "mios-userdb-render.service",
  "mios-webtools-firstboot.service",
  "mios-wsl-firstboot.service",
  "mios-wsl-flatpak-export-sync.path",
]

[units."mios-podman-gc.service".Unit]
comment = "# AI-hint: Systemd unit that executes a forced Podman system prune to reclaim disk space from unused images and containers, specifically targeting WSL and non-containerized environments."
Description = "'MiOS' Podman Garbage Collection"
ConditionVirtualization = ["|!container", "|wsl"]

[units."mios-podman-gc.service".Service]
Type = "oneshot"
ExecStart = "/usr/bin/podman system prune -a -f"

[units."mios-podman-gc.timer".Unit]
comment = "# AI-hint: Systemd timer unit that triggers the mios-podman-gc.service weekly to automate the removal of stale Podman containers, images, and networks to reclaim disk space.\n# AI-related: mios-podman-gc, mios-podman-gc.service, timers.target"
Description = "Weekly Podman Cleanup"

[units."mios-podman-gc.timer".Timer]
OnCalendar = "weekly"
Persistent = "true"
[units."mios-podman-gc.timer".Install]
WantedBy = "timers.target"

[units."mios-ai-firstboot.timer".Unit]
comment = "# AI-hint: Defines the systemd timer for mios-ai-firstboot.service, controlling post-boot AI provisioning retries until the sentinel file is present.\n# AI-related: /var/lib/mios/.ai-firstboot-done, mios-ai-firstboot.service, timers.target\n# /usr/lib/systemd/system/mios-ai-firstboot.timer\n# Retries the first-boot AI stack deployment if it didn't complete on\n# initial boot (e.g. machine rebooted mid-pull, or GPU drivers were\n# mid-dkms build). The timer is enabled by default so the attempt happens\n# automatically, but is gated on the absence of the sentinel file in\n# place. The .service degrades open (exit 0) on a partial provision and carries\n# ConditionPathExists=!<sentinel>, so once /var/lib/mios/.ai-firstboot-done is\n# written the timer-fired run no-ops. The same condition here stops the timer\n# itself from firing needlessly once provisioning is complete."
Description = "'MiOS' AI Plane First-Boot Provisioning Retry Schedule"
Documentation = "file:///usr/libexec/mios/mios-ai-firstboot-provision.sh"
ConditionPathExists = "!/var/lib/mios/.ai-firstboot-done"

[units."mios-ai-firstboot.timer".Timer]
OnBootSec = "2min"
OnUnitInactiveSec = "10min"
Persistent = "true"
Unit = "mios-ai-firstboot.service"

[units."mios-ai-firstboot.timer".Install]
WantedBy = "timers.target"

[units."mios-aios-refresh.timer".Unit]
comment = "# AI-hint: Systemd timer that triggers mios-aios-refresh.service every 15 minutes to synchronize the Single Source of Truth (SSOT) and update the A2A fleet discovery peer list.\n# AI-related: mios-aios-refresh, mios-aios-refresh.service, timers.target"
Description = "Periodic MiOS AIOS refresh (SSOT role SYSTEMs + A2A fleet discovery)"

[units."mios-aios-refresh.timer".Timer]
comment = "# 2 min after boot (agent-pipe up by then), then every 15 min so the role\n# SYSTEMs track catalog/SSOT changes and the peer list tracks the live fleet."
OnBootSec = "2min"
OnUnitActiveSec = "15min"
Persistent = "true"
[units."mios-aios-refresh.timer".Install]
WantedBy = "timers.target"

[units."mios-dashboard-issue.timer".Unit]
Description = "'MiOS' dashboard /etc/issue.d refresh timer"
Documentation = "file:///usr/libexec/mios/mios-dashboard-render-issue.sh"

[units."mios-dashboard-issue.timer".Timer]
OnBootSec = "2min"
OnUnitActiveSec = "5min"
AccuracySec = "30s"
Unit = "mios-dashboard-issue.service"
Persistent = "false"
[units."mios-dashboard-issue.timer".Install]
WantedBy = "timers.target"

[units."mios-embed-backfill.timer".Unit]
comment = "# AI-hint: Defines the systemd timer for the mios-embed-backfill.service, controlling the periodic execution interval (default 15m) for background embedding backfilling.\n# AI-related: /usr/lib/mios/agent-pipe/mios_pipe/memory/embed_backfill.py, mios-embed-backfill.service, timers.target\n# /usr/lib/systemd/system/mios-embed-backfill.timer"
Description = "'MiOS' Embedding Backfill Timer"
Documentation = "file:///usr/lib/mios/agent-pipe/mios_pipe/memory/embed_backfill.py"

[units."mios-embed-backfill.timer".Timer]
OnBootSec = "5min"
OnUnitActiveSec = "15min"
AccuracySec = "1min"
Unit = "mios-embed-backfill.service"
Persistent = "true"
[units."mios-embed-backfill.timer".Install]
WantedBy = "timers.target"

[units."mios-pgvector-backup.timer".Unit]
Description = "'MiOS' daily pgvector datastore backup schedule"
Documentation = "file:///usr/lib/systemd/system/mios-pgvector-backup.service"

[units."mios-pgvector-backup.timer".Timer]
comment = "# Daily, shortly after midnight local time. Persistent=true catches up a missed\n# run (machine asleep/off at the scheduled time) on the next boot. Randomized\n# delay spreads the dump off the exact minute so it doesn't collide with other\n# midnight jobs."
OnCalendar = "*-*-* 00:30:00"
Persistent = "true"
RandomizedDelaySec = "15m"
AccuracySec = "5m"

[units."mios-pgvector-backup.timer".Install]
WantedBy = "timers.target"

[units."mios-podman-ps.timer".Unit]
comment = "# AI-hint: Systemd timer that triggers mios-podman-ps.service every 15 seconds to refresh the podman container snapshot data for the MiOS dashboard display.\n# AI-related: mios-podman-ps, mios-podman-ps.service, timers.target"
Description = "'MiOS' refresh the podman container snapshot for the dashboard"

[units."mios-podman-ps.timer".Timer]
OnBootSec = "10s"
OnUnitActiveSec = "15s"
AccuracySec = "2s"

[units."mios-podman-ps.timer".Install]
WantedBy = "timers.target"

[units."mios-skills-miner.timer".Unit]
Description = "'MiOS' Phase C.2 skill-miner cadence (sequential pattern mining)"
Documentation = "file:///usr/libexec/mios/mios-skills"

[units."mios-skills-miner.timer".Timer]
OnBootSec = "10min"
OnUnitActiveSec = "60min"
AccuracySec = "2min"
Unit = "mios-skills-miner.service"
Persistent = "true"
[units."mios-skills-miner.timer".Install]
WantedBy = "timers.target"

[units."mios-suggestion-refresh.timer".Unit]
comment = "# AI-hint: Systemd timer that triggers mios-suggestion-refresh.service every 10 minutes to update OWUI starter chips based on current system state, kanban data, and recent user intents.\n# AI-related: /usr/libexec/mios/mios-suggestion-refresh, mios-suggestion-refresh, mios-suggestion-refresh.service, timers.target\n# /usr/lib/systemd/system/mios-suggestion-refresh.timer\n# Fires mios-suggestion-refresh.service every 10 minutes so the\n# OWUI starter chips revolve based on current MiOS state (recent\n# kanban, daemon nudges, recent refine intents). Operators tune\n# the cadence with:\n#   sudo systemctl edit mios-suggestion-refresh.timer\n#   [Timer]\n#   OnUnitActiveSec=30min"
Description = "'MiOS' starter-chip refresh cadence"
Documentation = "file:///usr/libexec/mios/mios-suggestion-refresh"

[units."mios-suggestion-refresh.timer".Timer]
comment = "# First refresh 2 min after boot so the chain has warmed up.\n# Then every 10 min while running."
OnBootSec = "2min"
OnUnitActiveSec = "10min"
AccuracySec = "1min"
Unit = "mios-suggestion-refresh.service"
Persistent = "true"
[units."mios-suggestion-refresh.timer".Install]
WantedBy = "timers.target"

[units."mios-sys-env-refresh.timer".Unit]
comment = "# AI-hint: Systemd timer that triggers the mios-sys-env-refresh service every 900 seconds to synchronize the sys_env environment cache with current system state, ensuring shared snapshots reflect recent app/service changes.\n# AI-related: mios-sys-env-refresh, timers.target"
Description = "'MiOS' refresh cadence for the sys_env environment cache"

[units."mios-sys-env-refresh.timer".Timer]
comment = "# Mirrors the daemon's directory_entry refresh cadence (~15 min): installed\n# apps / services / loaded models change far slower than container state, so a\n# 15-min refresh keeps the shared snapshot current without churn. The manual\n# sys_env_refresh verb covers the \"I just installed X\" case immediately."
OnBootSec = "45s"
OnUnitActiveSec = "900s"
AccuracySec = "10s"
Persistent = "true"
[units."mios-sys-env-refresh.timer".Install]
WantedBy = "timers.target"


[units."mios-firstboot.target".Unit]
comment = "# AI-hint: Defines the mios-firstboot.target unit to orchestrate initial provisioning services (CDI, libvirtd, and GRD setup) during the first boot sequence of the MiOS system.\n# AI-related: mios-firstboot, mios-cdi-detect, mios-libvirtd-setup, mios-grd-setup, mios-cdi-detect.service, mios-libvirtd-setup.service, mios-grd-setup.service, multi-user.target"
Description = "'MiOS' first-boot provisioning"
Documentation = "https://github.com/mios-dev/MiOS"
After = "multi-user.target"
Wants = "mios-cdi-detect.service mios-libvirtd-setup.service mios-grd-setup.service"

[units."mios-firstboot.target".Install]
WantedBy = "multi-user.target"

[units."mios-ai.target".Unit]
comment = "# AI-hint: systemd target grouping all MiOS AI plane services (task_54).\n# usr/lib/systemd/system/mios-ai.target"
Description = "MiOS AI Services Target"
After = "multi-user.target"
Wants = "mios-agent-pipe.service"

[units."mios-ai.target".Install]
WantedBy = "multi-user.target"

[units."mios-compute.target".Unit]
comment = "# AI-hint: Defines the compute systemd target for MiOS, representing a compute/worker node.\n# AI-related: mios-compute, mios-headless.target"
Description = "'MiOS' Compute Role"
Requires = "multi-user.target"
After = "multi-user.target"
Conflicts = "mios-controller.target mios-desktop.target mios-endpoint.target mios-ha-node.target mios-headless.target mios-hybrid.target mios-k3s-master.target"
AllowIsolate = "yes"
[units."mios-compute.target".Install]
WantedBy = "multi-user.target"

[units."mios-controller.target".Unit]
comment = "# AI-hint: Defines the controller systemd target for MiOS, representing the cluster controller.\n# AI-related: mios-controller, mios-headless.target"
Description = "'MiOS' Controller Role"
Requires = "multi-user.target"
After = "multi-user.target"
Conflicts = "mios-compute.target mios-desktop.target mios-endpoint.target mios-ha-node.target mios-headless.target mios-hybrid.target mios-k3s-master.target"
AllowIsolate = "yes"
[units."mios-controller.target".Install]
WantedBy = "multi-user.target"

[units."mios-desktop.target".Unit]
comment = "# AI-hint: Defines the mios-desktop.target systemd unit to initialize the desktop environment, ensuring required virtualization services (libvirtd, virtnetworkd) are active while preventing concurrent headless or cluster-specific targets.\n# AI-related: mios-desktop, mios-headless, mios-k3s-master, mios-ha-node, gdm.service, libvirtd.service, libvirtd.socket, virtnetworkd.service, virtqemud.service, virtstoraged.service"
Description = "'MiOS' Desktop Role"
Requires = "multi-user.target gdm.service libvirtd.service libvirtd.socket virtnetworkd.service virtqemud.service virtstoraged.service virtnodedevd.service"
After = "multi-user.target"
Conflicts = "mios-compute.target mios-controller.target mios-endpoint.target mios-ha-node.target mios-headless.target mios-hybrid.target mios-k3s-master.target"
AllowIsolate = "yes"
[units."mios-desktop.target".Install]
WantedBy = "multi-user.target"

[units."mios-endpoint.target".Unit]
comment = "# AI-hint: Defines the endpoint systemd target for MiOS, representing an edge/client node.\n# AI-related: mios-endpoint, mios-headless.target"
Description = "'MiOS' Endpoint Role"
Requires = "multi-user.target"
After = "multi-user.target"
Conflicts = "mios-compute.target mios-controller.target mios-desktop.target mios-ha-node.target mios-headless.target mios-hybrid.target mios-k3s-master.target"
AllowIsolate = "yes"
[units."mios-endpoint.target".Install]
WantedBy = "multi-user.target"

[units."mios-ha-node.target".Unit]
comment = "# AI-hint: Defines the mios-ha-node.target unit to identify and configure a node as a High Availability cluster member, ensuring it conflicts with desktop/headless modes and requires corosync/pacemaker services.\n# AI-related: mios-ha-node, mios-desktop, mios-headless, mios-k3s-master, corosync.service, pacemaker.service, multi-user.target, mios-desktop.target, mios-headless.target, mios-k3s-master.target"
Description = "'MiOS' HA Cluster Node Role"
Requires = "multi-user.target corosync.service pacemaker.service"
After = "multi-user.target"
Conflicts = "mios-compute.target mios-controller.target mios-desktop.target mios-endpoint.target mios-headless.target mios-hybrid.target mios-k3s-master.target"
AllowIsolate = "yes"
[units."mios-ha-node.target".Install]
WantedBy = "multi-user.target"

[units."mios-headless.target".Unit]
comment = "# AI-hint: Defines the headless systemd target for MiOS, enforcing a non-GUI environment by conflicting with desktop, k3s-master, and ha-node targets to ensure a dedicated server-mode state.\n# AI-related: mios-desktop, mios-k3s-master, mios-ha-node, multi-user.target, mios-desktop.target, mios-k3s-master.target, mios-ha-node.target"
Description = "'MiOS' Headless Role"
Requires = "multi-user.target"
After = "multi-user.target"
Conflicts = "mios-compute.target mios-controller.target mios-desktop.target mios-endpoint.target mios-ha-node.target mios-hybrid.target mios-k3s-master.target"
AllowIsolate = "yes"
[units."mios-headless.target".Install]
WantedBy = "multi-user.target"

[units."mios-hybrid.target".Unit]
comment = "# AI-hint: Defines the mios-hybrid.target unit to orchestrate the concurrent execution of desktop environments, k3s worker nodes, and Ceph OSD services as the primary system state for hybrid-role nodes.\n# AI-related: mios-hybrid, k3s-agent.service, graphical.target, default.target"
Description = "'MiOS' Hybrid role (desktop + k3s-worker + ceph-osd)"
Requires = "graphical.target"
After = "graphical.target"
Conflicts = "mios-compute.target mios-controller.target mios-desktop.target mios-endpoint.target mios-ha-node.target mios-headless.target mios-k3s-master.target"
AllowIsolate = "yes"
Wants = "k3s-agent.service"

[units."mios-hybrid.target".Install]
WantedBy = "multi-user.target"

[units."mios-k3s-master.target".Unit]
comment = "# AI-hint: Defines the systemd target for a K3s master node role, ensuring the K3s service is active and mutually exclusive with other MiOS node profiles like desktop or headless.\n# AI-related: mios-desktop, mios-headless, mios-ha-node, k3s.service, multi-user.target, mios-desktop.target, mios-headless.target, mios-ha-node.target"
Description = "'MiOS' K3s Master Role"
Requires = "multi-user.target k3s.service"
After = "multi-user.target"
Conflicts = "mios-compute.target mios-controller.target mios-desktop.target mios-endpoint.target mios-ha-node.target mios-headless.target mios-hybrid.target"
AllowIsolate = "yes"
[units."mios-k3s-master.target".Install]
WantedBy = "multi-user.target"

[units."mios-k3s-worker.target".Unit]
comment = "# AI-hint: Defines the systemd target for the MiOS K3s worker node role, ensuring the k3s-agent.service is active and providing a specific target for orchestrating worker-node lifecycle and dependencies.\n# AI-related: mios-k3s-worker, k3s-agent.service, multi-user.target, default.target"
Description = "'MiOS' K3s worker role (agent)"
Requires = "multi-user.target"
After = "multi-user.target"
AllowIsolate = "yes"
Wants = "k3s-agent.service"

[units."mios-k3s-worker.target".Install]
WantedBy = "multi-user.target"

[units."mios-cockpit-link.socket".Unit]
comment = "# AI-hint: Socket file for mios-cockpit-link proxy. Maps port 8091 on host/WSL to the cockpit service.\n# AI-related: usr/lib/systemd/system/mios-cockpit-link.service"
Description = "'MiOS' Cockpit Link Proxy Socket"
ConditionVirtualization = "!container"

[units."mios-cockpit-link.socket".Socket]
ListenStream = "0.0.0.0:${MIOS_PORTS_COCKPIT_LINK}"
BindIPv6Only = "both"

[units."mios-cockpit-link.socket".Install]
WantedBy = "sockets.target"

[units."mios-firewall-ports.service".Unit]
Description = "'MiOS': ensure firewalld has the MiOS service ports open"
After = "firewalld.service network-online.target"
Wants = "firewalld.service network-online.target"
Before = "mios-agent-pipe.service mios-open-webui.service mios-searxng.service"
ConditionPathExists = "/usr/bin/firewall-cmd"

[units."mios-firewall-ports.service".Service]
Type = "oneshot"
RemainAfterExit = "yes"
ExecStart = '''/bin/bash -c '\
    set +e; \
    if [ -f /etc/mios/install.env ]; then source /etc/mios/install.env; fi; \
    ports=(\
        "${MIOS_PORTS_FORGE_HTTP:-8400}" \
        "${MIOS_PORTS_OPEN_WEBUI:-8200}" \
        "${MIOS_PORTS_CODE_SERVER:-8900}" \
        "${MIOS_PORTS_HERMES:-8720}" \
        "${MIOS_PORTS_SEARXNG:-8800}" \
        "${MIOS_PORTS_COCKPIT:-8110}" \
        "${MIOS_PORTS_HERMES_DASHBOARD:-8210}" \
        "${MIOS_PORTS_LLM_LIGHT:-8500}" \
        "${MIOS_PORTS_PGVECTOR:-8600}" \
        "${MIOS_PORTS_COCKPIT_LINK:-8120}" \
        "${MIOS_PORTS_ADGUARD_UI:-8050}" \
        "${MIOS_PORTS_SSH:-8100}" \
        "${MIOS_PORTS_FORGE_SSH:-8410}" \
        "${MIOS_PORTS_LLM_HEAVY:-8520}" \
        "${MIOS_PORTS_CPU_NODE:-8510}" \
        53 \
    ); \
    for p in "${ports[@]}"; do \
        /usr/bin/firewall-cmd --permanent --add-port=${p}/tcp >/dev/null 2>&1; \
    done; \
    /usr/bin/firewall-cmd --permanent --add-port=53/udp >/dev/null 2>&1; \
    /usr/bin/firewall-cmd --reload >/dev/null 2>&1; \
    echo "MiOS firewalld ports: $(/usr/bin/firewall-cmd --list-ports 2>/dev/null)"; \
    exit 0\''''
ProtectKernelTunables = "yes"
ProtectControlGroups = "yes"
[units."mios-firewall-ports.service".Install]
WantedBy = "multi-user.target"

[units."mios-bootc-switch.path".Unit]
comment = "# AI-hint: Systemd path unit that monitors /var/lib/mios/forge-runner/last-build.txt to trigger mios-bootc-switch.service, automating the bootc kernel/image switch immediately after a Forgejo Runner build completes.\n# AI-related: /usr/libexec/mios/bootc-switch-from-build.sh, mios-bootc-switch, mios-bootc-switch.service, multi-user.target\n# /usr/lib/systemd/system/mios-bootc-switch.path\n# Watches the build-output sentinel that the Forgejo Runner workflow\n# writes after a successful `podman build`. PathChanged fires on\n# either creation or modification, so re-running the workflow with\n# the same image ref still triggers a re-stage (bootc switch is\n# idempotent on identical refs -- this is fine)."
Description = "'MiOS' watch for Forgejo Runner build output -> bootc switch"
Documentation = "file:///usr/libexec/mios/bootc-switch-from-build.sh"

[units."mios-bootc-switch.path".Path]
