  { key = "l", command = "select-pane -R" },
  { key = "s", command = "split-window -v" },
  { key = "v", command = "split-window -h" },
  { key = "n", command = "next-window" },
  { key = "p", command = "previous-window" },
  { key = "w", command = "choose-tree -Zw" },
  { key = "z", command = "resize-pane -Z" },
  { key = "y", command = "copy-mode" },
  { key = "d", command = "detach-client" },
  { key = "Tab", command = "send-keys BTab" },
  { key = "b", command = "send-prefix" },
  { key = "o", command = "run-shell '/usr/lib/mios/mcp/.venv/bin/python3 /usr/libexec/mios/mios-mcp-server --workspace-focus next'", command_windows = "select-pane -t :.+" },
  { key = "f", command = "run-shell '/usr/lib/mios/mcp/.venv/bin/python3 /usr/libexec/mios/mios-mcp-server --workspace-view toggle'", command_windows = "resize-pane -Z" },
]

[routing]
router_enable = true   # master switch; false = legacy full-surface behaviour

# Trailing courtesy/location phrases the agent-pipe fast-path (_deterministic_action_
# route) STRIPS from a launch target so the app name is clean and the launch stays
# deterministic: "open notepad for me" -> open_app(name="notepad"); "open spotify on
# my desktop" -> name="spotify". SSOT (no hardcoded English in code); stripped
# longest-match-first from the END of the target. Add phrases your launches pick up.
launch_filler_phrases = [
  "for me please", "on my desktop", "on the desktop", "right now", "real quick",
  "thank you", "for me", "please", "thanks", "now",
]

launch_target_lead_phrases = ["the", "a", "an", "my"]

# Trailing generic nouns dropped from a launch target so "open the calculator app"
# -> name="calculator", "open the photos application" -> name="photos". Single
# words, stripped from the END while the trailing word matches (word-boundary, so
# "whatsapp" is never truncated). Add nouns your phrasings pick up.
launch_target_trail_phrases = ["application", "program", "app", "window"]

remember_trigger_phrases = ["remember", "note", "save", "keep in mind", "don't forget", "make a note"]
# web_search: a TRIGGER verb phrase co-occurring (within ~40 chars) with a WEB
# CONTEXT phrase -> set web=true (e.g. "search ... online", "look up ... on the web").
web_search_trigger_phrases = ["search", "look up", "google", "find", "search the web", "search online"]
web_search_trigger_contexts = ["web", "internet", "online"]
location_sensitive_phrases = ["weather", "forecast", "near me", "nearby", "near here", "around here", "local news", "local", "my area", "things to do", "restaurants", "closest", "directions to"]
browser_action_verbs = ["quote", "read", "tell", "summarise", "summarize", "what is", "what does", "what say", "what says", "first sentence", "the content", "browse", "extract", "scrape", "headline", "article", "say"]
compound_conjunctions = ["and", "then"]
compound_actions = ["type", "write", "enter", "input", "paste", "put"]
# Two-target connectives: a bare 'launch <app>' that still carries one of these
# (a preposition/conjunction joining a SECOND target, e.g. 'open X in Y') is a
# COMPOUND phrase the deterministic open_app fast-path must DECLINE, so the LLM
# router splits content from target. SSOT (was an inline English regex in
# routing.py -- NO hardcoded keyword gate in code). Empty => guard degrades open.
compound_connectives = ["in", "and", "then", "with", "on", "to"]
model_modalities_embeddings = ["embed", "bert", "text-embedding", "bge"]
model_modalities_image      = ["diffuse", "flux", "dall", "midjourney", "sd"]
integer_param_keywords = ["limit", "count", "timeout", "port", "every", "concurrency", "maxsize"]
boolean_param_keywords = ["enable", "force", "success", "active", "dryrun"]

prefilter_conversational_bypass_mode = "model"
prefilter_classify_timeout_s = 6

launch_followup_phrases = [
  "didn't launch", "did not launch", "didn't open", "did not open",
  "didn't start", "did not start", "didn't come up", "did not come up",
  "didn't work", "did not work", "wouldn't open", "would not open",
  "no window", "nothing happened", "nothing opened", "never opened",
  "never launched", "not opening", "not launching", "isn't open",
  "is not open", "isn't running", "is not running", "won't open",
  "won't launch", "doesn't open", "does not open", "failed to open",
  "failed to launch",
]
# launch_retry_phrases -> an explicit ask to try again / launch+verify ("try
# again", "attempt to launch and verify", "launch and verify", "open it
# again", "retry"). Re-fires the launch+verify against the persisted last app.
launch_retry_phrases = [
  "attempt to launch and verify", "launch and verify", "launch it and verify",
  "try to launch and verify", "open and verify", "open it and verify",
  "try launching it again", "try launching again", "try opening it again",
  "try opening again", "launch it again", "open it again", "start it again",
  "run it again", "try again", "attempt again", "retry", "relaunch",
  "re-launch", "reopen", "re-open", "try once more", "one more time",
  "attempt to launch", "attempt the launch", "verify the launch",
  "launch and confirm", "open and confirm",
]

[routing.domains.web]
desc  = "LOOK UP INFORMATION on the internet: current events, news, trending topics, weather, prices, world facts. NOT for performing an action in an app, sending/posting/sharing a message, or controlling the screen."
verbs = ["web_search", "web_scrape", "crawl", "web_extract"]

[routing.domains.files]
desc  = "find, read, or edit LOCAL files on this machine"
verbs = ["everything_search", "text_view", "list_dir"]

[routing.domains.system]
desc  = "this machine's OS / version / kernel / whether WSL2 / the Windows host, plus state, services, processes, containers, logs, environment"
verbs = ["system_status", "sys_env", "sys_env_refresh", "system_logs", "service_status", "service_restart", "process_list", "container_status", "container_restart"]

[routing.domains.apps_windows]
desc  = "list or launch applications and manage on-screen windows"
verbs = ["open_app", "close_app", "open_url", "verify_launch", "window_state", "focus_window", "move_window", "position_window", "resize_window", "list_windows", "screen_layout", "mios_apps", "app_search", "mios_find"]

[routing.domains.packages]
desc  = "install, update, remove, or query software packages (dnf/winget/flatpak)"
verbs = ["pkg", "winget_search", "winget_list", "winget_show", "winget_install", "winget_upgrade", "winget_uninstall", "flatpak_search", "flatpak_list", "flatpak_show", "flatpak_install", "flatpak_upgrade", "flatpak_uninstall", "flatpak_preflight"]

[routing.domains.memory]
desc  = "recall or store the agent's own memory / knowledge / summaries"
verbs = ["knowledge_search", "remember", "recall", "ingest", "summarize"]

[routing.domains.computer_use]
desc  = "GUI pixel/element control of the screen via mouse and keyboard"
verbs = ["cu_screenshot", "cu_ground", "cu_atspi_query", "cu_window_list", "cu_click", "cu_type", "cu_key", "cu_key_combo", "pc_screenshot", "pc_type", "pc_key", "pc_click", "pc_find_element", "pc_click_element", "pc_list_elements"]

[routing.domains.code_shell]
desc  = "run code, shell, or PowerShell commands (incl. explaining what a script/code does)"
verbs = ["coderun", "code_mode", "os_recipe", "powershell_run"]

[routing.domains.agents_comms]
desc  = "PERFORM a communication or automation ACTION: send / post / share / DM a message (to a chat, channel, or person), delegate or hand a sub-task to another agent, schedule a recurring task, or generate a document"
verbs = ["handoff", "a2a_delegate", "discord_send", "schedule", "docgen_build", "docgen_convert", "tool_search"]

# ─── Verbs Default Policy (SSOT) ──────────────────────────────────────
# Default values applied to all [verbs.<name>] blocks. Introducing this
# block allows us to prune redundant keys across the 100+ individual verbs,
# keeping the catalog clean.
[verbs._defaults]
tier             = "common"
permission       = "read"
max_result_chars = 0
parallel_limit   = 0
hidden           = false


# MiOS-DEV self-development: apply the war-room / code-server workspace edits
# DIRECTLY onto the deployed dev root so they go live for testing without a GitHub
# round-trip. GATED to a MUTABLE MiOS-DEV root (an immutable bootc root is refused;
# ship those via bootc upgrade). Syncs only git-visible files, never deletes. The
# executable enforces every gate -- see usr/libexec/mios/mios-sync-to-root.
[verbs.sync_to_root]
section    = "MiOS-DEV / self-development"
sig        = 'mode="apply"?'
desc       = "Apply the code-server/war-room workspace edits DIRECTLY onto the deployed MiOS-DEV root so they go LIVE for testing (no GitHub round-trip). Only works on a mutable MiOS-DEV deploy; an immutable bootc root is refused. Use mode=check (or dry-run) to preview what would change without touching anything, then mode=apply to make it live."
examples   = ["apply my code-server changes to the dev root", "sync the war-room workspace live for testing", "push these edits into MiOS-DEV so I can test them", "dry-run what a sync-to-root would change"]
tier       = "rare"
permission = "write"
cmd        = "mios-sync-to-root {mode=apply}"
  [verbs.sync_to_root.params.mode]
  type    = "string"
  desc    = "apply = make the workspace edits live on the dev root; check/dry-run = preview only, touch nothing."
  enum    = ["apply", "check", "dry-run"]
  default = "apply"
  aliases = ["action", "op"]

[verbs.open_app]
hidden = true
section    = "Window / app launch"
sig        = 'name, position="default"?, args?, monitor=0?'
desc       = "LAUNCH any app/program by name (resolves Windows AND Linux/flatpak apps) and optionally place its window (position center/left/right/top-left..., monitor index) or pass CLI args. THE one launch verb -- use for any 'open / launch / start / run X'. After launching, confirm with verify_launch."
model_name = "launch_windows_app"
hidden_aliases = ["launch_app", "launch_verified", "launch_and_verify_app"]  # consolidated INTO open_app; resolve here, never re-shown on the model surface
examples   = ["open Firefox on my second monitor", "launch Spotify on the left half of the screen", "start Notepad with this file and put it top-left", "run Discord maximized on monitor 1"]
tier = "rare"
permission = "write"
conflict_group = "desktop_ui"  # WS-A7: one foreground window + keyboard -- serialize vs focus_window/pc_type so a fan-out can't race them
cmd        = "MIOS_LAUNCH_POSITION={position=default} mios-launch {name!}"
cmd_args   = "MIOS_LAUNCH_POSITION={position=default} mios-windows launch {name!}{args*}"
  [verbs.open_app.params.name]
  type    = "string"
  desc    = "App display name OR full path. Paths get basename-extracted before launch."
  aliases = ["query", "title", "app", "target", "program", "path", "file", "binary", "exe"]
  [verbs.open_app.params.position]
  type    = "string"
  desc    = "Semantic placement after launch."
  enum    = ["default", "as-is", "center", "left", "right", "top", "bottom", "top-left", "top-right", "bottom-left", "bottom-right", "maximize"]
  default = "default"
  [verbs.open_app.params.args]
  type    = "array"
  desc    = "Extra positional args passed to the launcher target."
  [verbs.open_app.params.monitor]
  type    = "integer"
  desc    = "Monitor index (0=primary)."
  default = 0

[verbs.verify_launch]
hidden = true
section    = "Window / app launch"
sig        = "app"
desc       = "CHECK whether an app/window ACTUALLY launched, read-only, in-turn (delegates to the daemon-agent's Definition-of-Done window check). Call with the SAME name AFTER you fired launch_app / launch_windows_app / focus_window to confirm before claiming success. This only CHECKS -- it does NOT launch; to launch and confirm in one go use launch_and_verify_app."
examples   = ["did Firefox actually open?", "check whether Spotify launched", "confirm the Discord window came up", "is the app I just started actually running?"]
tier = "rare"
cmd        = "mios-verify-launch {app}"
  [verbs.verify_launch.params.app]
  type    = "string"
  desc    = "App/window name that was supposedly launched (use the SAME name you passed to open_app)."
  aliases = ["name", "query", "title", "target", "program", "window", "path", "exe"]

[verbs.focus_window]
hidden = true
section    = "Window / app launch"
sig        = 'title, position="default"?'
desc       = "Raise an already-OPEN Windows window to the FRONT (by title) and optionally re-position it (same placement enum as launch_windows_app). Use to switch to / bring forward / activate a window that already exists -- it does NOT launch anything. Run list_windows first to confirm the title."
examples   = ["bring Firefox to the front", "switch to the Spotify window", "focus the Discord window and move it to the left", "activate the Notepad window"]
tier = "rare"
permission = "write"
conflict_group = "desktop_ui"  # WS-A7: serialize vs open_app/pc_type (shared foreground-window focus)
cmd            = "mios-window focus {title}"
cmd_positioned = "mios-window focus {title} && MIOS_LAUNCH_POSITION={position} mios-window {position} {title}"
  [verbs.focus_window.params.title]
  type    = "string"
  desc    = "Window title pattern (substring match)."
  aliases = ["name", "window", "app"]
  [verbs.focus_window.params.position]
  type    = "string"
  enum    = ["default", "as-is", "center", "left", "right", "top", "bottom", "top-left", "top-right", "bottom-left", "bottom-right", "maximize"]
  default = "default"

[verbs.close_app]
section    = "Window / app launch"
sig        = "title"
desc       = "Gracefully CLOSE an open Windows application or window (by title pattern). Use this when the operator asks to close, quit, exit, or kill an application."
examples   = ["close Firefox", "quit Spotify", "exit Discord"]
permission = "write"
cmd        = "mios-window close {title}"
  [verbs.close_app.params.title]
  type    = "string"
  desc    = "Window title pattern (substring match)."
  aliases = ["name", "window", "app"]

[verbs.move_window]
hidden = true
section    = "Window / app launch"
sig        = "title, position, monitor=0?"
desc       = "Move an OPEN Windows window to a SEMANTIC region: center, a half of the screen (left-half / right-half / top-half / bottom-half), a corner (top-left / ...), or maximize -- optionally on a chosen monitor. Half/corner rectangles are derived live from the monitor's work area. Use when the operator names a place ('to the left half', 'center it', 'snap it right') rather than exact coordinates. For literal pixel (x,y) use place_window_at_pixel; to change size use resize_window."
model_name = "move_window_to_region"
examples   = ["move Firefox to the right half of the screen", "center the Spotify window", "put Notepad in the top-left corner", "snap Discord to the left half on monitor 2"]
tier = "rare"
permission = "write"
cmd        = "mios-window {position=center} {title} {monitor?--monitor}"
  [verbs.move_window.params.title]
  type = "string"
  aliases = ["name", "window"]
  [verbs.move_window.params.position]
  type = "string"
  aliases = ["region", "snap"]
  enum = ["center", "maximize", "left-half", "right-half", "top-half", "bottom-half", "left", "right", "top", "bottom", "top-left", "top-right", "bottom-left", "bottom-right"]
  [verbs.move_window.params.monitor]
  type = "integer"
  default = 0

[verbs.position_window]
hidden = true
section    = "Window / app launch"
sig        = "title, x, y"
desc       = "Move an OPEN Windows window to LITERAL pixel coordinates (x, y). Use only when you have exact coords -- call screen_layout first to learn monitor geometry/resolution. For named regions (center/left/right) use move_window_to_region; to change size use resize_window."
model_name = "place_window_at_pixel"
examples   = ["move the window to pixel 100, 200", "position Firefox at coordinates 0,0", "place the window at x=1920 y=0 on the second monitor", "put Notepad exactly at 500, 300"]
tier = "rare"
permission = "write"
cmd        = "mios-window move {title} {x=0} {y=0}"
  [verbs.position_window.params.title]
  type = "string"
  aliases = ["name", "window"]
  [verbs.position_window.params.x]
  type = "integer"
  [verbs.position_window.params.y]
  type = "integer"

[verbs.resize_window]
hidden = true
section    = "Window / app launch"
sig        = "title, width, height"
desc       = "Resize an OPEN Windows window to a literal pixel size (width x height). This ONLY changes size -- it does NOT move the window. To relocate use move_window_to_region (named region) or place_window_at_pixel (exact x,y); to fill the monitor use maximize_window."
examples   = ["resize Firefox to 1280 by 720", "make the Notepad window 800x600", "set the Spotify window width to 1000 and height to 700", "shrink the Discord window to 640 by 480"]
tier = "rare"
permission = "write"
cmd        = "mios-window resize {title} {width} {height}"
  [verbs.resize_window.params.title]
  type = "string"
  aliases = ["name", "window"]
  [verbs.resize_window.params.width]
  type = "integer"
  aliases = ["w"]
  [verbs.resize_window.params.height]
  type = "integer"
  aliases = ["h"]

[verbs.minimize_window]
section    = "Window / app launch"
sig        = "title"
desc       = "Minimize an OPEN Windows window -- hide it to the taskbar without closing it. To bring it back use restore_window; to actually close it use close_window."
examples   = ["minimize the Firefox window", "hide Spotify to the taskbar", "minimize Notepad", "send the Discord window to the taskbar"]
tier = "rare"
permission = "write"
hidden     = true   # consolidated into [verbs.window_state]; kept parsed + dispatchable
cmd        = "mios-window minimize {title}"
  [verbs.minimize_window.params.title]
  type = "string"
  aliases = ["name", "window"]

[verbs.maximize_window]
section    = "Window / app launch"
sig        = "title"
desc       = "Maximize an OPEN Windows window to fill its containing monitor. To restore it back to normal size use restore_window; for a specific pixel size use resize_window."
examples   = ["maximize the Firefox window", "make Spotify fill the screen", "maximize Notepad", "blow up the Discord window to full screen"]
tier = "rare"
permission = "write"
hidden     = true   # consolidated into [verbs.window_state]; kept parsed + dispatchable
cmd        = "mios-window maximize {title}"
  [verbs.maximize_window.params.title]
  type = "string"
  aliases = ["name", "window"]

[verbs.restore_window]
section    = "Window / app launch"
sig        = "title"
desc       = "Restore an OPEN Windows window from a minimized OR maximized state back to its last normal-size geometry. Use to 'un-minimize' / 'un-maximize' / bring back a window. Pairs with minimize_window and maximize_window."
examples   = ["restore the Firefox window", "un-minimize Spotify", "bring the Notepad window back to normal size", "un-maximize the Discord window"]
tier = "rare"
permission = "write"
hidden     = true   # consolidated into [verbs.window_state]; kept parsed + dispatchable
cmd        = "mios-window restore {title}"
  [verbs.restore_window.params.title]
  type = "string"
  aliases = ["name", "window"]

[verbs.close_window]
section    = "Window / app launch"
sig        = 'title, mode="graceful"?'
desc       = "Gracefully CLOSE an OPEN Windows window by title (sends WM_CLOSE so the app saves state). Force-kill is intentionally unsupported. Use to close / quit / dismiss a window -- not to hide it (use minimize_window to send it to the taskbar)."
examples   = ["close the Firefox window", "quit Notepad", "close the Spotify window", "dismiss the dialog window"]
tier = "rare"
permission = "write"
hidden     = true   # consolidated into [verbs.window_state]; kept parsed + dispatchable (mode was never in cmd)
cmd        = "mios-window close {title}"
  [verbs.close_window.params.title]
  type = "string"
  aliases = ["name", "window", "app"]
  [verbs.close_window.params.mode]
  type = "string"
  enum = ["graceful", "force"]
  default = "graceful"

[verbs.window_state]
hidden = true
section    = "Window / app launch"
sig        = "action, title"
desc       = "Change the STATE of an OPEN Windows window (by title): minimize (hide to taskbar), maximize (fill its monitor), restore (back to normal size), or close (graceful WM_CLOSE so the app saves state). Run list_windows first to confirm the title. This is state only -- to bring a window to the front use focus_window, to relocate use move_window_to_region / place_window_at_pixel, to change size use resize_window."
examples   = ["minimize the Firefox window", "maximize Spotify", "restore the Notepad window", "close the Discord window", "send Slack to the taskbar"]
tier = "rare"
permission = "write"
cmd        = "mios-window {action} {title}"
  [verbs.window_state.params.action]
  type = "string"
  enum = ["minimize", "maximize", "restore", "close"]
  desc = "The window-state change to apply."
  aliases = ["op", "state"]
  [verbs.window_state.params.title]
  type = "string"
  desc = "Window title pattern (substring match)."
  aliases = ["name", "window", "app"]

[verbs.list_windows]
hidden = true
section    = "Window / app launch"
sig        = ""
desc       = "Enumerate the currently OPEN Windows-desktop windows (titles). Run this BEFORE focus/move/close to confirm the target window exists. NOT the installed-app inventory (use list_installed_apps) and NOT the Linux/Wayland desktop (that is linux_desktop_window_list)."
examples   = ["what windows are open right now?", "list my open windows", "show me the open application windows", "which windows are currently on screen?"]
tier = "rare"
cmd        = "mios-pc-control window-list --json"
# Fit a busy desktop's whole window list (the grounding for "what's open"). The
# old 1500-char default cut it mid-window so the model FABRICATED the omitted
# windows' PIDs/titles. _cap_verb_result still flags any
# overflow with a ⟪TRUNCATED⟫ marker the model must not invent past.
max_result_chars = 6000

[verbs.screen_layout]
section    = "Window / app launch"
sig        = ""
desc       = "Report Windows MONITOR geometry: each display's resolution, position, and which is primary. Use BEFORE place_window_at_pixel so you know valid coordinates. This describes the SCREENS/monitors, not the open windows (use list_windows for those)."
examples   = ["what's my monitor layout?", "what resolution are my screens?", "how many monitors do I have and where are they?", "which display is my primary monitor?"]
cmd        = "mios-pc-control screen-layout"

[verbs.open_url]
section    = "Window / app launch"
sig        = "url, mode?, browser?, private?, profile?, reuse_instance?"
desc       = "SHOW a web page to the operator in their VISIBLE browser. By DEFAULT opens the URL as a NEW TAB in the operator's ALREADY-RUNNING browser (reuses the instance -- NOT a new window, NOT a second instance). mode=window = a new window in the running browser; mode=new-window = force a brand-new isolated instance; private=true = incognito/private window. Use for 'open / pull up / show me this link' and 'open a tab to X'. NOT for research (that returns page content); this just displays the page."
examples   = ["open a firefox tab to youtube", "open youtube.com in my browser", "pull up the GitHub repo page on screen", "show me this link in a new window", "open my bank's site in a private window"]
tier       = "core"
permission = "write"
# Native tab/window control. mode -> the browser's native tab/window/private flag
# (SSOT [browser.flags.*]); tab reuses the running instance. NO literal quotes
# around placeholders (the renderer shlex-quotes -> a literal quote breaks the cmd).
cmd        = "mios-open-url {url}{mode?--mode}{browser?--browser}{private?--private}{profile?--profile}{reuse_instance?--reuse}"
  [verbs.open_url.params.url]
  type    = "string"
  aliases = ["link", "address", "uri"]
  [verbs.open_url.params.mode]
  type    = "string"
  enum    = ["tab", "window", "new-window", "private"]
  default = "tab"
  aliases = ["disposition", "where"]
  desc    = "How to present the URL: tab = a NEW TAB in the already-running browser (DEFAULT; reuses the instance). window = a new window in the running browser. new-window = force a brand-new isolated instance. private = private/incognito window."
  [verbs.open_url.params.browser]
  type = "string"
  desc = "Browser shortname (chromedev / firefox / epiphany / default). Empty = operator default."
  [verbs.open_url.params.private]
  type    = "boolean"
  default = false
  desc    = "Open in a private/incognito window (overrides mode)."
  [verbs.open_url.params.profile]
  type = "string"
  desc = "Browser profile name (optional)."
  [verbs.open_url.params.reuse_instance]
  type    = "boolean"
  default = true
  desc    = "Reuse the already-running browser instance (open a TAB) rather than cold-launching a new one. false = force a new instance/window."

[browser.family]
firefox  = ["firefox", "mozilla", "librewolf", "waterfox", "zen", "floorp"]
chromium = ["chrome", "chromium", "brave", "edge", "vivaldi", "opera"]
epiphany = ["epiphany", "gnome.web", "gnome.epiphany"]

[browser.flags.firefox]
tab          = "--new-tab"
window       = "--new-window"
new-window   = "--new-window --new-instance"
private      = "--private-window"
[browser.flags.chromium]
tab          = ""
window       = "--new-window"
new-window   = "--new-window"
private      = "--incognito"
[browser.flags.epiphany]
tab          = "--new-tab"
window       = "--new-window"
new-window   = "--new-window"
private      = "--incognito-mode"

# ─── Section: Automation / scheduling ─────────────────────────────────
[verbs.schedule]
section    = "Automation / scheduling"
sig        = "prompt, every"
desc       = "Schedule a RECURRING/standing task: run <prompt> through the agent on a repeating interval and post each result to the operator's Discord. Use for ANY 'do X every N minutes/hours', 'each day', 'keep me updated on ...', 'check ... regularly' request -- a STANDING job, NOT one-shot research."
examples   = ["check the news every morning and post to discord", "every 30 minutes summarize new logs", "keep me updated on GPU temps each hour", "run this report daily"]
tier       = "core"
permission = "write"
cmd        = "mios-cron-schedule add --prompt {prompt} --every {every}"
  [verbs.schedule.params.prompt]
  type    = "string"
  aliases = ["task", "query", "do", "what"]
  desc    = "The task/question to run each interval (e.g. 'research the cheapest Toronto to Japan flights')."
  [verbs.schedule.params.every]
  type    = "string"
  aliases = ["interval", "frequency", "cadence", "cron"]
  desc    = "Interval: '30 minutes' / 'hourly' / 'daily' / 'weekly', or a raw 5-field cron. Default daily."

# ─── Section: Discovery / resolution ──────────────────────────────────
[verbs.mios_find]
hidden = true
section    = "Discovery / resolution"
sig        = "name"
desc       = "Resolve an app/program NAME to the exact runnable launch command WITHOUT launching it -- returns the cmd line only; the agent then decides whether to run it (e.g. via launch_windows_app/launch_app). This is NOT a file search and does NOT open anything. Use it to get the precise command before launching, or to check how something would be started."
model_name = "resolve_launch_command"
examples   = ["what's the exact command to launch Blender", "how would I start Discord from the command line", "give me the launch command for VS Code without opening it", "resolve the run command for steam but don't launch it"]
tier = "rare"
cmd        = "mios-find --json {name}"
  [verbs.mios_find.params.name]
  type    = "string"
  aliases = ["query", "app", "target"]

[verbs.mios_apps]
hidden = true
section    = "Discovery / resolution"
sig        = "filter?"
desc       = "Full INVENTORY of installed apps AND games across every surface (flatpak/rpm/winget/store/steam/epic/xbox/gog/cli/service). THE verb for 'what apps/games are installed', 'list my programs', 'detect my installed games'. Optional substring filter. NOT a web search, NOT list_windows (open windows only); for fuzzy 'which app does X' use app_search."
model_name = "list_installed_apps"
examples   = ["what apps do I have installed?", "list all my installed games", "show me my installed programs", "detect my Steam and Epic games"]
tier = "rare"
cmd        = "mios-apps --json{filter?--filter}"
# The full inventory (apps + games across every surface) is ~27KB; the default
# 1500-char enrich cap truncated it BEFORE the windows-game section, so "list
# ALL my games" surfaced only 2 of 11. Keep the whole
# inventory so every game/app reaches the agent.
max_result_chars = 30000
  [verbs.mios_apps.params.filter]
  type    = "string"
  desc    = "Case-insensitive substring filter; empty = all."
  aliases = ["query", "search", "name"]

[verbs.everything_search]
hidden = true
section    = "Discovery / resolution"
sig        = "query, limit=10?, ext?"
desc       = "Search for files on the WINDOWS side of this machine via the Voidtools Everything NTFS index (exhaustive, name/extension match). Finds FILES that already exist on Windows drives (C:, etc.) -- NOT a web or knowledge search, and NOT the Linux filesystem. Good for 'where is X.exe' on Windows."
model_name = "windows_file_search"
examples   = ["find game.exe on my Windows drive", "where is the installer .msi on C drive", "search Windows for all my .pdf invoices", "locate steam.exe on Windows"]
tier = "rare"
cmd        = "mios-everything --json -n {limit=10} {query}{ext?-ext}"
  [verbs.everything_search.params.query]
  type    = "string"
  aliases = ["name", "filename", "term"]
  [verbs.everything_search.params.limit]
  type    = "integer"
  default = 10
  [verbs.everything_search.params.ext]
  type = "string"
  desc = "Filter to extension (e.g. 'exe')."

[verbs.fs_search]
hidden = true
section    = "Discovery / resolution"
sig        = "query, limit=20?, ext?, path?, type?"
desc       = "Search for files on the LINUX side of this machine via substring locate (plocate) — does NOT enumerate a directory; use list_dir for that."
model_name = "linux_file_search"
examples   = ["find nginx.conf on the Linux side", "where is the systemd unit file for mios-agent-pipe", "search Linux for all .py files under /usr/lib/mios", "locate the log file on the Linux filesystem"]
tier = "rare"
cmd        = "mios-locate --json -n {limit=20} {query}{ext?-ext}{path?-path}{type?-type}"
  [verbs.fs_search.params.query]
  type    = "string"
  aliases = ["name", "filename", "term"]
  [verbs.fs_search.params.limit]
  type = "integer"
  default = 20
  [verbs.fs_search.params.ext]
  type = "string"
  [verbs.fs_search.params.path]
  type = "string"
  desc = "Restrict to subtree."
  [verbs.fs_search.params.type]
  type = "string"
  enum = ["f", "d", "l"]

[verbs.list_dir]
section    = "Discovery / resolution"
sig        = "path?, depth=1?"
desc       = "LIST the immediate entries of a directory, like `ls <path>`; defaults to the current working directory. Use this to list a directory's files and subdirectories."
model_name = "list_directory"
examples   = ["what's here", "what's in this folder", "list the current directory", "list the files in /etc"]
tier       = "core"
