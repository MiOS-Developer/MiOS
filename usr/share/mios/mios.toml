smoke_podman_api_template  = "smoke 4/4: podman API server v{version}"

# ----------------------------------------------------------------------------
# [smoke_tests] -- attempts + interval the dev-VM smoketests use during
# bootstrap. Phase-3 brings up the podman-MiOS-DEV machine and runs four
# smoketests (responsive / systemd / overlay / podman API) before declaring
# the dev VM ready. Tunables live here so operators don't need to edit code.
# ----------------------------------------------------------------------------
[smoke_tests]
echo_attempts       = 15
systemd_attempts    = 15
podman_api_attempts = 15
interval_seconds    = 2

[messages.install_complete]
title          = "MiOS Windows-side install complete"
installed_lead = "    Installed ..............................................................."
next_steps     = "    What's next? Type any of these in the MiOS terminal:"
hub_hint       = "    The MiOS hub shortcut is in your Start Menu / Desktop / Win+Search."
# Bullets accept {disk_gb} substitution at render time so the
# storage-size value stays current per host.
bullets = [
    "Root overlay on C:\\ (converged Windows/Linux layout)",
    "Podman Desktop + podman-MiOS-DEV machine",
    "mios.git + mios-bootstrap nested at C:\\",
    "MiOS terminal essentials layered into MiOS-DEV",
    "Native Windows app: Start Menu + Desktop + per-verb shortcuts",
    "MiOS PowerShell profile (oh-my-posh, dashboard, mios <verb>)",
]

[search]
endpoint = "http://localhost:${MIOS_PORTS_SEARXNG}/"
enable   = true
anchor_stopwords = [
    "the", "a", "an", "of", "to", "from", "and", "or", "for", "in", "on", "at",
    "by", "with", "as", "is", "are", "was", "were", "be", "this", "that", "these",
    "those", "it", "its", "me", "my", "we", "our", "you", "your", "they", "them",
    "what", "which", "who", "when", "where", "why", "how", "do", "does", "did",
    "can", "could", "will", "would", "should", "may", "might", "near", "into",
    "about", "than", "then", "there", "here", "out", "not", "no", "all", "any",
    "some", "more", "most", "find", "get", "make", "show", "give", "tell", "list",
    "need", "want", "like", "use", "using", "best", "cheap", "cheapest",
]

[hermes]
# Hermes-Agent: OpenAI-compatible gateway and the live MiOS agent at /.
# Fronts mios-llm-light (${MIOS_PORTS_LLM_LIGHT}). API key generated at first boot
# into /etc/mios/hermes/api.env. Mirrors [ai].model -- this key is
# kept for back-compat with older callers; the SSOT default is [ai].model.
endpoint = "http://localhost:${MIOS_PORTS_AGENT_PIPE}/v1"
backend  = "http://localhost:${MIOS_PORTS_LLM_LIGHT}"   # mios-llm-light (ALL llama.cpp)
model    = "granite4.1:8b"
enable   = true


# Per-vendor CDI wiring, read at runtime via `mios-toml-get --section gpu.cdi`.
# `device` is the AddDevice= value (the GPU Quadlets bake nvidia's directly);
# `specs` are the spec filenames whose presence in MIOS_CDI_DIR proves a vendor
# live.
[gpu.cdi.nvidia]
device = "nvidia.com/gpu=all"
specs  = ["nvidia.yaml", "nvidia-wsl.yaml", "wsl2-nvidia.yaml"]

[gpu.cdi.amd]
device = "amd.com/gpu=all"
specs  = ["amd.json", "amd.yaml", "wsl2-amd.yaml"]

[gpu.cdi.intel]
device = "intel.com/gpu=all"
specs  = ["intel.yaml", "intel.json", "wsl2-intel.yaml"]

[sandbox]
enable = false
# task_210: bwrap already confined the filesystem and the network for an opted-in
# verb; the confined process still reported `Seccomp: 0`. Manual ch62.
seccomp_enable = true      # off => bwrap runs with no syscall filter (the old behaviour)
seccomp_action = "errno"   # errno => the call returns EPERM; kill => the process dies
# Extends the BASELINE floor in mios_pipe/access/seccomp.py; it cannot shrink it.
seccomp_deny   = ["swapon", "swapoff", "reboot", "settimeofday", "clock_settime",
                  "process_vm_readv", "process_vm_writev"]

# ----------------------------------------------------------------------------
[laws]
# The MiOS architectural LAW registry (v0.3.0) -- the SINGLE source of the law
# list. CLAUDE.md / AGENTS.md / MiOS.md and generate-manual.py document these;
# 98-drift-checks.sh + 99-postcheck.sh enforce them (a failing law fails the
# build). This table exists so the id<->slug<->enforcer mapping can never drift
# across the prose copies again. applies_to = bootc | wsl | both.
laws = [
  { id = 1,  slug = "USR-OVER-ETC",         applies_to = "both",  enforced_by = "98-drift-checks.sh:check_usr_over_etc" },
  { id = 2,  slug = "NO-MKDIR-IN-VAR",       applies_to = "both",  enforced_by = "98-drift-checks.sh:check_no_mkdir_in_var" },
  { id = 3,  slug = "BOUND-IMAGES",          applies_to = "bootc", enforced_by = "99-postcheck.sh:BOUND-IMAGES" },
  { id = 4,  slug = "BOOTC-CONTAINER-LINT",  applies_to = "bootc", enforced_by = "98-drift-checks.sh:check_lint_is_final" },
  { id = 5,  slug = "UNIFIED-AI-REDIRECTS",  applies_to = "both",  enforced_by = "99-postcheck.sh:UNIFIED-AI-REDIRECTS" },
  { id = 6,  slug = "UNPRIVILEGED-QUADLETS", applies_to = "bootc", enforced_by = "98-drift-checks.sh:check_quadlet_privilege" },
  { id = 7,  slug = "NO-HARDCODE",           applies_to = "both",  enforced_by = "98-drift-checks.sh:check_no_hardcode" },
  { id = 8,  slug = "SSOT-PROJECTION",       applies_to = "both",  enforced_by = "98-drift-checks.sh:check_projection_registry" },
  { id = 9,  slug = "ONE-CANONICAL-NAME",    applies_to = "both",  enforced_by = "98-drift-checks.sh:check_var_closure" },
  { id = 10, slug = "BARE-SAFE-ENV",         applies_to = "both",  enforced_by = "99-postcheck.sh:BARE-SAFE-ENV" },
  { id = 11, slug = "SECRETS-NEVER-IN-ENV",  applies_to = "bootc", enforced_by = "99-postcheck.sh:SECRETS-NEVER-IN-ENV" },
  { id = 12, slug = "BAKE-NOT-FETCH",        applies_to = "both",  enforced_by = "98-drift-checks.sh:check_dag_integrity,check_firstboot_degrade_open" },
  { id = 13, slug = "NATIVE-DROPINS",        applies_to = "both",  enforced_by = "98-drift-checks.sh:check_resolver_twin_parity" },
  { id = 14, slug = "TARGET-LANGUAGES",      applies_to = "both",  enforced_by = "98-drift-checks.sh:check_target_languages,check_agentpipe_mypy" },
  { id = 15, slug = "DOUBLE-REPO-TRIPLE-CHECK", applies_to = "both", enforced_by = "process:CLAUDE.md/AGENTS.md (both repos); parity via 98-drift-checks.sh checks 22+27" },
  { id = 16, slug = "ONE-TEMPLATE-PER-TYPE",    applies_to = "both", enforced_by = "98-drift-checks.sh:check_template_conformance" },
]

[laws.target_languages]
grandfathered_cs = [
  "usr/share/mios/windows/MiOS-Launcher.cs",
  "usr/share/mios/windows/MiosServiceTool.cs",
]

