[units."mios-mcp.service".Unit]
comment = "# AI-hint: Systemd unit file defining the mios-mcp.service daemon, which provides the Model Context Protocol (MCP) server for autonomous agents to access system context via a hardened, high-availability userspace listener.\n# AI-related: /usr/libexec/mios/mcp-init.sh, /usr/libexec/mios/mcp-server-runner, mios-ai, redis.service"
Description = "'MiOS' Agent Context Service (MCP)"
comment2 = "# High-availability context provider for autonomous agents. Pure\n# userspace daemon (no kernel/audit/hardware coupling) so it runs on\n# every MiOS shape -- bare-metal, Hyper-V, QEMU, WSL, Podman-WSL.\n# The previous `ConditionVirtualization=!container` would silently skip\n# WSL, since systemd reports WSL as a `container` virt variant."
After = "network.target redis.service"
Wants = "redis.service"

[units."mios-mcp.service".Service]
Type = "simple"
User = "mios-ai"
Group = "mios-ai"
comment5 = "# The runner reads MIOS_PORTS_MCP and MIOS_AI_ENDPOINT under set -u; the\n# resolver-rendered install.env is where they come from."
EnvironmentFile = "-/etc/mios/install.env"
comment = "# Execution wrapper that verifies SQLite vaults exist before starting the MCP listener"
ExecStartPre = "/usr/libexec/mios/mcp-init.sh"
ExecStart = "/usr/libexec/mios/mcp-server-runner"
Restart = "always"
RestartSec = "5"
comment2 = "# Security hardening: isolate the MCP server from writing to the core OS"
ProtectSystem = "strict"
ProtectHome = "read-only"
ReadWritePaths = "/var/lib/mios/mcp /var/log/mios/mcp"
RuntimeDirectory = "mios-tmux"
RuntimeDirectoryMode = "0700"
KillMode = "control-group"
UMask = "0077"
comment3 = "# Hardening parity with sibling mios-* daemons (log-watcher, cron-\n# director, hermes-browser) -- consolidation pass 2026-05-15."
PrivateTmp = "true"
NoNewPrivileges = "true"
comment4 = "# Drain timeout: MCP serves a long-lived TCP socket but in-flight\n# context requests are sub-second; 30 s is generous."
TimeoutStopSec = "30s"

[units."mios-mcp.service".Install]
WantedBy = "multi-user.target"


[units."mios-opencode-gateway.service".Unit]
comment = "# AI-hint: Systemd unit that hosts the opencode-gateway on port 8633, providing a standard OpenAI-compatible /v1 API shim for the opencode CLI to enable multi-agent fan-out and local inference via mios-llm-light.\n# AI-related: /usr/lib/mios/agents/opencode-gateway/server.py, /usr/lib/mios/agents/opencode/bin/opencode, /usr/lib/mios/agents/.venv, mios-llm-light.service\n# R8: dropped After=mios-ai-firstboot.service -- the coder gateway rides the venv +\n# the light inference lane (mios-llm-light), NOT the boot-time model fetch."
Description = "'MiOS' OpenCode /v1 gateway (OpenAI adapter fronting the opencode CLI)"
Documentation = "file:///usr/lib/mios/agents/opencode-gateway/server.py"
After = "network-online.target mios-llm-light.service"
Wants = "network-online.target mios-llm-light.service"
comment2 = "# Skip cleanly if the opencode binary never landed (build-time fetch failure)"
ConditionPathExists = "/usr/lib/mios/agents/opencode/bin/opencode"

[units."mios-opencode-gateway.service".Service]
Type = "simple"
User = "mios-ai"
Group = "mios-ai"
WorkingDirectory = "/var/lib/mios/opencode-gateway/work"
Environment = [
  "HOME=/var/lib/mios/opencode-gateway/work",
  "MIOS_PORTS_OPENCODE_GATEWAY=${MIOS_PORTS_OPENCODE_GATEWAY:-8780}",
  "MIOS_OPENCODE_HOST=127.0.0.1",
  "MIOS_OPENCODE_BIN=/usr/lib/mios/agents/opencode/bin/opencode",
  "MIOS_OPENCODE_MODEL=mios-opencode:latest",
  "MIOS_OPENCODE_PROVIDER=local",
  "MIOS_OPENCODE_CONFIG=/etc/mios/opencode/opencode.json",
  "MIOS_OPENCODE_TIMEOUT_S=90",
]
ExecStart = "/usr/lib/mios/agents/.venv/bin/python3 -u /usr/lib/mios/agents/opencode-gateway/server.py"
Restart = "on-failure"
RestartSec = "10s"
TimeoutStartSec = "30s"
NoNewPrivileges = "true"
PrivateTmp = "true"
ProtectSystem = "strict"
ProtectHome = "true"
ReadWritePaths = "/etc/mios /var/lib/mios"
ProtectKernelTunables = "true"
ProtectKernelModules = "true"
ProtectControlGroups = "true"
RestrictSUIDSGID = "true"
LockPersonality = "true"

[units."mios-opencode-gateway.service".Install]
WantedBy = "multi-user.target"


[units."mios-hermes-browser.service".Unit]
Description = "'MiOS' Hermes-Browser (ChromeDev w/ CDP for Hermes-Agent)"
Documentation = "https://chromedevtools.github.io/devtools-protocol/"
After = "mios-agent-pipe.service"
Wants = "mios-agent-pipe.service"
comment2 = "# ChromeDev flatpak must be installed (system or user scope). If\n# missing, the unit no-ops cleanly instead of crash-looping."
ConditionPathExists = ["|/var/lib/flatpak/app/org.chromium.Chromium", "|%h/.local/share/flatpak/app/org.chromium.Chromium", "|/var/lib/flatpak/app/com.google.ChromeDev", "|%h/.local/share/flatpak/app/com.google.ChromeDev"]

[units."mios-hermes-browser.service".Service]
Type = "simple"
User = "mios-ai"
Group = "mios-ai"
comment = "# Flatpak needs HOME to bootstrap its per-user state dir."
Environment = [
  "HOME=/var/lib/mios/hermes",
  "XDG_RUNTIME_DIR=/run/mios-hermes-browser",
  "HERMES_BROWSER_HEADLESS=1",
  "NO_AT_BRIDGE=1",
]
RuntimeDirectory = "mios-hermes-browser"
RuntimeDirectoryMode = "0700"
StateDirectory = "mios/hermes-browser/profile"
StateDirectoryMode = "0700"
ExecStart = "/usr/libexec/mios/mios-hermes-browser start"
Restart = "on-failure"
RestartSec = "5s"
TimeoutStopSec = "30s"
NoNewPrivileges = "true"
PrivateTmp = "false"

[units."mios-hermes-browser.service".Install]
WantedBy = "multi-user.target"


[units."mios-hermes-browser-worker.service".Unit]
comment = "# AI-hint: Systemd unit for a SECOND headless ChromeDev flatpak providing a dedicated CDP endpoint at 127.0.0.1:9223 (own profile dir profile-w2) for the Hermes WORKER (:8643), so the worker's browser_* tool loop never stomps the primary :9222 browser's first-page target / cookies.\n# AI-related: /usr/libexec/mios/mios-hermes-browser, hermes-worker.service, mios-hermes-browser.service, mios-ai, com.google.ChromeDev\n# /usr/lib/systemd/system/mios-hermes-browser-worker.service\n#\n# A SECOND headless ChromeDev (com.google.ChromeDev flatpak) with CDP on\n# 127.0.0.1:9223 -- the dedicated browser for the Hermes WORKER (:8643).\n# Distinct from the primary :9222 browser (mios-hermes-browser.service): the CDP\n# supervisor attaches to the FIRST page target."
Description = "'MiOS' Hermes-Browser-Worker (ChromeDev CDP :9223 for the worker)"
Documentation = "https://chromedevtools.github.io/devtools-protocol/"
After = "hermes-worker.service"
Wants = "hermes-worker.service"
ConditionPathExists = ["|/var/lib/flatpak/app/org.chromium.Chromium", "|%h/.local/share/flatpak/app/org.chromium.Chromium", "|/var/lib/flatpak/app/com.google.ChromeDev", "|%h/.local/share/flatpak/app/com.google.ChromeDev"]

[units."mios-hermes-browser-worker.service".Service]
Type = "simple"
User = "mios-ai"
Group = "mios-ai"
Environment = [
  "HOME=/var/lib/mios/hermes-worker",
  "XDG_RUNTIME_DIR=/run/mios-hermes-browser-worker",
  "HERMES_BROWSER_HEADLESS=1",
  "HERMES_BROWSER_CDP_PORT=${MIOS_PORTS_CHROME_CDP_WORKER:-9223}",
  "HERMES_BROWSER_PROFILE_DIR=/var/lib/mios/hermes-browser/profile-w2",
  "HERMES_BROWSER_LOG=/var/lib/mios/hermes-browser/launch-w2.log",
  "NO_AT_BRIDGE=1",
]
RuntimeDirectory = "mios-hermes-browser-worker"
RuntimeDirectoryMode = "0700"
StateDirectory = "mios/hermes-browser/profile-w2"
StateDirectoryMode = "0700"
ExecStart = "/usr/libexec/mios/mios-hermes-browser start"
Restart = "on-failure"
RestartSec = "5s"
TimeoutStopSec = "30s"
NoNewPrivileges = "true"
PrivateTmp = "false"

[units."mios-hermes-browser-worker.service".Install]
WantedBy = "multi-user.target"


[units."mios-policy-arbiter.service".Unit]
Description = "'MiOS' out-of-process HITL policy arbiter (WS-9)"
After = "network-online.target mios-agent-pipe.service"
Wants = "network-online.target"
ConditionPathExists = "/usr/libexec/mios/mios-policy-arbiter"

[units."mios-policy-arbiter.service".Service]
Type = "simple"
User = "mios-ai"
Group = "mios-ai"
Environment = "MIOS_AGENT_PIPE_DIR=/usr/lib/mios/agent-pipe"
EnvironmentFile = "-/etc/mios/install.env"
ExecStart = "/usr/bin/python3 /usr/libexec/mios/mios-policy-arbiter"
Restart = "on-failure"
RestartSec = "15s"
comment = "# Hardening: a stateless loopback decision service needs nothing but Python."
NoNewPrivileges = "true"
ProtectSystem = "strict"
ProtectHome = "true"
PrivateTmp = "true"

[units."mios-policy-arbiter.service".Install]
WantedBy = "multi-user.target"


[units."mios-finetune-serve.service".Unit]
comment = "# AI-hint: Systemd unit to host the fine-tuned refiner model as an OpenAI /v1-compatible endpoint on port 11438, allowing the agent-pipe to swap between the high-quality transformer-served adapter and the faster llama.cpp path.\n# AI-related: /usr/libexec/mios/mios-finetune-serve, network-online.target\n# 'MiOS' fine-tune serve -- serves the trained role adapter (base + LoRA) as an\n# OpenAI /v1 endpoint so the fine-tuned refiner can be adopted/A-B'd\n# in the agent-pipe. OPT-IN: NOT enabled by default (the transformers-served 2B is\n# correct but slower than the GGUF lane on the hot path; enable to evaluate)."
Description = "'MiOS' fine-tune serve (base+adapter refiner backend)"
After = "network-online.target"
Wants = "network-online.target"

[units."mios-finetune-serve.service".Service]
Type = "simple"
User = "mios"
Group = "mios"
Environment = ["HF_HOME=/var/home/mios/.cache/huggingface", "MIOS_FINETUNE_SERVE_PORT=${MIOS_PORT_FINETUNE_SERVE:-11438}"]
ExecStart = "/var/lib/mios/finetune/venv/bin/python /usr/libexec/mios/mios-finetune-serve"
Restart = "on-failure"
RestartSec = "5"
comment = "# model load + first request can take ~40s on a cold GPU"
TimeoutStartSec = "180"

[units."mios-finetune-serve.service".Install]
WantedBy = "multi-user.target"


[units."mios-pgvector-backup.service".Unit]
Description = "'MiOS' daily pg_dump backup of the unified agent-plane datastore (pgvector)"
Documentation = "file:///usr/lib/systemd/system/mios-pgvector-backup.service"
After = "mios-pgvector.service"
Wants = "mios-pgvector.service"
comment2 = "# Same virtualization guard as the pgvector container: the DB only runs on\n# bare-metal/WSL (not a nested container), so there's nothing to back up there."
ConditionVirtualization = ["|!container", "|wsl"]

[units."mios-pgvector-backup.service".Service]
Type = "oneshot"
comment = "# SSOT env: MIOS_PGVECTOR_USER / MIOS_PGVECTOR_DB / MIOS_PORTS_PGVECTOR / MIOS_PG_BACKUP_*\n# all flow from mios.toml [pgvector] -> userenv.sh. '-' = tolerate absence\n# (degrade-open to the inline defaults below)."
EnvironmentFile = "-/etc/mios/userenv.sh"
comment2 = "# Inline-default the knobs so the unit is correct even with no env file present."
Environment = [
  "MIOS_PGVECTOR_BACKUP_ENABLE=true",
  "MIOS_PGVECTOR_BACKUP_DIR=/var/lib/mios/backups",
  "MIOS_PGVECTOR_BACKUP_KEEP=7",
  "MIOS_PGVECTOR_USER=mios",
  "MIOS_PGVECTOR_DB=mios",
  "MIOS_PORTS_PGVECTOR=${MIOS_PORTS_PGVECTOR:-8600}",
]
comment3 = "# Runs as root to `podman exec` into the mios-ai.pod pgvector container.\n# ProtectSystem=strict / ReadWritePaths dropped so podman can reach its runtime."
ProtectHome = "true"
PrivateTmp = "true"
ExecStart = """/bin/sh -c '\
  case "$$MIOS_PGVECTOR_BACKUP_ENABLE" in \
    0|false|False|FALSE|no|off) echo "mios-pgvector-backup: disabled (MIOS_PGVECTOR_BACKUP_ENABLE=$$MIOS_PGVECTOR_BACKUP_ENABLE)"; exit 0 ;; \
  esac; \
  DIR="$$MIOS_PGVECTOR_BACKUP_DIR"; [ -z "$$DIR" ] && DIR="/var/lib/mios/backups"; \
  KEEP="$$MIOS_PGVECTOR_BACKUP_KEEP"; [ -z "$$KEEP" ] && KEEP="7"; \
  case "$$KEEP" in *[!0-9]*|"") KEEP=7 ;; esac; \
  [ "$$KEEP" -lt 1 ] && KEEP=1; \
  PORT="$$MIOS_PORTS_PGVECTOR"; [ -z "$$PORT" ] && PORT="8432"; \
  USR="$$MIOS_PGVECTOR_USER"; [ -z "$$USR" ] && USR="mios"; \
  DB="$$MIOS_PGVECTOR_DB"; [ -z "$$DB" ] && DB="mios"; \
  if ! command -v podman >/dev/null 2>&1; then \
    echo "mios-pgvector-backup: podman not found on PATH -- skipping (need podman to exec pg_dump inside the pod)"; \
    exit 0; \
  fi; \
  mkdir -p "$$DIR" 2>/dev/null || true; \
  TS=$$(date -u +%%Y%%m%%dT%%H%%M%%SZ); \
  OUT="$$DIR/mios-pgvector-$$TS.sql.gz"; \
  RAW="$$DIR/.mios-pgvector-$$TS.sql.partial"; \
  ERR="$$DIR/.mios-pgbackup.err"; \
  rc=0; \
  podman exec mios-pgvector pg_dump -h 127.0.0.1 -p "$$PORT" -U "$$USR" --no-password "$$DB" >"$$RAW" 2>"$$ERR" || rc=$$?; \
  if [ "$$rc" -ne 0 ] || [ ! -s "$$RAW" ]; then \
    echo "mios-pgvector-backup: pg_dump failed (rc=$$rc, degrade-open): $$(tail -n1 "$$ERR" 2>/dev/null)"; \
    rm -f "$$RAW" "$$ERR" 2>/dev/null || true; \
    exit 0; \
  fi; \
  if gzip -c "$$RAW" >"$$OUT.partial" && mv -f "$$OUT.partial" "$$OUT"; then \
    chmod 0640 "$$OUT" 2>/dev/null || true; \
    echo "mios-pgvector-backup: wrote $$OUT"; \
  else \
    echo "mios-pgvector-backup: gzip failed (degrade-open)"; \
    rm -f "$$OUT.partial" "$$RAW" "$$ERR" 2>/dev/null || true; \
    exit 0; \
  fi; \
  rm -f "$$RAW" "$$ERR" 2>/dev/null || true; \
  N=$$(ls -1 "$$DIR"/mios-pgvector-*.sql.gz 2>/dev/null | wc -l); \
  if [ "$$N" -gt "$$KEEP" ]; then \
    ls -1t "$$DIR"/mios-pgvector-*.sql.gz 2>/dev/null | tail -n +$$((KEEP+1)) | while IFS= read -r f; do rm -f "$$f" && echo "mios-pgvector-backup: pruned $$f"; done; \
  fi; \
  exit 0'"""

[units."mios-pgvector-backup.service".Install]
WantedBy = "multi-user.target"

[units."mios-embed-backfill.service".Unit]
comment = "# AI-hint: Systemd unit that runs the mios_pipe.memory.embed_backfill worker to periodically re-embed database rows with stale or missing vector versions.\n# AI-related: /usr/lib/mios/agent-pipe/mios_pipe/memory/embed_backfill.py, mios-embed-backfill.timer, mios-pgvector.service, mios-llm-light.service\n# /usr/lib/systemd/system/mios-embed-backfill.service"
Description = "'MiOS' Embedding Backfill Worker"
Documentation = "file:///usr/lib/mios/agent-pipe/mios_pipe/memory/embed_backfill.py"
comment2 = "# R8: dropped After=mios-ai-firstboot.service -- the backfill worker needs pgvector\n# + the embedding lane (mios-llm-light), NOT the boot-time model fetch."
After = "mios-pgvector.service mios-llm-light.service mios-agent-pipe.service"
Requires = "mios-pgvector.service"

[units."mios-embed-backfill.service".Service]
Type = "oneshot"
EnvironmentFile = ["-/etc/mios/userenv.sh", "-/etc/mios/install.env"]
Environment = "PYTHONPATH=/usr/lib/mios/agent-pipe"
ExecStart = "/usr/lib/mios/agents/.venv/bin/python3 -u -m mios_pipe.memory.embed_backfill"
comment = "# Low-privilege execution"
User = "mios-ai"
Group = "mios-ai"
NoNewPrivileges = "true"
ProtectSystem = "strict"
ProtectHome = "true"
PrivateTmp = "true"

[units."mios-embed-backfill.service".Install]
WantedBy = "multi-user.target"

[units."mios-account-sync.service".Unit]
comment = "# AI-hint: Systemd unit that executes /usr/libexec/mios/mios-account-sync in daemon mode to keep local Linux accounts synchronized with PostgreSQL accounts and aliases.\n# AI-related: /usr/libexec/mios/mios-account-sync, mios-pgvector.service"
Description = "'MiOS' live PostgreSQL-to-OS user account sync daemon"
Documentation = "file:///usr/libexec/mios/mios-account-sync"
After = "mios-pgvector.service"
Requires = "mios-pgvector.service"
StartLimitIntervalSec = "300"
StartLimitBurst = "5"

[units."mios-account-sync.service".Service]
Type = "simple"
EnvironmentFile = "-/etc/mios/install.env"
comment = "# Ensure postgres container is ready before launching the daemon"
ExecStartPre = "/usr/bin/podman exec mios-pgvector pg_isready -q -h 127.0.0.1 -p ${MIOS_PORTS_PGVECTOR:-8600} -U mios -d mios"
ExecStart = "/usr/libexec/mios/mios-account-sync --daemon"
Restart = "always"
RestartSec = "10s"

[units."mios-account-sync.service".Install]
WantedBy = "multi-user.target"


[units."mios-userdb-render.service".Unit]
comment = "# AI-hint: Systemd unit that executes /usr/libexec/mios/mios-userdb-render to project PostgreSQL account records into systemd userdb JSON drop-ins.\n# AI-related: /usr/libexec/mios/mios-userdb-render, mios-pgvector.service"
Description = "'MiOS' PostgreSQL account systemd userdb drop-in renderer"
Documentation = "file:///usr/libexec/mios/mios-userdb-render"
After = "mios-pgvector.service"
Requires = "mios-pgvector.service"

[units."mios-userdb-render.service".Service]
Type = "oneshot"
EnvironmentFile = "-/etc/mios/install.env"
ExecStartPre = "-/usr/bin/podman exec mios-pgvector pg_isready -q -h 127.0.0.1 -p ${MIOS_PORTS_PGVECTOR:-8600} -U mios -d mios"
ExecStart = "/usr/libexec/mios/mios-userdb-render"
RemainAfterExit = "yes"

[units."mios-userdb-render.service".Install]
WantedBy = "multi-user.target"


[units."mios-ceph-bootstrap.service".Unit]



comment = "# AI-hint: Systemd unit to execute /usr/libexec/mios/ceph-bootstrap.sh script to initialize the Ceph cluster (first boot only).\n# AI-related: /usr/libexec/mios/ceph-bootstrap.sh, podman.socket, network-online.target, multi-user.target"
Description = "'MiOS' Ceph Cluster Bootstrap"
Documentation = "https://docs.ceph.com/en/latest/cephadm/"
ConditionVirtualization = "no"
ConditionPathExists = ["!/etc/ceph/ceph.conf", "!/var/lib/ceph/.bootstrapped"]
After = "network-online.target podman.socket"
Wants = "network-online.target podman.socket"
StartLimitIntervalSec = "0"

[units."mios-ceph-bootstrap.service".Service]
Type = "oneshot"
RemainAfterExit = "yes"
ExecStart = "/usr/libexec/mios/ceph-bootstrap.sh"
ExecStartPost = ["/usr/bin/touch /var/lib/ceph/.bootstrapped", "-/bin/chmod 0600 /etc/ceph/ceph.client.admin.keyring"]
TimeoutStartSec = "600"
StandardOutput = "journal+console"
StandardError = "journal+console"

[units."mios-ceph-bootstrap.service".Install]
WantedBy = "multi-user.target"

[units."mios-node.service".Unit]
