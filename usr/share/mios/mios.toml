[containers.mios-otelcol.Container]
ContainerName = "mios-otelcol"
Group = "${MIOS_OTELCOL_GID:-829}"
# Pinned: `all-in-one` is the Jaeger v1 line only (v2 ships as
# jaegertracing/jaeger), and :latest == 1.76.0. The tag decides which env model
# the two host-port vars below belong to, so it cannot float.
Image = "${MIOS_OTELCOL_IMAGE:-docker.io/jaegertracing/all-in-one:latest}"
# Jaeger v1 binds via viper AutomaticEnv with `-`/`.` -> `_`, so
# `collector.otlp.grpc.host-port` and `query.http-server.host-port` map to the
# two names below. Without them the SSOT keys named numbers nothing bound.
Environment = [
  "COLLECTOR_OTLP_ENABLED=true",
  "COLLECTOR_OTLP_GRPC_HOST_PORT=:${MIOS_PORTS_OTELCOL_OTLP:-8575}",
  "QUERY_HTTP_SERVER_HOST_PORT=:${MIOS_PORTS_OTELCOL_UI:-8580}"
]
Label = [
  "org.opencontainers.image.title=mios-otelcol",
  "org.opencontainers.image.url=http://localhost:${MIOS_PORTS_OTELCOL_UI:-8580}/",
  "io.podman_desktop.openInBrowser=http://localhost:${MIOS_PORTS_OTELCOL_UI:-8580}/"
]
Pod = "mios-webtools.pod"
User = "${MIOS_OTELCOL_UID:-829}"

[containers.mios-otelcol.Install]
WantedBy = "multi-user.target default.target"

[containers.mios-otelcol.Service]
Delegate = "yes"
Restart = "on-failure"
RestartSec = "10s"
TimeoutStartSec = "300s"

[containers.mios-otelcol.Unit]
After = "network-online.target mios-webtools-firstboot.service"
Description = "'MiOS' OpenTelemetry Collector and Jaeger Trace Viewer"
Wants = "network-online.target"

[containers.mios-piper.Unit]
# Image=localhost/: ordered behind the firstboot that guarantees local images
