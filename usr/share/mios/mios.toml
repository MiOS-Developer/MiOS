  "/etc/mios/install.env"
]
Restart = "on-failure"
RestartSec = "10s"
TimeoutStartSec = "300s"

[containers.mios-open-webui.Unit]
# After mios-cdi-detect.service: open-webui is in MIOS_AI_QUADLETS_DEFAULT so the
# image ships a baked AddDevice=nvidia.com/gpu=all drop-in even though the base
# needs no GPU; without ordering after cdi-detect it can start before
# mios-gpu-passthrough rewrites that to the CPU-only reset -> podman "CDI device
# not found" flap on a GPU-less/non-NVIDIA host. Mirrors mios-llm-light.
After = "network-online.target mios-agent-pipe.service mios-cdi-detect.service mios-webtools-firstboot.service"
ConditionPathExists = "/etc/mios/hermes/api.env"
Description = "'MiOS' Open WebUI"
Wants = "network-online.target mios-agent-pipe.service mios-cdi-detect.service"

[containers.mios-pgvector.Container]
ContainerName = "mios-pgvector"
Environment = [
  "POSTGRES_USER=${MIOS_PGVECTOR_USER:-mios}",
  "POSTGRES_PASSWORD=${MIOS_PGVECTOR_PASS:-mios}",
  "POSTGRES_DB=${MIOS_PGVECTOR_DB:-mios}",
  "PGDATA=/var/lib/postgresql/data/pgdata"
]
Exec = "postgres -c port=${MIOS_PORTS_PGVECTOR:-8600} -c listen_addresses=${MIOS_PG_BIND_ADDR:-127.0.0.1} -c hnsw.iterative_scan=${MIOS_PGVECTOR_HNSW_ITERATIVE_SCAN:-strict_order} -c hnsw.max_scan_tuples=${MIOS_PGVECTOR_HNSW_MAX_SCAN_TUPLES:-20000} -c hnsw.scan_mem_multiplier=${MIOS_PGVECTOR_HNSW_SCAN_MEM_MULTIPLIER:-1}"
Group = "${MIOS_SERVICES_PGVECTOR_GID:-826}"
Image = "${MIOS_PGVECTOR_IMAGE:-docker.io/pgvector/pgvector:pg18}"
Label = [
  "org.opencontainers.image.title=mios-pgvector",
  "org.opencontainers.image.documentation=https://github.com/pgvector/pgvector"
]
Pod = "mios-ai.pod"
User = "${MIOS_SERVICES_PGVECTOR_UID:-826}"
Volume = [
  "${MIOS_PGVECTOR_DATA_DIR:-/var/lib/mios/pgvector}:/var/lib/postgresql/data:Z",
  "/usr/share/mios/postgres/schema-init.sql:/docker-entrypoint-initdb.d/10-mios-schema.sql:ro",
  "${MIOS_PGVECTOR_RESTORE_SQL:-/var/lib/mios/pgvector-restore.sql}:/docker-entrypoint-initdb.d/20-mios-restore.sql:ro"
]
EnvironmentFile = "/etc/mios/install.env"

[containers.mios-pgvector.Install]
WantedBy = "multi-user.target default.target"

[containers.mios-pgvector.Service]
Delegate = "yes"
EnvironmentFile = "/etc/mios/install.env"
ExecStartPost = "/usr/bin/bash -c 'for i in $(seq 1 45); do /usr/bin/podman exec mios-pgvector pg_isready -p ${MIOS_PORTS_PGVECTOR:-8600} -U ${MIOS_PGVECTOR_USER:-mios} -d ${MIOS_PGVECTOR_DB:-mios} -q && break; sleep 2; done; /usr/bin/podman exec mios-pgvector psql -p ${MIOS_PORTS_PGVECTOR:-8600} -v ON_ERROR_STOP=0 -U ${MIOS_PGVECTOR_USER:-mios} -d ${MIOS_PGVECTOR_DB:-mios} -f /docker-entrypoint-initdb.d/10-mios-schema.sql || true'"
Restart = "on-failure"
RestartSec = "10s"
TimeoutStartSec = "180s"

[containers.mios-pgvector.Unit]
After = "network-online.target"
ConditionVirtualization = [
  "|!container",
  "|wsl"
]
Description = "'MiOS' PostgreSQL + pgvector (unified agent-plane datastore, FOSS)"
Wants = "network-online.target"

[containers.mios-pxe-hub.Container]
