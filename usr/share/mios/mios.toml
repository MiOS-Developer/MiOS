[units."mios-additionalimagestores-perms.path".Unit]
comment = "# AI-hint: Systemd path unit that monitors container storage directories for permission changes and triggers mios-additionalimagestores-perms.service to restore go+rX permissions on image store subdirectories.\n# AI-related: mios-additionalimagestores-perms, mios-additionalimagestores-perms.service, multi-user.target\n# Path-watcher companion to mios-additionalimagestores-perms.service.\n# Re-runs the chmod whenever any of the additional image store's per-\n# driver subdirs change (e.g. podman extracts new layers and resets\n# the perms back to 0700 -- happens on first runtime pull into the\n# additional store, though that's atypical since this store is built\n# at OCI bake time and meant to be read-only at runtime).\n#\n# Together with the .service unit (runs at boot) this makes the\n# go+rX state self-healing: any way the perms get reset, they snap\n# back within seconds."
Description = "'MiOS': watch additionalimagestores for perm changes; retrigger chmod"
ConditionPathIsDirectory = "/usr/lib/containers/storage"

[units."mios-additionalimagestores-perms.path".Path]
PathChanged = [
  "/usr/lib/containers/storage/overlay-images",
  "/usr/lib/containers/storage/overlay-containers",
  "/usr/lib/containers/storage/overlay-layers",
  "/usr/lib/containers/storage/libpod",
]
Unit = "mios-additionalimagestores-perms.service"

[units."mios-additionalimagestores-perms.path".Install]
