# Image profiles (ADR-0025): every MiOS image kind is the one pipeline run
# under a profile. A profile selects phases from [build.phases].list and
# sections from [packages]; `extends` unions a parent's selection and `all`
# selects everything. `floor` is the profile every other one must contain.
# Read by `miosd build --list --profile`; gate: check_profile_integrity.
[profiles]
default = "full"

# floor = true marks the one profile every other non-`all` profile must contain.
# Each profile lists the image kinds it serves; a kind in several profiles unions them.
[profiles.core]
floor            = true
summary          = "the smallest MiOS that is still MiOS: SSOT, miosd, agent-pipe, the datastore, the verbs"
package_sections = ["repos", "base", "containers", "build-toolchain", "self-build", "utils", "ai", "critical"]
phases           = ["system-files-overlay", "materialize-build-ctx", "repos", "locale-theme",
                    "user", "hostname", "subuid-alloc", "generate-quadlets", "render-quadlets",
                    "render-ports", "services", "mios-dropin-fanout", "tools", "finalize",
                    "cleanup", "ssot-lint", "drift-checks", "postcheck"]

# Every image kind is the full image: a devcontainer, Codespace or cloud
# environment runs [image].ref itself (.devcontainer/Containerfile adds only
# container wiring), so no kind gets a subset. A cloud deployment skips runtime
# model pulls and desktop installs by configuration ([deployment.cloud]), not by
# a different build.
[profiles.full]
summary = "every enabled section and every registered phase"
all     = true
targets = ["oci", "wsl2", "devcontainer", "cloud", "codespace"]

# Every way MiOS can be deployed, named once. The targets and recipes existed;
# what did not exist was a statement of the matrix, so [deploy].artifacts listed
# two of the seven formats the build system actually produces and nothing
# noticed. A format is declared here or it is not supported.
[deploy.formats]
# The shared bootc-image-builder recipe the disk formats sit on. Not a format.
shared_recipe = "config/artifacts/bib.toml"

