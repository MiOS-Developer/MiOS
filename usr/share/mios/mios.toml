  "RAG_OPENAI_API_BASE_URL=http://host.containers.internal:${MIOS_PORTS_LLM_LIGHT:-8500}/v1",
  "RAG_OPENAI_API_KEY=sk-noop",
  "TASK_MODEL_EXTERNAL=hermes-agent",
  "ENABLE_TITLE_GENERATION=True",
  "ENABLE_TAGS_GENERATION=True",
  "ENABLE_FOLLOW_UP_GENERATION=True",
  "ENABLE_AUTOCOMPLETE_GENERATION=True",
  "\"TITLE_GENERATION_PROMPT_TEMPLATE=Output a 3 to 6 word title for this chat, in the same language the chat used. Title only, no quotes, no preamble, no thinking. Chat:\\n{{MESSAGES:END:2}}\"",
  "\"TAGS_GENERATION_PROMPT_TEMPLATE=Output 1 to 3 short topic tags for this chat (single words or hyphenated, in the chat language). JSON only: {\\\"tags\\\":[\\\"\\\",\\\"\\\"]}. Chat:\\n{{MESSAGES:END:4}}\"",
  "\"FOLLOW_UP_GENERATION_PROMPT_TEMPLATE=Suggest 3 short follow up actions the user might want next, grounded in the CURRENT chat content and the operator's CURRENT system state. Each is a single phrase or short imperative the user could click, in the same language and tone the chat used. JSON only: {\\\"follow_ups\\\":[\\\"\\\",\\\"\\\",\\\"\\\"]}. Chat:\\n{{MESSAGES:END:6}}\"",
