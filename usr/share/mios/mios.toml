windows     = "/mnt/c/Windows/System32/control.exe {panel}"

[recipes.open-settings-uri]
description = "Open a Windows Settings page by ms-settings: URI (display, sound, network, system, privacy-microphone, gaming-gamebar, ...)."
args        = ["page"]
permission  = "read"
windows     = "/mnt/c/Windows/System32/cmd.exe /c start ms-settings:{page}"

[recipes.run-powershell]
description = "Run a PowerShell command and return stdout (READ-ONLY by default; the agent should only emit read commands like Get-* / Test-* / Resolve-* / Measure-*)."
args        = ["cmd"]
permission  = "read"
windows     = "/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -NonInteractive -Command {cmd}"

[recipes.run-bash]
description = "Run a bash command and return stdout (READ-ONLY)."
args        = ["cmd"]
permission  = "read"
linux       = "bash -lc {cmd}"

[recipes.shutdown]
description = "Shutdown the host (WRITE -- requires MIOS_OS_RECIPE_WRITE=1)."
args        = ["delay_sec"]
permission  = "write"
linux       = "shutdown -h +{delay_sec}"
windows     = "/mnt/c/Windows/System32/shutdown.exe /s /t {delay_sec}"

[recipes.reboot]
description = "Reboot the host (WRITE)."
args        = ["delay_sec"]
permission  = "write"
linux       = "shutdown -r +{delay_sec}"
windows     = "/mnt/c/Windows/System32/shutdown.exe /r /t {delay_sec}"

[recipes.lock-screen]
description = "Lock the workstation."
args        = []
permission  = "read"
linux       = "loginctl lock-session"
windows     = "/mnt/c/Windows/System32/rundll32.exe user32.dll,LockWorkStation"

[recipes.list-drives]
description = "List mounted drives / volumes."
args        = []
permission  = "read"
linux       = "lsblk -o NAME,SIZE,TYPE,MOUNTPOINT,FSTYPE -J"
windows     = "/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command 'Get-Volume | ConvertTo-Json'"

[recipes.os-control-health]
description = "Probe the Windows OS-control plane (in-session executor :8950 + WSL-interop) and report typed JSON status {executor, interop, blind, reason}. Use to EXPLAIN why a Windows control/recipe action (show-network, windows_desktop_click, launch_windows_app, etc.) returned no data / exit -1 -- if executor is down, tell the operator the control plane is offline rather than guessing."
args        = []
permission  = "read"
linux       = "/usr/libexec/mios/mios-oscontrol-health"

[recipes.show-network]
description = "Show active network adapters + IPs."
args        = []
permission  = "read"
linux       = "ip -j addr"
windows     = "/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command 'Get-NetIPConfiguration | ConvertTo-Json'"

[recipes.show-process]
description = "Show top processes by CPU / memory."
args        = ["sort"]
permission  = "read"
linux       = "ps -eo pid,pcpu,pmem,comm --sort=-{sort} | head -20"
windows     = "/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command 'Get-Process | Sort-Object -Descending -Property {sort} | Select-Object -First 20 Id,CPU,WorkingSet64,ProcessName | ConvertTo-Json'"

[recipes.disk-usage]
description = "What's using disk space: filesystem fill (df) plus the largest top-level directories under / (du), ranked. Use for 'what's taking up space / disk full / largest folders'."
args        = []
permission  = "read"
linux       = "df -h -x tmpfs -x devtmpfs -x overlay; echo '== largest dirs under / =='; du -h -x --max-depth=1 / 2>/dev/null | sort -rh | head -20"
windows     = "/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command 'Get-PSDrive -PSProvider FileSystem | Select-Object Name,Used,Free | ConvertTo-Json'"

[recipes.service-status]
description = "systemctl is-active + status snapshot for a Linux service (READ). Pass the unit name as `service`."
args        = ["service"]
permission  = "read"
linux       = "systemctl is-active {service}; systemctl show {service} --no-pager -p Id,Description,LoadState,ActiveState,SubState,UnitFileState,MainPID,ExecMainStatus,ActiveEnterTimestamp"

[recipes.copy-to-clipboard]
description = "Copy a literal string to the system clipboard."
args        = ["text"]
permission  = "read"
linux       = "printf %s {text} | wl-copy"
windows     = "/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command Set-Clipboard -Value {text}"

[recipes.read-clipboard]
description = "Read the current clipboard contents."
args        = []
permission  = "read"
linux       = "wl-paste"
windows     = "/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command Get-Clipboard"

[recipes.toast]
description = "Show a notification toast."
args        = ["title", "message"]
permission  = "read"
linux       = "notify-send {title} {message}"
windows     = "/mnt/c/Windows/System32/WindowsPowerShell/v1.0/powershell.exe -NoProfile -Command New-BurntToastNotification -Text {title},{message}"

[skills]
enable                  = true
# Minimum sequence length the miner considers (N-gram length floor).
# 2 = the smallest pair worth codifying (open_app -> focus_window).
min_length              = 2
# Maximum sequence length the miner emits as a candidate skill.
# Past ~8 verbs the pattern is usually a unique session, not a
# repeatable skill.
max_length              = 8
# Minimum number of times a sequence must appear in the lookback
# window before the miner promotes it to a candidate row. Lower =
# more candidates + more noise; raise for high-traffic deployments.
min_support             = 3
window_hours            = 168
auto_promote_threshold  = 0.85
mine_interval_minutes   = 60
seed_catalog_dir        = "/usr/share/mios/skills"
local_catalog_dir       = "/var/lib/mios/skills"
# P2 outcome-gated auto-promotion: a mined skill auto-
# promotes only if its recorded skill_invocation success rate clears the floor
# AND it has enough samples (else samples are too few to block). mios-skills
# reads the matching MIOS_SKILLS_* env (SSOT-routed via userenv.sh).
min_success_rate    = 0.7   # P2: a mined skill auto-promotes only if its skill_invocation success rate >= this
min_success_samples = 3     # ...and it has at least this many recorded invocations (else not blocked)

[reliability]
gate_enabled         = false   # master switch for the pass^k promotion gate (off = legacy promote)
pass_and_k_count     = 3       # k replays an ordinary skill promotion must ALL pass
pass_and_k_dgm_count = 5       # stricter k for a DGM-class self-rewrite (promote --dgm)

[frontier]
# Orchestrator (main panel): decomposes, dispatches, monitors, keeps both lanes fed.
orch_engine = "claude"
orch_model  = "claude-sonnet-5"
orch_effort = "high"
# Lane A sub-agent = broad framework + ~80% of the work.
lane_a_engine = "claude"
lane_a_model  = "claude-opus-4-8"
lane_a_effort = "xhigh"
lane_a_role   = "framework + ~80%"
# Lane B sub-agent = finalize (last ~20%).
lane_b_engine = "agy"
lane_b_model  = "Gemini 3.5 Flash (High)"    # LOG-VERIFIED (task_3173): confirmed via agy --log-file resolution trace -
                                              # `agy models` display string is the only accepted --model value; bare
                                              # slugs (gemini-3.5-flash, gemini-3.5-flash-high, gemini-flash-3.5) all
                                              # fail model_config_manager resolution and silently fall back to the
                                              # (Medium) effort tier. Effort is baked into the model name itself, so
                                              # agy_effort_flag stays empty (no separate effort flag exists for agy).
lane_b_effort = "high"
lane_b_role   = "finalize (last ~20%)"
lane_b_fallback_engine = "claude"
lane_b_fallback_model  = "claude-sonnet-5"
lane_b_fallback_effort = "high"
# ON now: agy Gemini quota-blocked => Lane B degrades to the Claude engine above so
# finalize work never stalls. Flip to false when the Gemini quota returns.
lane_b_prefer_fallback = true
claude_effort_flag = "--effort {e}"
agy_effort_flag    = ""
gemini_effort_flag = ""
stream_to_reasoning = false
stream_path = "/var/lib/mios/hermes-tail/frontier/frontier.jsonl"

[agent_pipe]
tool_loop_limit = 20
reflexion_limit = 2
tool_max_iters = 15
replan_max = 5
no_progress_window = 2
max_consecutive_failures = 3
wall_clock_budget_s = 90
reflexion_enable = true
endpoint       = "http://localhost:${MIOS_PORTS_AGENT_PIPE}/v1"
backend        = "http://localhost:${MIOS_PORTS_HERMES}/v1"   # hermes-agent OpenAI gateway
backend_model  = "hermes-agent"               # the model id hermes-agent advertises
enable         = true
client_tools_passthrough = true
tool_backend             = "http://localhost:${MIOS_PORTS_LLM_LIGHT}/v1"
tool_backend_model       = "granite4.1:8b"
ingress_key              = ""


# WS-9 unified agent-plane datastore (PostgreSQL + pgvector, FOSS). The sole
# agent datastore since the WS-A3 cutover (concepts/postgres-pgvector-
# unification.md). Read by mios_pg / `mios-db --pg` + the quadlet (MIOS_PG_* via
# userenv.sh). Port from [ports].pgvector. Local-only defaults.
[pgvector]
memory_guard_mode = "log"
# WS-A15: pluggable agent-memory backend. The recall path routes through the
# MemoryProvider seam (mios_memory); "pgvector" (default) is a verbatim
# pass-through to the mios_pg client. A future backend registers under a new
# name; an UNKNOWN name fails closed (factory raises) -> the pipe logs + falls
# back to pgvector at startup. Env override: MIOS_MEMORY_PROVIDER.
memory_provider = "pgvector"
memguard_judge_mode = "model"
host        = "127.0.0.1"
user        = "mios"
pass        = "mios"
db          = "mios"
data_dir    = "/var/lib/mios/pgvector"
restore_sql = "/var/lib/mios/pgvector-restore.sql"
schema_init = "/usr/share/mios/postgres/schema-init.sql"
embed_model = "nomic-embed-text"   # 768-dim, OWUI-compat (vector(768))
enable      = true
db_backend  = "postgres"
rls_mode    = "off"
rls_enable  = false
pool_enable = false
pool_min    = 0
pool_max    = 8
hnsw_iterative_scan      = "strict_order"
# Approximate upper bound on tuples visited during an iterative scan -- the cap
# that stops a pathologically selective filter from walking the whole index.
# pgvector default; raise for higher recall on very selective filters. Env:
# MIOS_PGVECTOR_HNSW_MAX_SCAN_TUPLES.
hnsw_max_scan_tuples     = 20000
# Memory budget for the relaxed_order discarded-candidate heap, as a multiple of
# work_mem (consulted only under relaxed_order; inert under strict_order).
# pgvector default. Env: MIOS_PGVECTOR_HNSW_SCAN_MEM_MULTIPLIER.
hnsw_scan_mem_multiplier = 1
emb_model       = "nomic-embed-text"
emb_version     = "nomic-768-v1"   # bump on a model/dim change -> backfill re-embeds
scratch_persist = true             # durable per-chat working memory (survives restart)
backfill_batch  = 50               # re-embed batch size (mios_embed_backfill.plan_batches)
backup_enable  = true
# Where dumps land. Declared as a /var path via usr/lib/tmpfiles.d (NO-MKDIR-IN-
# VAR) by the backup unit's owner -- this key only names the dir; it is not
# created at build time here.
backup_dir     = "/var/lib/mios/backups"
# How many timestamped dumps to retain before pruning oldest. 7 = a week of
# daily snapshots. Read by shell/timer via MIOS_PGVECTOR_BACKUP_KEEP (userenv slot +
# render allowlist below).
backup_keep    = 7
# Bind the Postgres listener to loopback only. true (default) = 127.0.0.1 (the
# confined non-root agent-pipe + mios-pg-query reach it over loopback; nothing
# off-box can). userenv maps this to a concrete bind address (MIOS_PG_BIND_ADDR)
# the quadlet renders; flip false to bind 0.0.0.0 (off-box exposure -- only for
# a deliberately federated deployment).
listen_loopback = true

[lsfs]
enable      = true
root_dir    = "/var/lib/mios/lsfs"
embed_model = "nomic-embed-text"
max_versions = 10

[offline]
enable            = false
rpm_mirror_dir    = "/usr/share/mios/vendored/rpm-mirror"
fallback_to_online = true

[llamacpp]
enable     = true   # additive + gated; flip on after GGUFs baked + verified live
slot_dir   = "/var/lib/mios/llamacpp/slots"
models_dir = "/usr/share/mios/llamacpp/models"
config     = "/usr/share/mios/llamacpp/mios-llm-light.yaml"
# --threads for the mios-cpu-node CPU lane (rendered into its quadlet Exec). Sized
# to leave headroom on the box; SSOT-wired alongside ports.cpu_node
# (was a DEAD ${MIOS_LLAMACPP_CPU_NODE_THREADS} placeholder, never in the render allowlist).
cpu_node_threads = 14
bake_models = "granite-4.1-8b.gguf=unsloth/granite-4.1-8b-GGUF:granite-4.1-8b-Q4_K_M.gguf,lfm2-700m.gguf=LiquidAI/LFM2-700M-GGUF:LFM2-700M-Q4_K_M.gguf,embeddinggemma-300m-qat-q8_0.gguf=ggml-org/embeddinggemma-300m-qat-q8_0-GGUF:embeddinggemma-300m-qat-Q8_0.gguf"


[enhanced_session]
enabled    = true
port       = 13389
user       = ""                    # empty = inherits [identity].username
resolution = "auto"                # "auto" lets mstsc pick from Windows display; otherwise WxH (e.g. "1920x1080")


[flatpak]
prefer_beta      = true       # check flathub-beta first; fall back to flathub
default_remote   = "flathub"  # tail-fallback remote when no beta available
default_scope    = "system"   # system | user
noninteractive   = true       # all install/update operations are headless

[appearance]
gtk_theme        = "adw-gtk3-dark"              # GTK3 + libadwaita color-scheme target
adw_color_scheme = "prefer-dark"                # ADW_DEBUG_COLOR_SCHEME for libadwaita apps
cursor_theme     = "Bibata-Modern-Classic"      # XCURSOR_THEME (matches /usr/share/icons/)
cursor_size      = 24                           # XCURSOR_SIZE. 24 matches the Windows-side CursorBaseSize -- 16px read SMALLER than Windows Bibata under x11/Xwayland. Mirrors [theme.cursor_linux].size.

[graphics]
gsk_renderer       = "ngl"        # modern GTK4 node-GL renderer (was cairo)
force_software_gl  = false        # use real hardware GL via /dev/dri (was true)
disable_vulkan     = true         # GDK_VULKAN_DISABLE=1 (WSLg Vulkan still flaky)
gdk_backend        = "x11"        # x11 = route flatpak GTK through XWayland.
xcursor_path = "~/.local/share/icons:~/.icons:/run/host/user-share/icons:/run/host/share/icons:/usr/share/icons:/usr/share/pixmaps"

[ai]
# Heavy first-boot pulls: the GGUF and vLLM weights and the firstboot-tier
# inference images (mios-ai-firstboot), [ai].firstboot_models
# (mios-models-firstboot) and [ai].firstboot_bound_images
# (mios-bound-images-firstboot). Each reads the LAYERED SSOT, so a cloud or
# container deployment turns them off with the [deployment.cloud] host drop-in;
# the image is unchanged. false skips without writing a done-sentinel, so
# removing the drop-in resumes them at the next run.
firstboot_pulls = true
vision_grounding_enable = true
vision_grounding_model = "qwen3-vl:4b"
kernel_dispatch = true
db_authoritative = false
rag_hybrid = false
rag_rerank = false
endpoint            = "http://localhost:${MIOS_PORTS_AGENT_PIPE}/v1"
agent_model         = "MiOS AI"
available_models    = ["granite4.1:3b", "granite4.1:30b", "gpt-oss:20b", "nomic-embed-text"]
hitl_mode           = "block"   # WS-A14 (operator steer "full capabilities"): GATE high-risk verbs (perm tier >= hitl_threshold) pending approval. Was "off"; tune to "audit" (log+proceed) or "off" to dial back.
hitl_threshold      = "interactive"
micro_endpoint           = "http://localhost:${MIOS_PORTS_LLM_LIGHT}/v1"   # mios-llm-light (ALL llama.cpp, OpenAI /v1)
# The risk lattice, safest first. A permission a verb names that is not
# listed ranks ABOVE the top tier, so an unknown permission fails closed.
# Read by access/policy.py and by check_rbac_tiers, which until now told
# operators to edit a key the SSOT never declared.
permission_tiers    = ["read", "write", "interactive"]
ask_to_run          = true
ask_to_run_ttl_s    = 1800
# GLOBAL ASK-USER for CLARIFICATIONS ("ask user... for questions and
# clarifications too, not just coderunning"): when the answer is PRIMARILY a clarifying
# question (model-classified, gated on a '?'), mark it so OWUI/Hermes render a native
# INPUT prompt + feed the typed answer back as the next turn.
ask_clarify         = true     # STRUCTURAL clarifications (e.g. the location guard) -- reliable, ON.
# The BROAD post-answer clarification judge is SEPARATE + DEFAULT OFF: the small judge
# model false-positives on greetings that end with a social question ("how are you?")
# -> a stray OWUI input dialog. Flip on only with a stronger judge model.
ask_clarify_judge   = false
# Gated build catalog authority (V3 Build Catalog): when true, the clean build
# container materializes package sets and phase order from the seeded DB.
build_catalog_authoritative = false
# #62 out-of-process policy arbiter: when set, a high-risk action (tier >=
# hitl_threshold) is POSTed to this URL ({verb,tier,args}) for an {allow,reason}
# verdict, on top of the in-process gate above. Empty (default) -> no arbiter, no
# overhead. hitl_arbiter_fail = open (default; a down/erroring arbiter proceeds)
# or closed (fail-safe-deny).
hitl_arbiter_url    = "http://127.0.0.1:8760"
hitl_arbiter_fail   = "closed"
pdp_audit_allow     = false
tokenizer_backend   = "tiktoken"
# tiktoken encoding name (the OpenAI-BPE vocabulary). SSOT so it is never restated
# in code; cl100k_base is the widely-cached GPT-4/3.5 encoding. Env: MIOS_TOKENIZER_ENCODING.
tokenizer_encoding  = "cl100k_base"
# Baked, read-only offline cache for the tiktoken encoding blob -- pre-warmed at
# build time (72-hermes-agent.sh) so runtime needs no network. mios_tokenize points
# TIKTOKEN_CACHE_DIR here when the process has not already set it. Env: MIOS_TOKENIZER_CACHE_DIR.
tokenizer_cache_dir = "/usr/share/mios/tiktoken"
# Optional path to a vendored HuggingFace tokenizer.json (only used when
# tokenizer_backend = "hf"). Empty -> unset. Env: MIOS_TOKENIZER_PATH.
tokenizer_path      = ""
catalog_fail_mode   = "warn"
# WS-4: orchestration "effort" -- scales swarm fan-out WIDTH (1..swarm_max_width)
# to query complexity. "max" (default) = full width (behaviour-preserving);
# low|medium|high narrow it, or a 0..1 score. Env MIOS_EFFORT.
effort              = "max"
smartroute_enable   = false
smartroute_budget   = 0.0       # per-day cost cap for paid remote escalation (0 = unlimited)
package_registry    = false
# THE engine of the ONE heavy dGPU lane, mios-llm-heavy: "vllm" | "sglang".
# mios-gen renders [containers.mios-llm-heavy.engine.<this>] (and the .image
# twin) into the lane's Quadlet; the engine tunables are [ai.vllm] / [ai.sglang]
# and the per-engine surface settings [lanes.<this>]. Runtime LoRA
# ([converge.inference].vllm_*) needs "vllm". Env MIOS_AGENT_PIPE_HEAVY_ENGINE
# may still set the agent-pipe route to "light" (skip the heavy lane).
heavy_engine        = "vllm"
# WS-A16 remote-core escalation: when "on", any REMOTE [nodes.*] endpoint becomes
# a first-class TRAILING lane in the resolver -- local lanes are still preferred
# (LiteLLM order-based fallback: local-first), and a remote core is reached only
# when every local lane is on cooldown/unreachable. Default "off" -> local-only
# (byte-identical lane chain). The cost/quality trigger is mios_smartroute.
remote_escalation   = "off"
# Direct-install source for automation/72-hermes-agent.sh. Operators
# pin a tag/SHA for reproducible images via mios.html.
hermes_agent_repo   = "https://github.com/NousResearch/hermes-agent.git"
# Track LATEST via "main" ("don't pin any versions in MiOS!!!").
# The build + mios-hermes-firstboot run `pip install git+<repo>@<ref>`, so every fresh
# build/boot picks up the newest Hermes automatically. Do NOT pin to a tag/SHA.
hermes_agent_ref    = "main"

opencode_install_url = "https://opencode.ai/install"
opencode_version    = "latest"           # or pin to a tag
opencode_model      = "mios-opencode:latest"
# opencode provider name as declared in opencode.json; the gateway builds the
# `-m <provider>/<model>` selector from this.
opencode_provider   = "local"
# opencode binary install path (fetched at build). Gateway unit + installer
# reference this via MIOS_OPENCODE_BIN. Lives under the unified agent-plane
# tree /usr/lib/mios/agents/ alongside hermes-agent + opencode-gateway.
opencode_bin        = "/usr/lib/mios/agents/opencode/bin/opencode"
# Explicit opencode config path the gateway exports as OPENCODE_CONFIG (no
# hardcoded /root/.config/opencode dependency). /etc/mios/opencode is the
# canonical SoT (.gitignore whitelists it; mios-hermes-firstboot deploys it).
opencode_config     = "/etc/mios/opencode/opencode.json"
# Gateway run cwd / HOME (scratch for `opencode run`; no repo -> Q&A mode).
opencode_gateway_workdir   = "/var/lib/mios/opencode-gateway/work"
# Per-run timeout (s). Under VRAM pressure the run times out and the gateway
# returns empty so the swarm fan-out drops opencode harmlessly.
opencode_gateway_timeout_s = 90    # opencode `run` HANGS (returns nothing even with the model warm + 240s); 240 just made every coding turn wait longer. Fail FAST at 90 so a hung opencode drops to sleep quickly. Restore a longer budget only once `run` headless mode actually returns.
agent_venv          = "/usr/lib/mios/agents/.venv"
agent_install_dir   = "/usr/lib/mios/agents/hermes-agent"
# Inference backend Hermes-Agent forwards to. mios-llm-light's
# OpenAI-compatible surface; swap to vllm / another llama.cpp lane by editing this.
hermes_backend_url  = "http://localhost:${MIOS_PORTS_LLM_LIGHT}/v1"   # mios-llm-light (ALL llama.cpp, OpenAI /v1)
model               = "granite4.1:8b"   # IBM Granite 4.1 8B (dense 'granite' arch, mainline llama.cpp, 131K ctx, --jinja tool-calls). Replaces qwen3.5:4b (BLOCKED on mainline llama.cpp -> the gemma4:12b fallback). Family-diversity: first non-Qwen brain. Served by mios-llm-light :${MIOS_PORTS_LLM_LIGHT} (see mios-llm-light.yaml).
stack_model         = "granite4.1:8b"
embed_model         = "nomic-embed-text"   # served NAME unchanged (768d); backing GGUF swapped to EmbeddingGemma-300m QAT in mios-llm-light.yaml (zero pgvector migration)
api_key             = ""
mcp_registry        = "/usr/share/mios/ai/v1/mcp.json"
system_prompt_file  = ""                # optional override; empty = use canonical
prompt_shortcut     = "@"
bake_models         = "granite4.1:8b,lfm2:700m,nomic-embed-text,mios-agent,mios-agent-cpu,mios-hermes,mios-hermes-cpu,mios-opencode,mios-sys-agent"   # family-diverse fleet: Granite 4.1 8B (IBM) = brain+coder (one served GGUF, mainline llama.cpp), LFM2-700M (Liquid AI) = micro, nomic-embed-text NAME = EmbeddingGemma-300m QAT (Google, 768d, backing GGUF swapped in mios-llm-light.yaml). qwen3.5:4b/qwen3:1.7b/qwen2.5-coder:7b retired (Qwen-monoculture + qwen35 blocked on llama.cpp). mios-* tags blob-share the brain base.
# Recommended floor for the default model. granite4.1:3b is a dense
# 3 B model at q4_K_M (~2.5 GB on disk, ~4 GB resident). Sits inside
# the 8 GB usable budget on a 12 GB / 8-core box. Auto-pick promotes
# beyond this on hosts with more headroom.
ram_floor_gb        = 8

[ai.kv]
slot_save_path = "/var/lib/mios/llamacpp/slots"   # --slot-save-path for chat lanes (matches tmpfiles + mios-llm-light.yaml)
swa_full       = false                            # append --swa-full to SWA lanes ONLY; OFF for the current hybrid/recurrent brains

[[ai.catalog]]
id      = "granite4.1:8b"
label   = "Granite 4.1 8B (IBM, dense, ~5.5 GB, MiOS brain+coder default; 131K ctx, mainline llama.cpp)"
ram_gb  = 8

[[ai.catalog]]
id      = "lfm2:700m"
label   = "LFM2 700M (Liquid AI, dense, ~0.7 GB, micro/CPU classify lane)"
ram_gb  = 4

[[ai.catalog]]
id      = "mistral-magistral-small-2509"
label   = "Magistral Small 2509 (Mistral, dense 24B reasoning, AWQ ~14 GB, heavy dGPU lane)"
ram_gb  = 24

[ai.host_thresholds]
mid_vram_gb       = 8                             # >= this -> auto-promote to mid_ram_model
big_vram_gb       = 16                            # >= this -> big_ram_model AVAILABLE for explicit picks
max_cpu_percent   = 85.0                          # CPU load percent ceiling for heavy dispatches
max_vram_percent  = 90.0                          # GPU VRAM percent ceiling for heavy dispatches
# NOTE: auto-promotion now climbs to the big tier when detected VRAM >=
# big_vram_gb (operator directive); mios.html can still override to any pick.

# Legacy *_ram_gb names retained for build-mios.ps1 backwards-compat
# (they map onto the new vram-based logic at build time).
big_ram_gb        = 16                            # alias -> big_vram_gb
mid_ram_gb        = 8                             # alias -> mid_vram_gb

small_ram_model  = "granite4.1:8b"   # IBM Granite 4.1 8B Q4_K_M (~5.5GB resident, fits the 8GB usable budget; dense 'granite' arch loads on mainline llama.cpp -- unlike the BLOCKED qwen3.5:4b). With q4_0 KV + flash-attn it reaches 128k on the low-end profile.
mid_ram_model    = "granite4.1:8b"   # 8-16GB class. qwen3.5:9b retired (Qwen + qwen35 arch blocked on mainline llama.cpp). Granite 4.1 8B at a higher quant (UD-Q5/Q8) + 128k KV uses the mid-tier headroom; same mainline-safe arch, no separate base to bake. (A larger Granite/Gemma can be slotted here once a verified mid-class GGUF is pinned.)
big_ram_model    = "mistral-magistral-small-2509"   # 16GB+ dGPU class. qwen3-coder:30b retired (Qwen). Mistral Magistral Small 2509 (dense 24B reasoning, AWQ-INT4 ~14GB) fits a 24GB 4090 via the heavy lane (SGLang/vLLM, --reasoning-parser mistral); family-diversity off Qwen. Serve on the heavy lane (see [ai.sglang]/[ai.vllm]); the light lane keeps Granite.

vision_grounding_model    = ""
vision_grounding_endpoint = "http://localhost:${MIOS_PORTS_LLM_LIGHT}/v1"   # mios-llm-light (needs a vision GGUF in the map to activate)
chat_vision_model         = "qwen3-vl:4b"

grounding_endpoint = "http://localhost:${MIOS_PORTS_LLM_HEAVY}/v1"
grounding_model    = "mios-grounding"

micro_model              = "lfm2:700m"   # Liquid AI LFM2-700M (dense 'lfm2' arch merged mainline llama.cpp; ~0.7-1.0GB resident, ~2x faster CPU decode than Qwen; beats Qwen3-0.6B on MMLU/GSM8K/IFEval). Family-diversity off Qwen. Background classify/expand/gate only (Pythonic tool-call format, not JSON-tool agent). Served by mios-llm-light :11450; the qwen3:1.7b alias still resolves.
sys_agent_model          = "mios-sys-agent"

micro_keep_alive_seconds = -1

# ----------------------------------------------------------------------------
# [desktop] -- session preferences and Flatpak picks.
# desktop.flatpaks -> MIOS_DESKTOP_FLATPAKS (comma-joined for the Containerfile arg).
# ----------------------------------------------------------------------------
[desktop]
# Runtime desktop-application installs at boot (/usr/libexec/mios-flatpak-install,
# [desktop].flatpaks). false is what the [deployment.cloud] drop-in sets: apps
# baked into the image stay, nothing is installed at runtime.
runtime_installs = true
session       = "gnome"
color_scheme  = "prefer-dark"   # libadwaita / dconf color-scheme
flatpaks      = [
    # GTK theme extensions so flatpak apps honor host dark-Adwaita.
    "org.gtk.Gtk3theme.adw-gtk3-dark",
    "org.gtk.Gtk3theme.adw-gtk3",
    # Default session apps.
    "app.devsuite.Ptyxis",                             # terminal (renamed from org.gnome.Ptyxis 2026-Q1)
    # Nautilus modern: ONLY available as org.gnome.Nautilus.Devel on the
    # gnome-nightly remote. Flathub's org.gnome.Nautilus is END-OF-LIFE
    # (pinned to GNOME 3.28 runtime); Fedora flatpak registry doesn't
    # carry Nautilus.
    "gnome-nightly:org.gnome.Nautilus.Devel",
    "fedora:org.gnome.Epiphany",                       # 50.x current (vs. potentially-stale Flathub)
    "com.github.tchx84.Flatseal",                      # Flatpak permissions UI
    "com.mattjakeman.ExtensionManager",                # GNOME shell extensions
    "com.google.ChromeDev",                           # secondary browser and agent CDP target
]


[[desktop.apps]]
id          = "org.gnome.Epiphany"
remote      = "flathub"
role        = "browser"
default     = true
description = "GNOME Web -- the default MiOS flatpak browser (libadwaita, native dark, WSLg-compatible with the split-renderer override below)."
[desktop.apps.overrides]
GDK_BACKEND                              = "x11"
WEBKIT_DISABLE_COMPOSITING_MODE          = 1
WEBKIT_DISABLE_DMABUF_RENDERER           = 1
# Note: GSK_RENDERER=cairo + LIBGL_ALWAYS_SOFTWARE=1 + GDK_VULKAN_DISABLE
# inherited from the global [graphics] override. Do NOT duplicate here.

[[desktop.apps]]
id          = "org.gnome.Nautilus.Devel"
remote      = "gnome-nightly"
role        = "file-manager"
default     = true
description = "GNOME Files (Nautilus). Devel build because Flathub stable is EOL on GNOME 3.28 runtime."

[[desktop.apps]]
id          = "app.devsuite.Ptyxis"
remote      = "flathub"
role        = "terminal"
default     = true
description = "Ptyxis -- GNOME 47-era libadwaita terminal (the rename of org.gnome.Ptyxis)."

[[desktop.apps]]
id          = "com.google.ChromeDev"
remote      = "flathub"
role        = "browser"
default     = false
launcher    = "mios-chrome"
description = "Google Chrome Dev channel. Default secondary browser and Hermes-Agent CDP target. `launcher = mios-chrome` so dispatch sets the CDP port + WSLg env BEFORE flatpak-run."
[desktop.apps.com.google.ChromeDev.overrides]
# Hint Chrome to use Wayland natively (WSLg compositor) instead of
# launching XWayland which has no GPU acceleration on this host.
GDK_BACKEND        = "wayland"
# Ozone-Wayland + WaylandWindowDecorations so Chrome draws its own
# libadwaita-aware decorations and gets rounded corners on WSLg.
CHROME_DEFAULT_ARGS = "--ozone-platform=wayland --enable-features=UseOzonePlatform,WaylandWindowDecorations --gtk-version=4 --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1"

[[desktop.apps]]
id          = "org.chromium.Chromium"
remote      = "flathub"
role        = "browser"
default     = false
launcher    = "mios-chromium"
description = "Chromium Web Browser (FOSS upstream). Operator-facing alt browser + CDP automation target."
[desktop.apps.org.chromium.Chromium.overrides]
GDK_BACKEND         = "wayland"
CHROME_DEFAULT_ARGS = "--ozone-platform=wayland --enable-features=UseOzonePlatform,WaylandWindowDecorations --gtk-version=4 --remote-debugging-port=9222 --remote-debugging-address=127.0.0.1"

# code-editor role is served by code-server (mios-code-server.container,
# http://localhost:8220, editing the live root at /mnt/mios-root) -- the
# MiOS self-hosting dev loop -- not a desktop IDE flatpak.

[[desktop.apps]]
id          = "com.mattjakeman.ExtensionManager"
remote      = "flathub"
role        = "extensions"
default     = true
description = "GNOME shell extensions manager."

[[desktop.apps]]
id          = "com.github.tchx84.Flatseal"
remote      = "flathub"
role        = "flatpak-permissions"
default     = true
description = "Flatseal -- per-flatpak permissions UI."

# GTK theme extensions -- runtime infrastructure, no role.
[[desktop.apps]]
id          = "org.gtk.Gtk3theme.adw-gtk3-dark"
remote      = "flathub"
description = "adw-gtk3-dark theme extension (consumed by GTK3 apps inside flatpak sandboxes)."

[[desktop.apps]]
id          = "org.gtk.Gtk3theme.adw-gtk3"
remote      = "flathub"
description = "adw-gtk3 theme extension (light variant, kept for apps that auto-switch)."

[image]
ref            = "ghcr.io/mios-dev/mios:latest"
branch         = "main"
# Base OCI image. The script auto-picks NVIDIA vs non-NVIDIA at install
# time based on detected GPU; both variants are listed here so operators
# can swap to a different upstream (e.g. ucore-minimal, fedora-bootc) via
# mios.html without touching code.
base           = "ghcr.io/ublue-os/ucore-hci:stable-nvidia"   # default (NVIDIA preferred)
base_nvidia    = "ghcr.io/ublue-os/ucore-hci:stable-nvidia"
base_no_nvidia = "ghcr.io/ublue-os/ucore-hci:stable"
# bootc-image-builder image (BIB). Used inside MiOS-DEV to convert the
# OCI image into qcow2/raw/iso/vhdx etc. for Hyper-V, QEMU, USB sticks.
bib            = "quay.io/centos-bootc/bootc-image-builder:latest"
name           = "ghcr.io/mios-dev/mios"
tag            = "latest"
local_tag      = "localhost/mios:latest"
dev_local_tag  = "localhost/mios-devcontainer:latest"
machine_os_repo = "quay.io/podman/machine-os"
machine_os_tag  = "6.1"
# The container images of machine_os_repo:machine_os_tag, digest-identical,
# without the podman-machine disk images its index also lists (older
# containerd, as in Codespaces, cannot parse those). Published by
# tools/mirror-machine-os.sh; MiOS-DEV still boots the upstream disk images.
machine_os_mirror = "ghcr.io/mios-dev/machine-os"

[bootc_install]
# Read by mios-install and `mios-unit-gen bootc-install` (ADR-0014).
# Root filesystem, one of bootc's xfs | ext4 | btrfs.
root_fs_type    = "ext4"
# bootc --bound-images: "stored" copies the logically bound images from the
# installing host's container storage (air-gapped media pre-seed them);
# "pull" fetches them into the target during install.
bound_images    = "stored"
# Root partition floor and alignment padding, projected into
# usr/lib/repart.d/50-root.conf; mios-install refuses a disk that cannot
# hold the floor. 80 GB holds the rechunked image layers.
root_min_gb     = 80
root_padding_gb = 1
[deployment]
# BIB-supported types: ami, anaconda-iso, bootc-installer, gce, iso,
# ova, pxe-tar-xz, qcow2, raw, vhd, vmdk. Names below map directly
# (target_vhd → vhd, etc.) per the resolver's `target_<bib_type>`
# convention. There is no `wsl` BIB type; for WSL2 distributions
# we use podman save + post-process the tarball outside of BIB.
target_qcow2        = true   # QEMU/KVM disk (libvirt / Proxmox / GNOME Boxes)
target_iso          = true   # bootc-installer ISO (live + installer)
target_anaconda_iso = true   # Anaconda-based installer ISO (Fedora-style)
target_raw          = true   # raw disk image (dd-able to USB / bare-metal)
target_vhd          = true   # Hyper-V VM disk (Windows guest VMs, Azure)
target_vmdk         = false  # VirtualBox / VMware
target_ami          = false  # AWS AMI (needs aws-cli + signing)
target_ova          = false  # vSphere OVA (needs ovftool)
target_gce          = false  # Google Compute Engine
target_pxe_tar_xz   = false  # PXE network boot tarball

# Cloud and container deployments of the ONE image: the devcontainer, Codespaces,
# the Claude Code and Codex cloud environments, Cloud Shell and a GCE VM all run
# [image].ref. They differ from a booted install by configuration only: every
# cloud entry point (.devcontainer/cloud-shell/bootstrap.sh, the devcontainer
# lifecycle) writes [deployment.cloud.overlay] as the host drop-in `dropin`, which
# the layered resolver merges over the vendor SSOT, turning off the heavy runtime
# model pulls, runtime desktop installs and the desktop session.
[deployment.cloud]
state_directory = ""
runtime         = ""
builder         = 1
source_ref      = "main"
setup_budget_s  = 240
dropin        = "/etc/mios/mios.d/50-cloud.toml"
# Free space the container store needs before pulling [image].ref: ~23 GB of
# compressed layers unpack to ~49 GB, with headroom. A nested `podman build` of the
# root Containerfile with MIOS_BAKE_BOUND_IMAGES=0 (the CI validation build) needs
# build_free_gb more; the full bake with bound images needs a self-managed host.
min_free_gb   = 80
build_free_gb = 50

[deployment.cloud.overlay.ai]
firstboot_pulls = false
[deployment.cloud.overlay.desktop]
runtime_installs = false
# The role engine then targets the headless archetype: no desktop session starts.
[deployment.cloud.overlay.blade]
type = "headless"

# `bootstrap.sh gce-up`: a Compute Engine VM that runs [image].ref as a privileged
# podman container booting its own systemd. The boot disk holds the image and a
# nested build; Ubuntu LTS ships the guest agent that runs the startup script.
[deployment.cloud.gce]
project        = ""
instance       = "mios"
zone           = "us-central1-a"
machine_type   = "n2-standard-8"
boot_disk_gb   = 250
boot_disk_type = "pd-balanced"
image_family   = "ubuntu-2404-lts-amd64"
image_project  = "ubuntu-os-cloud"
container      = "mios"

[hwcaps]
level = "v1"
ld_so_hwcaps_autoselect = true
# Native-rebuild track gate. When true, automation/45-hwcaps-rebuild.sh
# would recompile the hot-path package set with -march=<level> via mock
# or COPR. Default false; flipping to true is a roadmap item (see
# usr/share/doc/mios/reference/hwcaps.md).
native_rebuild = false


# Engine options of the ONE heavy lane when [ai].heavy_engine = "vllm" (rendered into
# [containers.mios-llm-heavy.engine.vllm]). mios.html keeps them under Advanced.
[ai.vllm]
enable         = false          # documents intent; the systemd unit is the real gate (disabled by default)
served_name    = "mios-heavy"   # OpenAI served-model-name the lane advertises (= [nodes.local-heavy].model)
gpu_util       = 0.85           # --gpu-memory-utilization: the ~16GB AWQ weights need >0.66; 0.85=~20.4GB leaves ~4GB KV. Heavy lane is gated OFF by default -> only claims the GPU when explicitly enabled (near-exclusive 4090 then).
max_model_len  = 262144        # 256k native. On the shared 24GB 4090 vLLM's ~4GB fp8-KV budget admits well short of a full 256k sequence -> for the FULL 256k select the SGLang engine below (HiCache CPU KV-offload). vLLM PagedAttention admits up to this ceiling as KV allows.
kv_cache_dtype = "fp8"          # --kv-cache-dtype fp8 (e5m2 on Ada): ~2x KV capacity; REQUIRED to approach the ceiling on 24GB.
load_format    = "auto"          # --load-format: read the real weights from /models. "dummy" initialises RANDOM weights (vLLM profiling only) -- never ship it.
quantization   = ""              # quantization format (empty = vLLM auto-detects from model weights config.json)
tool_call_parser = "hermes"     # Qwen3 emits Hermes-style <tool_call> blocks -> OpenAI tool_calls[]
prefix_caching = true           # --enable-prefix-caching (APC): reuse the shared swarm prompt prefix across agents
v1_engine      = true            # V1 engine (default since vLLM 0.8, V0 removed in 0.11 -> MUST be true on current images). Chunked-prefill by default.

# Engine options of the ONE heavy lane when [ai].heavy_engine = "sglang" (rendered into
# [containers.mios-llm-heavy.engine.sglang]). mios.html keeps them under Advanced.
[ai.sglang]
enable             = false          # documents intent; the systemd unit is the real gate (disabled by default)
bake_model         = "stelterlab/Qwen3-30B-A3B-Instruct-2507-AWQ"   # same model as [ai.vllm], served from /usr/share/mios/vllm/model. SGLang is the engine for the FULL 256k (HiCache CPU KV-offload makes it fit the partial 4090).
served_name        = "mios-heavy"   # OpenAI served-model-name (= [nodes.local-heavy].model); the same lane name vLLM serves
mem_fraction       = 0.85           # --mem-fraction-static: the ~16GB AWQ weights need >0.66; HiCache spills the rest of the 256k KV to CPU RAM.
tool_parser        = "qwen25"       # --tool-call-parser: Qwen3-2507 emits Qwen <tool_call> blocks (qwen25 parser handles them); SGLang's qwen25 parser fits the Qwen3 family.
reasoning_parser   = ""             # Qwen3-30B-A3B-INSTRUCT-2507 is NON-thinking (no <think>) -> no reasoning parser. For CoT, bake Qwen/Qwen3-30B-A3B-Thinking-2507 and set reasoning_parser = "qwen3".
kv_cache_dtype     = "fp8_e5m2"     # --kv-cache-dtype fp8_e5m2: ~2x KV capacity; REQUIRED with HiCache to reach 256k.
load_format        = "auto"         # --load-format: read the real weights from /models ("dummy" = random weights, profiling only).
hierarchical_cache = true           # --enable-hierarchical-cache (HiCache): spill inactive KV to CPU RAM -- the mechanism that makes 256k fit
unified_radix_tree = true           # --enable-unified-radix-tree (UnifiedRadixTree): enable radx-tree KV cache optimization

[packages]
sections = [
    "base", "mcp", "security", "utils", "build-toolchain", "containers",
    "cockpit", "storage", "virt", "guests",
    "gpu-mesa", "gpu-nvidia", "gpu-amd-compute", "gpu-intel-compute",
    "gnome", "gnome-core-apps", "phosh",
    "ai", "k3s", "k3s-selinux-build", "cockpit-plugins-build",
    "sbom-tools", "uki", "self-build", "network-discovery", "updater",
    "wintools", "gaming", "steam", "nut", "ceph", "freeipa", "ha",
    "looking-glass-build", "android",
]

[packages.windows]
enable = true
pkgs = [
    # ── Critical runtime / toolchain ─────────────────────────────
    "Git.Git",                       # git for clone + fetch + reset
    "Microsoft.PowerShell",          # pwsh 7 (trampoline target)
    "chrisant996.Clink",             # native CMD prompt integration
    "Microsoft.WSL",                 # Windows Subsystem for Linux 2
    "Microsoft.WindowsTerminal",     # WT (also installed earlier; idempotent)
    "7zip.7zip",                     # archive support
    "Microsoft.VCRedist.2015+.x64",  # VC++ runtime
    "Python.Python.3.14",            # python 3.14 (matches MiOS-DEV 3.14.x) -- host-side MiOS python tooling
    # ── MiOS terminal CLI surface (mirrors the deployed Linux side) ─
    "sharkdp.bat",                   # syntax-highlighted cat
    "sharkdp.fd",                    # fast find
    "BurntSushi.ripgrep.MSVC",       # rg
    "junegunn.fzf",                  # fuzzy finder
    "jqlang.jq",                     # JSON query
    "GitHub.cli",                    # gh
    "aristocratos.btop4win",         # btop (Windows port)
    "arndawg.tmux-windows",          # native tmux for Windows (terminal multiplexer)
    "fastfetch-cli.fastfetch",       # fastfetch
    "Anchore.Syft",                  # syft (CycloneDX / SPDX SBOM generator)
]

# Post-install PATH verification probes -- the binaries build-mios.ps1's
# Install-MiosWindowsTools loops through to confirm `Get-Command <name>`
# resolves after the winget installs + PATH augmentation. Operators who
# add a custom package above (or remove the default set) extend / shrink
# this list to match.
verify_probes = [
    "python",
    "fastfetch",
    "btop",
    "tmux",
    "rg",
    "fzf",
    "jq",
    "gh",
    "bat",
    "fd",
    "pwsh",
    "oh-my-posh",
    "syft"
]

# Package-ID to expected-binary mapping for packages whose winget ID differs from the command name.
bin_map = [
    "BurntSushi.ripgrep.MSI|rg",
    "junegunn.fzf|fzf",
    "jqlang.jq|jq",
    "sharkdp.bat|bat",
    "sharkdp.fd|fd",
    "GitHub.cli|gh",
    "fastfetch-cli.fastfetch|fastfetch",
    "aristocratos.btop4win|btop",
    "arndawg.tmux-windows|tmux",
    "Microsoft.PowerShell|pwsh",
    "JanDeDobbeleer.OhMyPosh|oh-my-posh"
]

# Windows-side btop config root. mios-bootstrap's Install-MiosWindowsTools
# stages the SSOT-rendered btop.conf + themes/mios.theme here and points the
# User-scope BTOP_CONFIG_DIR at it. Defaults to the MiOS-owned data drive
# ([bootstrap.host_storage].drive_letter) rather than %APPDATA%.
btop_config_dir = "C:\\MiOS\\btop"

[browser_ai]
enable       = true
package      = "Zen-Team.Zen-Browser.Twilight"   # Zen Browser - Twilight (winget id)
provider_url = "http://localhost:${MIOS_PORTS_OPEN_WEBUI}"            # OWUI front door = the MiOS AI pipeline
# Firefox/Zen prefs as "name|type|value" (type = bool|string|int) so the bootstrap
# can build policies.json without a full TOML parser. Add Zen-specific zen.* AI
# flags here as they stabilise -- they flow through unchanged.
prefs = [
    "browser.ml.enable|bool|true",                # master ML/AI toggle
    "browser.smartwindow.enabled|bool|true",      # the NEW AI Window (Smart Window) mode -- replaces the old sidebar
    "browser.ml.chat.enabled|bool|true",          # AI chatbot sidebar (fallback path)
    "browser.ml.chat.hideLocalhost|bool|false",   # REQUIRED so a localhost (OWUI) provider is allowed
    "browser.ml.chat.shortcuts|bool|true",        # AI prompts on text selection
    "browser.ml.chat.menu|bool|true",             # AI entries in the context menu
    "browser.ml.pageAssist.enabled|bool|true",    # page-assist AI
    "browser.ml.linkPreview.enabled|bool|true",   # AI link previews
]

[packages.dev_vm_essentials]
enable = true
pkgs = [
    "mkpasswd",            # sha512crypt password hash
    "whois",               # mkpasswd is in mkpasswd pkg on F44, but ship whois too
    "openssl",             # password fallback + general TLS
    "python3-passlib",     # password fallback (Python 3.13+ removed crypt)
    "python3-bcrypt",      # bcrypt backend for passlib + mios-adguard-firstboot admin pw
    "bootc",               # bootc switch + self-replication closure
    "git",                 # in-distro clone
    "curl",                # required for Bibata/AI CLI downloads
    "tar",                 # required for Bibata extraction
    "iptables",            # netavark backend (binary; firewall_driver=none)
    "nftables",            # netavark alternative backend
    "fastfetch",           # MiOS dashboard / motd
    "btop",                # required by the global Windows/WSL monitor entry
    "tmux",                # human terminal and peer workspaces
    "oh-my-posh",          # MiOS themed prompt
    "python3-rich",        # MiOS TUI dashboard (mios-mon.py)
    "python3-textual",     # MiOS TUI dashboard full monitor
    "python3-psutil",      # MiOS system resource telemetry
    "bash-completion",     # tab-complete in interactive shells
]

# The ONE development userspace, part of every full MiOS image: the repos phase
# (automation/05-repos.sh) installs it with its declared dependency closure, so
# the devcontainer, Codespaces and the cloud environments, which all run
# [image].ref (.devcontainer/Containerfile adds only container wiring), carry it
# because MiOS does. [ci.fedora].package_sets also provisions the lean CI harness
# from it. The core profile selects self-build without these editor extras.
[packages.devcontainer]
enable = true
# The development image shares the self-build dependency closure with MiOS.
# Section dependencies are resolved and deduplicated by automation/lib/packages.sh.
requires_sections = ["self-build", "mcp"]
pkgs = [
    "just",
    "podman", "podman-compose", "buildah", "skopeo",
    "netavark", "aardvark-dns", "slirp4netns", "passt", "fuse-overlayfs",
    "bootc", "bootupd", "ostree", "rpm-ostree",
    "curl", "wget", "ca-certificates", "gh", "jq", "yq", "rsync", "git", "tmux",
    "nodejs", "npm",
    "python3.11", "python3.11-devel",   # agent-pipe venv interpreter (/usr/lib/mios/agents/.venv)
    "ruby", "ruby-devel",
    "python3-rich", "python3-textual", "python3-psutil",
    "dbus-daemon", "dbus-tools", "gnome-keyring", "libsecret",   # agent CLI credential keyring
    "procps-ng", "util-linux", "shadow-utils", "authselect",
    "sudo", "zsh",
    "findutils", "grep", "sed", "gawk", "diffutils", "patch",
    "ripgrep", "tar", "gzip", "unzip", "zip",
    "openssl", "qemu-img", "attr",
    "btop", "fastfetch", "oh-my-posh",
]

[orchestration]
conductor_enable = false
conductor_step_timeout = 300
conductor_allowed_exec_commands = ["/usr/bin/printf"]

[packages.dev_overlay]
enable = true   # default ON; toggle via /configurator.html (configurator.packages.<section>.enable)
sections = [
    "base", "security", "utils", "build-toolchain", "containers",
    "cockpit", "storage", "virt",
    "gpu-mesa", "gpu-nvidia", "gpu-amd-compute", "gpu-intel-compute",
