[testing]
# Grow-only, the inverse of the other ratchets: the smoke test asserted six
# things about a 49 GB image with 79 layers, and a manifest that can shrink
# is one that quietly stops checking. `mios-gate image-equivalence` refuses a
# floor below this, and a caller SSOT whose value sits below the image's own.
min_smoke_components = 24

# `miosd artifact-boot-test <format>` (P1-1): QEMU boots the disk read-only in
# its [deploy.formats.<f>.vm] shape, waits for SSH with the build's key, then
# runs each probe in the guest. A failing probe, no SSH within `timeout`, or an
# early QEMU exit (-no-reboot catches a greenboot rollback) fails the test.
[testing.boot]
timeout  = "30m"
# Secure Boot needs SMM, which KVM nested under Hyper-V (WSL2, so MiOS-DEV)
# cannot enter ("KVM: entry failed"); false boots such a host without it.
secure_boot = true
# The first present entry whose secure_boot matches. The Secure Boot stores
# enroll Microsoft's UEFI CA, the trust the Hyper-V template names.
firmware = [
  { code = "/usr/share/OVMF/OVMF_CODE_4M.secboot.fd", vars = "/usr/share/OVMF/OVMF_VARS_4M.ms.fd", secure_boot = true },          # Debian, Ubuntu: ovmf
  { code = "/usr/share/edk2/ovmf/OVMF_CODE.secboot.fd", vars = "/usr/share/edk2/ovmf/OVMF_VARS.secboot.fd", secure_boot = true },  # Fedora: edk2-ovmf
  { code = "/usr/share/OVMF/OVMF_CODE_4M.fd", vars = "/usr/share/OVMF/OVMF_VARS_4M.fd", secure_boot = false },
  { code = "/usr/share/edk2/ovmf/OVMF_CODE.fd", vars = "/usr/share/edk2/ovmf/OVMF_VARS.fd", secure_boot = false },
]
probes = [
  # Waits out startup, then requires the multi-user target.
  "systemctl is-system-running --wait >/dev/null; systemctl is-active multi-user.target",
  # greenboot's verdict on this boot: active only when every required.d check passed.
  "systemctl is-active greenboot-healthcheck.service",
  "sudo -n bootc status",
]

# What every MiOS image holds, whatever its profile (task_3464). The top-level
# lists are the floor. sections.<s>, phases.<p> and profiles.<q> add probes
# only when the asserted profile selects that [packages] section, registered
# phase or profile (its extends closure included). Probe kinds: shims and
# paths exist, units, python_entries and manpages are files, commands are
# executables on PATH, rpm_sections names [packages] sections whose pkgs the
# rpm database must provide. Gate: mios-gate image-equivalence; manifest
# closure: check_smoke_manifest.
[testing.smoke_components]
shims = [
    "usr/libexec/mios/flatpak-launch",
    "usr/libexec/mios/mios-pc-control",
    "usr/libexec/mios/mios-launcher-daemon",
    "usr/libexec/mios/mios-flatpak-icon-sanitize",
    "usr/bin/mios",
    "usr/bin/mios-build",
    "usr/bin/mios-update",
    "usr/bin/mios-pull",
    "usr/bin/mios-deploy",
    "usr/libexec/mios/mios-doctor",
    "usr/libexec/mios/mios-manual",
    "usr/libexec/mios/mios-theme-render",
]
units = [
    "usr/lib/systemd/system/mios-wsl-interop-priority.service",
    "usr/lib/systemd/system/mios-agent-pipe.service",
    "usr/lib/systemd/system/mios-hermes-browser.service",
    "usr/lib/systemd/system/mios-hermes-firstboot.service",
    "usr/lib/systemd/system/mios-dashboard-issue.service",
    "usr/lib/systemd/system/mios-firstboot.target",
]
python_entries = [
    "usr/lib/mios/agent-pipe/server.py",
    "usr/lib/mios/agent-pipe/mios_dispatcher.py",
    "usr/lib/mios/agent-pipe/mios_router.py",
    "usr/lib/mios/agent-pipe/mios_kernel.py",
    "usr/lib/mios/agent-pipe/mios_sandbox.py",
    "usr/lib/mios/agent-pipe/mios_capreg.py",
]
manpages = [
    "usr/share/man/man1/mios.1",
    "usr/share/man/man7/mios-variants.7",
    "usr/share/man/man5/mios.toml.5",
    "usr/share/man/man7/mios.7",
]
commands = ["podman", "bootc", "rpm-ostree"]
paths = ["usr/lib/mios/agents/.venv/bin/python3"]
rpm_sections = ["critical"]

# The development userspace a full image adds over core.
[testing.smoke_components.sections.devcontainer]
commands = ["just", "git", "gh"]

[testing.negative_coverage_exempt]
exempt = [
  # Authenticode verification: no-ops unless [security.powershell_signing]
  # names a cert AND a Windows PowerShell is present, neither of which holds on
  # a Linux runner -- an injected fault would be skipped, not caught.
  "check_ps_signatures",
  # Static linkage (task_3441): its subject is a musl target tree only the Linux
  # builder produces; the negative (a glibc PT_INTERP stub in the scan dir)
  # needs those artifacts to plant. Follow-up tracked under task_953.
  "check_static_linkage",
  # Rust native linter: requires mios-ssot-lint binary compilation environment.
  "check_native_lint",
  # Windows PowerShell resolver equivalence: requires pwsh/PowerShell host runtime.
  "check_resolver_ps_equivalence",
  # Shell resolver equivalence: requires specific POSIX shell execution context.
  "check_resolver_shell_equivalence",
  # Template validator: meta-conformance engine requires full template hierarchy.
  "check_template_self_conformance",
  # Agent schema: requires external jsonschema validator toolchain.
  "check_agent_schema",
  # AI manifest: requires live AI plane model specification.
  "check_ai_manifest",
  # BIB rootfs policy: requires container disk-image build context.
  "check_bib_rootfs_label_policy",
  # Blade dropins: requires blade hardware profile dropin generator.
  "check_blade_dropins",
  # Canonical bools: requires strict TOML boolean parser state.
  "check_canonical_bools",
  # Capability manifest: requires full verb/recipe capability tree.
  "check_capability_manifest",
  # CephFS SSOT: requires Ceph cluster storage configuration context.
  "check_cephfs_ssot",
  # CLI SQL safety: requires static code scanner across libexec CLIs.
  "check_cli_sql_safety",
  # Container ports: requires container network port mapping definitions.
  "check_container_ports",
  # Converge SSOT: requires state convergence engine runtime.
  "check_converge_ssot",
  # Coordination hygiene: requires multi-node cluster coordination config.
  "check_coordination_hygiene",
  # DAG integrity: requires full component dependency graph context.
  "check_dag_integrity",
  # Dotfiles projection: requires user home dotfiles projection tree.
  "check_dotfiles_projection",
  # Drift build catalog: requires build catalog generator context.
  "check_drift_build_catalog",
  # Drift projection: requires SSOT projection matrix context.
  "check_drift_projection",
  # Egress firewall: requires nftables egress rule generator context.
  "check_egress_firewall",
  # ETC duplicates: requires system configuration file deduplication scanner.
  "check_etc_duplicates",
  # Fluff tokens: requires token hygiene scanner.
  "check_fluff_tokens",
  # Gate index: requires full fitness function gate registry index.
  "check_gate_index",
  # Globals image parity: requires container image SSOT reference parity.
  "check_globals_image_parity",
  # Globals ports: requires global port allocation registry.
  "check_globals_ports",
  # Greenboot healthcheck: requires ostree/bootc deployment environment.
  "check_greenboot",
  # Greenboot enablement: requires systemd service enablement state.
  "check_greenboot_enablement",
  # Hint coverage: requires AI hint comment static analyzer.
  "check_hint_coverage",
  # Hummingbird: requires hummingbird mesh network topology context.
  "check_hummingbird",
