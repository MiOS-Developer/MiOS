# THE heavy dGPU lane. ONE spec, two engines: the base below is engine-neutral, and
# mios-gen merges [containers.mios-llm-heavy.engine.<[ai].heavy_engine>] onto it
# (a list adds, a scalar sets) to render the vLLM or the SGLang Quadlet. Either
# engine binds ${MIOS_PORTS_LLM_HEAVY}, serves "mios-heavy" from the same
# /var/lib/mios/vllm/model weights, and stays gated on that model existing.
[containers.mios-llm-heavy.Container]
AddDevice = "${MIOS_GPU_CDI_NVIDIA_DEVICE:-nvidia.com/gpu=all}"
ContainerName = "mios-llm-heavy"
Environment = [
  "HF_HUB_OFFLINE=1",
  "TRANSFORMERS_OFFLINE=1",
  "DO_NOT_TRACK=1",
  "HF_HOME=/tmp/.cache",
  "XDG_CACHE_HOME=/tmp/.cache",
  "GLOO_SOCKET_IFNAME=lo",
  "NCCL_SOCKET_IFNAME=lo",
  "HOME=/tmp"
]
Group = "${MIOS_LLM_HEAVY_GID:-815}"
Label = [
  "org.opencontainers.image.title=mios-llm-heavy",
  "org.opencontainers.image.url=http://localhost:${MIOS_PORTS_LLM_HEAVY:-8520}/v1/models",
  "io.podman_desktop.openInBrowser=http://localhost:${MIOS_PORTS_LLM_HEAVY:-8520}/v1/models"
]
Pod = "mios-ai.pod"
User = "${MIOS_LLM_HEAVY_UID:-0}"
Volume = "/var/lib/mios/vllm/model:/models:ro,Z"

[containers.mios-llm-heavy.Install]
WantedBy = "multi-user.target default.target"

[containers.mios-llm-heavy.Service]
Delegate = "yes"
EnvironmentFile = [
  "/etc/mios/install.env",
  "-/run/mios/gpu-numa.env"
]
Restart = "on-failure"
RestartSec = "15"
TimeoutStartSec = "600s"

[containers.mios-llm-heavy.Unit]
After = "network-online.target mios-cdi-detect.service mios-webtools-firstboot.service"
ConditionPathExists = "/var/lib/mios/vllm/model/config.json"
Wants = "network-online.target"

[containers.mios-llm-heavy.engine]
select = "ai.heavy_engine"

# vLLM: PagedAttention + automatic prefix caching, multi-LoRA; options [ai.vllm].
[containers.mios-llm-heavy.engine.vllm.Container]
Environment = [
  "VLLM_NO_USAGE_STATS=1",
  "VLLM_WSL2_ENABLE_PIN_MEMORY=1",
  "VLLM_USE_V2_MODEL_RUNNER=0",
  "VLLM_CACHE_DIR=/tmp/.cache",
  "FLASHINFER_WORKSPACE_DIR=/tmp/.cache",
  "TRITON_CACHE_DIR=/tmp/.cache",
  "VLLM_HOST_IP=127.0.0.1"
]
Exec = "--model /models --served-model-name ${MIOS_VLLM_SERVED_NAME:-mios-heavy} --host 0.0.0.0 --port ${MIOS_PORTS_LLM_HEAVY:-8520} --gpu-memory-utilization ${MIOS_VLLM_GPU_UTIL:-0.80} --max-model-len ${MIOS_VLLM_MAX_MODEL_LEN:-8192} --kv-cache-dtype ${MIOS_VLLM_KV_CACHE_DTYPE:-fp8} --load-format ${MIOS_VLLM_LOAD_FORMAT:-auto} --enable-prefix-caching --enforce-eager --enable-auto-tool-choice --tool-call-parser ${MIOS_VLLM_TOOL_CALL_PARSER:-hermes}"
Image = "${MIOS_VLLM_IMAGE:-docker.io/vllm/vllm-openai:latest}"

[containers.mios-llm-heavy.engine.vllm.Unit]
Description = "'MiOS' heavy lane, vLLM engine (OpenAI /v1, PagedAttention + APC; gated)"

# SGLang: HiCache spills inactive KV to CPU RAM for the native 256k context; options [ai.sglang].
[containers.mios-llm-heavy.engine.sglang.Container]
Exec = "python3 -m sglang.launch_server --model /models --served-model-name ${MIOS_SGLANG_SERVED_NAME:-mios-heavy} --host 0.0.0.0 --port ${MIOS_PORTS_LLM_HEAVY:-8520} --mem-fraction-static ${MIOS_SGLANG_MEM_FRACTION:-0.85} --context-length ${MIOS_SGLANG_MAX_MODEL_LEN:-262144} --load-format ${MIOS_SGLANG_LOAD_FORMAT:-auto} --kv-cache-dtype ${MIOS_SGLANG_KV_CACHE_DTYPE:-fp8_e5m2} --tool-call-parser ${MIOS_SGLANG_TOOL_PARSER:-qwen25} --enable-hierarchical-cache --trust-remote-code"
Image = "${MIOS_SGLANG_IMAGE:-docker.io/lmsysorg/sglang:latest}"

[containers.mios-llm-heavy.engine.sglang.Unit]
Description = "'MiOS' heavy lane, SGLang engine (OpenAI /v1, HiCache CPU KV-offload; native 256k context)"

[containers.mios-llm-light.Container]
AddDevice = "${MIOS_GPU_CDI_NVIDIA_DEVICE:-nvidia.com/gpu=all}"
ContainerName = "mios-llm-light"
Entrypoint = "/app/llama-swap"
