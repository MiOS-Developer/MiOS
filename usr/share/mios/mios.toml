# One ordered projection plan for native mios-gen sync on Linux and Windows.
# Remaining Python/Bash adapters stay declared until their native ports prove parity.
[generation.sync]
unit_projections = ["blade-dropins", "blade-karg", "uki-cmdline", "cockpit", "ipa-enroll", "bootc-install", "keybindings"]

[[generation.sync.steps]]
id = "index.untracked"
register = true
# Update generated SSOT budgets before any projection consumes their values.
[[generation.sync.steps]]
id = "metrics.ceiling"
calls = [{ tool = "mios-size-ceiling" }]
[[generation.sync.steps]]
id = "ports.projection"
calls = [{ tool = "mios-gen", args = ["render-ports", "--root", "{root}"] }]
[[generation.sync.steps]]
id = "globals.projection"
calls = [{ tool = "mios-gen", args = ["render-globals", "--root", "{root}"] }]
[[generation.sync.steps]]
id = "desktop.projection"
calls = [{ tool = "mios-gen", args = ["render-desktop", "--root", "{root}"] }]
[[generation.sync.steps]]
id = "manpages.projection"
calls = [{ tool = "mios-gen", args = ["render-manpages", "--root", "{root}", "--validate"] }]
[[generation.sync.steps]]
id = "dotfiles.projection"
calls = [
  { script = "tools/sync-dotfiles.py" },
  { tool = "mios-gen", args = ["render-tmux-theme", "--write-fixture", "{root}"] },
  { tool = "mios-gen", args = ["render-btop-theme", "--root", "{root}"] },
  { tool = "mios-gen", args = ["render-fastfetch", "--root", "{root}", "--mock", "--out", "{root}/tests/golden/fastfetch/mock.jsonc"] },
]
[[generation.sync.steps]]
id = "wsl.reference"
copy = ["etc/wsl.conf", "usr/lib/wsl.conf"]
[[generation.sync.steps]]
id = "quadlets.projection"
calls = [{ tool = "mios-gen", args = ["pod-quadlets", "--root", "{root}"] }]
[[generation.sync.steps]]
id = "names.registry"
calls = [{ tool = "mios-gen", args = ["names-registry", "--root", "{root}"] }]
[[generation.sync.steps]]
id = "topology.matrix"
calls = [{ tool = "mios-gen", args = ["metal-vs-hosted", "--root", "{root}"] }]
[[generation.sync.steps]]
id = "indexes.projection"
calls = [
  { tool = "mios-gen", args = ["gate-index", "--root", "{root}"] },
  { tool = "mios-gen", args = ["pipeline-index", "--root", "{root}"] },
