# An archetype expands to the capabilities its blade activates. An archetype
# with NO capabilities is a SEAT: it runs the UX and consumes remote addresses.
[blade.archetypes]
hybrid     = ["gpu-serving", "controller", "service-plane"]
compute    = ["gpu-serving", "service-plane"]
controller = ["controller", "service-plane"]
headless   = ["service-plane"]
desktop    = ["service-plane"]
endpoint   = []
# Cluster roles. They already shipped mios-k3s-master.target / mios-ha-node.target
# and role-apply already selected them from a `k3s*`/`ha*` glob -- but they were
# absent HERE, so such a blade resolved to zero capabilities and started nothing
# while its target came up.
k3s-master = ["controller", "service-plane"]
ha-node    = ["controller", "service-plane"]

# Legacy role spellings, mapped onto an archetype. This table replaces the
# `k3s*)` / `ha*)` globs in role-apply: a glob accepted `k3sx` too, selecting a
# target for a role that grants nothing. Every value must be an archetype key
# (gate: check_role_ssot).
[blade.role_aliases]
k3s = "k3s-master"
ha  = "ha-node"

[blade.requires]
# GPU lanes: gpu-serving AND service-plane (repeated ConditionPathExists is AND).
mios-llm-heavy     = ["gpu-serving", "service-plane"]
"mios-llm-worker@" = ["gpu-serving", "service-plane"]
# The rest of the service plane: offloaded wholesale on a seat.
mios-adguard                   = ["service-plane"]
mios-ceph                      = ["service-plane"]
mios-cockpit-link              = ["service-plane"]
mios-code-server               = ["service-plane"]
mios-cpu-node                  = ["service-plane"]
mios-forge                     = ["service-plane"]
mios-forgejo-runner            = ["service-plane"]
mios-headscale                = ["service-plane"]
mios-guacamole                 = ["service-plane"]
mios-guacd                     = ["service-plane"]
mios-node                      = ["service-plane"]
mios-k3s           = ["controller", "service-plane"]
mios-llm-light                 = ["service-plane"]
llama-rpc-server               = ["service-plane"]   # distributed compute worker
mios-log-archiver              = ["service-plane"]
mios-log-streamer              = ["service-plane"]
mios-mdns-mesh                 = ["service-plane"]
mios-open-webui                = ["service-plane"]
mios-otelcol                   = ["service-plane"]
mios-pgvector                  = ["service-plane"]
mios-piper                     = ["service-plane"]
mios-powerd                    = ["service-plane"]   # pauses the LLM lane on battery
mios-pxe-hub       = ["controller", "service-plane"]
mios-radosgw                   = ["service-plane"]
mios-self-heal                 = ["service-plane"]
mios-sunshine                  = ["service-plane"]
mios-whisper                   = ["service-plane"]
mios-webtools-crawl4ai         = ["service-plane"]
miosd                          = ["service-plane"]   # supervises the AI plane
mios-webtools-firecrawl-api    = ["service-plane"]
mios-webtools-firecrawl-worker = ["service-plane"]
mios-webtools-redis            = ["service-plane"]
# Native (non-Quadlet) long-running units. Same rule: a seat offloads them.
hermes-worker                  = ["service-plane"]
mios-searxng                   = ["service-plane"]
mios-hermes-browser-worker     = ["service-plane"]
k3s                            = ["service-plane"]
mios-account-sync              = ["service-plane"]
mios-agents                    = ["service-plane"]
mios-cron-director             = ["service-plane"]
mios-daemon                    = ["service-plane"]
mios-finetune-serve            = ["service-plane"]
mios-mcp                       = ["service-plane"]
mios-opencode-gateway          = ["service-plane"]
mios-policy-arbiter            = ["service-plane"]
mios-attest        = ["controller", "service-plane"]   # TPM-quote verifier + onboarding: controller blades only
mios-registry                  = ["service-plane"]   # local OCI registry
mios-thermald                  = ["service-plane"]   # CPU/GPU power caps, like mios-powerd: the blade owns the hardware
mios-wol-proxy                 = ["service-plane"]   # wake-on-LAN relay for the fleet
# Units that activate a gated unit and cannot work without it. See ADR-0016 D4.
mios-embed-backfill            = ["service-plane"]
mios-forge-firstboot           = ["service-plane"]
mios-forgejo-runner-firstboot  = ["service-plane"]
mios-git-root-init             = ["service-plane"]
mios-k3s-master                = ["service-plane"]
mios-passport-provision        = ["service-plane"]
mios-pgvector-backup           = ["service-plane"]
mios-skills-miner              = ["service-plane"]
mios-sys-env-refresh           = ["service-plane"]
mios-userdb-render             = ["service-plane"]

[blade.cpu_fallbacks]
# GPU-gated service -> CPU lane, same /v1 contract. ADR-0017 D2, task_2237.
mios-llm-heavy     = "mios-llm-light"
"mios-llm-worker@" = "mios-llm-light"

[field]
monitor_enabled   = true
show_live_monitor = true
drivepath         = "D"
filesystem        = "NTFS"
partition_scheme  = "GPT"
secure_boot       = "Enabled"
build_xbox        = "Enabled"
gaming_optimize   = "Enabled"
medicatver        = "21.12"
cache_path        = "M:\\MediCat.USB.v21.12.7z"
# medicat_sha1 / medicat_md5 : upstream-published hashes of MediCat.USB.v<medicatver>.7z,
#                  checked by installation/MiOS-Field.bat after download (SHA1 preferred,
#                  MD5 if SHA1 is empty; both empty -> check skipped). Update them with
#                  medicatver; keep them equal to mios-bootstrap's mios.toml [field]. Source
#                  for v21.12: the MediCat download page, https://medicatusb.com/#downloads
#                  (repo github.com/mon5termatt/medicat-website,
#                  src/components/home/downloads.astro @ cd6f924); the MD5 matches upstream
#                  github.com/mon5termatt/medicat_installer src/downloads.h + download/cdn.bat
#                  @ d588fd3, whose archive size (22994783619) matches MiOS-Field.bat's size gate.
medicat_sha1      = "2cbf5f337849a11084124a79a1b8d7e77eaca7d5"
medicat_md5       = "db50f96a5c7b5ec6dc9ed77ea29fffb0"
ventoy_version    = "latest"
xbox_builder      = ""
build_driver      = ""
log_path          = ""
models            = ""

# MiOS-Repo shadow-config partition (the "brain" -- always present on any USB).
# Label used when formatting the small config partition.
[field.repo_partition]
label              = "MiOS-Repo"

# MiOS-Data bulk store (OCI tar + just-all artifacts + model weights + package mirrors).
# Created ONLY on disks >= min_disk_gb; skipped on smaller sticks (degrade-open).
[field.data_partition]
label              = "MiOS-Data"
min_disk_gb        = 512

[field.live_chat]
enabled            = true
model              = "lfm2-700m"
model_fallback     = "granite-4.1-8b"
port               = 8642
ctx_size           = 8192
threads            = 0
iso_name           = "MiOS-Live-Chat.iso"
live_chat_enabled  = "true"                     # .bat-loader alias of `enabled`
live_chat_iso_name = "MiOS-Live-Chat.iso"       # .bat-loader alias of `iso_name`
live_chat_iso_src  = "M:\\MiOS-Live-Chat.iso"   # where MiOS-Field.bat looks for a pre-built ISO

[field.sysrescue]
enable            = true
username          = "mios"
password          = ""            # empty -> [identity].default_password (one SSOT cred)
root_login        = true
nofirewall        = true          # REQUIRED: default SystemRescue firewall blocks inbound sshd
ar_source_label   = "MiOS-Field"  # Ventoy data-partition label the autorun scanner mounts
connection_header = true          # print live IP + hardware banner on every boot AND every login
wipe_passphrase   = "mios"        # generic default passphrase gating the "Wipe MiOS" GRUB menu entry

[dotfiles]

# VS Code settings partition (ADR-0024): API-applied surfaces get client-portable
# keys only; settings FILES keep the full profile. Read by sync-dotfiles.py, mios-dotfiles-render.
[dotfiles.vscode]
# Registered only by the Electron workbench, src/vs/workbench/electron-browser/
# desktop.contribution.ts, which workbench.desktop.main.ts alone imports; the web
# workbench (vscode.dev, github.dev, a browser Codespace, code-server) has no
# registration for them. All but window.zoomLevel are APPLICATION-scoped too, so a
# Workspace-target write of them is refused on the desktop client as well.
desktop_only_keys = [
    "window.titleBarStyle",             # src/vs/workbench/electron-browser/desktop.contribution.ts (scope APPLICATION)
    "window.customTitleBarVisibility",  # src/vs/workbench/electron-browser/desktop.contribution.ts (scope APPLICATION); the key the Codespace named
    "window.dialogStyle",               # src/vs/workbench/electron-browser/desktop.contribution.ts (scope APPLICATION)
    "window.zoomLevel",                 # src/vs/workbench/electron-browser/desktop.contribution.ts (window scope)
    "vscode_custom_css.imports",        # be5invis.vscode-custom-css package.json: extensionKind ui, main-only, no browser entry -- a web extension host never loads it
]
# Registered on every client (src/vs/workbench/browser/workbench.contribution.ts,
# included on web) but APPLICATION-scoped, so a Workspace-target write is refused
# everywhere ("This setting can be written only into User settings"): User FILE only.
user_only_keys = [
    "window.menuBarVisibility",         # src/vs/workbench/browser/workbench.contribution.ts (scope APPLICATION)
]
# Keys no current client or extension registers. They are gone from the SSOT
# settings files; naming them here is what PRUNES them from a surface the additive
# merge would otherwise let them linger in, and --check refuses their return.
unregistered_keys = [
    "workbench.panel.alignment",        # runtime state (src/vs/workbench/browser/layout.ts PANEL_ALIGNMENT), never a setting: use the View: Align Panel commands
    "vscode_custom_css.policy",         # removed from be5invis.vscode-custom-css at commit 8023aaf, no replacement
    "docker.dockerPath",                # ms-azuretools.vscode-docker is an extension pack now; Container Tools registers containers.containerCommand instead
    "docker.environment",               # replaced by containers.environment (ms-azuretools.vscode-containers)
    "podman.socketPath",                # no extension registers it: redhat.vscode-podman exists on neither the marketplace nor open-vsx
    "podman.systemSocketPath",          # as above
]
# The client-portable surfaces, relative to this repository. The settings object
# sits at customizations.vscode.settings in a devcontainer.json and at settings in
# a *.code-workspace; tools/sync-dotfiles.py derives that path from the file name.
client_portable_surfaces = [
    ".devcontainer/devcontainer.json",
    ".devcontainer/artifact-builder/devcontainer.json",
    "mios.code-workspace",
]
# The same kind of surface in mios-bootstrap.git (Law 15), relative to that
# checkout (the sibling directory of this repository, or MIOS_BOOTSTRAP_ROOT).
bootstrap_client_portable_surfaces = [
    ".devcontainer/devcontainer.json",
]

# ----------------------------------------------------------------------------
# [rde] -- Decentralized Remote Development Environment SSOT Configuration
# Governs client-only DevPod orchestration, code-server IDE parameters,
# and OpenTofu infrastructure provisioning targets.
# ----------------------------------------------------------------------------
[rde]
orchestrator        = "devpod"
engine              = "podman"
ide                 = "code-server" # MIT licensed FOSS (or "openvscode-server" / "none")
devpod_version      = "0.6.15"
opentofu_version    = "1.13.1"
code_server_version = "4.141.0"
socket_path         = "/run/user/1000/podman/podman.sock"
workspace_dir       = "/workspaces/MiOS"
storage_driver      = "overlay"
telemetry           = false

[rde.devpod]
default_provider       = "docker"
inactivity_timeout     = 0
git_credentials_sync   = true
docker_credentials_sync = true
devcontainer_path      = ".devcontainer/devcontainer.json"

[rde.opentofu]
binary_path                    = "/usr/local/bin/tofu"
terraform_compatibility_symlink = true
parallelism                    = 10

[rde.blade]
enabled       = false
target_host   = "blade01.local"
target_user   = "user"
target_port   = 8100
identity_file = "~/.ssh/id_ed25519"

# forwardPorts of every devcontainer.json above (both repos), projected by
# tools/sync-dotfiles.py from these [ports] keys in order; the array is owned.
# containerEnv: each named MIOS_* entry is set to the value the resolver emits.
# Every MiOS repo on GitHub, side by side under root; every MiOS image opens this
# set. Post-create clones the missing ones; tools/sync-dotfiles.py projects it.
[workspace]
root         = "/workspaces"
primary      = "MiOS"
devcontainer = ".devcontainer/devcontainer.json"
repos = [
  { name = "MiOS",           url = "https://github.com/mios-dev/MiOS.git",           label = "MiOS (system root)" },
  { name = "mios-bootstrap", url = "https://github.com/mios-dev/mios-bootstrap.git", label = "mios-bootstrap (installer and user overlay)" },
  { name = "-dev-loop",      url = "https://github.com/mios-dev/-dev-loop.git",      label = "-dev-loop (engineering loop)" },
  { name = "mios-micro",     url = "https://github.com/mios-dev/mios-micro.git",     label = "mios-micro" },
]

[dotfiles.devcontainer]
forward_port_keys  = ["code_server", "agent_pipe", "llm_light", "pgvector"]
container_env_keys = ["MIOS_AI_ENDPOINT"]
# hostRequirements of every devcontainer.json above. The devcontainer runs
# [image].ref itself: ~23 GB compressed and ~49 GB unpacked, and Codespaces'
# containerd keeps both, so the pull alone needs ~72 GB before the workspace or a
# nested build of the image. Codespaces offers 128 GB of storage only on its
# 16-core / 64 GB machine, which is also what a rebuild of MiOS inside it needs.
# remoteUser is projected from [identity].username: the image's own user.
host_requirements = { cpus = 16, memory = "64gb", storage = "128gb" }

