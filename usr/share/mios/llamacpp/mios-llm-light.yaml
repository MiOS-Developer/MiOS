# AI-hint: The mios-llm-light model map -- maps OpenAI /v1-compatible model tags to llama-server configs, enabling multi-model auto-swapping, KV-cache paging via slot-save-paths, and embeddings for the MiOS agent stack.
# AI-doc: usr/share/doc/mios/manual/llamacpp.md
# Source of the CPU-tier map mios-llm-light-cpu.yaml (mios-gen light-tiers).
# Stream llama-swap's model swaps ("proxy") and one access line per request
# ("http": client address, method, path, status) to the journal, so a model
# load can be traced to the client that asked for it.
logToStdout: "proxy,http"
models:
  # ── chat / reasoning models (KV-pageable; --parallel 1 = one resident slot) ──
  # NOTE (fleet modernization): the light brain is now IBM Granite 4.1
  # 8B (dense 'granite' arch) -- it loads on MAINLINE llama.cpp, which is the REAL
  # fix for the old qwen3.5:4b qwen35-arch block (custom "qwen35" arch failed:
  # "qwen35.rope.dimension_sections wrong array length; expected 4, got 3"). The
  # micro lane is Liquid AI LFM2-700M ('lfm2' arch, also mainline). No patched fork
  # is needed any more; every served arch here loads on stock llama-server.
  # The fleet is now FAMILY-DIVERSE (IBM Granite + Liquid AI + Google + H Company)
  # and 128k-on-every-chat-lane via symmetric q8_0 quantized KV cache + flash-attn.
  # The qwen35-arch block is gone upstream: Qwen3.5 ('qwen35') and Qwen3.6
  # ('qwen35moe') load on mainline llama.cpp through the native GATED_DELTA_NET op
  # (PR #19468), present in the b12464 CPU and b12602 CUDA lane images. The
  # Qwen-monoculture rule still stands, so the Qwen entries below are tier picks,
  # never the vendor brain. Which lane serves which GGUF on a host is that host's model
  # tier (manual chapter 10, "Model tiers").
  # KV RULE: every chat entry runs symmetric q8_0 K/V ([llamacpp.tool_safe], gated by
  # check_tool_safe_floor). A 4-bit KV cache measurably flips tool-call decisions
  # (llama.cpp docs/function-calling.md warns on -ctk q4_0), so q4_0 is never the fix
  # for a tight box -- pick a hybrid-attention model instead (Qwen3.5/3.6 GDN, LFM2.5/
  # LFM3 conv: 64k of q8_0 KV costs 0.4-1.1 GiB).
  # micro_cpu (always-warm classify/expand/gate). fleet modernization:
  # qwen3:1.7b -> Liquid AI LFM2-700M (LiquidAI/LFM2-700M-GGUF). Dense 'lfm2' arch is
  # MERGED in mainline llama.cpp (PR #14620, ~b6709) -- NOT the qwen35 trap; verified
  # `llama-cli -hf LiquidAI/LFM2-700M-GGUF`. Beats Qwen3-0.6B on MMLU/GSM8K/IFEval at
  # ~0.7-1.0GB resident, ~2x faster CPU decode. Family-diversity win (off Qwen).
  # CAVEAT: LFM2 tool-calls use a Pythonic special-token format, not OpenAI JSON --
  # fine for the short micro job, not a JSON-tool agent. Native ctx 32K (micro lane is
  # EXEMPT from the global 128k chat mandate). Symmetric q8_0 KV + flash-attn on (GPU-
  # offloadable; NEVER asymmetric k!=v -> issue #20866 CPU-fallback). The qwen3:1.7b
  # alias keeps every pipeline-emitted micro name resolving onto the new model.
  # Part 10 CONV-04: --cache-reuse 256 (gate: MIOS_CONVERGE_INFERENCE_LLAMA_CACHE_REUSE_TOKENS > 0); --np 4 for shared-prefix concurrency.
  # TOOL-SAFE: lfm2-700m.gguf is LFM2-700M at Q8_0, the [llamacpp.tool_safe] small floor
  # for a sub-1B non-reasoning micro. It also backs the mios-micro names: their old
  # entry ran the mios-micro image's Qwen2.5-Coder-1.5B at Q4_K_M, below that floor,
  # as a second always-resident micro. One micro GGUF in RAM is what lets the light
  # lane's helpers fit a 14G Blade's 25% bound next to its GPU and CPU lanes.
  "lfm2:700m":
    aliases:
      - qwen3:1.7b
      - mios-micro:1.5b
      - mios-micro
      - micro
    cmd: >
      /app/llama-server --model /models/lfm2-700m.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 32768 --parallel 1 --cache-reuse 256
      --n-gpu-layers 999 --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --slot-save-path /var/lib/mios/llamacpp/slots --jinja
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  # light_brain + coder -- IBM Granite 4.1 8B Instruct (dense). fleet
  # modernization: the served chat/reasoning GGUF moves from gemma4:12b to Granite 4.1
  # 8B (ibm-granite/granite-4.1-8b; GGUF unsloth/granite-4.1-8b-GGUF Q4_K_M ~5.5GB).
  # Dense GraniteForCausalLM ('granite') arch loads on MAINLINE llama.cpp (bartowski
  # quant @ b8970; Unsloth uses stock llama-server) -> sidesteps the qwen35 trap that
  # BLOCKS qwen3.5:4b and forced the gemma4:12b fallback. Granite is natively 131K-capable,
  # but the SERVED --ctx-size is 32768 (model-placement decision): the
  # always-on SGLang heavy lane ([ai.sglang], mem_fraction 0.45 ~= 11GB RESERVED up front) +
  # granite weights (~5GB) + a full 128k q8_0 KV (~8GB) CANNOT co-fit the shared 24GB 4090 ->
  # granite's load spilled to CPU = 67-100s refine (the chat-slowness root cause). A 32k q8_0
  # KV (~2-3GB) co-fits SGLang on the GPU (refine drops to ~2-5s) and is ample for chat/refine.
  # Raise back toward 131072 ONLY if the SGLang heavy lane is disabled or moved off this card
  # (then granite has the whole 4090). Apache-2.0; first non-Qwen brain (family mix).
  # DO NOT pull the '-h'/granitehybrid GGUF (newer arch = qwen35-style trap). Build
  # note: avoid CUDA 13.2 (gibberish-output bug). --jinja MANDATORY for tool_calls.
  # 128k FIT: symmetric q8_0 K+V quantized KV cache + flash-attn on (GPU-offloadable;
  # NEVER asymmetric k!=v -> issue #20866 ~40x CPU-fallback). Low-end 8GB profile:
  # keep q8_0 (see the KV RULE above) and serve a hybrid-attention entry instead of
  # this dense 8B, whose 64k q8_0 KV alone is ~5.3 GiB.
  # Part 10 CONV-04: --cache-reuse 256 (gate: MIOS_CONVERGE_INFERENCE_LLAMA_CACHE_REUSE_TOKENS > 0); --np 4 for shared-prefix concurrency.
  "granite4.1:8b":
    # Alias every legacy/role model name the pipeline still emits (incl. the old
    # gemma4:12b reasoning tag and the BLOCKED qwen3.5 tags) onto Granite 4.1 8B so
    # the upstream llama-swap proxy routes them instead of 400 "no router for requested model". Until G7
    # reconciles names in SSOT this resolves the whole pipeline to the one served
    # mainline-loadable brain GGUF on the dGPU.
    aliases:
      - MiOS-Agent
      - mios-agent
      - mios-agent-cpu
      - mios-hermes
      - mios-hermes-cpu
      - hermes-agent
      - mios-daemon-agent
      - mios-opencode
      - mios-opencode:latest
      - mios-igpu
      - mios-heavy
      - mios-reasoner-cpu
      - mios-planner
      - gemma4:12b
      - qwen3.5:4b
      - qwen3.5:9b
      - qwen3.5:2b
      - granite4.1:3b
      - qwen2.5-3b-instruct-4bit
      - qwen2.5-coder:7b
    cmd: >
      /app/llama-server --model /models/granite-4.1-8b.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 32768 --parallel 1 --cache-reuse 256
      --flash-attn auto
      --cache-type-k q8_0 --cache-type-v q8_0
      --slot-save-path /var/lib/mios/llamacpp/slots --jinja
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  # ── model-tier picks (every arch below loads on stock llama-server) ─────────
  # Each runs at a [llamacpp.tool_safe] quant with symmetric q8_0 K/V and --jinja.
  # The heavy lane and mios-cpu-node serve these GGUFs per host through their model
  # tiers ([[llamacpp.tiers.heavy]], [[llamacpp.tiers.cpu_node]]) under the stable
  # served names (mios-heavy, mios-agent-cpu and every granite4.1:8b alias); the
  # entries here make each one callable by name on a GPU-tier light lane. A CPU-only
  # host's CPU-tier map drops the agent-class entries ([llamacpp.light_cpu_tier].drop).
  # Every GGUF is in the vendor [[ai.firstboot_models]], so every host has them. The
  # hybrid-attention entries carry no --cache-reuse: recurrent/conv state cannot be
  # shifted, and llama-server disables reuse for such models anyway.
  #
  # Qwen3.5-4B (Apache-2.0; 'qwen35' dense GDN hybrid, reasoning, 262k native). Dense
  # 4B + reasoning: the floor is Q4_K_M, which the 8 GB GPU and console-APU tiers use;
  # bigger GPU tiers serve its Q8_0 (Qwen3.5-4B-Q8_0.gguf) at 128k. Tool calls are
  # Qwen3-Coder XML (llama.cpp's qwen3_coder handler). A thinking model: keep >= 64k.
  # GGUF ggml-org/Qwen3.5-4B-GGUF, file Qwen3.5-4B-Q4_K_M.gguf (3032091584 bytes).
  "qwen3.5:4b-q4_K_M":
    aliases:
      - qwen3.5-4b
    cmd: >
      /app/llama-server --model /models/Qwen3.5-4B-Q4_K_M.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 65536 --parallel 1
      --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --slot-save-path /var/lib/mios/llamacpp/slots --jinja
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  # LFM2.5-8B-A1B (Liquid AI, LFM Open License v1.0 -- commercial terms not yet
  # reviewed; 'lfm2moe' conv hybrid, 8.5B total / 1.5B active, 128k native). A MoE
  # with <= 2B active: Q8_0. The 16G-RAM cpu-node tier: it reads about a fifth of a
  # dense 8B's weight bytes per token, and 64k of q8_0 KV is ~0.4 GiB. Tool calls are
  # Pythonic <|tool_call_start|>[f(a=1)]<|tool_call_end|>, which llama.cpp's LFM2.5
  # handler maps to OpenAI tool_calls; confirm with a JSON tool_calls smoke test.
  # GGUF LiquidAI/LFM2.5-8B-A1B-GGUF, file LFM2.5-8B-A1B-Q8_0.gguf (9010195680 bytes).
  "lfm2.5:8b-a1b":
    aliases:
      - lfm2.5-8b-a1b
    cmd: >
      /app/llama-server --model /models/LFM2.5-8B-A1B-Q8_0.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 65536 --parallel 1
      --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --slot-save-path /var/lib/mios/llamacpp/slots --jinja
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  # Granite 4.2 3B (IBM, Apache-2.0; dense 'granite', every layer attends, built-in
  # thinking, 131k native). Sub-4B: Q8_0. Same family and template path as granite-4.1;
  # the 6G and 12G cpu-node tiers (32k and 64k). Served here at 32k because its dense KV
  # is 80 KiB/token (64k of q8_0 is ~2.7 GiB).
  # GGUF ibm-granite/granite-4.2-3b-GGUF, file granite-4.2-3b-Q8_0.gguf (3892651552 bytes).
  "granite4.2:3b":
    aliases:
      - granite-4.2-3b
    cmd: >
      /app/llama-server --model /models/granite-4.2-3b-Q8_0.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 32768 --parallel 1 --cache-reuse 256
      --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --slot-save-path /var/lib/mios/llamacpp/slots --jinja
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  # LFM3-1.7B (Liquid AI, LFM Open License v1.0; 'lfm3' tri-hybrid of short convs,
  # sliding-window and global attention, 256k native; post-trained for agent harnesses
  # including Hermes Agent). Sub-4B: Q8_0. The tool-safe floor of the cpu-node tiers
  # (every node keeps tools, a 14G APU's CPU lane included) and the opt-in micro
  # ([ai].micro_model = "lfm3:1.7b"). Tool calls are Qwen3-Coder-style XML (llama.cpp's
  # qwen3_coder handler); the vendor warns against agentic coding or long multi-step
  # reasoning. Micro lane: 32k, EXEMPT from the 128k chat mandate.
  # GGUF LiquidAI/LFM3-1.7B-GGUF, file LFM3-1.7B-Q8_0.gguf (1846238496 bytes).
  "lfm3:1.7b":
    aliases:
      - lfm3-1.7b
    cmd: >
      /app/llama-server --model /models/LFM3-1.7B-Q8_0.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 32768 --parallel 1
      --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --slot-save-path /var/lib/mios/llamacpp/slots --jinja
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  # gpt-oss-20b (Apache-2.0; 'gpt-oss' MoE, 20.9B total / 3.6B active, half sliding
  # window, 131k native) in its native MXFP4, which meets any floor. The 32G-RAM
  # cpu-node tier and the 16-24 GB GPU tiers. Its parser is Harmony: clients MUST send
  # reasoning_content back on every tool-call turn, or a malformed channel header gets
  # the turn rejected (llama.cpp #27720).
  # GGUF ggml-org/gpt-oss-20b-GGUF, file gpt-oss-20b-MXFP4.gguf (12109566624 bytes).
  "gpt-oss:20b":
    aliases:
      - gpt-oss-20b
    cmd: >
      /app/llama-server --model /models/gpt-oss-20b-MXFP4.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 65536 --parallel 1
      --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --slot-save-path /var/lib/mios/llamacpp/slots --jinja
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  # Qwen3.6-35B-A3B (Apache-2.0; 'qwen35moe' GDN MoE, 35B total / 3B active, reasoning,
  # 262k native). The strongest sub-40B agent and coder. 3B active is caution
  # territory, so it serves only at Q8_0 (~36 GiB at 64k): the 64G-RAM cpu-node tier;
  # the CPU tier drops it from this lane. Tool calls are Qwen3-Coder XML.
  # GGUF ggml-org/Qwen3.6-35B-A3B-GGUF, file Qwen3.6-35B-A3B-Q8_0.gguf (36903139616 bytes).
  "qwen3.6:35b-a3b":
    aliases:
      - qwen3.6-35b-a3b
    cmd: >
      /app/llama-server --model /models/Qwen3.6-35B-A3B-Q8_0.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 65536 --parallel 1
      --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
      --slot-save-path /var/lib/mios/llamacpp/slots --jinja
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  # NVIDIA-Nemotron-3.5-Bolt-E4B -- DISABLED (commented out below). Gemma-4-E4B
  # lineage, the best call-discipline scores in its class (When2Call, RelyToolBench).
  # Verified: NVIDIA's own GGUF nvidia/NVIDIA-Nemotron-3.5-Bolt-E4B-4GB, file
  # Nemotron-3.5-Bolt-E4B-Q4_K_M.gguf (6180446208 bytes, OpenMDW-1.1, 'gemma4' arch,
  # 64k native). Its class (8B total, dense) meets the floor at Q4_K_M, but it does not
  # fit the GPU tier it was meant for: ~5.8 GiB of weights + ~0.5 GiB of 64k q8_0 KV +
  # 0.8 GiB compute is ~7.1 GiB, against the 14G console APU's ~5.4 GiB GPU budget
  # (0.40 x 13.6 GiB, next to its CPU lane and light lane); at 32k it is still ~6.8 GiB.
  # Uncomment, add its [llamacpp.gguf] row and a [[llamacpp.tiers.heavy]] row only for
  # a GPU tier that fits it.
  # "nemotron3.5-bolt:e4b":
  #   aliases:
  #     - nemotron-3.5-bolt-e4b
  #   cmd: >
  #     /app/llama-server --model /models/Nemotron-3.5-Bolt-E4B-Q4_K_M.gguf
  #     --port ${PORT} --host 127.0.0.1
  #     --ctx-size 65536 --parallel 1
  #     --flash-attn on
  #     --cache-type-k q8_0 --cache-type-v q8_0
  #     --slot-save-path /var/lib/mios/llamacpp/slots --jinja
  #   proxy: "http://127.0.0.1:${PORT}"
  #   ttl: 300

  # ── embeddings (replaces the legacy embed lane; OpenAI /v1/embeddings) ──
  # fleet modernization: nomic-embed-text -> Google EmbeddingGemma-300m QAT
  # (ggml-org/embeddinggemma-300m-qat-q8_0-GGUF). 768d NATIVE = exact pgvector
  # vector(768) match -> ZERO schema migration. QAT (operator efficiency win);
  # 'gemma-embedding' arch merged mainline (b6384); <0.5GB, CPU-servable. The served
  # NAME stays "nomic-embed-text" so every caller (OWUI, knowledge/RAG, the 768d
  # column) is unchanged -- only the backing GGUF swaps. CAVEAT: set --pooling mean
  # explicitly (issue #19040 cosine-drift was a mean-vs-CLS config error, not arch).
  # MIGRATION GATE: run the knowledge-recall sanity test (0.933-hit) before retiring
  # the real nomic GGUF; to roll back, point --model at /models/nomic-embed-text.gguf.
  # Embeddings are EXEMPT from the 128k mandate -- ctx stays short (2048).
  "nomic-embed-text":
    # -parallel 4 (F1): the embedding server had ONE slot, so a
    # BURST of concurrent /v1/embeddings (OWUI re-vectorizing a knowledge collection;
    # any multi-chunk RAG batch) overran it -> llama-swap returned 429 Too Many Requests
    # and the MiOS Documentation collection never vectorized (knowledge_search 0 hits).
    # 4 embedding slots absorb the concurrency; the 300m model is tiny so the extra KV
    # is negligible. Pairs with the co-resident `swap:false` group (which fixed the
    # SWAP-induced 429); this fixes the CONCURRENCY-induced one.
    cmd: >
      /app/llama-server --model /models/embeddinggemma-300m-qat-q8_0.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 8192 --batch-size 2048 --ubatch-size 2048 --embedding --pooling mean --n-gpu-layers 999 --parallel 4
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600

  # EmbeddingGemma 2, text path only (Google, Apache-2.0; 'gemma-embedding2', the 271M
  # non-causal text model; its GGUF declares pooling_type mean and a 768-d output, the
  # pgvector width, Matryoshka down to 128). Much stronger on code retrieval than the
  # EmbeddingGemma-300m behind nomic-embed-text, so it suits tool shortlisting and
  # nearest-lane routing over /v1/embeddings. A SEPARATE served name on purpose:
  # re-pointing nomic-embed-text at it changes the vector space, so that swap is an
  # operator migration ([pgvector].emb_version bump + backfill re-embed), never a
  # default. The vision/audio towers ship as mmproj files and are not loaded.
  # GGUF ggml-org/embeddinggemma-2-GGUF, file embeddinggemma-2-Q8_0.gguf (309855456 bytes).
  "embeddinggemma2:270m":
    aliases:
      - embeddinggemma-2
    cmd: >
      /app/llama-server --model /models/embeddinggemma-2-Q8_0.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 8192 --batch-size 2048 --ubatch-size 2048 --embedding --pooling mean --n-gpu-layers 999 --parallel 4
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 600

  # ── vision grounding (cu_ground / mios-pc-vision fallback) ──────────────────
  # INERT until BOTH GGUFs exist under /models -- the operator downloads them (the
  # security classifier blocks the fetch for the assistant). Once present, mios-llm-light
  # serves qwen3-vl:4b with vision on demand and cu_ground's vision fallback
  # activates (endpoint already points here, :11450;).
  # fleet modernization: qwen3-vl:4b -> H Company Holo1.5-7B (UI-grounding
  # SFT, ScreenSpot-Pro ~57.9). GGUF mradermacher/Holo1.5-7B-GGUF Q4_K_M 4.68GB +
  # mmproj-Q8_0 1.0GB. Base arch 'qwen2vl' (fine-tune of Qwen2.5-VL) is MATURE on
  # mainline llama.cpp -> opposite of the qwen35 fork-only trap. ~5.7GB fits the 4090.
  # Keep mmproj >= Q8_0/f16 (vision is quant-sensitive). Low-end 8GB profile: use the
  # 3B (mradermacher/Holo1.5-3B-GGUF Q4_K_M 2.1GB + mmproj-Q8_0 0.9GB, ~3GB total).
  # Vision/grounding lane keeps short ctx (8192) -- EXEMPT from the 128k chat mandate.
  # STILL INERT until BOTH GGUFs exist under /models (operator places them; the
  # security classifier blocks the assistant fetch). The served NAME stays
  # "qwen3-vl:4b" so cu_ground / mios-pc-vision endpoints are unchanged.
  "qwen3-vl:4b":
    cmd: >
      /app/llama-server --model /models/holo1.5-7b.gguf
      --mmproj /models/holo1.5-7b-mmproj-q8_0.gguf
      --port ${PORT} --host 127.0.0.1
      --ctx-size 8192 --n-gpu-layers 999 --flash-attn on
      --cache-type-k q8_0 --cache-type-v q8_0
    proxy: "http://127.0.0.1:${PORT}"
    ttl: 300

  # ── federated RPC model route: RETIRED ───────────────────────────────────────
  # federated:32b (aliases mios-federated, federated) sharded the 8B's layers across
  # the dGPU and the iGPU rpc-server (--rpc, --split-mode layer, --tensor-split). It
  # failed on every request: no fleet host runs the RPC backend it needs, and
  # upstream describes llama.cpp RPC as proof-of-concept, fragile and insecure, with
  # the slowest node gating every token. Larger models are reached by routing over
  # one-model-per-node lanes instead. llama-rpc-server and the Windows iGPU lane are
  # unchanged; only this served route is gone.

# ── CO-RESIDENT GROUP ("explain the logs" exposed it) ──────
# Default llama-swap is single-active: only ONE model resident, the rest swapped
# out. So an embeddings request (RAG / memory) that arrives DURING a chat turn had
# to swap the BUSY chat model out -- which llama-swap refuses mid-request and
# returns 429 Too Many Requests. Result: ~40% of /v1/embeddings 429'd on a normal
# turn (the agent-pipe stores knowledge + RAG-enriches every turn), silently
# degrading memory/recall. FIX: keep the everyday trio CO-RESIDENT. `swap: false`
# = members never evict EACH OTHER (all can be loaded together); they still load
# on demand. VRAM: granite4.1:8b ~5.5G + lfm2:700m ~0.7G + embeddinggemma ~0.5G
# = ~6.7G, far inside the 4090's 24G. Vision (qwen3-vl, inert/gated) stays in the
# implicit default group and swaps in on demand (exclusive), evicting this group
# only when actually used. No more swap-contention 429 on the hot chat+embed path.
# The opt-in helpers (lfm3:1.7b micro, embeddinggemma2:270m embedder) join the group
# because their job is to answer DURING a chat turn; they load only when a host asks
# for them. The opt-in agent picks stay in the default group, like vision. On a
# 14G CPU-only Blade the CPU-tier lane is bounded to 25% of RAM (~3.4 GiB): the
# resident trio (~2.8 GiB, estimated from live RSS) leaves room for the 0.3 GiB embedder but
# not for lfm3:1.7b beside lfm2:700m, so such a Blade keeps lfm2:700m as its micro.
groups:
