# AI-hint: Liquid-glass Hyprland effects fragment, projected from mios.toml.
decoration {
    rounding = ${MIOS_EFFECTS_ROUNDING}
    active_opacity = ${MIOS_EFFECTS_ACTIVE_OPACITY}
    inactive_opacity = ${MIOS_EFFECTS_INACTIVE_OPACITY}
    fullscreen_opacity = ${MIOS_EFFECTS_FULLSCREEN_OPACITY}
    blur {
        enabled = ${MIOS_EFFECTS_BLUR_ENABLED}
        size = ${MIOS_EFFECTS_BLUR_SIZE}
        passes = ${MIOS_EFFECTS_BLUR_PASSES}
        new_optimizations = ${MIOS_EFFECTS_BLUR_NEW_OPTIMIZATIONS}
        xray = ${MIOS_EFFECTS_BLUR_XRAY}
        ignore_opacity = ${MIOS_EFFECTS_BLUR_IGNORE_OPACITY}
        noise = ${MIOS_EFFECTS_BLUR_NOISE}
        contrast = ${MIOS_EFFECTS_BLUR_CONTRAST}
        brightness = ${MIOS_EFFECTS_BLUR_BRIGHTNESS}
        vibrancy = ${MIOS_EFFECTS_BLUR_VIBRANCY}
        vibrancy_darkness = ${MIOS_EFFECTS_BLUR_VIBRANCY_DARKNESS}
        popups = ${MIOS_EFFECTS_BLUR_POPUPS}
        popups_ignorealpha = ${MIOS_EFFECTS_BLUR_POPUPS_IGNOREALPHA}
    }
    drop_shadow = ${MIOS_EFFECTS_SHADOW_ENABLED}
    shadow_range = ${MIOS_EFFECTS_SHADOW_RANGE}
    shadow_render_power = ${MIOS_EFFECTS_SHADOW_RENDER_POWER}
    shadow_offset = ${MIOS_EFFECTS_SHADOW_OFFSET}
    col.shadow = rgba(${MIOS_EFFECTS_SHADOW_COLOR})
    col.shadow_inactive = rgba(${MIOS_EFFECTS_SHADOW_COLOR_INACTIVE})
    dim_inactive = ${MIOS_EFFECTS_DIM_INACTIVE}
    dim_strength = ${MIOS_EFFECTS_DIM_STRENGTH}
}

# Layout spacing (gaps + border width are part of the glass rhythm). This
# general{} merges additively with hyprland.conf's general{} which keeps the
# border COLORS on the @@MIOS_COLOR_*@@ palette path -- no conflict.
general {
    gaps_in = ${MIOS_EFFECTS_GAPS_IN}
    gaps_out = ${MIOS_EFFECTS_GAPS_OUT}
    border_size = ${MIOS_EFFECTS_BORDER_SIZE}
}

# Dynamic micro-animations -- overshoot beziers approximate a spring/"liquid"
# feel (native spring curves are Hyprland 0.55+; adopt once the baked compositor
# reaches it). borderangle is intentionally NOT looped -- looping defeats VFR and
# drains battery even when the window is obscured (Hyprland wiki). Bezier names
# are lowercase so definitions and every animation reference stay consistent.
animations {
    enabled = ${MIOS_EFFECTS_ANIMATIONS_ENABLED}
    bezier = liquid,    ${MIOS_EFFECTS_BEZIER_LIQUID}
    bezier = smoothout, ${MIOS_EFFECTS_BEZIER_SMOOTHOUT}
    bezier = smoothin,  ${MIOS_EFFECTS_BEZIER_SMOOTHIN}
    bezier = mybezier,  ${MIOS_EFFECTS_BEZIER_MYBEZIER}
    animation = windows,     ${MIOS_EFFECTS_ANIM_WINDOWS}
    animation = windowsIn,   ${MIOS_EFFECTS_ANIM_WINDOWSIN}
    animation = windowsOut,  ${MIOS_EFFECTS_ANIM_WINDOWSOUT}
    animation = windowsMove, ${MIOS_EFFECTS_ANIM_WINDOWSMOVE}
    animation = border,      ${MIOS_EFFECTS_ANIM_BORDER}
    animation = borderangle, ${MIOS_EFFECTS_ANIM_BORDERANGLE}
    animation = fade,        ${MIOS_EFFECTS_ANIM_FADE}
    animation = fadeIn,      ${MIOS_EFFECTS_ANIM_FADEIN}
    animation = fadeOut,     ${MIOS_EFFECTS_ANIM_FADEOUT}
    animation = workspaces,  ${MIOS_EFFECTS_ANIM_WORKSPACES}
    animation = layers,      ${MIOS_EFFECTS_ANIM_LAYERS}
    animation = layersIn,    ${MIOS_EFFECTS_ANIM_LAYERSIN}
    animation = layersOut,   ${MIOS_EFFECTS_ANIM_LAYERSOUT}
}

# Liquid-glass on the shell's OWN layer surfaces (Quickshell bar + rail, rofi,
# notifications). Compositor blur is what actually frosts them -- the QML only
# sets a translucent fill.
layerrule = blur, quickshell
layerrule = ignorealpha ${MIOS_EFFECTS_LAYER_ALPHA_QUICKSHELL}, quickshell
layerrule = xray 0, quickshell
layerrule = blur, ^(mios-.*)$
layerrule = ignorealpha 0.15, ^(mios-.*)$
layerrule = xray 0, ^(mios-.*)$
layerrule = blur, rofi
layerrule = ignorealpha ${MIOS_EFFECTS_LAYER_ALPHA_ROFI}, rofi
layerrule = blur, notifications
layerrule = ignorealpha ${MIOS_EFFECTS_LAYER_ALPHA_NOTIFICATIONS}, notifications
