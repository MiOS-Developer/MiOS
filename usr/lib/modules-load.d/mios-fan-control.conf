# AI-hint: Autoloads the nct6775 Super-I/O hwmon driver (Nuvoton NCT67xx, incl. the NCT6799D on ASUS AM5 boards) so motherboard fan headers appear as /sys/class/hwmon pwmN/fanN for ventulusd (mios-fan-control).
# AI-related: /usr/lib/systemd/system/ventulusd.service, /usr/share/mios/fan-control/daemon.toml, /usr/share/mios/mios.toml [hardware.fan_control]
# No acpi_enforce_resources=lax needed: on the ROG CROSSHAIR X870E EXTREME the
# driver binds (0x2e:0x290) with no ACPI resource conflict. A board without
# the chip just logs that no device was found; nothing else changes.
nct6775
