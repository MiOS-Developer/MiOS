        .buttons-wrapper {
          overflow: visible !important;
          height: auto !important;
          min-height: max-content !important;
          flex-shrink: 0 !important;
          display: flex !important;
          flex-direction: column !important;
          box-sizing: border-box !important;
          width: 100% !important;
        }
        :host([expanded]) .buttons-wrapper {
          display: flex !important;
          flex-direction: column !important;
          align-items: stretch !important;
          justify-content: flex-start !important;
          border: 1.5px solid color-mix(in srgb, #E7DFD3 22%, color-mix(in srgb, #F35C15 50%, transparent)) !important;
          border-radius: 10px !important;
          background: color-mix(in srgb, #282262 48%, transparent) !important;
          box-shadow: inset 0 1px 0 color-mix(in srgb, #E7DFD3 24%, transparent) !important;
          padding: 6px 8px !important;
          margin-top: 2px !important;
        }
        :host([expanded]) .buttons-wrapper::before {
          content: "tabs / apps";
          display: block !important;
          width: 100% !important;
          box-sizing: border-box !important;
          font-size: 11px !important;
          font-weight: 700 !important;
          letter-spacing: 0.04em !important;
          color: #F35C15 !important;
          text-align: center !important;
          padding-bottom: 5px !important;
          margin-bottom: 5px !important;
          border-bottom: 1px solid color-mix(in srgb, #B7C9D7 40%, transparent) !important;
        }
        .tools-and-extensions:not(.overflow-button) {
          overflow: visible !important;
          min-height: max-content !important;
          max-height: none !important;
          flex-shrink: 0 !important;
          width: 100% !important;
          display: flex !important;
          flex-direction: column !important;
          align-items: stretch !important;
          box-sizing: border-box !important;
        }
        .overflow-button, .bottom-actions {
          display: none !important;
