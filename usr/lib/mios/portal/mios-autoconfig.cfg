      :root[data-mios-zen-open="true"] #sidebar-container {
        width: 240px !important;
        min-width: 240px !important;
      }
    `;
    const wu = win.windowUtils;
    if (wu && wu.loadSheetUsingURIString) {
      wu.loadSheetUsingURIString(
        "data:text/css;charset=utf-8," + encodeURIComponent(mainCss),
        wu.USER_SHEET
      );
    }
    if (win.gBrowser && win.gBrowser.tabContainer && !win._miosTabScaleWired) {
      win._miosTabScaleWired = true;
      const onTabChange = () => {
        syncTabstripHeight(win);
        win.setTimeout(() => syncTabstripHeight(win), 50);
      };
      for (const evName of ["TabOpen", "TabClose", "TabPinned", "TabUnpinned"]) {
        win.gBrowser.tabContainer.addEventListener(evName, onTabChange);
      }
      win.addEventListener("resize", onTabChange);
    }
    syncTabstripHeight(win);
  } catch (e) {
    Cu.reportError("mios-autoconfig: main chrome sheet: " + e);
  }
}

function syncSidebarShadow(sm, win) {
