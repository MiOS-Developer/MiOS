          width: 100% !important;
          box-sizing: border-box !important;
        }
        #mios-zen-header-top {
          display: flex !important;
          flex-direction: row !important;
          align-items: center !important;
          justify-content: space-between !important;
          gap: 4px !important;
          width: 100% !important;
          box-sizing: border-box !important;
        }
        :host(:not([expanded])) #mios-zen-header-top {
          justify-content: center !important;
        }
        #mios-zen-title {
          font-size: 13px !important;
          font-weight: 700 !important;
          letter-spacing: 0.02em !important;
          color: #E7DFD3 !important;
          white-space: nowrap !important;
          overflow: hidden !important;
          text-overflow: ellipsis !important;
        }
        :host(:not([expanded])) #mios-zen-title,
        :host(:not([expanded])) #mios-zen-url-form {
          display: none !important;
        }
        #mios-zen-collapse-btn {
          appearance: none !important;
          border: 1.5px solid color-mix(in srgb, #E7DFD3 26%, color-mix(in srgb, #F35C15 65%, transparent)) !important;
          border-radius: 7px !important;
          background: color-mix(in srgb, #F35C15 24%, color-mix(in srgb, #282262 50%, transparent)) !important;
          box-shadow: inset 0 1px 0 color-mix(in srgb, #E7DFD3 28%, transparent) !important;
          color: #E7DFD3 !important;
          font-size: 11px !important;
          font-weight: 700 !important;
          padding: 3px 6px !important;
          cursor: pointer !important;
          line-height: 1 !important;
          flex-shrink: 0 !important;
        }
        #mios-zen-url-form {
          display: flex !important;
          width: 100% !important;
          margin: 0 !important;
        }
        #mios-zen-url-input {
          width: 100% !important;
