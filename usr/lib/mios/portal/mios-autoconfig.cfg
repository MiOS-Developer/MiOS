                btn.setAttribute("data-mios-brand", activeModel.brandName);
                let pillText = ms.shadowRoot.getElementById("mios-model-visible-label");
                if (!pillText) {
                  pillText = aiDoc.createElementNS("http://www.w3.org/1999/xhtml", "span");
