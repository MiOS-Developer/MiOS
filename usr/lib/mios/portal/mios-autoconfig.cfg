                  ms.shadowRoot.insertBefore(pillText, btn);
                }
                pillText.textContent = fullLabel;
              }
              const items = Array.from(ms.shadowRoot.querySelectorAll("button.model-item"));
              const ordered = ["0", "1", "2", "3"].map(k => MIOS_MODELS[k]).filter(Boolean);
              items.forEach((item, idx) => {
                const m = ordered[idx];
                if (!m) return;
                item.setAttribute("data-choice", m.choice);
                item.setAttribute("data-mios-label", m.shortName);
                const lblEl = item.querySelector(".model-item-label");
                if (lblEl) {
                  lblEl.removeAttribute("data-l10n-id");
                  lblEl.textContent = m.shortName;
                }
                const detEl = item.querySelector(".model-item-details");
                if (detEl) {
                  detEl.removeAttribute("data-l10n-id");
                  detEl.removeAttribute("data-l10n-args");
                  detEl.textContent = m.ownerName;
                }
              });
              const activeBanner = sr.getElementById("mios-smartwindow-active-model");
              if (activeBanner) {
                activeBanner.textContent = "Local Model: " + activeModel.shortName + " · Endpoint: " + MIOS_CHAT_URL;
              }
            } catch (e) {}
          };
          applyModelLabels();
          if (!ms._miosModelSyncWired) {
            ms._miosModelSyncWired = true;
            ms.addEventListener("aiwindow-input-model-select:model-change", (ev) => {
              try {
                const nextChoice = String((ev && ev.detail && ev.detail.modelChoiceId) || "1");
                const nextModel = MIOS_MODELS[nextChoice] || MIOS_MODELS["1"];
                Services.prefs.setStringPref("browser.smartwindow.firstrun.modelChoice", nextChoice);
                Services.prefs.setStringPref("browser.smartwindow.model", nextModel.model);
                applyModelLabels();
              } catch (e) {}
            });
            const origUpdated = typeof ms.updated === "function" ? ms.updated.bind(ms) : null;
            ms.updated = function(...args) {
              if (origUpdated) {
                try { origUpdated(...args); } catch (e) {}
              }
              applyModelLabels();
            };
          }
        }
      }
    }
  } catch (e) {
    Cu.reportError("mios-autoconfig: syncSmartWindowElements: " + e);
  }
}

function allowSidebarInSmartWindow(win) {
  try {
    if (!win || !win.SidebarController) return;
    win.SidebarController.isAIWindow = () => false;
    if (win.SidebarController.sidebars && typeof win.SidebarController.sidebars.get === "function") {
      const cfg = win.SidebarController.sidebars.get("viewGenaiChatSidebar");
      if (cfg) {
        cfg.hideInAIWindow = false;
      }
    }
  } catch (e) {}
}

function hydrateChatSidebar(win) {
  try {
    ensureMiOSSmartWindowSubsystem();
    allowSidebarInSmartWindow(win);
    const doc = win.document;
    const sbox = doc.getElementById("sidebar-box");
    const sb = doc.getElementById("sidebar");
    if (!sbox || !sb) return;

    if (!doc.getElementById("mios-chat-header")) {
      const hdr = doc.createElementNS("http://www.w3.org/1999/xhtml", "div");
      hdr.id = "mios-chat-header";
      const t = doc.createElementNS("http://www.w3.org/1999/xhtml", "span");
      t.id = "mios-chat-title";
      t.textContent = "Chat";
      t.setAttribute("title", "MiOS Portal Smart Window AI");
      const hidesBtn = doc.createElementNS("http://www.w3.org/1999/xhtml", "button");
      hidesBtn.id = "mios-chat-hides-btn";
      hidesBtn.type = "button";
      const syncHidesLabel = () => {
        const pinned = doc.documentElement.getAttribute("data-mios-chat-pinned") === "true";
        hidesBtn.setAttribute("data-pinned", pinned ? "true" : "false");
        hidesBtn.textContent = pinned ? "Hides" : "Hides (Auto)";
      };
      syncHidesLabel();
      hidesBtn.addEventListener("click", (ev) => {
        ev.preventDefault();
        const root = doc.documentElement;
        if (root.getAttribute("data-mios-chat-pinned") === "true") {
          root.removeAttribute("data-mios-chat-pinned");
        } else {
          root.setAttribute("data-mios-chat-pinned", "true");
        }
        syncHidesLabel();
      });
      hdr.appendChild(t);
      hdr.appendChild(hidesBtn);
      sbox.insertBefore(hdr, sbox.firstChild);
    }

    sb.style.setProperty("display", "none", "important");
    sb.style.setProperty("max-height", "0px", "important");
    sb.style.setProperty("flex", "0 0 0px", "important");

    const stack = sbox.querySelector(".sidebar-browser-stack") || sbox;
    let aiBrowser = doc.getElementById("ai-window-browser");
    if (!aiBrowser) {
      aiBrowser = doc.createXULElement("browser");
      aiBrowser.setAttribute("id", "ai-window-browser");
      aiBrowser.setAttribute("type", "content");
      aiBrowser.setAttribute("transparent", "true");
      aiBrowser.setAttribute("flex", "1");
      aiBrowser.setAttribute("disablehistory", "true");
      aiBrowser.setAttribute("disablefullscreen", "true");
      aiBrowser.setAttribute("tooltip", "aHTMLTooltip");
      aiBrowser.style.setProperty("flex", "1 1 auto", "important");
      aiBrowser.style.setProperty("width", "100%", "important");
      aiBrowser.style.setProperty("min-height", "0", "important");
      aiBrowser.style.setProperty("background", "transparent", "important");
      stack.appendChild(aiBrowser);
      aiBrowser.setAttribute("src", "chrome://browser/content/aiwindow/aiWindow.html");
    }

    const applySmartWindow = () => {
      try {
        ensureMiOSSmartWindowPrefs();
        allowSidebarInSmartWindow(win);
        const aiDoc = aiBrowser && aiBrowser.contentDocument;
        if (!aiDoc || !aiDoc.location) return;
        if (!aiDoc.location.href.startsWith("chrome://browser/content/aiwindow/aiWindow.html")) return;
        syncSmartWindowElements(aiDoc, win);
      } catch (e) {}
    };

    if (!aiBrowser._miosSmartWinWired) {
      aiBrowser._miosSmartWinWired = true;
      aiBrowser.addEventListener("DOMContentLoaded", applySmartWindow, true);
      aiBrowser.addEventListener("load", applySmartWindow, true);
      win.addEventListener("SidebarShown", applySmartWindow);
    }
    applySmartWindow();
    win.setTimeout(applySmartWindow, 150);
    win.setTimeout(applySmartWindow, 450);
    win.setTimeout(applySmartWindow, 900);
  } catch (e) {
    Cu.reportError("mios-autoconfig: chat sidebar hook: " + e);
  }
}

try {
  ensureMiOSSmartWindowSubsystem();
  Services.obs.addObserver(win => {
    try {
      ensureMiOSSmartWindowSubsystem();
      allowSidebarInSmartWindow(win);
      hydrateMainWindowChrome(win);
      hydrateSidebarFooter(win);
      hydrateChatSidebar(win);
      const isHeadless = Services.env.get("MOZ_HEADLESS") === "1";
      if (!isHeadless) {
        win.document.documentElement.setAttribute("data-mios-chat-pinned", "true");
        win.document.documentElement.setAttribute("data-mios-zen-open", "true");
        try {
          const sm = win.document.querySelector("sidebar-main");
          if (sm) {
            sm.expanded = true;
            sm.setAttribute("expanded", "");
            syncSidebarShadow(sm, win);
          }
        } catch (e) {}
      }
      if (Services.prefs.getBoolPref("mios.portal.chat.autohide", false)) {
        if (win.SidebarController && (!win.SidebarController.isOpen || win.SidebarController.currentID !== "viewGenaiChatSidebar")) {
          win.SidebarController.show("viewGenaiChatSidebar").then(() => {
            hydrateChatSidebar(win);
            hydrateSidebarFooter(win);
          });
        }
      }
    } catch (e) {
      Cu.reportError("mios-autoconfig: window startup hook: " + e);
    }
  }, "browser-delayed-startup-finished");
} catch (e) {
  Cu.reportError("mios-autoconfig: observer hook: " + e);
}

