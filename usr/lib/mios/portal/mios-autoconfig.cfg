          width: auto !important;
          flex: 0 0 auto !important;
          padding-inline: 6px !important;
        }
        :host([expanded]) .tools-and-extensions > moz-button[view]::part(moz-button-label) {
          display: none !important;
        }
        :host([expanded]) .tools-and-extensions > moz-button[view]::after {
          content: attr(data-mios-label);
          color: #E7DFD3 !important;
          font-size: 12px;
          font-weight: 600;
          line-height: 1;
          white-space: nowrap;
        }
      `;
      sr.appendChild(st);
    }
    const wrapper = sr.querySelector(".wrapper");
    if (wrapper && !sr.getElementById("mios-zen-header")) {
      const hdr = doc.createElementNS("http://www.w3.org/1999/xhtml", "div");
      hdr.id = "mios-zen-header";
      const top = doc.createElementNS("http://www.w3.org/1999/xhtml", "div");
      top.id = "mios-zen-header-top";
      const title = doc.createElementNS("http://www.w3.org/1999/xhtml", "span");
      title.id = "mios-zen-title";
      title.textContent = "Zen Sidebar";
      const btn = doc.createElementNS("http://www.w3.org/1999/xhtml", "button");
      btn.id = "mios-zen-collapse-btn";
      btn.type = "button";
      btn.title = "Collapse / expand Zen Sidebar";
      btn.textContent = sm.expanded ? "←∣" : "∣→";
      btn.addEventListener("click", (ev) => {
        ev.preventDefault();
        ev.stopPropagation();
        try {
          const root = w && w.document && w.document.documentElement;
          if (root && root.getAttribute("data-mios-zen-open") === "true") {
            root.removeAttribute("data-mios-zen-open");
            sm.expanded = false;
            sm.removeAttribute("expanded");
          } else if (root && !sm.expanded) {
            root.setAttribute("data-mios-zen-open", "true");
            sm.expanded = true;
            sm.setAttribute("expanded", "");
          } else if (w && w.SidebarController) {
            w.SidebarController.toggleExpand();
          }
          syncSidebarShadow(sm, w);
        } catch (e) {}
      });
      top.appendChild(title);
      top.appendChild(btn);

      const uform = doc.createElementNS("http://www.w3.org/1999/xhtml", "form");
      uform.id = "mios-zen-url-form";
      const uinput = doc.createElementNS("http://www.w3.org/1999/xhtml", "input");
      uinput.id = "mios-zen-url-input";
      uinput.type = "text";
      uinput.placeholder = "Search or enter address...";
      uinput.autocomplete = "off";
      try {
        if (w && w.gBrowser && w.gBrowser.currentURI) {
          uinput.value = w.gBrowser.currentURI.spec || "";
        }
      } catch (e) {}
      uform.addEventListener("submit", (ev) => {
        ev.preventDefault();
        const raw = (uinput.value || "").trim();
        if (!raw || !w || typeof w.openTrustedLinkIn !== "function") return;
        const target = /^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(raw) ? raw : ("http://" + raw);
        w.openTrustedLinkIn(target, "current");
      });
      uform.appendChild(uinput);

      hdr.appendChild(top);
      hdr.appendChild(uform);
      wrapper.insertBefore(hdr, wrapper.firstChild);

      if (w && !w._miosZenUrlSyncWired && w.gBrowser) {
        w._miosZenUrlSyncWired = true;
        const syncUrl = () => {
          try {
            const inp = sr.getElementById("mios-zen-url-input");
            if (inp && w.docShell && w.gBrowser && w.gBrowser.currentURI) {
              inp.value = w.gBrowser.currentURI.spec || "";
            }
          } catch (e) {}
        };
        w.gBrowser.tabContainer.addEventListener("TabSelect", syncUrl);
        w.addEventListener("TabAttrModified", syncUrl);
      }
    }
    if (w && w.document && w.document.documentElement.getAttribute("data-mios-zen-open") === "true" && !sm.expanded) {
      sm.expanded = true;
      sm.setAttribute("expanded", "");
    }
    const cbtn = sr.getElementById("mios-zen-collapse-btn");
    if (cbtn) {
      cbtn.textContent = sm.expanded ? "←∣" : "∣→";
    }
    const uinp = sr.getElementById("mios-zen-url-input");
    if (uinp && w && w.gBrowser && w.gBrowser.currentURI && doc.activeElement !== uinp) {
      uinp.value = w.gBrowser.currentURI.spec || "";
    }
    const bw = sr.querySelector(".buttons-wrapper");
    if (bw) { bw.removeAttribute("overflowing"); bw.style.height = ""; }
    for (const g of sr.querySelectorAll(".tools-and-extensions:not(.overflow-button)")) {
      g.setAttribute("orientation", "vertical");
      g.removeAttribute("overflowing");
    }
    for (const btn of sr.querySelectorAll(".tools-and-extensions:not(.overflow-button) moz-button[view]")) {
      const v = btn.getAttribute("view") || "";
      btn.setAttribute("data-mios-app", v);
      btn.style.visibility = "visible";
      const app = MIOS_APPS.find(a => a.view === v);
      const lbl = app ? app.label : (btn.getAttribute("aria-label") || "");
      btn.setAttribute("data-mios-label", lbl);
      if (sm.expanded) {
        btn.setAttribute("label", lbl);
      } else {
        btn.removeAttribute("label");
      }
    }
    syncTabstripHeight(w);
  } catch (e) {}
}

