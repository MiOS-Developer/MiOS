          const applyModelLabels = () => {
            try {
              const activeModel = Object.values(MIOS_MODELS).find(m => m.model === ms.selectedModelId) || MIOS_MODELS["1"];
              const btn = ms.shadowRoot.querySelector(".input-model-select-button");
