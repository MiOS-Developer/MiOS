function ensureMiOSSmartWindowPrefs() {
  try {
    const P = Services.prefs;
    const setPref = (fn, k, v) => {
      try { P.unlockPref(k); } catch (e) {}
      try { fn.call(P, k, v); } catch (e) {}
    };
    setPref(P.setBoolPref, "layout.css.backdrop-filter.enabled", true);
    setPref(P.setBoolPref, "browser.smartwindow.enabled", true);
    setPref(P.setStringPref, "browser.smartwindow.endpoint", MIOS_CHAT_URL);
    setPref(P.setStringPref, "browser.smartwindow.customEndpoint", MIOS_CHAT_URL);
    setPref(P.setStringPref, "browser.smartwindow.model", MIOS_MODELS["1"].model);
    setPref(P.setStringPref, "browser.smartwindow.firstrun.modelChoice", "1");
    setPref(P.setBoolPref, "browser.smartwindow.firstrun.hasCompleted", true);
    setPref(P.setIntPref, "browser.smartwindow.tos.consentTime", 1792260000);
    setPref(P.setBoolPref, "browser.smartwindow.mistralRelease", true);
    setPref(P.setBoolPref, "browser.smartwindow.memories", true);
    setPref(P.setBoolPref, "browser.smartwindow.conversationSuggestions", true);
  } catch (e) {
    Cu.reportError("mios-autoconfig: smartwindow prefs: " + e);
  }
}

let _miosSmartWindowReady = false;
function ensureMiOSSmartWindowSubsystem() {
  ensureMiOSSmartWindowPrefs();
  if (_miosSmartWindowReady) return;
  _miosSmartWindowReady = true;

  try {
    const { AIWindow } = ChromeUtils.importESModule(
      "moz-src:///browser/components/aiwindow/ui/modules/AIWindow.sys.mjs"
    );
    AIWindow.isAIWindowEnabled = () => true;
    AIWindow.isAIWindowActive = () => true;
    AIWindow.isAIWindowContentActive = () => true;
    AIWindow.isSmartWindowFirstRun = () => false;
  } catch (e) {
    Cu.reportError("mios-autoconfig: AIWindow hook: " + e);
  }

  try {
    const { AIWindowAccountAuth } = ChromeUtils.importESModule(
      "moz-src:///browser/components/aiwindow/ui/modules/AIWindowAccountAuth.sys.mjs"
    );
    AIWindowAccountAuth.isSignedIn = async () => true;
    AIWindowAccountAuth.canAccessAIWindow = async () => true;
    AIWindowAccountAuth.ensureAIWindowAccess = async () => true;
    AIWindowAccountAuth.promptSignIn = async () => true;
  } catch (e) {
    Cu.reportError("mios-autoconfig: AIWindowAccountAuth hook: " + e);
  }

  try {
    const utilsMod = ChromeUtils.importESModule(
      "moz-src:///browser/components/aiwindow/models/Utils.sys.mjs"
    );
    if (utilsMod.FALLBACK_MODELS) {
      for (const [k, m] of Object.entries(MIOS_MODELS)) {
        utilsMod.FALLBACK_MODELS[k] = {
          model: m.model,
          ownerName: m.ownerName,
          labelId: m.labelId,
          shortName: m.shortName,
          brandName: m.brandName
        };
      }
    }
    if (utilsMod.FALLBACK_MODELS_V2) {
      for (const [k, m] of Object.entries(MIOS_MODELS)) {
        utilsMod.FALLBACK_MODELS_V2[k] = {
          model: m.model,
          ownerName: m.ownerName,
          labelId: m.labelId,
          shortName: m.shortName,
          brandName: m.brandName
        };
      }
    }
    if (typeof utilsMod._setRemoteClientForTesting === "function") {
      utilsMod._setRemoteClientForTesting({
        get: async () => {
          let baseRecords = [];
          try {
            const resp = await fetch("resource://app/defaults/settings/main/ai-window-prompts.json");
            const parsed = await resp.json();
            if (parsed && Array.isArray(parsed.data)) {
              baseRecords = parsed.data.filter(
                r => !(r.feature === "chat" && r.kind === "params" && r.model_choice_id in MIOS_MODELS)
              );
            }
          } catch (e) {}
          for (const [choiceId, m] of Object.entries(MIOS_MODELS)) {
            baseRecords.push({
              feature: "chat",
              kind: "params",
              model_choice_id: choiceId,
              model: m.model,
              owner_name: m.ownerName,
              short_name: m.shortName,
              generic_label_id: m.labelId,
              version: "1.0",
              is_default: choiceId === "1",
              temperature: 0.3
            });
          }
          return baseRecords;
        }
      });
      if (typeof utilsMod.refreshModelsDataCache === "function") {
        utilsMod.refreshModelsDataCache().catch(() => {});
      }
    }
  } catch (e) {
    Cu.reportError("mios-autoconfig: Utils models hook: " + e);
  }

  try {
    const { openAIEngine } = ChromeUtils.importESModule(
      "moz-src:///browser/components/aiwindow/models/openAIEngine.sys.mjs"
    );
    openAIEngine.getFxAccountToken = async () => "mios-local";
    openAIEngine._createEngine = async function(cfg) {
      const resolveEndpoint = () => {
        const raw = (cfg && cfg.baseURL) || Services.prefs.getStringPref("browser.smartwindow.endpoint", MIOS_CHAT_URL) || MIOS_CHAT_URL;
        return raw.replace(/\/?$/, "") + "/chat/completions";
      };
      const resolveModel = () => {
        const choice = Services.prefs.getStringPref("browser.smartwindow.firstrun.modelChoice", "1");
        const entry = MIOS_MODELS[choice] || MIOS_MODELS["1"];
        return (cfg && cfg.modelId) || entry.model;
      };
      const callLocalOpenAI = async (opts) => {
        const msgs = Array.isArray(opts) ? opts : ((opts && (opts.args || opts.messages)) || []);
        const res = await fetch(resolveEndpoint(), {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            model: resolveModel(),
            messages: msgs,
            stream: false
          })
        });
        const data = await res.json();
        const choice = data && data.choices && data.choices[0] && data.choices[0].message;
        const text = (choice && choice.content) || "";
        const toolCalls = (choice && choice.tool_calls) || [];
        return { text, toolCalls, done: true, finalOutput: text, ok: true };
      };
      return {
        run: callLocalOpenAI,
        runWithGenerator: async function*(opts) {
          const out = await callLocalOpenAI(opts);
          yield out;
          return out;
        }
      };
    };
  } catch (e) {
    Cu.reportError("mios-autoconfig: openAIEngine hook: " + e);
  }

  try {
    const { ConversationSuggestions } = ChromeUtils.importESModule(
      "moz-src:///browser/components/aiwindow/models/ConversationSuggestions.sys.mjs"
    );
    ConversationSuggestions.generateFollowupPrompts = async () => [
      { text: "Summarize this page with MiOS-AI", type: "chat" },
      { text: "Check MiOS pipeline & task status", type: "chat" }
    ];
  } catch (e) {}
}

function syncTabstripHeight(win) {
  try {
    if (!win || !win.document) return;
    const doc = win.document;
    const vt = doc.getElementById("vertical-tabs");
    const tabs = doc.getElementById("tabbrowser-tabs");
    const asb = doc.getElementById("tabbrowser-arrowscrollbox");
    const ptc = doc.getElementById("pinned-tabs-container");
    for (const host of [asb, ptc]) {
      if (host && host.shadowRoot && !host.shadowRoot.getElementById("mios-scrollbox-style")) {
        const st = doc.createElementNS("http://www.w3.org/1999/xhtml", "style");
        st.id = "mios-scrollbox-style";
        st.textContent = `
          :host {
            flex: 0 1 auto !important;
            height: auto !important;
            min-height: 0 !important;
            max-height: 46vh !important;
          }
          scrollbox, [part="scrollbox"], .scrollbox-clip {
            flex: 0 1 auto !important;
            height: auto !important;
            min-height: 0 !important;
            max-height: 46vh !important;
          }
        `;
        host.shadowRoot.appendChild(st);
      }
    }
    const nTabs = Math.max(
      1,
      (win.gBrowser && Array.isArray(win.gBrowser.visibleTabs) && win.gBrowser.visibleTabs.length) ||
      (win.gBrowser && win.gBrowser.tabs && win.gBrowser.tabs.length) ||
      1
    );
    const maxScrollH = Math.max(120, Math.floor((win.innerHeight || 900) * 0.44));
    const scrollH = Math.min(maxScrollH, nTabs * 40 + 6);
    const vtH = scrollH + 42;
    if (asb) {
      asb.style.setProperty("flex", "0 0 auto", "important");
      asb.style.setProperty("height", scrollH + "px", "important");
      asb.style.setProperty("min-height", scrollH + "px", "important");
      asb.style.setProperty("max-height", maxScrollH + "px", "important");
    }
    if (tabs) {
      tabs.style.setProperty("flex", "0 0 auto", "important");
      tabs.style.setProperty("height", vtH + "px", "important");
      tabs.style.setProperty("min-height", vtH + "px", "important");
    }
    if (vt) {
      vt.style.setProperty("flex", "0 0 auto", "important");
      vt.style.setProperty("height", vtH + "px", "important");
      vt.style.setProperty("min-height", vtH + "px", "important");
    }
  } catch (e) {}
}

function hydrateSidebarFooter(win) {
  try {
    const sm = win.document.querySelector("sidebar-main");
    if (!sm) return;
    if (!sm._miosFooterWired) {
      sm._miosFooterWired = true;
      sm.getLauncherActions = () => MIOS_APPS.map(a => Object.assign({}, a));
      sm.bottomActions = [];
      sm.isToolsOverflowing = () => false;
      Object.defineProperty(sm, "shouldShowOverflowButton", {
        get: () => false,
        set: () => {},
        configurable: true
      });
      sm.showView = async function(view) {
        const app = MIOS_APPS.find(a => a.view === view);
        if (!app) return;
        if (app.miosSidebar && win.SidebarController) {
          await win.SidebarController.toggle(app.miosSidebar);
        } else if (app.miosUrl && typeof win.openTrustedLinkIn === "function") {
          win.openTrustedLinkIn(app.miosUrl, "tab");
        }
      };
      const origUpdated = typeof sm.updated === "function" ? sm.updated.bind(sm) : null;
      sm.updated = function(...args) {
        if (origUpdated) {
          try { origUpdated(...args); } catch (e) {}
        }
        syncSidebarShadow(this, win);
      };
    }
    sm.requestUpdate();
    syncSidebarShadow(sm, win);
    syncTabstripHeight(win);
  } catch (e) {
    Cu.reportError("mios-autoconfig: sidebar footer hook: " + e);
  }
}

