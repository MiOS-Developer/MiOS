# AI-hint: Unified MiOS kernel sysctl parameters for memory, overlayfs, hardening, and virtualization (ADR-0030)
# AI-doc: usr/share/doc/mios/manual/sysconf.md
# Folded from 6 files into one per ADR-0030 Decision 4 / task_3656.


# --- source: usr/lib/sysctl.d/20-memory.conf ---
vm.compaction_proactiveness = 20
vm.page_lock_unfairness = 1

# --- source: usr/lib/sysctl.d/20-mios-memory.conf ---
20-memory.conf

# --- source: usr/lib/sysctl.d/90-mios-le9uo.conf ---
# Prevent page thrashing under extreme Zram/Zstd pressure
vm.watermark_scale_factor = 200
vm.watermark_boost_factor = 15000
vm.min_free_kbytes = 1048576

# Tuning specifically for interactive workloads (BORE-scheduler-friendly).
# These keys only exist on BORE / le9uo-patched kernels; on vanilla and WSL2
# kernels they don't and systemd-sysctl logs noise. Prefix with "-" so a
# missing key is silently ignored. See sysctl.d(5).
-kernel.sched_cfs_bandwidth_slice_us = 3000
-kernel.sched_latency_ns = 3000000
-kernel.sched_min_granularity_ns = 300000
-kernel.sched_wakeup_granularity_ns = 500000
-kernel.sched_migration_cost_ns = 250000

# --- source: usr/lib/sysctl.d/90-mios-overlayfs.conf ---
# --- systemd-sysext / OverlayFS Stacking --------------------------------------
# Note: Upstream hard limit is 2. MiOS-OS uses OSTree + verity.
# Repackaging multiple small .sysext images into a single large one is 
# handled via the 'mios-sysext-pack' helper (Planned).

# --- Performance & Memory Retention ------------------------------------------
# Optimized for workstation fluidity under heavy virtualization/container loads.
vm.swappiness = 10
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 1024

# --- Network Stability for dense container clusters --------------------------
net.ipv4.neigh.default.gc_thresh1 = 1024
net.ipv4.neigh.default.gc_thresh2 = 2048
net.ipv4.neigh.default.gc_thresh3 = 4096

# --- source: usr/lib/sysctl.d/99-mios-hardening.conf ---
# Kernel pointer and dmesg restriction
kernel.kptr_restrict = 2
kernel.dmesg_restrict = 1

# Ptrace scope (allow parent-child only)
kernel.yama.ptrace_scope = 2

# Unprivileged userns - keep enabled; required by rootless Podman, Waydroid,
# Steam sandboxes. The "-" prefix suppresses errors on kernels (e.g. WSL2)
# that don't expose this key. See sysctl.d(5).
-kernel.unprivileged_userns_clone = 1

# TCP/IP hardening
net.ipv4.tcp_syncookies = 1
net.ipv4.conf.all.rp_filter = 1
net.ipv4.conf.default.rp_filter = 1
net.ipv4.conf.all.accept_source_route = 0
net.ipv6.conf.all.accept_source_route = 0
net.ipv4.conf.all.accept_redirects = 0
net.ipv6.conf.all.accept_redirects = 0
net.ipv4.conf.all.send_redirects = 0
net.ipv4.icmp_echo_ignore_broadcasts = 1
net.ipv4.icmp_ignore_bogus_error_responses = 1

# File system protections
fs.protected_symlinks = 1
fs.protected_hardlinks = 1
fs.protected_fifos = 2
fs.protected_regular = 2
fs.suid_dumpable = 0

# Core dumps off for set-uid (keep on for normal processes - CUDA crashes need cores)
# kernel.core_pattern left untouched to preserve systemd-coredump integration

# BPF hardening (Fedora 44 defaults, applied ahead of distro rollout)
# net.core.bpf_jit_harden=2: Harden JIT-compiled BPF against spray attacks
# (rootless Podman / K3s / CrowdSec use BPF as root; unprivileged_bpf_disabled
#  blocks only *unprivileged* BPF load -- leaves all our workloads unaffected)
net.core.bpf_jit_harden = 2
kernel.unprivileged_bpf_disabled = 1

# Suppress SysRq on production deployments (physical console attack vector)
kernel.sysrq = 0

# Suppress kernel messages from leaking to the physical console
# (audit/journal still receives everything; this only mutes /dev/console)
kernel.printk = 3 3 3 3

# --- source: usr/lib/sysctl.d/99-mios-vmhost.conf ---
vm.swappiness = 10
vm.overcommit_memory = 1
vm.dirty_ratio = 20
vm.dirty_background_ratio = 5
net.ipv4.ip_forward = 1
net.ipv4.conf.all.forwarding = 1
net.ipv6.conf.all.forwarding = 1
net.bridge.bridge-nf-call-iptables = 1
net.bridge.bridge-nf-call-ip6tables = 1
fs.inotify.max_user_watches = 1048576
fs.inotify.max_user_instances = 8192
