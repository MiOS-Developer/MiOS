# AI-hint: Unified MiOS sysusers configuration declaring all system and service users/groups (ADR-0030)
# AI-doc: usr/share/doc/mios/manual/sysusers.d.md
# Folded from 8 files into one per ADR-0030 Decision 4 / task_3656.


# --- source: usr/lib/sysusers.d/10-mios.conf ---
g kvm 36 -
g video 39 -
g render 105 -
g libvirt - -
# 'input' is declared in 00-coreos-static.conf and 'dialout' in setup.conf;
# omitting them here avoids per-boot "Conflict ... ignoring line" warnings.
# `m mios input` / `m mios dialout` below still resolve via NSS.
g docker - -
# The persistent Nix store in tmpfiles.d references this upstream build group.
g nixbld - -
g mios 1000

u mios 1000:mios "'MiOS' User" /var/home/mios /bin/bash
m mios wheel
m mios libvirt
m mios kvm
m mios video
m mios render
m mios input
m mios dialout
m mios docker
# mios-hermes group owns /etc/mios/hermes/api.env (mode 0640). Adding mios
# to the group lets /usr/bin/mios + /etc/profile.d/mios-env.sh + the bash
# `@<query>` shortcut read API_SERVER_KEY without sudo. The group itself
# is declared in 50-mios-services.conf (`g mios-hermes 820`); we just
# attach the login user to it here.
m mios mios-hermes
# USER/SYSTEM/AI separation (operator directive 2026-05-18): operator
# joins BOTH bucket groups so `mios` can read AI shared state (skill
# catalog, passport public keys, scratch, kanban shadow) AND infra
# state (Guacamole config, Forgejo data, PXE configs) without sudo.
# Writes still require the per-service uid or sudo. Groups are declared
# in 50-mios-services.conf (`g mios-ai 850` / `g mios-sys 860`).
m mios mios-ai
m mios mios-sys

# --- source: usr/lib/sysusers.d/20-podman-machine.conf ---
g core 1001
u core 1001:core "Podman Machine User" /var/home/core /bin/bash
m core wheel
m core libvirt
m core kvm
m core video
m core render
m core input
m core dialout
m core docker

# --- source: usr/lib/sysusers.d/30-mios-tmpfiles-prereq.conf ---
# cockpit -- referenced by /usr/lib/tmpfiles.d/mios-infra.conf:5-6
# (/var/lib/cockpit + /var/lib/cockpit/motd.d). The cockpit RPM
# expects this group to own /var/lib/cockpit so the daemon can persist
# its state.
g cockpit -

# --- source: usr/lib/sysusers.d/50-mios-cockpit.conf ---
# Existing entry (kept verbatim).
g cockpit-systemd-service 977
u cockpit-systemd-service 977:cockpit-systemd-service "'MiOS' Cockpit systemd-service helper" /var/empty /sbin/nologin

# Group used by cockpit.service's static Group= (cockpit-wsinstance-socket)
# and cockpit-wsinstance-socket-user.service's static User= / Group=.
g cockpit-wsinstance-socket 976
u cockpit-wsinstance-socket 976:cockpit-wsinstance-socket "'MiOS' Cockpit wsinstance socket helper" /var/empty /sbin/nologin

# cockpit-wsinstance-http.service: User=cockpit-wsinstance-http,
# Group=cockpit-session-socket. Add both.
g cockpit-wsinstance-http 975
u cockpit-wsinstance-http 975:cockpit-wsinstance-http "'MiOS' Cockpit wsinstance http worker" /var/empty /sbin/nologin

g cockpit-session-socket 974
u cockpit-session-socket 974:cockpit-session-socket "'MiOS' Cockpit session socket helper" /var/empty /sbin/nologin

# cockpit-wsinstance-https.service: User=cockpit-wsinstance-https.
g cockpit-wsinstance-https 973
u cockpit-wsinstance-https 973:cockpit-wsinstance-https "'MiOS' Cockpit wsinstance https worker" /var/empty /sbin/nologin

# Upstream cockpit.service traditionally uses 'cockpit-ws' as the main
# socket user; some sub-units still reference that name even when our
# drop-ins point cockpit.service itself at cockpit-systemd-service.
# The 2026-05-10 journal showed cockpit-wsinstance-socket-user.service
# failing with "Failed to determine credentials for user 'cockpit-ws'"
# specifically, so the static name must exist regardless of which unit
# is the immediate caller.
g cockpit-ws 972
u cockpit-ws 972:cockpit-ws "'MiOS' Cockpit web service primary user" /var/empty /sbin/nologin

# Group memberships -- cockpit's binaries are run by systemd as
# `cockpit-systemd-service` (set by cockpit.service's User=) and as
# `cockpit-ws` (set by some helper units). Both need access to the
# Unix sockets cockpit-ws creates at runtime under /run/cockpit/:
#
#   /run/cockpit/session                            group cockpit-session-socket
#   /run/cockpit/wsinstance/http.sock               group cockpit-wsinstance-socket
#   /run/cockpit/wsinstance/https-factory.sock      group cockpit-wsinstance-socket
#
# Without these supplementary group memberships, cockpit-tls fails with
#   cockpit-tls: connect(...): Permission denied
# the browser receives HTTP 401 "Authentication not available", and
# the login form shows "Authentication failed" even when the operator
# entered the correct credentials. Operator-flagged 2026-05-10.
m cockpit-ws cockpit-wsinstance-socket
m cockpit-systemd-service cockpit-wsinstance-socket
m cockpit-systemd-service cockpit-session-socket
m cockpit-ws              cockpit-session-socket
# cockpit-wsinstance-https.service spawns /usr/libexec/cockpit-ws with
# DynamicUser=yes + User=cockpit-wsinstance-https + Group=cockpit-session-socket.
# When DynamicUser is in effect systemd uses the unit's Group= for the
# transient primary GID; when our overlay drop-ins disable it, the static
# user's own primary group sticks (cockpit-wsinstance-https=953) and the
# cockpit-session.sock connect fails. Explicit membership keeps both
# paths working. Same applies to the http instance.
m cockpit-wsinstance-https cockpit-session-socket
m cockpit-wsinstance-https cockpit-wsinstance-socket
m cockpit-wsinstance-http  cockpit-session-socket
m cockpit-wsinstance-http  cockpit-wsinstance-socket
m cockpit-wsinstance-socket cockpit-session-socket

# --- source: usr/lib/sysusers.d/50-mios-gpu.conf ---
g video  39
g render 105

# --- source: usr/lib/sysusers.d/50-mios-services.conf ---
g mios-ai  850
g mios-sys 860
# ---- CORE AI-AGENT USER (operator 2026-05-23: "consolidate MiOS system users
# to fewer combined/core users"). The agent/code PLANE now RUNS as this single
# user instead of 4 (mios-hermes, mios-agent-pipe, root, mios): agent-pipe,
# hermes-agent, delegation-prefilter, hermes-browser, mios-daemon, mios-mcp,
# skills-miner. One owner for /var/lib/mios state -> no cross-user perms walls
# (the class behind the container/snapshot visibility bugs). Per-container
# DATA-plane users (llamacpp, open-webui, searxng, pgvector, forge, ...) stay
# ISOLATED. uid 850 == the mios-ai bucket gid; HOME=/var/lib/mios/hermes keeps
# opencode's ~/.local + $HERMES_HOME working. journal+adm groups give the
# consolidated daemon RO log/journal access (it previously ran as root).
# Legacy mios-hermes (820) + mios-agent-pipe (822) accounts are RETAINED inert
# for `sudo -u`/chown reference-compat; nothing runs as them now.
u mios-ai 850:mios-ai "'MiOS' core AI-agent user" /var/lib/mios/hermes /usr/sbin/nologin
m mios-ai systemd-journal
m mios-ai adm
m mios-ai mios-hermes
g mios-guacamole 810
u mios-guacamole 810:mios-guacamole "'MiOS' Guacamole web" /var/empty /usr/sbin/nologin
g mios-guacd 811
u mios-guacd 811:mios-guacd "'MiOS' Guacamole daemon" /var/empty /usr/sbin/nologin
g mios-postgres 812
u mios-postgres 812:mios-postgres "'MiOS' Guacamole Postgres" /var/empty /usr/sbin/nologin
g mios-pxe-hub 813
u mios-pxe-hub 813:mios-pxe-hub "'MiOS' PXE hub" /var/empty /usr/sbin/nologin
g mios-crowdsec 814
u mios-crowdsec 814:mios-crowdsec "'MiOS' CrowdSec dashboard" /var/empty /usr/sbin/nologin
g mios-forge 816
# Container-only service (Quadlet at /etc/containers/systemd/
# mios-forge.container). The sysuser exists for /var/lib/mios/forge
# ownership stability across rebuilds; HOME=/var/empty is correct
# because the container has its own internal HOME -- this UID/GID
# is never logged into directly. Consolidation note 2026-05-15.
u mios-forge 816:mios-forge "'MiOS' Forge (Forgejo)" /var/empty /usr/sbin/nologin
g mios-open-webui 817
u mios-open-webui 817:mios-open-webui "'MiOS' Open WebUI" /var/empty /usr/sbin/nologin
g mios-searxng 818
u mios-searxng 818:mios-searxng "'MiOS' SearXNG metasearch" /var/empty /usr/sbin/nologin
# 819 is reserved for mios-ceph in globals.{sh,ps1}; leave it alone here.
g mios-hermes 820
# Home is /var/lib/mios/hermes -- the Hermes service unit's
# $HERMES_HOME and the writable area sub-tools (opencode, the
# self-improvement skill clones, browser profile, kanban.db, etc.)
# need a real writable home for. Setting this in passwd lets
# `sudo -u mios-hermes -H ...`, opencode's ~/.local/<name>
# bootstrap, and any other "use $HOME" pattern Just Work.
# Operator-confirmed regression 2026-05-15: opencode failed with
# "EACCES: permission denied, mkdir '/var/empty/.local'" when
# invoked as mios-hermes because the prior /var/empty home left
# ~/.local unwritable.
u mios-hermes 820:mios-hermes "'MiOS' Hermes-Agent gateway" /var/lib/mios/hermes /usr/sbin/nologin
# Supplementary groups so the gateway can read journals + system logs
# without a sudo escalation: systemd-journal grants RO journal access;
# adm grants RO /var/log/* access. Both are read-only -- the gateway
# can SEE everything but only WRITES go through the existing capability
# surface (Bash tool + sudo policy). Lets the log-watcher daemon's
# state ALSO be visible to the agent's "what happened recently?" path
# even if it ever moves off world-readable 0644 mode.
m mios-hermes systemd-journal
m mios-hermes adm

# 'MiOS' standalone Agent Pipe (router + refine + critic FastAPI;
# fronts hermes-agent for every gateway: OWUI, Discord, future
# Slack/Telegram/MCP). Operator directive 2026-05-18: centralize the
# pipe so all gateways get the same tool surface + critic + agent-DB
# state writes. HOME=/var/lib/mios/agent-pipe is the data + state dir
# (chown via /usr/lib/tmpfiles.d/mios-agent-pipe.conf at boot).
g mios-agent-pipe 822
u mios-agent-pipe 822:mios-agent-pipe "'MiOS' Agent Pipe (router + refine + critic FastAPI)" /var/lib/mios/agent-pipe /usr/sbin/nologin
# 'MiOS' in-VM CPU light-lane (router/classifier + verb embeddings +
# micro-LLMs) -- a retired sidecar UID from the 810-829 range, along
# with its retired dGPU big-model sibling (uid 815). The AMD iGPU now
# runs natively on the Windows host (mios-igpu-server.ps1, served to
# the swarm as mios-reasoner-cpu).
# 'MiOS' crawl engine user (operator 2026-05-24: the unclecode/crawl4ai
# CONTAINER was scrapped). Now owns the venv FastAPI service
# (mios-crawl4ai.service): the venv at /usr/lib/mios/crawl4ai/.venv and the
# cache at /var/cache/mios/crawl4ai (camoufox's patched Firefox + crawl4ai
# cache), chowned via /usr/lib/tmpfiles.d/mios-crawl4ai.conf + the
# mios-crawl4ai-setup script. HOME=/var/empty (the service points
# XDG_CACHE_HOME at the cache dir). Next free UID after the retired CPU light-lane (823)
# in the 810-829 sidecar range.
g mios-crawl4ai 824
u mios-crawl4ai 824:mios-crawl4ai "'MiOS' crawl4ai web crawler (fetch -> markdown)" /var/empty /usr/sbin/nologin
# 'MiOS' AdGuard Home DNS resolver / ad-blocker. SYSTEM tier (network infra,
# like CrowdSec) -- joins mios-sys below. uid owns /etc/mios/adguard (config)
# + /var/lib/mios/adguard (AdGuard work dir: query log, stats db, filter cache).
# Container runs as this uid with CAP_NET_BIND_SERVICE to bind :53. HOME=/var/
# empty. Next free UID after mios-crawl4ai (824) in the 810-829 sidecar range.
g mios-adguard 825
u mios-adguard 825:mios-adguard "'MiOS' AdGuard Home DNS resolver" /var/empty /usr/sbin/nologin
# WS-9 unified agent-plane Postgres+pgvector container (Quadlet
# usr/share/containers/systemd/mios-pgvector.container). AI tier: own uid for
# /var/lib/mios/pgvector ownership, shared mios-ai group for cross-agent reads
# (like the other agent-plane containers). HOME=/var/lib/mios/pgvector (the PGDATA parent). 826 =
# next free after mios-adguard (825) in the 810-829 sidecar range.
g mios-pgvector 826
u mios-pgvector 826:mios-pgvector "'MiOS' PostgreSQL+pgvector unified agent DB" /var/lib/mios/pgvector /usr/sbin/nologin
# WS-10 mios-llm-light: llama.cpp multi-model lane (served via the upstream
# llama-swap proxy; Quadlet usr/share/containers/systemd/mios-llm-light.container).
# AI tier: own uid for /var/lib/mios/llamacpp (KV slot-save dir) ownership, shared
# mios-ai group. HOME=/var/lib/mios/llamacpp. 827 = next free after mios-pgvector (826).
g mios-llamacpp 827
u mios-llamacpp 827:mios-llamacpp "'MiOS' mios-llm-light llama.cpp lane" /var/lib/mios/llamacpp /usr/sbin/nologin
# WS-2 Code Mode sandbox-workspace owner. AI tier: own uid for /var/lib/mios/
# codemode (generated-snippet root, bind-mounted into the rootless podman
# coderun-sandbox as /work) ownership, shared mios-ai group. HOME=/var/empty
# (no login; the agent plane writes via the broker). 828 = next free after
# mios-llamacpp (827) in the 810-829 sidecar range.
g mios-codemode 828
u mios-codemode 828:mios-codemode "'MiOS' Code Mode sandbox workspace" /var/empty /usr/sbin/nologin
# WS-11 mios-otelcol jaeger/otelcol trace aggregator.
g mios-otelcol 829
u mios-otelcol 829:mios-otelcol "'MiOS' OTelCol collector" /var/empty /usr/sbin/nologin
# Streaming speech engines of the mios-ai pod (Quadlets mios-piper.container,
# mios-whisper.container; [services.piper]/[services.whisper] in mios.toml).
# AI tier: read-only model volumes, ports above 1024, no state dir, so
# HOME=/var/empty. 830 is mios-node; 831 and 832 continue the sidecar block.
g mios-piper 831
u mios-piper 831:mios-piper "'MiOS' Piper streaming TTS engine" /var/empty /usr/sbin/nologin
g mios-whisper 832
u mios-whisper 832:mios-whisper "'MiOS' whisper.cpp streaming STT engine" /var/empty /usr/sbin/nologin
# Mesh tier: Headscale mesh VPN control plane coordinator (port 8085).
# HOME=/var/lib/headscale. 833 = next free after mios-whisper (832).
g mios-headscale 833
u mios-headscale 833:mios-headscale "'MiOS' Headscale mesh VPN coordinator" /var/lib/headscale /usr/sbin/nologin
# Supplementary groups: agent-pipe needs read access to /var/lib/mios/
# scratch and the hermes session JSONs for the critic / structured-
# tool-history features.
m mios-agent-pipe systemd-journal
m mios-agent-pipe adm
# Phase D.5: agent-pipe forwards to Hermes-Agent and other sub-
# agents. /etc/mios/hermes/api.env (0640 mios-hermes:mios-hermes)
# carries the API_SERVER_KEY agent-pipe injects as Bearer when
# the upstream caller didn't supply one (curl, MCP clients,
# Discord). Adding agent-pipe to the hermes group is narrower
# than world-readable + cleaner than copying the key.
m mios-agent-pipe mios-hermes

# ---- Bucket-group memberships (USER/SYSTEM/AI separation) ----
#
# AI tier -- every agent in mios-ai. Shared read of skill catalog,
# passport public keys, scratch, kanban shadow, ...
m mios-open-webui   mios-ai
m mios-hermes       mios-ai
m mios-agent-pipe   mios-ai
m mios-searxng      mios-ai
m mios-crawl4ai     mios-ai
m mios-pgvector     mios-ai
m mios-llamacpp     mios-ai
m mios-codemode     mios-ai
m mios-piper        mios-ai
m mios-whisper      mios-ai

# SYSTEM tier -- infra services in mios-sys.
m mios-guacamole    mios-sys
m mios-guacd        mios-sys
m mios-postgres     mios-sys
m mios-pxe-hub      mios-sys
m mios-crowdsec     mios-sys
m mios-forge        mios-sys
m mios-adguard      mios-sys
m mios-headscale    mios-sys

