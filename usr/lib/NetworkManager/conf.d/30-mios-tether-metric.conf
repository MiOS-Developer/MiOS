# AI-hint: Demotes USB phone tethers (Android NCM/RNDIS, iPhone ipheth) below Wi-Fi and wired uplinks so a lossy cellular tether is never the host default route; the tether still carries the local link Tailscale uses to reach the phone as an exit node.
# AI-related: mios-tailscale-sync, [tailscale].exit_nodes, NetworkManager.conf(5) "Connection Section"
# Default metrics: wired 100, Wi-Fi 600. A tether only wins when nothing else is up.
[connection-mios-usb-tether]
match-device=driver:cdc_ncm,driver:rndis_host,driver:ipheth
ipv4.route-metric=900
ipv6.route-metric=900
