# AI-hint: Unified MiOS kernel module configuration, blacklists, and driver options (ADR-0030)
# AI-doc: usr/share/doc/mios/manual/kernel.md
# Folded from 6 files into one per ADR-0030 Decision 4 / task_3656.


# --- source: usr/lib/modprobe.d/blacklist-nouveau.conf ---
blacklist nouveau
options nouveau modeset=0

# --- source: usr/lib/modprobe.d/blacklist-vmw_vsock.conf ---
blacklist vmw_vsock_vmci_transport

# --- source: usr/lib/modprobe.d/kvmfr.conf ---
options kvmfr static_size_mb=128

# --- source: usr/lib/modprobe.d/mios-nvidia-blacklist.conf ---
blacklist nvidia
blacklist nvidia_drm
blacklist nvidia_modeset
blacklist nvidia_uvm

# --- source: usr/lib/modprobe.d/nvidia-open.conf ---
options nvidia NVreg_OpenRmEnableUnsupportedGpus=1
# Use kernel suspend notifiers (595+) for internal video memory preservation.
options nvidia NVreg_UseKernelSuspendNotifiers=1
# Preserve video memory across suspend/hibernate. Required for nvidia-drm.
options nvidia NVreg_PreserveVideoMemoryAllocations=1

# --- source: usr/lib/modprobe.d/nvidia.conf ---
options nvidia_drm modeset=1 fbdev=1
options nvidia NVreg_EnableGpuFirmware=1
options nvidia NVreg_PreserveVideoMemoryAllocations=1
