# AI-hint: Keep host DNS on discovered network links; never forward unicast DNS into the local mDNS listener.
# AI-doc: usr/share/doc/mios/manual/ch28-dynamic-network-and-firewall-management.md

[Resolve]
# NetworkManager and Tailscale supply per-link DNS. AdGuard uses the SSOT DNS port;
# a local upstream must be selected only after that resolver is serving requests.
FallbackDNS=1.1.1.1 9.9.9.9
DNSOverTLS=opportunistic
MulticastDNS=yes
LLMNR=no
