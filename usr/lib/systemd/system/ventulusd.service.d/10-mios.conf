# AI-hint: MiOS policy for the upstream ventulusd fan daemon: vendor config + profile from /usr/share/mios/fan-control, socket reachable by root and wheel only (POSIX ACL), pump roles applied by mios-fanctl after READY, bare metal only.
# AI-related: /usr/lib/systemd/system/ventulusd.service, /usr/share/mios/fan-control/daemon.toml, /usr/share/mios/fan-control/profiles/mios-default.json, /usr/share/mios/fan-control/mios-fanctl.toml, /usr/bin/mios-fanctl, /usr/lib/modules-load.d/mios-fan-control.conf
# Operator overrides: /etc/mios/fan-control.env (OPENFAN_PROFILE=..., VENTULUS_CONFIG=...)
# or a drop-in under /etc/systemd/system/ventulusd.service.d/.
[Unit]
Description=MiOS fan control (ventulusd)
Documentation=https://github.com/Plan-B-Development/ventulusd/blob/v5.1.0/docs/USER_GUIDE.md file:///usr/share/mios/fan-control/daemon.toml
# Super-I/O headers only exist on real hardware; a VM, container or WSL guest
# has nothing for the daemon to drive.
ConditionVirtualization=no
# nct6775 is loaded by /usr/lib/modules-load.d/mios-fan-control.conf.
After=systemd-modules-load.service

[Service]
Environment=VENTULUS_CONFIG=/usr/share/mios/fan-control/daemon.toml
Environment=OPENFAN_PROFILE=mios-default
EnvironmentFile=-/etc/mios/fan-control.env
# Replay any hand-back record a previous instance left un-replayed (its
# ExecStopPost was killed or never ran) BEFORE the daemon starts. Without this
# the new instance reads the header still in manual mode, records "manual
# <duty>" as the original, and every later stop hands back a fixed duty
# instead of the firmware curve. No record (the normal case) is a no-op.
ExecStartPre=+/usr/bin/ventulus-restore-auto
# Upstream leaves the socket 0666 in a 0755 directory with no authentication,
# so any local account could activate profiles or take overrides. Close the
# directory to others and grant wheel traversal with an ACL. systemd re-chowns
# and re-chmods RuntimeDirectory on every exec, but chmod 0750 only resets the
# ACL mask to r-x, so the wheel entry stays effective. (A socket-proxyd
# front-end was tried: SELinux confines systemd_socket_proxyd_t away from
# var_run_t sockets.)
RuntimeDirectoryMode=0750
ExecStartPost=+/usr/bin/setfacl -m g:wheel:rx /run/ventulus
# Assign pump roles from mios-fanctl.toml [roles] (30 % floor, never stopped,
# pump-safe identify). Idempotent; a failure never fails the unit.
ExecStartPost=-/usr/bin/mios-fanctl --socket /run/ventulus/ventulus.sock apply-roles

[Install]
Alias=mios-fan-control.service
