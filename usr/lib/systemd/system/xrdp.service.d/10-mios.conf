[Unit]
Documentation=file:///usr/libexec/mios/mios-rdp
After=network-online.target
Wants=network-online.target

[Service]
ExecCondition=/usr/libexec/mios/mios-rdp enabled xrdp
ExecStartPre=/usr/libexec/mios/mios-rdp render
ExecStart=
ExecStart=/usr/bin/xrdp --nodaemon --config /run/mios/rdp/xrdp.ini
