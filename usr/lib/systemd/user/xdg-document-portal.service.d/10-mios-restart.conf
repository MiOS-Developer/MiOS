# AI-hint: MiOS recovery for the flatpak document portal. A second xdg-document-portal started anywhere with this
# user's XDG_RUNTIME_DIR (a private test/nested bus) lazily unmounts $XDG_RUNTIME_DIR/doc at its startup, and the
# primary instance exits 21 ("Fuse filesystem unmounted"). Restart it so the operator's /run/user/<uid>/doc comes
# back without waiting for the next D-Bus activation. A clean exit (bus closed, SIGTERM) is not restarted.
# AI-related: tests/test-document-portal-isolation.py, tests/test-shell-appmenu-live.py
[Service]
Restart=on-failure
RestartSec=1
