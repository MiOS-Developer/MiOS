# AI-hint: Keep xdg-desktop-portal-hyprland bound to mios-desktop.target and prevent StartLimitBurst lockout during compositor restarts so OBS and ScreenCast consumers never lose display sources.
# AI-related: usr/lib/systemd/user/mios-desktop.target, etc/xdg/xdg-desktop-portal/portals.conf
[Unit]
PartOf=mios-desktop.target
StartLimitIntervalSec=0

[Service]
Restart=on-failure
RestartSec=2s
