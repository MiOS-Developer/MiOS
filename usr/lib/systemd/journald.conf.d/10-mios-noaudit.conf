# AI-hint: Configures systemd-journald for every MiOS host: no audit stream, no syslog-socket race, and a short sync interval so a host that hangs keeps its last seconds on disk. The kernel log is stored (ReadKMsg default); WSL2, whose kernel refuses /dev/kmsg, turns it off at runtime via the mios-wsl-journald generator.
# AI-related: /usr/lib/systemd/system-generators/mios-wsl-journald, tests/test-journald-kmsg.sh
[Journal]
# Audit=yes crashes journald on WSL2 (no audit netlink socket).
Audit=no
# Avoid syslog socket dependency that races with journald startup in WSL2.
ForwardToSyslog=no
# A Blade that freezes outright loses whatever journald had not synced: the
# PS5 Blade's journal stopped 26 s before its last live output. CRIT and above
# sync at once anyway; this bounds the loss for every other line.
SyncIntervalSec=10s
