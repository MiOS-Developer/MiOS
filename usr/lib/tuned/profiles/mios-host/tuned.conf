# AI-hint: tuned profile for a MiOS workstation host that runs rootless/rootful containers and KVM guests while serving a graphical desktop from the iGPU; discrete GPUs are left to guests (see mios-gpu-roles). Inherits Fedora's virtual-host.
# AI-related: /usr/lib/tuned/profiles/virtual-host/tuned.conf, /etc/tuned/ppd.conf, /usr/libexec/mios/mios-gpu-roles, /usr/share/mios/mios.toml, /usr/libexec/mios/mios-bootstrap-linux.sh
[main]
summary=MiOS host: containers + KVM guests + desktop on the iGPU, dGPUs reserved for guests
include=virtual-host

[cpu]
# amd-pstate-epp / intel_pstate: favour throughput over the idle power savings of the stock profile.
governor=performance
energy_performance_preference=performance

[vm]
# QEMU/KVM and container databases opt in through madvise; never force THP system-wide.
transparent_hugepages=madvise

[sysctl]
# Keep guests and container working sets in RAM; swap only under real pressure.
vm.swappiness=10
# Container runtimes, IDEs and file watchers exhaust the 8k-instance / 400k-watch defaults.
fs.inotify.max_user_watches=1048576
fs.inotify.max_user_instances=8192
# Container/VM service fan-in over bridges and veths.
net.core.somaxconn=4096
net.core.netdev_max_backlog=16384
