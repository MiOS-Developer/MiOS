# AI-hint: Generated by mios-gen render-tuned from mios.toml [host.tuning.profiles].
# AI-related: usr/share/mios/mios.toml, tools/native/mios-gen/src/render.rs

[main]
summary=MiOS balanced host: containers, KVM and responsive desktop
include=virtual-host

[cpu]
governor=powersave
energy_performance_preference=balance_performance
min_perf_pct=0
energy_perf_bias=normal

[acpi]
platform_profile=balanced

[vm]
transparent_hugepages=madvise

[sysctl]
vm.swappiness=10
fs.inotify.max_user_watches=1048576
fs.inotify.max_user_instances=8192
net.core.somaxconn=4096
net.core.netdev_max_backlog=16384
