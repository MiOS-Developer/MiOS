# AI-hint: GNOME "Performance" power mode for a MiOS host: mios-host plus shallower CPU idle states for latency-sensitive guests and builds. Exists because tuned-ppd requires a one-to-one PPD-to-TuneD mapping.
# AI-related: /usr/lib/tuned/profiles/mios-host/tuned.conf, /etc/tuned/ppd.conf
[main]
summary=MiOS host, performance mode: mios-host with shallow C-states for latency-sensitive guests
include=mios-host

[cpu]
force_latency=cstate.id_no_zero:2|20
