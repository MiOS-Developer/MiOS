# AI-hint: Defines filesystem permissions and ownership for the mios-llm-light lane (WS-10) state directories, specifically for storing per-conversation KV paging files in /var/lib/mios/llamacpp/slots.
# AI-doc: usr/share/doc/mios/manual/tmpfiles.d.md
d /var/lib/mios/llamacpp 0750 827 827 -
d /var/lib/mios/llamacpp/slots 0750 827 827 -
# FBM (task_180): the first-boot provisioner writes downloaded GGUFs here.
# Declared rather than mkdir'd by the fetcher (Architectural Law 2).
d /var/lib/mios/llamacpp/models 0750 827 827 -
# WS-A4: OS-level GC backstop -- systemd-tmpfiles --clean ages out KV slot/fork
# save files (mios-kv-*.bin) idle longer than 1d, so an unbounded fork fan-out
# can't fill the disk even when the agent-pipe's in-process kv-gc isn't co-located
# with this lane. An actively-paged conversation bumps its file's mtime each save,
# so a live KV is never aged out; only stale/abandoned files are reclaimed.
e /var/lib/mios/llamacpp/slots/mios-kv-*.bin - - - 1d
