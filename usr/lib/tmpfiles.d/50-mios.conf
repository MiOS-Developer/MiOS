# --- source: usr/lib/tmpfiles.d/mios-forge-runner.conf ---
# Persistent runner state: registration record, workflow caches, job
# logs. The runner image's entrypoint persists /data/.runner here so
# subsequent starts skip re-registration.
d /srv/mios/forge-runner       0750 root root -

# Build-output sentinel directory. The Forgejo Runner workflow writes
# /var/lib/mios/forge-runner/last-build.txt after a successful
# `podman build`; mios-bootc-switch.path watches this exact path on
# the host side. The directory is shared between the runner container
# and the host (Volume= bind in the Quadlet) so the watcher fires
# regardless of which side wrote the file.
d /var/lib/mios/forge-runner   0755 root root -

# --- source: usr/lib/tmpfiles.d/mios-forge.conf ---
# Container's /data mount target. Holds the SQLite DB, repository bytes,
# attachments, avatars, search index. /srv is the FHS-3.0 location for data.
# Owned by user 1000 (mios) mode 0775.
d /srv/mios/forge          0775 1000 1000 -

# Auxiliary runtime state outside the /data mount (logs the operator
# might want separated from the data dir, lock files, etc.).
d /var/lib/mios/forge      0750 mios-forge mios-forge -
d /var/log/mios/forge      0750 mios-forge mios-forge -

# Admin-override directory for an optional app.ini and any custom
# templates / static asset overrides. Mounted into the container as
# /etc/mios/forge:ro so admins can edit on the host without rebuilding
# the image. Operator-edited; tracked under /etc/ per Law 1
# (USR-OVER-ETC: /etc/ is admin-override only).
d /etc/mios/forge          0750 root mios-forge -

