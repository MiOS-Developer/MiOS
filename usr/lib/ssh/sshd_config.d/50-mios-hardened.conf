# AI-hint: MiOS sshd security policy: key-only logins, no root, no passwords, no X11 or agent forwarding, TCP forwarding kept for Remote-SSH editors and ssh -L tunnels.

# Read through /etc/ssh/sshd_config.d/05-mios-vendor.conf (automation/46-sshd-port.sh);
# Fedora's sshd reads only /etc/ssh/sshd_config.d. sshd keeps the first value it reads,
# so this wins over Fedora's later drop-ins and an admin overrides it from a drop-in
# that sorts before 05.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
PubkeyAuthentication yes
AuthenticationMethods publickey
X11Forwarding no
AllowAgentForwarding no
# Kept on (operator decision 2026-11-19): Remote-SSH editors and ssh -L tunnels need it.
AllowTcpForwarding yes
MaxAuthTries 3
MaxSessions 5
ClientAliveInterval 300
ClientAliveCountMax 2
