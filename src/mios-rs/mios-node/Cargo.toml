# AI-hint: Cargo package specification for the mios-node edge micro-node daemon.
# AI-related: src/mios-rs/mios-node/src/main.rs, automation/55-native-build.sh

[package]
name = "mios-node"
version.workspace = true
edition.workspace = true
authors = ["MiOS Core Team <dev@mios.org>"]
description = "MiOS ('My OS') Distributed Edge Micro-Node Runtime with custom 16B wire protocol, dual-tier task execution, and CRDT state sync."

[dependencies]
getrandom = "0.2"
tokio.workspace = true
bytes = "1.6"
byteorder = "1.5"
crc32fast = "1.4"
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
ed25519-dalek = "2.1"
curve25519-dalek = "4.1"
sha2.workspace = true
clap.workspace = true
mios-resolver = { path = "../../../tools/native/mios-resolver" }

[dev-dependencies]
tempfile.workspace = true

