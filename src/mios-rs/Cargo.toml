# AI-hint: stub
# AI-related: stub
[workspace]
members = [
    "miosd",
    "mios-build",
    "mios-config",
    "mios-node",
    "mios-gate",
    "mios-probe",
]
resolver = "2"

[workspace.package]
version = "0.3.0"
edition = "2021"

[workspace.dependencies]
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
figment = { version = "0.10", features = ["toml", "env"] }
libc = "0.2"
miette = { version = "7.0", features = ["fancy"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.10"
thiserror = "2.0"
tokio = { version = "1.38", features = ["full"] }
toml = "0.8"
toml_edit = "0.22"

