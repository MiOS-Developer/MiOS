# AI-hint: Forgejo publisher: runs the SSOT-registered suite tiers, bakes the OCI image, records the tag for the host's next bootc switch, and mirrors to the registry.
# AI-doc: usr/share/doc/mios/manual/workflows.md

name: build-mios
on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: mios-self-hosted
    env:
      MIOS_DRIFT_REQUIRE_TOOLS: "1"
      GHCR_USER: ${{ secrets.GHCR_USER }}
      GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
      MIOS_VENDOR_TOML: ${{ github.workspace }}/usr/share/mios/mios.toml
    steps:
      - name: Checkout
        # The repository is the deployed root. Checkout fetches the pushed
        # state into the job workspace, and the Containerfile there is what
        # podman builds. Full history: check_legacy_archive (ADR-0030
        # Decision 7) replays it, and a shallow clone fails that gate.
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve ratchet comparison baseline
        # Wire ratchet comparison base (task_3398).
        run: |
          set -euo pipefail
          target_sha=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            git fetch origin main || true  # no --depth: it would graft the full clone shallow
            target_sha="$(git rev-parse FETCH_HEAD 2>/dev/null || true)"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            target_sha="${{ github.event.before }}"
          fi
          if [[ -n "$target_sha" ]]; then
            git fetch origin "$target_sha" || true
            if git cat-file -e "$target_sha" 2>/dev/null; then
              echo "MIOS_RATCHET_BASE=$target_sha" >> "$GITHUB_ENV"
            fi
          fi

      - name: Provision the analysis toolchain
        # The package list is [ci.python] in the SSOT, so this runner installs
        # exactly what the GitHub publisher installs.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck powershell dotnet-sdk-8.0 bubblewrap || true
          packages="$(python3 ./tools/ci-suites.py --python-packages)"
          # shellcheck disable=SC2086
          python3 -m pip install --quiet --disable-pip-version-check $packages \
            || python3 -m pip install --quiet --disable-pip-version-check --break-system-packages $packages \
            || true


      # [ci.powershell.modules] pins the test and analysis dependencies.
      - name: Provision SSOT PowerShell modules
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json,tomllib; print(json.dumps(tomllib.load(open("usr/share/mios/mios.toml","rb"))["ci"]["powershell"]["modules"]))' |
            pwsh -NoProfile -NonInteractive -Command '
              $ErrorActionPreference = "Stop"
              $modules = $input | ConvertFrom-Json
              if (-not $modules.PSScriptAnalyzer -or -not $modules.Pester) { throw "Required CI PowerShell modules are undeclared" }
              foreach ($entry in $modules.PSObject.Properties) {
                if ($entry.Name -notmatch "^[A-Za-z][A-Za-z0-9_.-]*$" -or $entry.Value -notmatch "^[0-9]+\.[0-9]+\.[0-9]+$") { throw "Invalid CI PowerShell module policy" }
                if (-not (Get-Module -ListAvailable -Name $entry.Name | Where-Object { $_.Version -eq [version]$entry.Value })) {
                  Install-Module -Name $entry.Name -RequiredVersion $entry.Value -Scope CurrentUser -Repository PSGallery -Force -SkipPublisherCheck -ErrorAction Stop
                }
              }
            '

      - name: Build and install the SSOT native catalog
        run: |
          set -euo pipefail
          sudo bash ./automation/55-native-build.sh
          python3.13 ./usr/libexec/mios/mios-mcp-server --install-native --source-root .

      - name: Generated artifacts match the SSOT
        run: |
          mios-gen sync --root .
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: generated artifacts differ from what the SSOT renders:" >&2
            git status --porcelain >&2
            git --no-pager diff --stat >&2 || true
            exit 1
          fi

      - name: Check out mios-bootstrap for the Law 15 parity gate
        # Cloned OUTSIDE the workspace so it cannot dirty the generated-artifact
        # comparison. Without it check_bootstrap_sync skipped and reported the
        # same green as a run that compared the two repositories, which is how
        # they drifted: eighteen shared files had diverged unnoticed.
        run: |
          git clone --depth 1 https://github.com/mios-dev/mios-bootstrap.git \
              "${RUNNER_TEMP}/mios-bootstrap"
          echo "MIOS_BOOTSTRAP_ROOT=${RUNNER_TEMP}/mios-bootstrap" >> "$GITHUB_ENV"

      - name: Static analysis tier
        run: bash ./tests/run-suites.sh lint

      - name: Behavioural suite tier
        run: bash ./tests/run-suites.sh unit

      - name: Drift-gate tier
        run: bash ./tests/run-suites.sh gate

      - name: Resolve the image tag
        id: tag
        run: |
          source ./tools/lib/ci-runtime.sh
          tag="$(mios_ci_image_tag .)"
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Building tag: ${tag}"

      - name: Sign in to the base-image registry
        # Authenticated pulls raise the base-image rate limit.
        if: ${{ secrets.GHCR_TOKEN != '' }}
        run: echo "$GHCR_TOKEN" | podman login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Build the OCI image
        run: |
          set -euo pipefail
          # Build arguments come from /etc/mios/install.env, which the runner
          # Quadlet mounts read-only from the host.
          BASE_IMAGE="$(./usr/libexec/mios/mios-toml-get --vendor image base)"
          [[ -n "$BASE_IMAGE" ]] || { echo "SSOT image.base is empty" >&2; exit 1; }
          BUILD_ARGS=(--build-arg "BASE_IMAGE=$BASE_IMAGE")
          if [[ -r /etc/mios/install.env ]]; then
              # shellcheck source=/dev/null
              source /etc/mios/install.env
              [[ -n "${MIOS_LINUX_USER:-}"     ]] && BUILD_ARGS+=(--build-arg "MIOS_IDENTITY_USERNAME=${MIOS_LINUX_USER}")
              [[ -n "${MIOS_IDENTITY_HOSTNAME:-}"       ]] && BUILD_ARGS+=(--build-arg "MIOS_IDENTITY_HOSTNAME=${MIOS_IDENTITY_HOSTNAME}")
              [[ -n "${MIOS_AI_MODEL:-}"       ]] && BUILD_ARGS+=(--build-arg "MIOS_AI_MODEL=${MIOS_AI_MODEL}")
              [[ -n "${MIOS_AI_EMBED_MODEL:-}" ]] && BUILD_ARGS+=(--build-arg "MIOS_AI_EMBED_MODEL=${MIOS_AI_EMBED_MODEL}")
          fi
          podman build \
              "${BUILD_ARGS[@]}" \
              --retry 5 --retry-delay 3s \
              -f Containerfile \
              -t "localhost/mios:latest" \
              -t "localhost/mios:${{ steps.tag.outputs.image_tag }}" \
              .

      - name: Image is bootc-switchable (Architectural Law 4)
        run: |
          source ./tools/lib/ci-runtime.sh
          mios_ci_verify_bootc_labels localhost/mios:latest

      - name: Record the tag for the host's next bootc switch
        run: |
          install -d -m 0755 /var/lib/mios/forge-runner
          printf '%s %s\n' "$(date -u +%FT%TZ)" "localhost/mios:latest" \
              > /var/lib/mios/forge-runner/last-build.txt
          chmod 0644 /var/lib/mios/forge-runner/last-build.txt
          echo "Build recorded. The host stages it on next boot."
          echo "Apply now: sudo bootc upgrade --apply"

      - name: Mirror to the registry
        if: ${{ secrets.GHCR_TOKEN != '' }}
        run: |
          set -euo pipefail
          export GHCR_TOKEN="${{ secrets.GHCR_TOKEN }}"
          source ./tools/lib/ci-runtime.sh
          REG_HOST="$(mios_ci_registry_host .)"
          podman login -u "${GHCR_USER}" -p "${GHCR_TOKEN}" "${REG_HOST}"
          for tag in latest "${{ steps.tag.outputs.image_tag }}"; do
              podman tag  localhost/mios:latest "${MIOS_IMAGE_NAME}:${tag}"
              podman push "${MIOS_IMAGE_NAME}:${tag}"
              echo "Pushed: ${MIOS_IMAGE_NAME}:${tag}"
          done
