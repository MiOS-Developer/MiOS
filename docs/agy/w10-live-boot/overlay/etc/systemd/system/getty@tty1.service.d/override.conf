# AI-hint: W10 live-chat leg: tty1 runs the chat client in place of a login shell, so no bare shell is ever reachable on this console. Injected only by automation/build/live-iso.sh; never present on a real install.
#
# W10 live-chat leg. Replaces tty1's login shell with the chat
# client itself -- there is never a bare shell reachable on this console,
# which is what makes "sudo-disabled / immutable" a structural property of
# the live session rather than a policy one CLI-enforced by trusting sudo
# to be absent. Injected ONLY by automation/build/live-iso.sh; never present
# on a real install (that tty1 keeps its normal getty/login).
# /etc/systemd/system/getty@tty1.service.d/override.conf
[Unit]
After=mios-live-chat-server.service
Wants=mios-live-chat-server.service

[Service]
# ExecStart= (empty) clears agetty entirely -- tty1 runs ONLY the chat
# client below, so there is no login prompt, no shell, nothing to `Ctrl-C`
# out of into a bash. Type=idle avoids racing the boot-log spam on tty1.
ExecStart=
ExecStart=-/usr/libexec/mios/mios-live-chat --tty %I
Type=idle
StandardInput=tty
StandardOutput=tty
TTYPath=/dev/%I
TTYReset=yes
TTYVHangup=yes
Restart=always
RestartSec=1s
