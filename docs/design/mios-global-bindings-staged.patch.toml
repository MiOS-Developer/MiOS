# ===== BLOCK B: replaces usr/share/mios/mios.toml:8731-8782 =====

# Hypr3D room controls (camera, movement, grab/resize, CRT, face buttons) and the L3+R3 toggle chord.
# Consumer: mios-inputd LegacyConfig (config.rs, every key it names is required). The retired legacy daemon
# /usr/libexec/mios/mios-gamepad-hypr3d is no longer a recovery path; it keeps its own defaults when run by hand.
[desktop.hyprland.hypr3d.controller]
enabled = true
# Simultaneous thumbstick chord: tap toggles the room (uncaptured); a hold of capture_hold_ms releases a capture.
toggle_chord = ["BTN_THUMBL", "BTN_THUMBR"]
# Radial/axis deadzone threshold [0.0..1.0] for room movement and look.
deadzone = 0.15
# Global sensitivity multiplier.
sensitivity = 1.0
# Translation sensitivity multiplier for Left Stick movement.
move_sensitivity = 1.0
# Rotation sensitivity multiplier for Right Stick camera look.
camera_sensitivity = 1.0
# Invert camera pitch (look up/down).
invert_y = false
# D-pad (ABS_HAT0X, ABS_HAT0Y) drives discrete movement in the room.
dpad_enabled = true
# Fallback axes for Right Stick on gamepads exposing Z/RZ instead of RX/RY.
fallback_axes = ["ABS_Z", "ABS_RZ"]
# Right Trigger (RT) grabs/drags aimed or focused window in 3D space while held.
grab_button = "BTN_TR2"
grab_axis = "ABS_RZ"
# Left Trigger (LT) resizes aimed or focused window in 3D space while held.
resize_button = "BTN_TL2"
resize_axis = "ABS_Z"
# Analog trigger threshold [0.0..1.0] for engaging RT grab / LT resize (and, I2, the digital LT/RT edge in nav).
trigger_threshold = 0.30
# SELECT button cycles through Hypr3D camera views/modes (first-person, third-person behind, third-person front).
view_mode_button = "BTN_SELECT"
# Bottom/South face button (BTN_SOUTH): single-press jumps; double-press within double_press_ms toggles Flying/Hover mode (hold = fly up).
jump_button = "BTN_SOUTH"
double_press_ms = 350
# Left/West face button (BTN_WEST): cycles posture (Stand -> Crouch -> Sit) in walking/gravity mode; hold = fly down in Flying/Hover mode.
crouch_button = "BTN_WEST"
# North TAP gives the aimed/focused window all inputs in the room; HOLD enters native 2D fullscreen.
fullscreen_button = "BTN_NORTH"
# Right bumper (R1/RB = BTN_TR): CRT toggle in the room; ShaderGlass toggle elsewhere (uncaptured only).
shaderglass_toggle_button = "BTN_TR"
# Left bumper (L1/LB = BTN_TL): CRT cycle in the room; ShaderGlass cycle elsewhere (uncaptured only).
shaderglass_cycle_button = "BTN_TL"
