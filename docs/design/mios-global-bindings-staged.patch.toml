# Tier 4: the controller. One physical bridge (mios-inputd) owns every pad. Captured: the app gets everything through
# the virtual pad except a held toggle_chord (release, capture_hold_ms) and mode_override_chord (half-capture: the
# sticks and triggers drive the host mouse; every button still goes to the app; Start or the chord again returns).
# Capture is per window, never per class: North tap = capture (in the room the aimed window, staying in 3D), North
# hold = fullscreen + capture, held toggle_chord = release to the desktop. Ownership is per session (every pad).
# Uncaptured: unmodified buttons follow the nav profile of the context (I2) and the room map ([desktop.hyprland.hypr3d.
# controller], [keybindings.global.controller.room]). With Guide held, system_layer (no leak to the app).
[keybindings.global.controller]
enabled = true
exclusive_grab = true                # one physical evdev owner; false (or enabled = false) = serve exits 0
captured_system_layer = false         # captured apps own ordinary controller chords, including Guide combinations
capture_fullscreen = true              # North-button fullscreen selects ANY application, not only known classes
capture_tag = "mios-input-captured"    # native per-window capture for windowed applications
release_tag = "mios-input-released"            # set by a held L3+R3 release; cancels fullscreen==2, capture_tag and
                                               # input_owner capture for that window (any kind) until North captures again
capture_fullscreen_tag = "mios-input-fullscreen"  # marks a fullscreen the bridge set (North hold); release unsets it
#@I2 capture_osd = true                  # notify on every capture/release: "Controller -> <app>. Hold L3+R3 to release."
context_poll_ms = 50                   # backup poll; native focus/fullscreen events wake the context worker
context_stale_ms = 1000                # transport failure never invents terminal focus; an unconfirmed capture/release
                                       # reverts after this long (a failed ownership transaction reverts at once)
capture_hold_ms = 500                 # THE hold threshold: North tap/hold, L3+R3 release, and every nav [tap, hold] pair
guide_button = "BTN_MODE"
mode_override_chord = ["BTN_MODE", "BTN_SELECT"]
cursor_mode_button = "BTN_START"     # unmodified START toggles cursor mode; never an exit/session action
cursor_mode_contexts = ["desktop-2d", "desktop-3d", "terminal"]
legacy_pad_state_path = "/tmp/mios-hypr3d-pad.bin"
debounce_ms = 250                     # toggle_chord: both sticks within this window = one chord
scan_ms = 2000                        # device scan; also how often serve re-checks seat/device access while idle
pointer_hz = 250
stick_deadzone = 0.12                 # THE deadzone for pointer, scroll and nav flicks
pointer_max_speed_px = 18.0
scroll_sensitivity = 45.0

# Guide held + button (uncaptured contexts with a compositor; none on a VT). BTN_DPAD_* matches pads that report d-pad
# keys today. HAT d-pads (DualSense, xpad) match once I4 folds ABS_HAT0X/Y into BTN_DPAD_*.
[keybindings.global.controller.system_layer]
BTN_TL = "hypr:workspace e-1"
BTN_TR = "hypr:workspace e+1"
BTN_TL2 = "hypr:movetoworkspace e-1"
BTN_TR2 = "hypr:movetoworkspace e+1"
BTN_SOUTH = "hypr:togglefloating"
BTN_EAST = "hypr:killactive"
BTN_WEST = "exec:mios-terminal"
BTN_NORTH = "mios:launch-browser"
BTN_START = "quickshell:monitor-toggle"   # @drop:I4
#@I4 BTN_START = "mios:system-monitor"
BTN_THUMBL = "quickshell:lock"
BTN_THUMBR = "mios:toggle_vm_passthrough"
BTN_DPAD_LEFT = "hypr:movefocus left"
BTN_DPAD_RIGHT = "hypr:movefocus right"
BTN_DPAD_UP = "hypr:movefocus up"
BTN_DPAD_DOWN = "hypr:movefocus down"
#@I4 LS_UP = "mios:volume up"
#@I4 LS_DOWN = "mios:volume down"
#@I4 LS_LEFT = "mios:media previous"
#@I4 LS_RIGHT = "mios:media next"
#@I4 RS_LEFT = "hypr:movewindow left"
#@I4 RS_RIGHT = "hypr:movewindow right"
