# Shared human interface. SSH receives plain Ctrl-b + one ordinary key;
# Desktop shortcuts use Ctrl+Alt+Shift plus the same letter, avoiding OS Super shortcuts.
[keybindings]
enabled = true
tmux_prefix = "C-b"
vscode_prefix = "ctrl+b"
desktop_modifier = "CTRL ALT SHIFT"
desktop_accelerator = "<Control><Alt><Shift>"
windows_hotkey_modifier = "CTRL+ALT+SHIFT"
vscode_allow_chords = false
vscode_allow_mnemonics = false
vscode_passthrough_commands = ["workbench.action.toggleSidebarVisibility"]
terminal_session = "mios"
socket_name = "mios-human"           # the controller's tmux: actions target clients on this server (tmux -L)
escape_time_ms = 50
repeat_time_ms = 500
history_limit = 50000
mouse = true
[[keybindings.actions]]
id = "terminal"
label = "MiOS Terminal"
key = "t"
command = "/usr/libexec/mios/mios-terminal"
desktop_command = "alacritty -e env -u TMUX -u TMUX_PANE -u TMUX_TMPDIR /usr/libexec/mios/mios-terminal"   # no action: the global session selector ([terminal.sessions])
tmux_command = "new-window"
tmux_command_windows = "new-window"
vscode_command = "workbench.action.terminal.toggleTerminal"

[[keybindings.actions]]
id = "ai"
label = "MiOS AI"
key = "a"
command = "/usr/bin/mios ai"
desktop_command = "alacritty -e env -u TMUX -u TMUX_PANE -u TMUX_TMPDIR /usr/libexec/mios/mios-terminal --action ai"
tmux_command = "run-shell '/usr/libexec/mios/mios-terminal --action ai'"
tmux_command_windows = "new-window -n MiOS-AI 'mios.cmd ai'"
vscode_command = "runCommands"
vscode_shell = "mios ai"

[[keybindings.actions]]
id = "agents"
label = "MiOS Agents"
key = "g"
command = "mios agents --watch"
desktop_command = "alacritty -e env -u TMUX -u TMUX_PANE -u TMUX_TMPDIR /usr/libexec/mios/mios-terminal --action agents"
tmux_command = "run-shell '/usr/libexec/mios/mios-terminal --action agents'"
tmux_command_windows = "new-window -n MiOS-Agents 'mios.cmd agents --watch'"
vscode_command = "runCommands"
vscode_shell = "mios agents --watch"

[[keybindings.actions]]
id = "system"
label = "MiOS System Monitor"
key = "m"
command = "mios mon"
desktop_command = "alacritty -e env -u TMUX -u TMUX_PANE -u TMUX_TMPDIR /usr/libexec/mios/mios-terminal --action system"
tmux_command = "new-window -n MiOS-System mios mon"
tmux_command_windows = "new-window -n MiOS-System 'mios.cmd mon'"
vscode_command = "runCommands"
vscode_shell = "mios mon"

# Mobile approval is an explicit prefix chord, limited to verified adapters.
[keybindings.agent]
accept_key = "Enter"
# One mobile-safe chord for EVERY agent CLI (replaces the desktop-only Ctrl-K): tmux receives it
# (extended-keys csi-u) and sends the focused CLI's adapter key; unlisted CLIs get the chord itself.
# Controller: holding South sends this chord in desktop terminals. The Linux VT cannot encode Shift+Enter,
# so South-hold does nothing on a VT.
accept_chord = "S-Enter"
unavailable_message = "No pending-action key adapter for this pane"
adapters = [
  { kind = "agy", accept_keys = ["C-k"] },
]

# Prefix-table keys stay mobile-safe: Tab or one lowercase letter (mios-unit-gen enforces it). The controller does not
# add prefix keys. Its tmux: actions run tmux commands against the focused client (FINAL.md section 3.3).
[keybindings.tmux]
extended_features_index = 120
extended_keys = "on"
extended_keys_format = "csi-u"
extended_key_terms = ["xterm*", "kitty*", "foot*", "alacritty*"]
#@U1 menu_alias = "mios-menu"              # also emit the MiOS menu (MouseDown3) as a command alias, centred, so
#@U1                                       # inputd can open it on a client (Guide tap on a VT)
#@U1 mouse_terms = ["linux"]               # PLAUSIBLE: set -as terminal-features ',linux:mouse' (VT mouse via gpm)
bindings = [
  { key = "h", command = "select-pane -L" },
  { key = "j", command = "select-pane -D" },
  { key = "k", command = "select-pane -U" },
  { key = "l", command = "select-pane -R" },
  { key = "s", command = "split-window -v" },
  { key = "v", command = "split-window -h" },
  { key = "n", command = "next-window" },
  { key = "p", command = "previous-window" },
  { key = "w", command = "choose-tree -Zw" },
  { key = "z", command = "resize-pane -Z" },
  { key = "y", command = "copy-mode" },
  { key = "d", command = "detach-client" },
  { key = "Tab", command = "send-keys BTab" },
  { key = "b", command = "send-prefix" },
  { key = "o", command = "run-shell '/usr/lib/mios/mcp/.venv/bin/python3 /usr/libexec/mios/mios-mcp-server --workspace-focus next'", command_windows = "select-pane -t :.+" },
  { key = "f", command = "run-shell '/usr/lib/mios/mcp/.venv/bin/python3 /usr/libexec/mios/mios-mcp-server --workspace-view toggle'", command_windows = "resize-pane -Z" },
]

# Read by mios-sync-theme:98 (enabled) and the mios-controls TUI (tui.rs:809, hypr3d_toggle_chord). The router itself uses
# [desktop.hyprland.hypr3d.controller].toggle_chord.
[keybindings.controller]
enabled = true
hypr3d_toggle_chord = ["BTN_THUMBL", "BTN_THUMBR"]   # mirror of toggle_chord # @drop:GT (tui.rs:809 reads toggle_chord)

# --- Global input contract (/usr/share/doc/mios/keybinds.md) ---
# One audited map of every host keyboard/controller binding across the four tiers: 1 desktop/window manager,
# 2 VM / Looking Glass / RDP / kernel VT, 3 terminal / POSIX / agent loop, 4 controller. `mios-gate
# keybind-collisions` fails on a chord bound twice in intersecting contexts, a multi-step prefix clash, a
# bypass that does not use bypass_mod, a host bind that leaks into vm-passthrough, a reserved POSIX terminal
# chord stolen from the focused terminal, and a `realized_by = "hyprland"` binding the compositor does not have.
# mios-inputd (Rust) consumes the same tables; both normalise chords to the vectors in
# usr/share/mios/keybinds/chord-vectors.json. POSIX/Readline defaults stay with the focused application.
# Ownership rule: the focused window is either captured (the app owns every keyboard handle except escapes, and every
# controller input except a held L3+R3 and Guide+Select) or uncaptured (MiOS owns the controller).
[keybindings.global]
enabled = true
mod_key = "SUPER"
bypass_mod = "SUPER+CTRL"            # host-escape modifier: reaches the host even while a VM owns the keyboard
chord_sep = " "                      # separates the steps of a multi-step chord ("CTRL+x CTRL+b")
action_namespaces = ["hypr", "exec", "quickshell", "mios", "tmux", "readline"]   # @drop:I2
#@I2 action_namespaces = ["hypr", "exec", "quickshell", "mios", "tmux", "readline", "key", "pointer"]   # replaces the line above
# Chords the focused terminal owns (termios/Readline/job control); no host binding may shadow them there.
# CTRL+b is the tmux prefix and CTRL+s is flow control. mios-inputd already reserves both (config.rs:328-336).
reserved_terminal = ["CTRL+c", "CTRL+z", "CTRL+d", "CTRL+\\", "CTRL+a", "CTRL+e", "CTRL+k", "CTRL+u", "CTRL+w", "CTRL+r", "CTRL+l", "CTRL+b", "CTRL+s"]
# Every quickshell: and mios: action a binding fires must be in one of these two (the gate enforces it): an
# implemented action carries its argv; an action with no runtime handler yet is listed as planned and is reported,
# never silently launched. hypr:, exec:, tmux: and readline: verbs resolve natively (compositor eval, program, tmux, readline).
planned_actions = []
native_actions = { "mios:vm-command-modifier" = "hyprland" }

[keybindings.global.action_argv]
"quickshell:monitor-toggle" = ["alacritty", "-e", "env", "-u", "TMUX", "-u", "TMUX_PANE", "-u", "TMUX_TMPDIR", "/usr/libexec/mios/mios-terminal", "--action", "system"]   # @drop:I4 (renamed below)
#@I4 "mios:system-monitor" = ["alacritty", "-e", "env", "-u", "TMUX", "-u", "TMUX_PANE", "-u", "TMUX_TMPDIR", "/usr/libexec/mios/mios-terminal", "--action", "system"]
"mios:toggle_vm_passthrough" = ["/usr/libexec/mios/mios-inputd", "vm-action", "toggle_vm_passthrough"]
"mios:vm-fullscreen" = ["/usr/libexec/mios/mios-inputd", "vm-action", "vm-fullscreen"]
"mios:shaderglass toggle" = ["/usr/bin/mios-shaderglass", "toggle"]
"mios:shaderglass cycle" = ["/usr/bin/mios-shaderglass", "cycle"]
"quickshell:drawer-toggle" = ["quickshell", "ipc", "--path", "/usr/share/mios/quickshell/Config.qml", "--any-display", "call", "drawer", "toggle"]
"quickshell:keymap-toggle" = ["quickshell", "ipc", "--path", "/usr/share/mios/quickshell/Config.qml", "--any-display", "call", "keymap", "toggle"]
"mios:placement-toggle" = ["/usr/bin/miosd", "placement", "toggle"]
"mios:hyprland-3d-toggle" = ["/usr/bin/mios-gen", "hyprland-3d-toggle"]
"mios:launch-browser" = ["/usr/bin/mios-browser"]
"mios:session-scale-up" = ["/usr/bin/mios-gen", "session-scale", "up"]
"mios:session-scale-down" = ["/usr/bin/mios-gen", "session-scale", "down"]
"mios:session-scale-reset" = ["/usr/bin/mios-gen", "session-scale", "reset"]
"quickshell:lock" = ["/usr/bin/hyprlock"]   # same locker as [desktop.launchers].lock
#@I4 "mios:volume up" = ["/usr/bin/wpctl", "set-volume", "-l", "1.0", "@DEFAULT_AUDIO_SINK@", "5%+"]
#@I4 "mios:volume down" = ["/usr/bin/wpctl", "set-volume", "@DEFAULT_AUDIO_SINK@", "5%-"]
