# Window class -> context (anchored regexes). desktop-3d is the Hypr3D room itself, not a class.
# app-capture is not a class: fullscreen==2, capture_tag or the room's input_owner select it, and release_tag cancels it.
# A class never captures the controller: capture and release are the same for every window kind (native, Flatpak,
# game, VM, remote, nested, PiP, Theatre). These classes only scope keyboard bindings (contexts/passthrough).
# console (I3) is not a class either: no compositor, or this user's active seat session is a tty.
[keybindings.global.contexts]
desktop-2d = ["firefox", "zen", "app\\.zen_browser\\.zen", "org\\.gnome\\.Nautilus", "quickshell"]
terminal = ["mios-terminal", "Alacritty", "kitty", "foot"]
vm-passthrough = ["looking-glass-client", "xfreerdp", "wlfreerdp", "sdl-freerdp", "winapps", "virt-manager", "remote-viewer", "qemu-system-x86_64"]
game = ["steam_app_.*", "gamescope", "Waydroid"]

