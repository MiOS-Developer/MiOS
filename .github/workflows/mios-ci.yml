# AI-hint: Builds, verifies, signs and publishes the MiOS OCI image, running the SSOT-registered suite tiers before the bake.
# AI-doc: usr/share/doc/mios/manual/workflows.md
name: mios-ci


on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Supersede stale pull-request bakes; never cancel main -- that run publishes
# and signs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MIOS_DRIFT_REQUIRE_TOOLS: "1"
  PUBLISH: 'true'

jobs:
  # Source-tree fitness functions. No built image is required, so drift fails a
  # change before the expensive bake. The suites come from [ci] in the SSOT and
  # are the same set .forgejo/workflows/build-mios.yml runs.
  drift-gate:
    runs-on: ubuntu-24.04
    # The gate runs on the podman machine OS (Fedora CoreOS) that MiOS-DEV boots,
    # the lean CI harness, not on the runner's Ubuntu. (The dev container is the
    # full MiOS image, FROM [image].ref.) A literal because container: is
    # resolved before any step can read the SSOT; tools/ci-suites.py --check
    # holds it equal to [ci.fedora].image.
    container:
      image: ghcr.io/mios-dev/machine-os:6.1
      # tests/test-sandbox-seccomp.sh's live tier runs bwrap, which needs user
      # namespaces the default container seccomp/AppArmor profile denies. A
      # suite that cannot run it exits 77 and fails: it is never a pass.
      options: --privileged
    permissions:
      contents: read
    steps:
      - name: Bootstrap git and python
        # Before checkout: without git in the container, actions/checkout falls
        # back to a tarball with no .git, and every git-backed check would fail.
        # The ostree base's /var link targets come from its tmpfiles.d, as in the dev image.
        run: |
          systemd-tmpfiles --create --prefix=/var/home --prefix=/var/roothome --prefix=/var/opt \
              --prefix=/var/srv --prefix=/var/mnt --prefix=/var/usrlocal
          dnf install -y --setopt=install_weak_deps=False git-core python3

      - name: Checkout
        uses: actions/checkout@v4

      - name: Trust the workspace
        # The checkout is owned by the runner user, not the container's root.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Resolve ratchet comparison baseline
        # Wire ratchet comparison base (T-1073).
        # On pull_request: compare against PR base SHA.
        # On push: compare against origin/main or previous commit.
        run: |
          set -euo pipefail
          target_sha=""
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            target_sha="${{ github.event.pull_request.base.sha }}"
          elif [[ "${{ github.ref }}" != "refs/heads/main" ]]; then
            echo "Fetching origin/main for branch compare..."
            git fetch --depth=1 origin main || true
            target_sha="$(git rev-parse FETCH_HEAD 2>/dev/null || true)"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            target_sha="${{ github.event.before }}"
          fi
          if [[ -n "$target_sha" ]]; then
            echo "Fetching baseline commit ${target_sha}..."
            git fetch --depth=1 origin "$target_sha" || true
            if git cat-file -e "$target_sha" 2>/dev/null; then
              echo "MIOS_RATCHET_BASE=$target_sha" >> "$GITHUB_ENV"
              echo "Successfully resolved MIOS_RATCHET_BASE=$target_sha"
            else
              echo "::warning::Baseline commit $target_sha could not be verified; falling back to merge-base"
            fi
          fi

      - name: Provision the analysis toolchain
        # Everything comes from the SSOT: [ci.fedora] names the dnf set (MiOS's
        # [packages.devcontainer] plus CI-only extras, pwsh from its repo), and
        # [ci.python] the pip set. pyflakes backs lint-python.sh's undefined-name
        # pass and the rest make agent-pipe/server.py importable; both fail
        # closed under MIOS_DRIFT_REQUIRE_TOOLS=1, so a failed install fails here.
        shell: bash
        run: |
          set -euo pipefail
          # Capture separately: a failed substitution inside dnf's arguments
          # does not make set -e stop before dnf runs with an empty list.
          repos="$(python3 ./tools/ci-suites.py --dnf-repos)"
          packages="$(python3 ./tools/ci-suites.py --dnf-packages)"
          python_packages="$(python3 ./tools/ci-suites.py --python-packages)"
          set -f
          if [[ -n "$repos" ]]; then
            # shellcheck disable=SC2086
            dnf install -y $repos
          fi
          # shellcheck disable=SC2086
          dnf install -y --setopt=install_weak_deps=False $packages
          # shellcheck disable=SC2086
          python3 -m pip install --quiet --disable-pip-version-check $python_packages

      - name: Build and install the SSOT native catalog
        shell: bash
        run: |
          set -euo pipefail
          bash ./automation/55-native-build.sh
          # Host fixture paths remain part of the existing daemon unit suites.
          cargo build --locked --manifest-path ./src/mios-rs/Cargo.toml -p mios-gate -p miosd

      - name: Base images are the newest stable release
        # Every MiOS image shares [image].machine_os_repo; a newer stable tag fails here.
        run: |
          bash ./tools/fetch-image-facts.sh .
          mios-gate image-freshness --root .

      - name: Generated artifacts match the SSOT
        run: |
          mios-gen sync --root .
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "ERROR: generated artifacts differ from what the SSOT renders:" >&2
            git status --porcelain >&2
            # The filename alone is not actionable: a generator that emits
            # different bytes here than on a contributor's machine has to be
            # diagnosed from the content.
            echo "--- rendered vs committed ---" >&2
            git --no-pager diff --stat >&2 || true
            git --no-pager diff | head -200 >&2 || true
            exit 1
          fi

      - name: Check out mios-bootstrap for the Law 15 parity gate
        # Cloned OUTSIDE the workspace so it cannot dirty the generated-artifact
        # comparison. Without it check_bootstrap_sync skipped and reported the
        # same green as a run that compared the two repositories, which is how
        # they drifted: eighteen shared files had diverged unnoticed.
        run: |
          git clone --depth 1 https://github.com/mios-dev/mios-bootstrap.git \
              "${RUNNER_TEMP}/mios-bootstrap"
          echo "MIOS_BOOTSTRAP_ROOT=${RUNNER_TEMP}/mios-bootstrap" >> "$GITHUB_ENV"

      - name: Static analysis tier
        run: bash ./tests/run-suites.sh lint

      - name: Behavioural suite tier
        run: |
          python3.13 ./usr/libexec/mios/mios-mcp-server --install-native --source-root .
          bash ./tests/run-suites.sh unit

      - name: Rust format, lint and tests
        run: |
          cd ./src/mios-rs
          cargo fmt --all --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace
          cd ../../tools/native
          cargo fmt --all --check
          cargo clippy --workspace --exclude mios-wallpaperd --all-targets -- -D warnings
          cargo test --workspace --exclude mios-wallpaperd

      - name: Drift-gate tier
        run: bash ./tests/run-suites.sh gate

  build:
    needs: drift-gate
    runs-on: ubuntu-24.04
    env:
      MIOS_VENDOR_TOML: ${{ github.workspace }}/usr/share/mios/mios.toml
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        # The bake stages sixteen or more bound images and needs roughly 30 GB
        # beyond what the runner ships free.
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Provision the container runtime
        # build.sh's post-build drift phase re-runs lint-shell.sh on this
        # runner, so shellcheck must be present here too or that re-run skips
        # the lint and reports green.
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman skopeo shellcheck
          source ./tools/lib/ci-runtime.sh
          mios_ci_prepare_storage

      - name: Resolve version and image tag
        id: tag
        run: |
          source ./tools/lib/ci-runtime.sh
          echo "version=$(mios_ci_version .)" >> "$GITHUB_OUTPUT"
          tag="$(mios_ci_image_tag .)"
          echo "image_tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "Building tag: ${tag}"

      - name: Sign in to the base-image registry
        # Authenticated pulls raise the base-image rate limit.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Build the OCI image
        run: |
          set -euo pipefail
          # Build arguments come from /etc/mios/install.env when a self-hosted
          # runner mounts one. A hosted runner has none, so identity and model
          # resolve from the SSOT inside the build.
          # [image].base from the SSOT; the Containerfile carries no default.
          BASE_IMAGE="$(./usr/libexec/mios/mios-toml-get --vendor image base)"
          [[ -n "$BASE_IMAGE" ]] || { echo "::error::SSOT image.base is empty" >&2; exit 1; }
          BUILD_ARGS=(--build-arg "BASE_IMAGE=$BASE_IMAGE")
          if [[ -r /etc/mios/install.env ]]; then
              # shellcheck source=/dev/null
              source /etc/mios/install.env
              [[ -n "${MIOS_LINUX_USER:-}"     ]] && BUILD_ARGS+=(--build-arg "MIOS_IDENTITY_USERNAME=${MIOS_LINUX_USER}")
              [[ -n "${MIOS_IDENTITY_HOSTNAME:-}"       ]] && BUILD_ARGS+=(--build-arg "MIOS_IDENTITY_HOSTNAME=${MIOS_IDENTITY_HOSTNAME}")
              [[ -n "${MIOS_AI_MODEL:-}"       ]] && BUILD_ARGS+=(--build-arg "MIOS_AI_MODEL=${MIOS_AI_MODEL}")
              [[ -n "${MIOS_AI_EMBED_MODEL:-}" ]] && BUILD_ARGS+=(--build-arg "MIOS_AI_EMBED_MODEL=${MIOS_AI_EMBED_MODEL}")
          fi
          SOURCE_DATE_EPOCH=$(git -C "$GITHUB_WORKSPACE" log -1 --format=%ct 2>/dev/null || date +%s)
          export SOURCE_DATE_EPOCH
          # SOURCE_DATE_EPOCH is the reproducible-builds standard and podman
          # honours it for layer timestamps unaided. Passing --timestamp as well
          # sets the same thing twice, and podman refuses the pair outright,
          # exiting 125 before the Containerfile is read.
          sudo TMPDIR=/mnt/tmp SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" podman build \
              "${BUILD_ARGS[@]}" \
              --build-arg SOURCE_DATE_EPOCH="$SOURCE_DATE_EPOCH" \
              --device /dev/fuse \
              --cap-add all \
              --security-opt seccomp=unconfined \
              --security-opt apparmor=unconfined \
              --retry 5 --retry-delay 3s \
              --build-arg MIOS_BAKE_BOUND_IMAGES=${{ env.PUBLISH == 'true' && '1' || '0' }} \
              -f Containerfile \
              -t "localhost/mios:latest" \
              -t "localhost/mios:${{ steps.tag.outputs.image_tag }}" \
              .

      - name: Image is bootc-switchable (Architectural Law 4)
        run: |
          source ./tools/lib/ci-runtime.sh
          mios_ci_verify_bootc_labels localhost/mios:latest

      - name: Rechunk for smaller Day-2 deltas
        # Pull requests exercise the rechunkers and discard the image; main
        # publishes the result.
        if: env.PUBLISH == 'true'
        run: |
          set -uo pipefail
          IMAGE_TAG="localhost/mios:${{ steps.tag.outputs.image_tag }}"
          MAX_LAYERS="${MIOS_BUILD_RECHUNK_MAX_LAYERS:-67}"
          _RECHUNKED=""
          if sudo podman run --rm --privileged \
              -v /mnt/containers-storage:/var/lib/containers/storage \
              "${IMAGE_TAG}" \
              rpm-ostree compose build-chunked-oci --bootc --format-version=2 \
                  --from="containers-storage:${IMAGE_TAG}" \
                  --output="containers-storage:${IMAGE_TAG}-rechunked"; then
              _RECHUNKED=1
              echo "rechunk: rpm-ostree build-chunked-oci --format-version=2 OK"
          elif sudo podman run --rm \
              --security-opt label=type:unconfined_t \
              -v /mnt/containers-storage:/var/lib/containers/storage \
              "${IMAGE_TAG}" \
              /usr/libexec/bootc-base-imagectl rechunk \
                  --max-layers "${MAX_LAYERS}" \
                  "containers-storage:${IMAGE_TAG}" \
                  "containers-storage:${IMAGE_TAG}-rechunked"; then
              _RECHUNKED=1
              echo "rechunk: bootc-base-imagectl fallback OK"
          fi
          # Strict before merge, degrade-open on main: a layering optimisation
          # must never block a publish.
          if [[ -n "${_RECHUNKED}" ]]; then
              sudo podman tag "${IMAGE_TAG}-rechunked" "${IMAGE_TAG}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "::error::every rechunker failed -- pre-merge rechunk validation is strict"
              exit 1
          else
              echo "WARN: every rechunker failed; publishing the un-rechunked image" >&2
          fi
          sudo podman tag "${IMAGE_TAG}" "localhost/mios:latest"

      - name: Resolve the registry tags
        id: meta
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          source ./tools/lib/ci-runtime.sh
          mios_ci_registry_host . >/dev/null
          BASE="${MIOS_IMAGE_NAME}"
          TAGS=()
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              TAGS+=("${BASE}:latest" "${BASE}:${{ steps.tag.outputs.version }}")
          fi
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
              TAGS+=("${BASE}:${GITHUB_REF#refs/tags/v}" "${BASE}:latest")
          fi
          TAGS+=("${BASE}:${{ steps.tag.outputs.image_tag }}")
          {
              echo "tags<<TAGLIST"
              printf '%s\n' "${TAGS[@]}"
              echo "TAGLIST"
          } >> "$GITHUB_OUTPUT"

      - name: Push the image
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          source ./tools/lib/ci-runtime.sh
          REG_HOST="$(mios_ci_registry_host .)"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              sudo podman login -u "${{ github.actor }}" --password-stdin "${REG_HOST}"
          while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              sudo podman tag localhost/mios:latest "$tag"
              sudo podman push "$tag"
              echo "Pushed: $tag"
          done <<< "${{ steps.meta.outputs.tags }}"

      - name: Install cosign
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@v3

      - name: Sign every pushed tag
        # Keyless OIDC, using the job's id-token permission. Signing :latest as
        # well as v* tags is what makes SECURITY.md's claim that CI signs every
        # push true.
        if: env.PUBLISH == 'true' && github.event_name != 'pull_request'
        env:
          COSIGN_EXPERIMENTAL: '1'
        run: |
          set -euo pipefail
          source ./tools/lib/ci-runtime.sh
          REG_HOST="$(mios_ci_registry_host .)"
          echo "${{ secrets.GITHUB_TOKEN }}" | \
              cosign login "${REG_HOST}" -u "${{ github.actor }}" --password-stdin
          while IFS= read -r tag; do
              [[ -z "$tag" ]] && continue
              cosign sign --yes "$tag"
          done <<< "${{ steps.meta.outputs.tags }}"

  # Builds the image and checks its MiOS components on every push, alongside
  # drift-gate rather than after it, so a red source gate cannot hide whether
  # the image builds. Publishing stays in `build`, which still needs drift-gate.
  smoke-test:
    runs-on: ubuntu-24.04
    env:
      MIOS_VENDOR_TOML: ${{ github.workspace }}/usr/share/mios/mios.toml
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reclaim runner disk
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Provision the container runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman
          source ./tools/lib/ci-runtime.sh
          mios_ci_prepare_storage
          echo "$GH_TOKEN" | sudo podman login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Smoke build
        # The Containerfile's final layer runs bootc container lint.
        run: |
          set -euo pipefail
          BASE_IMAGE="$(./usr/libexec/mios/mios-toml-get --vendor image base)"
          [[ -n "$BASE_IMAGE" ]] || { echo "::error::SSOT image.base is empty" >&2; exit 1; }
          sudo TMPDIR=/mnt/tmp podman build --device /dev/fuse --cap-add all \
              --security-opt seccomp=unconfined --security-opt apparmor=unconfined \
              --build-arg "BASE_IMAGE=$BASE_IMAGE" \
              --build-arg MIOS_BAKE_BOUND_IMAGES=0 -t mios:smoke -f Containerfile .

      - name: Image runs and carries the MiOS components
        run: bash ./tests/bake-smoke.sh mios:smoke
