# AI-hint: tuned-ppd mapping for a MiOS host. GNOME's power-profile switch is translated to tuned profiles by tuned-ppd; without this, selecting "Balanced" or "Performance" silently replaces mios-host with a stock profile.
# AI-related: /usr/lib/tuned/profiles/mios-host/tuned.conf, /usr/libexec/mios/mios-bootstrap-linux.sh
[main]
# The default PPD profile
default=balanced
battery_detection=true
sysfs_acpi_monitor=true

[profiles]
# PPD = TuneD
power-saver=mios-host-powersave
balanced=mios-host
performance=mios-host-performance

[battery]
# PPD = TuneD
balanced=balanced-battery
