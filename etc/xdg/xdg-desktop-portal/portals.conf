# AI-hint: Portal backend order for MiOS: Hyprland first (ScreenCast/Screenshot/GlobalShortcuts -- OBS, browsers and RDP capture need it), then gnome/gtk for the rest; Secret goes to gnome-keyring. A "default=gnome" here overrides /usr/share/xdg-desktop-portal/hyprland-portals.conf and leaves screen capture with no sources.
# AI-related: mios-wslg
[preferred]
default=hyprland;gnome;gtk
org.freedesktop.impl.portal.Secret=gnome-keyring
