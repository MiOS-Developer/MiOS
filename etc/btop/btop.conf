# AI-hint: GENERATED btop config -- do NOT hand-edit. Projected from the mios.toml [btop] SSOT by mios-theme-render (surface "btop-conf" -> etc/btop/btop.conf), the SAME way [colors] projects into themes/mios.theme.
# AI-doc: usr/share/doc/mios/manual/btop.md

# Color theme -- MiOS palette via the sibling themes/mios.theme surface.
color_theme = "mios"

# Transparent background -- preserves the terminal's acrylic backdrop.
theme_background = False

# Sets if 24-bit truecolor should be used.
truecolor = True

# Force tty mode (off -- we have a real terminal).
force_tty = False

presets = "cpu:0:default,proc:1:default cpu:0:default,mem:0:default cpu:0:default,mem:0:default,net:0:default proc:0:default cpu:0:default,mem:0:default,net:0:default,proc:1:default"

# Set to True to add "v" mark when value is volatile.
vim_keys = False

# Rounded corners on boxes (matches MiOS frame chars).
rounded_corners = True

# Default symbols for graphs: "braille", "block", "tty".
graph_symbol = "block"

# Individual graph symbol (for cpu graph).
graph_symbol_cpu = "block"
graph_symbol_gpu = "block"
graph_symbol_mem = "block"
graph_symbol_net = "block"
graph_symbol_proc = "block"

# Boxes shown at launch -- matches preset 4 (proc only) so plain
# `btop` invocations (without -p) still render the operator's
# canonical view.
shown_boxes = "proc"

# Update time in milliseconds. Operator: "not 500ms update speed" -- the
# displayed value was 2000ms. Lock to 500ms here so btop refreshes 2x/sec
# on the dev VM out of the box.
update_ms = 500

# Process sort column (when proc box re-enabled).
proc_sorting = "cpu lazy"

# Reverse sort.
proc_reversed = False

# Show command line of processes.
proc_tree = False

# Show colliding cpu colors in tree mode.
proc_colors = True

# Show graph for each process (cpu / mem usage).
proc_gradient = True

# Filter via "/" key.
proc_filter_kernel = False

# Display PID by default.
proc_per_core = False

# Show memory in process box.
proc_mem_bytes = True

# Show CPU graph in process box.
proc_cpu_graphs = True

# Use psutil for process info (Linux).
proc_info_smaps = False

# Show command in process box.
proc_left = False

# Display CPU as percentage (true) or single core load (false).
proc_filter = ""

# CPU graph height (rows). Minimal for 80x20.
cpu_graph_upper = "total"
cpu_graph_lower = "total"
cpu_invert_lower = True
cpu_single_graph = True
cpu_bottom = False

# Show top of CPU box.
show_uptime = True

# Show cpu temperatures (per-core if available).
check_temp = True

# Which sensor to use for cpu temperature.
cpu_sensor = "Auto"

# Show all cores in cpu temp.
show_coretemp = True

# CPU core map order: layout/numa/etc.
cpu_core_map = ""

# Custom cpu model name in cpu percentage box.
custom_cpu_name = ""

# Cpu freq display: True/False.
show_cpu_freq = True

# Update graphs for processes / cpu freq even when paused.
clock_format = "%X"

# Background update while paused.
background_update = True

# Filter all-zero CPU.
custom_filters = ""

# Memory box -- compact.
show_swap = True
swap_disk = True
show_disks = True
only_physical = True
use_fstab = False
zfs_hide_datasets = False

# Disable disk meter graph for compact 80x20 fit.
disk_free_priv = False
show_io_stat = False
io_mode = False
io_graph_combined = False
io_graph_speeds = ""

# Network box (hidden via shown_boxes -- still configured for when re-enabled).
net_download = 100
net_upload = 100
net_auto = True
net_sync = False
net_iface = ""

# Show battery status (when applicable).
show_battery = True
selected_battery = "Auto"
show_battery_watts = True

# Logging level.
log_level = "WARNING"
