# AI-hint: PipeWire WebRTC acoustic echo cancellation filter and virtual loopback sink (task_730).
# AI-doc: usr/share/doc/mios/manual/audio.md

context.modules = [
    {
        name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            node.description = "MiOS Echo-Cancelled Microphone"
            source.props = {
                node.name = "echo-cancel-source"
                node.description = "Echo-Cancelled Mic for AI ASR & Voice"
                filter.smart = true
            }
            sink.props = {
                node.name = "echo-cancel-sink"
                node.description = "Echo-Cancellation Playback Reference"
            }
            aec.args = {
                webrtc.extended_filter = true
                webrtc.delay_agnostic = true
                webrtc.high_pass_filter = true
                webrtc.noise_suppression = true
                webrtc.voice_detection = true
            }
        }
    }
    {
        name = libpipewire-module-loopback
        args = {
            node.description = "MiOS Application Audio Virtual Sink"
            capture.props = {
                node.name = "virtual-sink"
                media.class = "Audio/Sink"
                audio.position = [ FL FR ]
            }
            playback.props = {
                node.name = "virtual-playback"
                node.target = "echo-cancel-sink"
            }
        }
    }
]
