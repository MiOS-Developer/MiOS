# AI-hint: Kdump configuration for automated zstd crash dump extraction (task_459).
# AI-doc: usr/share/doc/mios/manual/ch45-diagnostic-tools-and-profilers.md
path /var/crash
core_collector makedumpfile -l --message-level 1 -d 31
extra_modules zstd
default reboot
