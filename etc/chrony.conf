# AI-hint: NTP configuration for Chrony. Generated from mios.toml [network.ntp] SSOT.
# DO NOT EDIT -- edit mios.toml [network.ntp] and run miosd build-phase --phase 42-chrony-render.sh

server 0.pool.ntp.org iburst
server 1.pool.ntp.org iburst
server 2.pool.ntp.org iburst
server 3.pool.ntp.org iburst

# Record the rate at which the system clock gains/losses time.
driftfile /var/lib/chrony/drift

# Allow the system clock to be stepped in the first three updates
# if its offset is larger than 1 second. (Disabled in WSL2 where Hyper-V handles coarse sync)
makestep 0 0
maxslewrate 500

# Runtime drop-ins: mios-chrony-ptp-dropin writes 10-ptp.conf with a PHC
# refclock only when a Hyper-V PTP clock is present (WSL2 / Hyper-V guest).
confdir /etc/chrony.d

# Enable kernel synchronization of the real-time clock (RTC).
rtcsync

# Specify directory for log files.
logdir /var/log/chrony
