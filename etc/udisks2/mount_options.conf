# AI-hint: Configures udisks2 declarative mount options to enforce read-only untrusted storage mounts (task_742).
# AI-doc: usr/share/doc/mios/manual/ch17-defense-in-depth-hardening.md

[defaults]
# External removable storage mounts strictly read-only, non-executable, no-suid, no-device-nodes
defaults=ro,nosuid,nodev,noexec
allow=ro,nosuid,nodev,noexec

[vfat]
defaults=ro,nosuid,nodev,noexec,utf8=1
allow=ro,nosuid,nodev,noexec,utf8=1

[exfat]
defaults=ro,nosuid,nodev,noexec
allow=ro,nosuid,nodev,noexec

[ntfs]
defaults=ro,nosuid,nodev,noexec
allow=ro,nosuid,nodev,noexec

[ext4]
defaults=ro,nosuid,nodev,noexec
allow=ro,nosuid,nodev,noexec
